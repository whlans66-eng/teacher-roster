      const base = { type, title: ED_BLOCK_LABEL[type] || '新區塊', minutes: 3 };
      if (type === 'text')   return { ...base, body: '' };
      if (type === 'tabs')   return { ...base, minutes: 4, intro: '', tabs: [edNewTab(), edNewTab(), edNewTab()] };
      if (type === 'ladder') return { ...base, minutes: 5, intro: '', tracks: [edNewTrack()] };
      if (type === 'order')  return {
        ...base, minutes: 5, intro: '',
        items: [edNewItem(), edNewItem(), edNewItem()],
        successText: '順序完全正確，這就是標準的作業流程。',
        hintText: '想一想哪一個步驟必須先完成，才輪得到下一步。'
      };
      return null;
    }

    // 把既有 material 讀成可編輯的 draft（深拷貝 + 補齊缺欄位）
    function edLoadDraft(m) {
      const src = m && typeof m === 'object' ? m : {};
      const blocks = (Array.isArray(src.blocks) ? src.blocks : [])
        .filter(b => b && ED_TYPES.includes(b.type))
        .map(b => {
          const o = {
            type: b.type,
            title: String(b.title ?? ''),
            minutes: Number(b.minutes) || 0
          };
          if (b.type === 'text') {
            o.body = String(b.body ?? '');
          } else {
            o.intro = String(b.intro ?? '');
          }
          if (b.type === 'tabs') {
            o.tabs = (Array.isArray(b.tabs) ? b.tabs : []).map(t => ({
              label:    String(t?.label ?? ''),
              eyebrow:  String(t?.eyebrow ?? ''),
              headline: String(t?.headline ?? ''),
              chips:    (Array.isArray(t?.chips) ? t.chips : []).map(c => String(c ?? '')),
              desc:     String(t?.desc ?? ''),
              summary:  String(t?.summary ?? '')
            }));
          }
          if (b.type === 'ladder') {
            o.tracks = (Array.isArray(b.tracks) ? b.tracks : []).map(t => ({
              key:   String(t?.key ?? ''),
              name:  String(t?.name ?? ''),
              hint:  String(t?.hint ?? ''),
              nodes: (Array.isArray(t?.nodes) ? t.nodes : []).map(n => ({
                label: String(n?.label ?? ''),
                level: String(n?.level ?? ''),
                desc:  String(n?.desc ?? '')
              }))
            }));
          }
          if (b.type === 'order') {
            o.items = (Array.isArray(b.items) ? b.items : []).map(i => ({
              title: String(i?.title ?? ''),
              desc:  String(i?.desc ?? '')
            }));
            o.successText = String(b.successText ?? '');
            o.hintText    = String(b.hintText ?? '');
          }
          return o;
        });

      return {
        fileName: String(src.fileName ?? ''),
        estMinutes: Number(src.estMinutes) || 0,
        blocks
      };
    }

    // ── 欄位元件 ──────────────────────────────────────────────────
    function edDomId(path) {
      return 'ed_' + String(path).replace(/[^A-Za-z0-9_]/g, '_');
    }

    function edAutoAttr(path) {
      return edFocusPath && edFocusPath === path ? ' data-ed-autofocus="1"' : '';
    }

    function edInput(path, label, value, placeholder, opts) {
      const o = opts || {};
      const id = edDomId(path);
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">${h(label)}</label>
            <input id="${a(id)}" class="input" type="${a(o.type || 'text')}"
              ${o.type === 'number' ? 'min="0" step="1" inputmode="numeric"' : ''}
              data-path="${a(path)}" value="${a(value == null ? '' : value)}"
              placeholder="${a(placeholder || '')}" oninput="edSet(this)"${edAutoAttr(path)}>
            ${o.hint ? `<div class="ed-hint">${h(o.hint)}</div>` : ''}
          </div>`;
    }

    function edArea(path, label, value, placeholder, opts) {
      const o = opts || {};
      const id = edDomId(path);
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">${h(label)}</label>
            <textarea id="${a(id)}" class="input" rows="${a(o.rows || 4)}"
              data-path="${a(path)}" placeholder="${a(placeholder || '')}"
              oninput="edSet(this)"${edAutoAttr(path)}>${h(value == null ? '' : value)}</textarea>
            ${o.hint ? `<div class="ed-hint">${h(o.hint)}</div>` : ''}
          </div>`;
    }

    // chips 以逗號分隔編輯，儲存回陣列
    function edChipsField(path, value) {
      const id = edDomId(path);
      const text = (Array.isArray(value) ? value : []).join('、');
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">重點標籤（用逗號或頓號分隔）</label>
            <input id="${a(id)}" class="input" type="text"
              data-path="${a(path)}" value="${a(text)}"
              placeholder="例：值班航行、避碰規則、交接紀錄" oninput="edChips(this)">
          </div>`;
    }

    // 上移／下移／刪除三顆 icon 鈕
    function edToolsHtml(listPath, idx, len, delLabel) {
      return `<span class="ed-block-tools">
              <button type="button" class="ed-icon-btn" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edUp(this)" ${idx === 0 ? 'disabled' : ''}
                title="上移" aria-label="上移">
                <i class="ph ph-arrow-up" aria-hidden="true"></i>
              </button>
              <button type="button" class="ed-icon-btn" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edDown(this)" ${idx >= len - 1 ? 'disabled' : ''}
                title="下移" aria-label="下移">
                <i class="ph ph-arrow-down" aria-hidden="true"></i>
              </button>
              <button type="button" class="ed-icon-btn danger" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edDel(this)"
                title="${a(delLabel)}" aria-label="${a(delLabel)}">
                <i class="ph ph-trash" aria-hidden="true"></i>
              </button>
            </span>`;
    }

    function edAddBtn(listPath, kind, label) {
      return `<button type="button" class="btn btn-sm btn-secondary"
              data-p="${a(listPath)}" data-k="${a(kind)}" onclick="edAdd(this)">
              <i class="ph ph-plus" aria-hidden="true"></i>${h(label)}
            </button>`;
    }

    // ── 區塊編輯器 ────────────────────────────────────────────────
    function edBlockHtml(b, bi, total) {
      const p = 'blocks.' + bi;
      const label = ED_BLOCK_LABEL[b.type] || b.type;

      let body = '';
      if (b.type === 'text') {
        body = edArea(p + '.body', '內文', b.body,
          '直接換行即可，課程頁會原樣保留段落。', { rows: 6,
          hint: '純文字，不會解讀 HTML 標籤。' });

      } else if (b.type === 'tabs') {
        const tabs = Array.isArray(b.tabs) ? b.tabs : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這組分頁要比較什麼。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">分頁（${tabs.length} 頁）</span>
            <div class="ed-hint">學員按上方分頁鈕切換，一次只看一頁。建議 2～4 頁。</div>
            <div class="ed-sub">${
              tabs.length
                ? tabs.map((t, ti) => edTabHtml(t, p, ti, tabs.length)).join('')
                : '<div class="ed-empty">還沒有任何分頁。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.tabs', 'tab', '新增分頁')}</div>
          </div>`;

      } else if (b.type === 'ladder') {
        const tracks = Array.isArray(b.tracks) ? b.tracks : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這幾條職涯路線。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">路線（${tracks.length} 條）</span>
            <div class="ed-hint">每條路線是一排可點的節級；節點由左到右代表由低到高。</div>
            <div class="ed-sub">${
              tracks.length
                ? tracks.map((t, ti) => edTrackHtml(t, p, ti, tracks.length)).join('')
                : '<div class="ed-empty">還沒有任何路線。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.tracks', 'track', '新增路線')}</div>
          </div>`;

      } else if (b.type === 'order') {
        const items = Array.isArray(b.items) ? b.items : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這個排序題在練什麼。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">步驟（${items.length} 張卡）</span>
            <div class="ed-hint">
              這裡的上下順序就是正確答案 —— 請由「最先做」排到「最後做」。
              學員看到的卡片一定會被打亂，不必自己先打亂。
            </div>
            <div class="ed-sub">${
              items.length
                ? items.map((it, ii) => edItemHtml(it, p, ii, items.length)).join('')
                : '<div class="ed-empty">還沒有任何步驟。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.items', 'item', '新增步驟')}</div>
          </div>`
          + `<div class="ed-row">
            ${edInput(p + '.successText', '答對時顯示的話', b.successText, '順序完全正確，這就是標準流程。')}
            ${edInput(p + '.hintText', '答錯時的提示', b.hintText, '再想想哪一步必須先完成。')}
          </div>`;
      }

      return `<div class="ed-block">
          <div class="ed-block-head">
            <span class="ed-block-type"><i class="ph ${a(ED_BLOCK_ICON[b.type] || 'ph-square')}" aria-hidden="true"></i> ${h(label)}</span>
            <span class="ed-block-name" data-name-for="${a(p)}">${h(b.title || '未命名區塊')}</span>
            ${edToolsHtml('blocks', bi, total, '刪除這個區塊')}
          </div>
          <div class="ed-row">
            ${edInput(p + '.title', '區塊標題', b.title, '例：三個部門在做什麼')}
            ${edInput(p + '.minutes', '分鐘', b.minutes, '3', { type: 'number' })}
          </div>
          ${body}
        </div>`;
    }

    function edTabHtml(t, blockPath, ti, len) {
      const p = blockPath + '.tabs.' + ti;
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>分頁 ${ti + 1}${t.label ? '：' + h(t.label) : ''}</span>
                ${edToolsHtml(blockPath + '.tabs', ti, len, '刪除這個分頁')}
              </div>
              <div class="ed-row">
                ${edInput(p + '.label', '分頁鈕文字', t.label, '例：甲板部')}
                ${edInput(p + '.eyebrow', '小標（鈕上方）', t.eyebrow, '例：Deck Department')}
              </div>
              ${edInput(p + '.headline', '主標題', t.headline, '例：負責航行安全與貨物裝卸')}
              ${edChipsField(p + '.chips', t.chips)}
              ${edArea(p + '.desc', '說明', t.desc, '這個部門平常在做什麼。', { rows: 3 })}
              ${edArea(p + '.summary', '結論（深色條）', t.summary, '一句話收斂重點，會用深色底白字強調。', { rows: 2 })}
            </div>`;
    }

    function edTrackHtml(t, blockPath, ti, len) {
      const p = blockPath + '.tracks.' + ti;
      const nodes = Array.isArray(t.nodes) ? t.nodes : [];
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>路線 ${ti + 1}${t.name ? '：' + h(t.name) : ''}</span>
                ${edToolsHtml(blockPath + '.tracks', ti, len, '刪除這條路線')}
              </div>
              <div class="ed-row">
                ${edInput(p + '.name', '路線名稱', t.name, '例：甲板部')}
                ${edInput(p + '.key', '代號（英數，不重複）', t.key, '例：deck')}
              </div>
              ${edInput(p + '.hint', '路線補充說明', t.hint, '例：航行值班體系')}
              <div class="ed-field">
                <span class="ed-label">節級（${nodes.length} 級，由低到高）</span>
                <div class="ed-hint">課程頁預設選到第 4 級，讓「已過」與「未到」兩種樣式同時出現；建議至少 4 級。</div>
                <div class="ed-sub">${
                  nodes.length
                    ? nodes.map((n, ni) => edNodeHtml(n, p, ni, nodes.length)).join('')
                    : '<div class="ed-empty">這條路線還沒有節級。</div>'
                }</div>
                <div class="ed-add-row">${edAddBtn(p + '.nodes', 'node', '新增節級')}</div>
              </div>
            </div>`;
    }

    function edNodeHtml(n, trackPath, ni, len) {
      const p = trackPath + '.nodes.' + ni;
      return `<div class="ed-sub-item">
                    <div class="ed-sub-head">
                      <span>第 ${ni + 1} 級${n.label ? '：' + h(n.label) : ''}</span>
                      ${edToolsHtml(trackPath + '.nodes', ni, len, '刪除這一級')}
                    </div>
                    <div class="ed-row">
                      ${edInput(p + '.label', '職務名稱', n.label, '例：三副')}
                      ${edInput(p + '.level', '級別標記', n.level, '例：Junior Officer')}
                    </div>
                    ${edArea(p + '.desc', '職務說明', n.desc, '這一級負責什麼、需要什麼資格。', { rows: 3 })}
                  </div>`;
    }

    function edItemHtml(it, blockPath, ii, len) {
      const p = blockPath + '.items.' + ii;
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>第 ${ii + 1} 步${it.title ? '：' + h(it.title) : ''}</span>
                ${edToolsHtml(blockPath + '.items', ii, len, '刪除這個步驟')}
              </div>
              ${edInput(p + '.title', '步驟標題', it.title, '例：報到與繳交證書')}
              ${edArea(p + '.desc', '步驟說明', it.desc, '這一步要做什麼。', { rows: 2 })}
            </div>`;
    }

    // ── Modal 整體 ────────────────────────────────────────────────
    function edTotalMinutes() {
      if (!edDraft) return 0;
      return (edDraft.blocks || []).reduce((s, b) => s + (Number(b.minutes) || 0), 0);
    }

    function edFootText() {
      const n = (edDraft?.blocks || []).length;
      const sum = edTotalMinutes();
      return `共 ${n} 個區塊` + (sum ? ` · 區塊分鐘合計 ${sum} 分` : '');
    }

    function edModalHtml() {
      const blocks = edDraft.blocks || [];
      const isNew = edMatIdx == null;

      return `<div class="ed-modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">
        <div class="ed-head">
          <div>
            <h3 id="edTitle">${isNew ? '新增互動教材' : '編輯互動教材'}</h3>
            <div class="ed-head-sub">學員會在課程頁依序看到下面的區塊</div>
          </div>
          <button type="button" class="ed-close" onclick="closeEditor()"
            title="關閉" aria-label="關閉編輯器">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="ed-body" id="edBody">
          <div class="ed-row">
            ${edInput('fileName', '單元標題', edDraft.fileName, '例：上船前的準備', {
              hint: '這個標題同時是進度記錄的鍵值，改名之後舊的學習進度會從頭算。'
            })}
            ${edInput('estMinutes', '預估時長（分鐘）', edDraft.estMinutes, '15', { type: 'number' })}
          </div>

          <div class="ed-field">
            <span class="ed-label">學習區塊（${blocks.length}）</span>
            <div class="ed-blocks">${
              blocks.length
                ? blocks.map((b, i) => edBlockHtml(b, i, blocks.length)).join('')
                : '<div class="ed-empty">還沒有任何區塊。<br>用下面的按鈕加入第一個區塊。</div>'
            }</div>
            <div class="ed-add-row">
              ${ED_TYPES.map(t => `<button type="button" class="btn btn-sm btn-secondary"
                data-p="blocks" data-k="${a(t)}" onclick="edAdd(this)">
                <i class="ph ${a(ED_BLOCK_ICON[t])}" aria-hidden="true"></i>${h(ED_BLOCK_LABEL[t])}
              </button>`).join('')}
            </div>
          </div>
        </div>

        <div class="ed-foot">
          <span class="ed-foot-left" id="edFoot">${h(edFootText())}</span>
          <button type="button" class="btn btn-secondary" onclick="closeEditor()">取消</button>
          <button type="button" class="btn btn-primary" id="edSave" onclick="saveEditor()">
            <i class="ph ph-check" aria-hidden="true"></i>儲存
          </button>
        </div>
      </div>`;
    }

    // 重繪：保留 .ed-body 的捲動位置，並把焦點送到剛新增的欄位
    function edRender() {
      const host = document.getElementById('edOverlay');
      if (!host || !edDraft) return;
      const prevTop = document.getElementById('edBody')?.scrollTop || 0;

      host.innerHTML = edModalHtml();

      const body = document.getElementById('edBody');
      if (body) body.scrollTop = prevTop;

      const target = host.querySelector('[data-ed-autofocus="1"]');
      edFocusPath = null;
      if (target) {
        target.focus();
        if (typeof target.scrollIntoView === 'function') {
          target.scrollIntoView({ block: 'center' });
        }
      }
      edSyncSave();
    }

    function edSyncFoot() {
      const el = document.getElementById('edFoot');
      if (el) el.textContent = edFootText();
    }

    function edSyncSave() {
      const btn = document.getElementById('edSave');
      if (!btn) return;
      btn.disabled = !!edSaving;
      // 只把按鈕變灰看不出在做事，要講出來
      if (edSaving) {
        if (!btn.dataset.idleText) btn.dataset.idleText = btn.textContent;
        btn.textContent = '儲存中…';
      } else if (btn.dataset.idleText) {
        btn.textContent = btn.dataset.idleText;
        delete btn.dataset.idleText;
      }
    }

    // ── 欄位寫回（不重繪，避免打字時失焦） ─────────────────────────
    function edSet(el) {
      if (!el || !el.dataset) return;
      const path = el.dataset.path;
      const r = edResolve(path);
      if (!r) return;

      if (el.type === 'number') {
        const n = parseInt(el.value, 10);
        r.obj[r.key] = Number.isFinite(n) && n >= 0 ? n : 0;
        if (path === 'estMinutes' || /\.minutes$/.test(path)) edSyncFoot();
      } else {
        r.obj[r.key] = el.value;
      }

      // 區塊標題改了，同步更新該區塊的摺疊標頭文字
      const m = /^(blocks\.\d+)\.title$/.exec(path || '');
      if (m) {
        const nameEl = document.querySelector('[data-name-for="' + m[1] + '"]');
        if (nameEl) nameEl.textContent = el.value || '未命名區塊';
      }
    }

    function edChips(el) {
      if (!el || !el.dataset) return;
      const r = edResolve(el.dataset.path);
      if (!r) return;
      r.obj[r.key] = String(el.value || '')
        .split(/[,，、]/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    // ── 結構操作（會重繪） ────────────────────────────────────────
    function edSwap(el, delta) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      const i = Number(el.dataset.i);
      if (!list || Number.isNaN(i)) return;
      const j = i + delta;
      if (j < 0 || j >= list.length) return;
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
      edRender();
    }

    function edUp(el)   { edSwap(el, -1); }
    function edDown(el) { edSwap(el, 1); }

    function edDel(el) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      const i = Number(el.dataset.i);
      if (!list || Number.isNaN(i) || !list[i]) return;
      if (!confirm('確定刪除？刪掉之後要按儲存才會寫回課程。')) return;
      list.splice(i, 1);
      edRender();
    }

    function edAdd(el) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      if (!list) return;
      const kind = el.dataset.k;

      let item = null;
      let firstKey = 'title';
      if (ED_TYPES.includes(kind)) { item = edNewBlock(kind); firstKey = 'title'; }
      else if (kind === 'tab')     { item = edNewTab();   firstKey = 'label'; }
      else if (kind === 'track')   { item = edNewTrack(); firstKey = 'name'; }
      else if (kind === 'node')    { item = edNewNode();  firstKey = 'label'; }
      else if (kind === 'item')    { item = edNewItem();  firstKey = 'title'; }
      if (!item) return;

      list.push(item);
      edFocusPath = el.dataset.p + '.' + (list.length - 1) + '.' + firstKey;
      edRender();
    }

    // ── 驗證與輸出 ────────────────────────────────────────────────
    const edTrim = v => String(v == null ? '' : v).trim();

    // 回傳乾淨的 { fileName, estMinutes, blocks }，不合格回 null（並已 showToast）
    function edBuild() {
      if (!edDraft) return null;

      const fileName = edTrim(edDraft.fileName);
      if (!fileName) { edFail('請先填寫單元標題。', 'fileName'); return null; }

      const blocks = [];
      const srcBlocks = Array.isArray(edDraft.blocks) ? edDraft.blocks : [];
      if (!srcBlocks.length) { edFail('請至少加入一個學習區塊。'); return null; }

      for (let i = 0; i < srcBlocks.length; i++) {
        const b = srcBlocks[i];
        const no = i + 1;
        const title = edTrim(b.title);
        if (!title) { edFail(`第 ${no} 個區塊還沒有標題。`, 'blocks.' + i + '.title'); return null; }

        const out = { type: b.type, title, minutes: Number(b.minutes) || 0 };

        if (b.type === 'text') {
          const body = String(b.body == null ? '' : b.body).replace(/\s+$/, '');
          if (!body.trim()) { edFail(`第 ${no} 個區塊「${title}」的內文是空的。`, 'blocks.' + i + '.body'); return null; }
          out.body = body;

        } else {
          out.intro = edTrim(b.intro);

          if (b.type === 'tabs') {
            const tabs = (Array.isArray(b.tabs) ? b.tabs : [])
              .map(t => ({
                label:    edTrim(t.label),
                eyebrow:  edTrim(t.eyebrow),
                headline: edTrim(t.headline),
                chips:    (Array.isArray(t.chips) ? t.chips : []).map(edTrim).filter(Boolean),
                desc:     edTrim(t.desc),
                summary:  edTrim(t.summary)
              }))
              .filter(t => t.label || t.headline || t.desc || t.summary || t.chips.length);
            if (!tabs.length) { edFail(`第 ${no} 個區塊「${title}」至少要有一個分頁。`); return null; }
            const blank = tabs.findIndex(t => !t.label);
            if (blank >= 0) { edFail(`第 ${no} 個區塊的分頁 ${blank + 1} 還沒有分頁鈕文字。`); return null; }
            out.tabs = tabs;

          } else if (b.type === 'ladder') {
            const tracks = [];
            const usedKeys = new Set();
            const srcTracks = Array.isArray(b.tracks) ? b.tracks : [];
            for (let ti = 0; ti < srcTracks.length; ti++) {
              const t = srcTracks[ti];
              const nodes = (Array.isArray(t.nodes) ? t.nodes : [])
                .map(n => ({ label: edTrim(n.label), level: edTrim(n.level), desc: edTrim(n.desc) }))
                .filter(n => n.label || n.level || n.desc);
              const name = edTrim(t.name);
              if (!name && !nodes.length) continue;      // 整條空白 → 丟掉
              if (!name) { edFail(`第 ${no} 個區塊的路線 ${ti + 1} 還沒有名稱。`); return null; }
              if (!nodes.length) { edFail(`第 ${no} 個區塊的路線「${name}」還沒有節級。`); return null; }
              const blankNode = nodes.findIndex(n => !n.label);
              if (blankNode >= 0) { edFail(`路線「${name}」的第 ${blankNode + 1} 級還沒有職務名稱。`); return null; }

              // key 缺漏或重複時自動補，避免課程頁 activeTrack 撞號
              let key = edTrim(t.key).replace(/[^A-Za-z0-9_-]/g, '');
              if (!key || usedKeys.has(key)) key = 'track' + (ti + 1);
              while (usedKeys.has(key)) key += '_';
              usedKeys.add(key);

              tracks.push({ key, name, hint: edTrim(t.hint), nodes });
            }
            if (!tracks.length) { edFail(`第 ${no} 個區塊「${title}」至少要有一條路線。`); return null; }
            out.tracks = tracks;

          } else if (b.type === 'order') {
            const items = (Array.isArray(b.items) ? b.items : [])
              .map(it => ({ title: edTrim(it.title), desc: edTrim(it.desc) }))
              .filter(it => it.title || it.desc);
            if (items.length < 2) { edFail(`第 ${no} 個區塊「${title}」至少要有兩個步驟才排得起來。`); return null; }
            const blankItem = items.findIndex(it => !it.title);
            if (blankItem >= 0) { edFail(`第 ${no} 個區塊的第 ${blankItem + 1} 步還沒有標題。`); return null; }
            out.items = items;
            out.successText = edTrim(b.successText) || '順序完全正確。';
            out.hintText    = edTrim(b.hintText)    || '再想想哪一步必須先完成。';

          } else {
            edFail(`第 ${no} 個區塊的型別無法辨識。`);
            return null;
          }
        }

        blocks.push(out);
      }

      const est = Number(edDraft.estMinutes) || 0;
      return {
        fileName,
        estMinutes: est || edTotalMinutes(),
        blocks
      };
    }

    // 驗證失敗：提示 + 把焦點送到出問題的欄位
    function edFail(msg, path) {
      showToast(msg, 'error');
      if (!path) return;
      const el = document.getElementById(edDomId(path));
      if (el) {
        el.focus();
        if (typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'center' });
      }
    }

    function edDirty() {
      return !!edDraft && JSON.stringify(edDraft) !== edOriginal;
    }

    // ── Esc 關閉 ──────────────────────────────────────────────────
    function edBindKeys() {
      if (edKeyBound) return;
      edKeyBound = true;
      document.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape' || !edDraft || edSaving) return;
        ev.preventDefault();
        closeEditor();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  對外三個函式
    // ══════════════════════════════════════════════════════════════

    // matIdx = null → 新增；否則編輯該互動教材
    function openEditor(courseId, matIdx) {
      if (!isAdmin) return;

      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { showToast('找不到這個課程模組', 'error'); return; }

      const host = document.getElementById('edOverlay');
      if (!host) { showToast('編輯器容器不存在', 'error'); return; }

      let idx = null;
      if (matIdx != null) {
        idx = Number(matIdx);
        const m = (course.materials || [])[idx];
        if (!m) { showToast('找不到這個單元', 'error'); return; }
        if (!isInteractive(m)) { showToast('這是檔案型教材，不能用互動編輯器修改', 'error'); return; }
        edDraft = edLoadDraft(m);
      } else {
        edDraft = { fileName: '', estMinutes: 0, blocks: [] };
      }

      edCourseId  = String(course.id);
      edMatIdx    = idx;
      edOriginal  = JSON.stringify(edDraft);
      edSaving    = false;
      edFocusPath = idx == null ? 'fileName' : null;

      edBindKeys();
      // .open 要先加：未開啟時 overlay 是 visibility:hidden，focus() 對隱藏子樹無效
      host.classList.add('open');
      edRender();
      document.body.style.overflow = 'hidden';
    }

    // force = true 時不問未儲存變更（儲存成功後內部呼叫）
    function closeEditor(force) {
      if (!edDraft) return;
      if (edSaving) return;
      if (force !== true && edDirty() && !confirm('有尚未儲存的變更，確定要關閉嗎？')) return;

      const host = document.getElementById('edOverlay');
      if (host) {
        host.classList.remove('open');
        host.innerHTML = '';
      }
      document.body.style.overflow = '';

      edDraft = null;
      edOriginal = '';
      edCourseId = null;
      edMatIdx = null;
      edFocusPath = null;
    }

    async function saveEditor() {
      if (!isAdmin || !edDraft || edSaving) return;

      const course = allCourses.find(c => String(c.id) === String(edCourseId));
      if (!course) { showToast('找不到這個課程模組', 'error'); closeEditor(true); return; }

      const clean = edBuild();
      if (!clean) return;

      if (!Array.isArray(course.materials)) course.materials = [];
      if (edMatIdx != null && !course.materials[edMatIdx]) {
        showToast('這個單元已被其他人移除，請重新整理後再試', 'error');
        return;
      }

      const snapshot = course.materials.slice();
      const mat = {
        kind: 'interactive',
        fileName: clean.fileName,
        estMinutes: clean.estMinutes,
        blocks: clean.blocks,
        updatedAt: new Date().toISOString(),
        updatedBy: (currentUser && currentUser.username) || ''
      };

      if (edMatIdx == null) course.materials.push(mat);
      else course.materials[edMatIdx] = mat;

      edSaving = true;
      edSyncSave();
      // 邏輯本來就完整（防重入、失敗還原、編輯器留著），
      // 缺的只是「看得到的處理中」——原本只把按鈕設成 disabled，
      // 使用者只會覺得按鈕按不動，不知道它正在存。
      const doneBusy = (window.UIFeedback && UIFeedback.showBusy)
        ? UIFeedback.showBusy('儲存互動教材中…', '正在同步到雲端，請稍候')
        : function () {};
      try {
        await persistCourses();
        edSaving = false;
        closeEditor(true);
        renderModule(course);
        showToast('已儲存互動教材', 'success');
      } catch (err) {
        course.materials = snapshot;                 // 失敗就還原，編輯器留著讓使用者再試
        edSaving = false;
        edSyncSave();
        showToast(`儲存失敗：${(err && err.message) || '未知錯誤'}`, 'error');
      } finally {
        doneBusy();
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  AI 助教側欄（skeleton 的 <aside class="ai-panel" id="aiPanel">）
    //  版面照原型課程頁右側欄：桌機 380px 固定在右、窄螢幕全幅抽屜
    //  類名一律用 screens.css 既有的 .ai-* / body.ai-open，不新增按鈕樣式
    //  後端 askgemini 只開放 admin / teacher，非該兩角色連面板都不渲染
    // ══════════════════════════════════════════════════════════════

    // ── 狀態（只有這一份，切換單元時保留對話，因為每則訊息都會自帶單元上下文）──
    let aiOpen = false;
    let aiMsgs = [];              // [{ role:'me'|'bot'|'err', text }]
    let aiBusy = false;
    let aiDraft = '';             // 重繪面板時把使用者沒送出的草稿帶回來
    let aiCooldownUntil = 0;      // aiChat.chat 丟 rateLimited 時進入冷卻
    let aiCdTimer = null;
    let aiSessionReady = false;   // aiChat 是全站單例，第一次開面板要切新對話，免得帶到其他頁的上下文

    // 建議問題在「帳號管理 → 系統設定 → 教材頁 AI 建議問題」改
    const aiSuggestions = () => Site.get('aiLessonPrompts') || [];

    // ── 權限 ──────────────────────────────────────────────────────
    // core.js 已有 canUseAi()；這裡做一層容錯，單獨載入本檔時直接問 Auth
    function aiAllowed() {
      if (typeof canUseAi === 'function') return !!canUseAi();
      try {
        const r = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : '';
        return !!(Auth.can && Auth.can('ai'));
      } catch { return false; }
    }

    // ── 小工具 ────────────────────────────────────────────────────
    function aiPanelEl() { return document.getElementById('aiPanel'); }

    // AI 回覆是純文字：一律 h() 後才把換行換成 <br>，絕不直接塞原始回覆
    function aiFmt(s) { return h(s).replace(/\r\n|\r|\n/g, '<br>'); }

    function aiUnitTitle(m) {
      if (typeof lsUnitTitle === 'function') return lsUnitTitle(m);
      if (!m) return '';
      const name = m.fileName || '未命名單元';
      return (typeof isInteractive === 'function' && isInteractive(m))
        ? name : (name.replace(/\.[^.\s]{1,8}$/, '') || name);
    }

    // 目前單元的上下文，會塞在送出訊息的開頭，讓回答貼合這一課的教材
    function aiContextLine() {
      const c = (typeof activeCourse === 'function') ? activeCourse() : null;
      if (!c) return '';
      const mats = Array.isArray(c.materials) ? c.materials : [];
      const m = (typeof activeMatIdx === 'number') ? mats[activeMatIdx] : null;
      const unit = m ? aiUnitTitle(m) : '';
      const name = c.name || '未命名課程';
      return unit ? `（目前正在看：${name} / ${unit}）` : `（目前正在看：${name}）`;
    }

    function aiCooldownLeft() {
      return Math.max(0, Math.ceil((aiCooldownUntil - Date.now()) / 1000));
    }

    // 冷卻中每秒更新送出鈕與 placeholder，不整頁重繪（避免吃掉草稿與焦點）
    function aiTickCooldown() {
      if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
      const step = () => {
        const left = aiCooldownLeft();
        const btn = document.getElementById('aiSend');
        const box = document.getElementById('aiInput');
        if (left > 0) {
          if (btn) { btn.disabled = true; btn.title = `冷卻中，還要 ${left} 秒`; }
          if (box) box.placeholder = `AI 服務冷卻中，還要 ${left} 秒…`;
          return;
        }
        if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
        if (btn) { btn.title = '送出'; }
        if (box) box.placeholder = '輸入你的問題…';
        aiSyncSendState();
      };
      step();
      if (aiCooldownLeft() > 0) aiCdTimer = setInterval(step, 1000);
    }

    // 送出鈕只在「有字、沒在忙、沒冷卻」時可按
    function aiSyncSendState() {
      const btn = document.getElementById('aiSend');
      const box = document.getElementById('aiInput');
      if (!btn) return;
      const hasText = !!(box ? box.value.trim() : aiDraft.trim());
      btn.disabled = aiBusy || aiCooldownLeft() > 0 || !hasText;
    }

    function aiScrollBottom() {
      const body = document.getElementById('aiBody');
      if (body) body.scrollTop = body.scrollHeight;
    }

    // ── 輸入事件 ──────────────────────────────────────────────────
    function aiOnInput(el) {
      aiDraft = el.value;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      aiSyncSendState();
    }

    // Enter 送出、Shift+Enter 換行（輸入法組字中的 Enter 不送出）
    function aiOnKey(ev, el) {
      if (ev.key !== 'Enter' || ev.shiftKey || ev.isComposing) return;
      ev.preventDefault();
      sendAiMessage(el.value);
    }

    function aiAskSuggestion(i) {
      const q = aiSuggestions()[i];
      if (q) sendAiMessage(q);
    }

    function aiOnPanelKey(ev) {
      if (ev.key === 'Escape') { ev.stopPropagation(); closeAi(); }
    }

    // ── 開關 ──────────────────────────────────────────────────────
    function toggleAi() {
      if (!aiAllowed()) {
        showToast('你目前沒有使用 AI 助教的權限', 'error');
        return;
      }
      aiOpen ? closeAi() : openAi();
    }

    function openAi() {
      if (!aiAllowed()) {
        showToast('你目前沒有使用 AI 助教的權限', 'error');
        return;
      }
      // aiChat 建構時會自動還原最近一個 session（js/api.js switchSession），
      // 那可能是在智慧派課頁聊的內容。這裡 UI 是空的，模型卻記得 —— 開新對話讓兩邊一致。
      if (!aiSessionReady) {
        aiSessionReady = true;
        try {
          if (typeof aiChat !== 'undefined' && typeof aiChat.startNewSession === 'function') {
            aiChat.startNewSession();
          }
        } catch (_) {}
      }
      aiOpen = true;
      renderAiPanel();
      const box = document.getElementById('aiInput');
      if (box) box.focus();
    }

    // core.js 的 goHome() / openModule() 會呼叫這支關掉面板
    function closeAi() {
      aiOpen = false;
      if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
      const panel = aiPanelEl();
      if (panel) {
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
      }
      document.body.classList.remove('ai-open');
      const btn = document.querySelector('.les-bar-right button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    // ── 渲染 ──────────────────────────────────────────────────────
    function renderAiPanel() {
      const panel = aiPanelEl();
      if (!panel) return;

      // 權限不足：連面板內容都不產生（不是 disabled，是不渲染）
      if (!aiAllowed()) {
        panel.innerHTML = '';
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('ai-open');
        return;
      }

      const ctx = aiContextLine();
      const left = aiCooldownLeft();

      const ctxHtml = ctx
        ? `<div style="font-size:11px; line-height:1.5; color:var(--apple-gray); padding:0 2px 2px">${h(ctx)}</div>`
        : '';

      const emptyHtml = aiMsgs.length ? '' : `
        <div class="ai-empty">可以問這個單元的內容，<br>或先從下面的問題開始。</div>
        <div class="ai-sugg">
          ${aiSuggestions().map((q, i) => `
            <button type="button" class="ai-sugg-btn" onclick="aiAskSuggestion(${i})">${h(q)}</button>`).join('')}
        </div>`;

      const msgsHtml = aiMsgs.map(m => {
        if (m.role === 'err') {
          return `<div class="ai-msg bot" style="background:var(--ui-danger-bg); color:var(--ui-danger)">${aiFmt(m.text)}</div>`;
        }
        return `<div class="ai-msg ${m.role === 'me' ? 'me' : 'bot'}">${aiFmt(m.text)}</div>`;
      }).join('');

      const busyHtml = aiBusy ? `<div class="ai-busy">AI 助教正在思考…</div>` : '';

      panel.innerHTML = `
        <div class="ai-head">
          <span class="ai-head-title"><i class="ph ph-sparkle" aria-hidden="true"></i>AI 助教</span>
          <button type="button" class="ai-close" onclick="closeAi()"
            title="關閉 AI 助教" aria-label="關閉 AI 助教">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="ai-body" id="aiBody" role="log" aria-live="polite" aria-label="AI 助教對話">
          ${ctxHtml}${emptyHtml}${msgsHtml}${busyHtml}
        </div>

        <div class="ai-foot">
          <textarea class="input" id="aiInput" rows="1"
            style="resize:none; height:40px; max-height:120px; padding:10px 12px; line-height:1.5; overflow-y:auto"
            placeholder="${left > 0 ? a('AI 服務冷卻中，還要 ' + left + ' 秒…') : '輸入你的問題…'}"
            aria-label="輸入你的問題，Enter 送出，Shift+Enter 換行"
            oninput="aiOnInput(this)" onkeydown="aiOnKey(event, this)"></textarea>
          <button type="button" class="ai-send" id="aiSend" onclick="sendAiMessage()"
            title="送出" aria-label="送出問題">
            <i class="ph ph-paper-plane-right" aria-hidden="true"></i>
          </button>
        </div>`;

      panel.onkeydown = aiOnPanelKey;
      panel.setAttribute('aria-hidden', aiOpen ? 'false' : 'true');
      panel.classList.toggle('open', aiOpen);
      document.body.classList.toggle('ai-open', aiOpen);

      const btn = document.querySelector('.les-bar-right button');
      if (btn) btn.setAttribute('aria-expanded', aiOpen ? 'true' : 'false');

      // 把草稿與自動長高還原回去
      const box = document.getElementById('aiInput');
      if (box && aiDraft) {
        box.value = aiDraft;
        box.style.height = 'auto';
        box.style.height = Math.min(box.scrollHeight, 120) + 'px';
      }
      if (box) box.disabled = aiBusy;

      aiSyncSendState();
      if (left > 0) aiTickCooldown();
      aiScrollBottom();
    }

    // ── 送出 ──────────────────────────────────────────────────────
    async function sendAiMessage(text) {
      if (!aiAllowed()) {
        showToast('你目前沒有使用 AI 助教的權限', 'error');
        return;
      }
      const box = document.getElementById('aiInput');
      const raw = (text != null ? text : (box ? box.value : aiDraft)) || '';
      const q = String(raw).trim();
      if (!q || aiBusy) return;

      if (aiCooldownLeft() > 0) {
        showToast(`AI 服務冷卻中，請等待 ${aiCooldownLeft()} 秒`, 'error');
        return;
      }
      if (typeof aiChat === 'undefined' || !aiChat || typeof aiChat.chat !== 'function') {
        showToast('AI 服務尚未就緒，請稍後再試', 'error');
        return;
      }

      aiMsgs.push({ role: 'me', text: q });
      aiDraft = '';
      aiBusy = true;
      renderAiPanel();

      // 單元上下文塞在訊息開頭，讓回答貼合這一課的教材
      const ctx = aiContextLine();
      const payload = ctx ? `${ctx}\n${q}` : q;

      try {
        const rawReply = await aiChat.chat(payload);
        // api.js 的 system prompt 會要求模型輸出 [WHAI_ACTION]{...}；chat() 只剝 [MEMORY:]
        // 不剝 action，必須自己過 cleanDisplayText（與 maritime-courses.html 同作法）
        const reply = (typeof aiChat.cleanDisplayText === 'function'
          ? aiChat.cleanDisplayText(String(rawReply || ''))
          : String(rawReply || '')).trim();
        aiMsgs.push({ role: 'bot', text: reply || '抱歉，我沒有收到回覆，請再試一次。' });
      } catch (err) {
        const msg = (err && err.message) ? String(err.message) : '連線發生問題';
        // api.js 失敗時會把這題從 conversationHistory pop 掉，這裡同步退回泡泡，
        // 並把內容還回輸入框，否則使用者得整段重打。
        if (aiMsgs.length && aiMsgs[aiMsgs.length - 1].role === 'me') aiMsgs.pop();
        aiDraft = q;
        if (err && err.rateLimited) {
          // api.js 會進入 60 秒冷卻，這段期間送出鈕一律禁用
          aiCooldownUntil = Date.now() + 60000;
          aiMsgs.push({ role: 'err', text: `${msg}\n（提問太密集了，問題已退回輸入框，稍等一下再送。）` });
          showToast('AI 請求已達上限，請稍後再試', 'error');
        } else {
          aiMsgs.push({ role: 'err', text: `回答失敗：${msg}\n問題已退回輸入框，可以直接再送一次。` });
        }
      } finally {
        aiBusy = false;
        renderAiPanel();
        const again = document.getElementById('aiInput');
        if (again && !again.disabled && aiCooldownLeft() === 0) again.focus();
      }
    }

  </script>
</body>
</html>
