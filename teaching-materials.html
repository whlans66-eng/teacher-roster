    function lsFinish() {
      const c = activeCourse();
      const m = lsCurMat();
      if (c && m) saveProgress(c.id, m.fileName, { completed: true });
      showToast('已完成本模組', 'success');
      if (c) openModule(c.id); else goHome();
    }

    function lsToggleAi() {
      if (typeof toggleAi === 'function') toggleAi();
    }

    function lsKey(ev, el) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // ── 麵包屑列 ──────────────────────────────────────────────────
    function lsBarHtml(course, m) {
      const mins = matMinutes(m);
      const ai = (typeof canUseAi === 'function' && canUseAi())
        ? `<button type="button" class="btn btn-sm btn-secondary u-pill" onclick="lsToggleAi()"
              title="AI 助教" aria-label="開啟 AI 助教">
              <i class="ph-fill ph-sparkle" aria-hidden="true"></i><span class="brand-sub">AI 助教</span>
            </button>`
        : '';

      return `
      <div class="les-bar">
        <div class="les-bar-left">
          <span class="les-brand" role="link" tabindex="0"
            onclick="goHome()" onkeydown="lsKey(event, this)">教材管理</span>
          <span class="les-sep" aria-hidden="true"></span>
          <nav class="les-crumb" aria-label="麵包屑">
            <span class="les-crumb-link" role="link" tabindex="0"
              onclick="lsGoModule()" onkeydown="lsKey(event, this)">${h(course.name || '未命名課程')}</span>
            <span aria-hidden="true">/</span>
            <span class="les-crumb-cur" title="${a(lsUnitTitle(m))}">${h(lsUnitTitle(m))}</span>
            ${mins ? `<span class="les-crumb-min">· ${mins} 分鐘</span>` : ''}
          </nav>
        </div>
        <div class="les-bar-right">${ai}</div>
      </div>`;
    }

    // ── 底部導覽 ──────────────────────────────────────────────────
    function lsNavHtml(course, idx) {
      const mats = course.materials || [];
      const hasPrev = idx > 0;
      const hasNext = !!mats[idx + 1];

      const prev = hasPrev
        ? `<span class="les-nav-prev" role="link" tabindex="0"
              onclick="lsGo(-1)" onkeydown="lsKey(event, this)">‹ 上一課</span>`
        : `<span class="les-nav-prev off" aria-disabled="true">‹ 上一課</span>`;

      const next = hasNext
        ? `<button type="button" class="btn btn-sm btn-primary u-pill" onclick="lsGo(1)">
              下一課<i class="ph ph-caret-right" aria-hidden="true"></i>
            </button>`
        : `<button type="button" class="btn btn-sm btn-primary u-pill" onclick="lsFinish()">
              <i class="ph ph-check" aria-hidden="true"></i>完成本模組
            </button>`;

      return `<div class="les-nav">${prev}<span class="les-nav-spacer"></span>${next}</div>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  檔案型教材
    // ══════════════════════════════════════════════════════════════

    function lsMediaHeadHtml(m) {
      const size = fmtSize(m.fileSize);
      const url = m.fileUrl || '';
      const open = url
        ? `<a class="btn btn-sm btn-plain" href="${a(url)}" target="_blank" rel="noopener noreferrer">
              <i class="ph ph-arrow-square-out" aria-hidden="true"></i>另開
            </a>`
        : '';
      return `
        <div class="ls-media-head">
          <span class="ls-media-title">${h(lsUnitTitle(m))}</span>
          <span class="ls-media-meta">
            <span><i class="ph ${a(fileStyle(m.fileName).icon)}" aria-hidden="true"></i>${h(matKind(m))}</span>
            ${size ? `<span>${h(size)}</span>` : ''}
            ${open}
          </span>
        </div>`;
    }

    function lsFallbackHtml(m, msg) {
      const url = m.fileUrl || '';
      return `
        <div class="ls-fallback">
          <i class="ph ph-cloud-slash" aria-hidden="true"></i>
          <p>${h(msg)}</p>
          ${url ? `<a class="btn btn-sm btn-secondary u-pill" href="${a(url)}"
                target="_blank" rel="noopener noreferrer">
                <i class="ph ph-download-simple" aria-hidden="true"></i>下載原始檔案
              </a>` : ''}
        </div>`;
    }

    function lsFileHtml(course, m) {
      const ext = (m.fileName || '').split('.').pop().toLowerCase();
      const preview = drivePreview(m);
      let inner;

      if (isVideo(m.fileName)) {
        // 本機／dataUrl 影片才能用 <video>（可追蹤 timeupdate 進度）；
        // Drive 上的影片只能靠 iframe 預覽，沒有可讀的播放事件。
        const src = m.dataUrl || '';
        if (src) {
          inner = `<video class="ls-video" controls preload="metadata" playsinline
              src="${a(src)}" ontimeupdate="lsVideoTime(this)" onended="lsVideoEnd(this)"></video>`;
        } else if (preview) {
          inner = `<iframe class="ls-frame" src="${a(preview)}" title="${a(lsUnitTitle(m))}"
              allow="autoplay" allowfullscreen loading="lazy"></iframe>`;
        } else {
          inner = lsFallbackHtml(m, '這個影片沒有可預覽的來源。');
        }
      } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
        const src = m.dataUrl || driveImage(m) || m.fileUrl || '';
        inner = src
          ? `<img class="ls-img" src="${a(src)}" alt="${a(lsUnitTitle(m))}" loading="lazy">`
          : lsFallbackHtml(m, '這張圖片沒有可預覽的來源。');
      } else if (preview) {
        // PDF 與 Office 文件都走 Drive 的 /preview
        inner = `<iframe class="ls-frame" src="${a(preview)}" title="${a(lsUnitTitle(m))}"
            allowfullscreen loading="lazy"></iframe>`;
      } else if (m.fileUrl && ext === 'pdf') {
        inner = `<iframe class="ls-frame" src="${a(m.fileUrl)}" title="${a(lsUnitTitle(m))}"
            allowfullscreen loading="lazy"></iframe>`;
      } else {
        inner = lsFallbackHtml(m, '這個教材沒有可直接預覽的格式，請下載後開啟。');
      }

      return `<div class="ls-media">${lsMediaHeadHtml(m)}${inner}</div>`;
    }

    // 影片進度：每 5 秒寫一次，看完 92% 以上就算完成
    function lsVideoTime(el) {
      const c = activeCourse();
      const m = lsCurMat();
      if (!c || !m || !el || !el.duration) return;

      const now = Date.now();
      if (now - lessonVideoSaveAt < 5000) return;
      lessonVideoSaveAt = now;

      const pct = Math.round(el.currentTime / el.duration * 100);
      const data = { viewed: true, pos: Math.floor(el.currentTime), pct };
      if (pct >= 92) data.completed = true;
      saveProgress(c.id, m.fileName, data);
    }

    function lsVideoEnd() {
      const c = activeCourse();
      const m = lsCurMat();
      if (!c || !m) return;
      saveProgress(c.id, m.fileName, { viewed: true, completed: true, pct: 100 });
      showToast('已看完這個單元', 'success');
    }

    // ══════════════════════════════════════════════════════════════
    //  互動型教材：區塊卡外殼
    // ══════════════════════════════════════════════════════════════

    function lsInitState(b) {
      if (!b) return {};
      if (b.type === 'tabs') return { activeTab: 0 };
      if (b.type === 'ladder') {
        const tracks = Array.isArray(b.tracks) ? b.tracks : [];
        const nodes = (tracks[0] && Array.isArray(tracks[0].nodes)) ? tracks[0].nodes : [];
        // 原型刻意預選第 4 個節點，讓「已過」與「未到」兩種樣式一開場就同時出現
        return { trackIdx: 0, nodeIdx: Math.max(0, Math.min(3, nodes.length - 1)) };
      }
      if (b.type === 'order') {
        const items = Array.isArray(b.items) ? b.items : [];
        return { order: lsShuffle(items.length), sel: null, checked: null, dragFrom: null };
      }
      return {};
    }

    // 打亂，但保證開場一定不是正解（長度 < 2 時無解可打亂，直接回傳）
    function lsShuffle(n) {
      const base = [];
      for (let i = 0; i < n; i++) base.push(i);
      if (n < 2) return base;

      let out;
      let guard = 0;
      do {
        out = base.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = out[i]; out[i] = out[j]; out[j] = t;
        }
        guard++;
      } while (guard < 50 && out.every((v, i) => v === i));
      return out;
    }

    function lsState(bi, b) {
      if (!lessonState[bi]) lessonState[bi] = lsInitState(b);
      return lessonState[bi];
    }

    function lsResetBlock(bi) {
      const m = lsCurMat();
      const b = lsBlocks(m)[bi];
      if (!b) return;
      lessonState[bi] = lsInitState(b);
      if (b.type === 'tabs')   lsTabsApply(bi, b);
      if (b.type === 'ladder') lsLadderApply(bi, b);
      if (b.type === 'order')  lsOrderApply(bi, b);
    }

    function lsHeadHtml(b) {
      const mins = Number(b.minutes) || 0;
      return `
        <div class="blk-head">
          <h2>${h(b.title || '未命名段落')}</h2>
          ${mins ? `<span class="blk-min"><i class="ph ph-play" aria-hidden="true"></i>${mins} 分鐘</span>` : ''}
        </div>`;
    }

    function lsResetBtnHtml(bi, label) {
      return `<button type="button" class="blk-reset" onclick="lsResetBlock(${Number(bi)})"
          title="${a(label)}" aria-label="${a(label)}">
          <i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>
        </button>`;
    }

    function lsBlockHtml(b, bi) {
      lsState(bi, b);
      let body;
      if (b.type === 'text')        body = lsTextHtml(b);
      else if (b.type === 'tabs')   body = lsTabsHtml(b, bi);
      else if (b.type === 'ladder') body = lsLadderHtml(b, bi);
      else if (b.type === 'order')  body = lsOrderHtml(b, bi);
      else return '';
      return `<section class="blk" id="lsBlock${Number(bi)}">${lsHeadHtml(b)}${body}</section>`;
    }

    // ── type:'text' ───────────────────────────────────────────────
    // .blk-body 是 white-space:pre-wrap，所以 body 只要跳脫、換行會自己保留
    function lsTextHtml(b) {
      return `<p class="blk-body">${h(b.body || '')}</p>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  1. type:'tabs' — 部門分頁
    // ══════════════════════════════════════════════════════════════

    function lsTabPaneInner(b, ti) {
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      const t = tabs[ti] || {};
      const chips = (Array.isArray(t.chips) ? t.chips : []).filter(s => typeof s === 'string' && s.trim());
      return `
            ${t.eyebrow ? `<span class="blk-eyebrow">${h(t.eyebrow)}</span>` : ''}
            ${t.headline ? `<div class="blk-headline">${h(t.headline)}</div>` : ''}
            ${chips.length ? `<div class="blk-chips">${chips.map(s => `<span class="blk-chip">${h(s)}</span>`).join('')}</div>` : ''}
            ${t.desc ? `<p class="blk-desc">${h(t.desc)}</p>` : ''}
            ${t.summary ? `<div class="blk-summary">${h(t.summary)}</div>` : ''}`;
    }

    function lsTabsHtml(b, bi) {
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      if (!tabs.length) return lsIntroHtml(b);
      const st = lsState(bi, b);
      const n = tabs.length;

      const btns = tabs.map((t, i) => `
            <button type="button" class="blk-tab${i === st.activeTab ? ' active' : ''}"
              id="lsTab${Number(bi)}-${i}" role="tab" data-i="${i}"
              aria-selected="${i === st.activeTab ? 'true' : 'false'}"
              aria-controls="lsTabPane${Number(bi)}" tabindex="${i === st.activeTab ? 0 : -1}"
              onclick="lsTabPick(${Number(bi)}, ${i})"
              onkeydown="lsTabKey(event, ${Number(bi)}, ${i})">${h(t && t.label || '分頁 ' + (i + 1))}</button>`).join('');

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重設')}
          <div class="blk-tabs${n > 4 ? ' many' : ''}" id="lsTabs${Number(bi)}"
            style="--tab-n:${n}" role="tablist" aria-label="${a(b.title || '分頁')}">${btns}
          </div>
          <div class="blk-card" id="lsTabPane${Number(bi)}" role="tabpanel"
            aria-labelledby="lsTab${Number(bi)}-${st.activeTab}">${lsTabPaneInner(b, st.activeTab)}
          </div>
        </div>`;
    }

    function lsIntroHtml(b) {
      return b.intro ? `<p class="blk-intro">${h(b.intro)}</p>` : '';
    }

    function lsTabsApply(bi, b) {
      const st = lessonState[bi] || {};
      const root = document.getElementById('lsTabs' + bi);
      if (root) {
        root.querySelectorAll('.blk-tab').forEach(el => {
          const on = Number(el.dataset.i) === st.activeTab;
          el.classList.toggle('active', on);
          el.setAttribute('aria-selected', on ? 'true' : 'false');
          el.tabIndex = on ? 0 : -1;
        });
      }
      const pane = document.getElementById('lsTabPane' + bi);
      if (pane) {
        pane.innerHTML = lsTabPaneInner(b, st.activeTab);
        pane.setAttribute('aria-labelledby', 'lsTab' + bi + '-' + st.activeTab);
      }
    }

    function lsTabPick(bi, ti) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      if (!tabs[ti]) return;
      lsState(bi, b).activeTab = Number(ti);
      lsTabsApply(bi, b);
    }

    function lsTabKey(ev, bi, ti) {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const n = (Array.isArray(b.tabs) ? b.tabs : []).length;
      if (n < 2) return;
      ev.preventDefault();
      const next = (Number(ti) + (ev.key === 'ArrowRight' ? 1 : -1) + n) % n;
      lsTabPick(bi, next);
      document.getElementById('lsTab' + bi + '-' + next)?.focus();
    }

    // ══════════════════════════════════════════════════════════════
    //  2. type:'ladder' — 職級階梯
    // ══════════════════════════════════════════════════════════════

    function lsLadderDetailInner(b, st) {
      const tracks = Array.isArray(b.tracks) ? b.tracks : [];
      const track = tracks[st.trackIdx] || {};
      const nodes = Array.isArray(track.nodes) ? track.nodes : [];
      const node = nodes[st.nodeIdx] || {};
      const next = nodes[st.nodeIdx + 1];
      return `
            <div class="blk-detail-top">
              <span class="blk-detail-eyebrow">${h(track.name || '路線')} · 第 ${Number(st.nodeIdx) + 1} 級</span>
              ${node.level ? `<span class="blk-level">${h(node.level)}</span>` : ''}
            </div>
            <div class="blk-detail-title">${h(node.label || '未命名職級')}</div>
            ${node.desc ? `<p class="blk-desc">${h(node.desc)}</p>` : ''}
            <div class="blk-detail-next">${next ? '下一級 → ' + h(next.label || '') : '這是這條路線的最高職務。'}</div>`;
    }

    function lsLadderHtml(b, bi) {
      const tracks = (Array.isArray(b.tracks) ? b.tracks : []).filter(t => t && Array.isArray(t.nodes) && t.nodes.length);
      if (!tracks.length) return lsIntroHtml(b);
      const st = lsState(bi, b);
      if (!tracks[st.trackIdx]) { st.trackIdx = 0; st.nodeIdx = 0; }

      const rows = tracks.map((t, ti) => {
        const nodes = t.nodes;
        const dots = nodes.map((nd, ni) => {
          const active = ti === st.trackIdx && ni === st.nodeIdx;
          const past   = ti === st.trackIdx && ni < st.nodeIdx;
          const cls = 'blk-node' + (active ? ' active' : past ? ' past' : '');
          return `
                <button type="button" class="${cls}" data-t="${ti}" data-n="${ni}"
                  ${active ? 'aria-current="true"' : ''}
                  aria-label="${a((t.name || '') + ' 第 ' + (ni + 1) + ' 級 ' + (nd && nd.label || ''))}"
                  onclick="lsLadderPick(${Number(bi)}, ${ti}, ${ni})"
                  onkeydown="lsNodeKey(event, ${Number(bi)}, ${ti}, ${ni})">
                  <span class="blk-node-dot">${active ? '<i class="ph ph-check" aria-hidden="true"></i>' : ''}</span>
                  <span class="blk-node-label">${h(nd && nd.label || '')}</span>
                </button>`;
        }).join('');

        return `
            <div class="blk-track">
              <div class="blk-track-side">
                <span class="blk-track-badge${ti % 2 ? ' alt' : ''}">${h(t.name || '路線 ' + (ti + 1))}</span>
                ${t.hint ? `<span class="blk-track-hint">${h(t.hint)}</span>` : ''}
              </div>
              <div class="blk-track-main">
                <span class="blk-track-line" aria-hidden="true"></span>
                <div class="blk-nodes" style="--node-n:${nodes.length}">${dots}</div>
              </div>
            </div>`;
      }).join('');

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重設')}
          <div class="blk-tracks" id="lsLadder${Number(bi)}">${rows}</div>
          <div class="blk-card blk-detail" id="lsDetail${Number(bi)}">${lsLadderDetailInner(b, st)}</div>
        </div>`;
    }

    function lsLadderApply(bi, b) {
      const st = lessonState[bi] || {};
      const root = document.getElementById('lsLadder' + bi);
      if (root) {
        root.querySelectorAll('.blk-node').forEach(el => {
          const ti = Number(el.dataset.t);
          const ni = Number(el.dataset.n);
          const active = ti === st.trackIdx && ni === st.nodeIdx;
          const past   = ti === st.trackIdx && ni < st.nodeIdx;
          el.className = 'blk-node' + (active ? ' active' : past ? ' past' : '');
          if (active) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
          const dot = el.querySelector('.blk-node-dot');
          if (dot) dot.innerHTML = active ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
        });
      }
      const d = document.getElementById('lsDetail' + bi);
      if (d) d.innerHTML = lsLadderDetailInner(b, st);
    }

    // 點了另一條 track，原本那條的「已過」灰點會全部退回未到態 —— 著色只跟著作用中的線
    function lsLadderPick(bi, ti, ni) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tracks = Array.isArray(b.tracks) ? b.tracks : [];
      const nodes = tracks[ti] && Array.isArray(tracks[ti].nodes) ? tracks[ti].nodes : null;
      if (!nodes || !nodes[ni]) return;
      const st = lsState(bi, b);
      st.trackIdx = Number(ti);
      st.nodeIdx = Number(ni);
      lsLadderApply(bi, b);
    }

    function lsNodeKey(ev, bi, ti, ni) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        lsLadderPick(bi, ti, ni);
        return;
      }
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tracks = Array.isArray(b.tracks) ? b.tracks : [];
      const nodes = tracks[ti] && Array.isArray(tracks[ti].nodes) ? tracks[ti].nodes : [];
      if (nodes.length < 2) return;
      ev.preventDefault();
      const next = (Number(ni) + (ev.key === 'ArrowRight' ? 1 : -1) + nodes.length) % nodes.length;
      lsLadderPick(bi, ti, next);
      document.querySelector(`#lsLadder${Number(bi)} .blk-node[data-t="${Number(ti)}"][data-n="${next}"]`)?.focus();
    }

    // ══════════════════════════════════════════════════════════════
    //  3. type:'order' — 上船步驟拖曳排序
    // ══════════════════════════════════════════════════════════════

    function lsOrderItemsInner(b, bi) {
      const items = Array.isArray(b.items) ? b.items : [];
      const st = lsState(bi, b);
      const order = st.order || [];

      return order.map((orig, pos) => {
        const it = items[orig] || {};
        let cls = 'blk-item';
        if (st.checked != null) cls += (orig === pos ? ' ok' : ' bad');
        else if (st.sel === pos) cls += ' sel';
        if (st.dragFrom === pos) cls += ' dragging';

        return `
            <div class="${cls}" draggable="true" data-pos="${pos}"
              ondragstart="lsDragStart(event, ${Number(bi)}, ${pos})"
              ondragover="lsDragOver(event)"
              ondrop="lsDrop(event, ${Number(bi)}, ${pos})"
              ondragend="lsDragEnd(event, ${Number(bi)})"
              onclick="lsOrderSelect(${Number(bi)}, ${pos})">
              <span class="blk-item-num">${pos + 1}</span>
              <div class="blk-item-main">
                <div class="blk-item-title">${h(it.title || '未命名步驟')}</div>
                ${it.desc ? `<div class="blk-item-desc">${h(it.desc)}</div>` : ''}
              </div>
              <div class="blk-item-arrows">
                <button type="button" class="blk-arrow" aria-label="往上移一格"
                  ${pos === 0 ? 'disabled' : ''}
                  onclick="lsOrderMove(event, ${Number(bi)}, ${pos}, -1)">
                  <i class="ph ph-caret-up" aria-hidden="true"></i>
                </button>
                <button type="button" class="blk-arrow" aria-label="往下移一格"
                  ${pos >= order.length - 1 ? 'disabled' : ''}
                  onclick="lsOrderMove(event, ${Number(bi)}, ${pos}, 1)">
                  <i class="ph ph-caret-down" aria-hidden="true"></i>
                </button>
              </div>
              <span class="blk-grip" aria-hidden="true"><i class="ph ph-dots-six-vertical"></i></span>
            </div>`;
      }).join('');
    }

    function lsOrderHtml(b, bi) {
      const items = Array.isArray(b.items) ? b.items : [];
      if (!items.length) return lsIntroHtml(b);

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重新打亂')}
          <div class="blk-hint-top">↑ 最先做</div>
          <div class="blk-items" id="lsItems${Number(bi)}">${lsOrderItemsInner(b, bi)}</div>
          <div class="blk-hint-bot">↓ 最後做</div>
          <div class="blk-check-row">
            <button type="button" class="btn btn-sm btn-primary u-pill"
              onclick="lsOrderCheck(${Number(bi)})">檢查答案</button>
            <span class="blk-result" id="lsRes${Number(bi)}" role="status" aria-live="polite"></span>
          </div>
        </div>`;
    }

    // 只重畫卡片清單；結果列（aria-live）要一直留在 DOM 上才播報得出來
    function lsOrderApply(bi, b) {
      const box = document.getElementById('lsItems' + bi);
      if (box) box.innerHTML = lsOrderItemsInner(b, bi);
      lsOrderResultApply(bi, b);
    }

    function lsOrderResultApply(bi, b) {
      const el = document.getElementById('lsRes' + bi);
      if (!el) return;
      const st = lessonState[bi] || {};
      if (st.checked == null) { el.className = 'blk-result'; el.textContent = ''; return; }
      if (st.checked === 0) {
        el.className = 'blk-result ok';
        el.textContent = b.successText || '完全正確，這就是標準的上船流程。';
        return;
      }
      el.className = 'blk-result bad';
      el.textContent = `還有 ${st.checked} 張卡片的位置不對。` + (b.hintText ? ' ' + b.hintText : '');
    }

    // 拖曳與上下箭頭共用：任何一次移動都把 checked 清回 null，對錯著色立刻消失
    function lsOrderMoveTo(bi, from, to) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      const o = (st.order || []).slice();
      if (from < 0 || from >= o.length || to < 0 || to >= o.length || from === to) {
        st.dragFrom = null;
        lsOrderApply(bi, b);
        return;
      }
      const moved = o.splice(from, 1)[0];
      o.splice(to, 0, moved);
      st.order = o;
      st.checked = null;
      st.sel = to;
      st.dragFrom = null;
      lsOrderApply(bi, b);
    }

    function lsOrderSelect(bi, pos) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      st.sel = Number(pos);
      lsOrderApply(bi, b);
    }

    // 箭頭鈕：觸控裝置沒有 HTML5 drag，這是唯一可靠的輸入方式
    function lsOrderMove(ev, bi, pos, dir) {
      ev.stopPropagation();
      ev.preventDefault();
      lsOrderMoveTo(bi, Number(pos), Number(pos) + Number(dir));
    }

    function lsDragStart(ev, bi, pos) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      lsState(bi, b).dragFrom = Number(pos);
      try {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', String(pos));
      } catch (e) { /* 部分瀏覽器會丟錯，忽略 */ }
      const el = document.getElementById('lsItems' + bi);
      const row = el && el.querySelector(`.blk-item[data-pos="${Number(pos)}"]`);
      if (row) row.classList.add('dragging');
    }

    function lsDragOver(ev) {
      ev.preventDefault();
      try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { /* noop */ }
    }

    function lsDrop(ev, bi, pos) {
      ev.preventDefault();
      ev.stopPropagation();
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);

      let from = st.dragFrom;
      if (from == null) {
        try {
          const raw = ev.dataTransfer.getData('text/plain');
          if (raw !== '' && raw != null) from = Number(raw);
        } catch (e) { from = null; }
      }
      if (from == null || Number.isNaN(from) || from === Number(pos)) {
        st.dragFrom = null;
        lsOrderApply(bi, b);
        return;
      }
      lsOrderMoveTo(bi, Number(from), Number(pos));
    }

    function lsDragEnd(ev, bi) {
      const st = lessonState[bi];
      if (!st) return;
      st.dragFrom = null;
      const b = lsBlocks(lsCurMat())[bi];
      if (b) lsOrderApply(bi, b);
    }

    function lsOrderCheck(bi) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      const order = st.order || [];
      st.checked = order.filter((v, i) => v !== i).length;
      st.sel = null;
      lsOrderApply(bi, b);

      if (st.checked !== 0) return;
      // 全對就是標記這個單元完成的自然時機
      const c = activeCourse();
      const m = lsCurMat();
      if (c && m) saveProgress(c.id, m.fileName, { completed: true });
      showToast('答對了，單元已標記完成', 'success');
    }

    // ══════════════════════════════════════════════════════════════
    //  入口
    // ══════════════════════════════════════════════════════════════

    function renderLesson(course, idx) {
      ensureLessonStyle();
      const host = document.getElementById('lessonView');
      if (!host) return;
      if (!course) { goHome(); return; }

      const i = Number(idx);
      const m = (course.materials || [])[i];
      if (!m) { openModule(course.id); return; }

      // 切單元就整包丟掉互動狀態；同一單元重畫（後端同步完）則保留
      const key = String(course.id) + '#' + i;
      if (lessonStateKey !== key) { lessonState = {}; lessonStateKey = key; lessonVideoSaveAt = 0; }

      // 進到單元就算看過
      saveProgress(course.id, m.fileName, { viewed: true });

      let body;
      if (isInteractive(m)) {
        const blocks = lsBlocks(m);
        body = blocks.length
          ? blocks.map((b, bi) => lsBlockHtml(b, bi)).join('')
          : `<div class="ls-empty"><i class="ph ph-cards" aria-hidden="true"></i>
              <p>這份互動教材還沒有任何段落。</p></div>`;
      } else {
        body = lsFileHtml(course, m);
      }

      host.innerHTML = `
      ${lsBarHtml(course, m)}
      <div class="les-grid">
        <div class="les-main">
          ${body}
          ${lsNavHtml(course, i)}
        </div>
      </div>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  互動教材編輯器（#edOverlay）— 僅 isAdmin
    //  宣告：openEditor(courseId, matIdx) / closeEditor() / saveEditor()
    //  版面用 screens.css 既有的 .ed-* 類名；按鈕一律 shared/ui.css 的 .btn
    //  產出：{ kind:'interactive', fileName, estMinutes, blocks, updatedAt, updatedBy }
    // ══════════════════════════════════════════════════════════════

    // ── 模組層級狀態（不放 window，不與其他 writer 的變數衝突） ──
    let edCourseId  = null;   // string | null
    let edMatIdx    = null;   // number | null（null = 新增）
    let edDraft     = null;   // { fileName, estMinutes, blocks:[] }
    let edOriginal  = '';     // 開啟時的 JSON 快照，用來判斷是否有未儲存變更
    let edSaving    = false;
    let edFocusPath = null;   // 重繪後要自動聚焦的欄位 path
    let edKeyBound  = false;

    const ED_TYPES = ['text', 'tabs', 'ladder', 'order'];

    const ED_BLOCK_LABEL = {
      text:   '文字段落',
      tabs:   '分頁對照',
      ladder: '階梯進程',
      order:  '步驟排序'
    };

    const ED_BLOCK_ICON = {
      text:   'ph-text-align-left',
      tabs:   'ph-squares-four',
      ladder: 'ph-steps',
      order:  'ph-list-numbers'
    };

    // path 只允許走這些鍵（path 字串由本檔產生，仍做白名單，避免被 data-* 竄改後亂走）
    const ED_KEYS = new Set([
      'fileName', 'estMinutes', 'blocks',
      'type', 'title', 'minutes', 'body', 'intro',
      'tabs', 'tracks', 'items', 'nodes',
      'label', 'eyebrow', 'headline', 'chips', 'desc', 'summary',
      'key', 'name', 'hint', 'level',
      'successText', 'hintText'
    ]);

    // ── path 解析 ─────────────────────────────────────────────────
    function edStep(raw) {
      return /^\d+$/.test(raw) ? Number(raw) : raw;
    }

    // 回傳 { obj, key }，無效 path 回 null
    function edResolve(path) {
      if (!edDraft) return null;
      const parts = String(path || '').split('.');
      if (!parts.length || parts[0] === '') return null;
      let cur = edDraft;
      for (let i = 0; i < parts.length - 1; i++) {
        const k = edStep(parts[i]);
        if (typeof k === 'string' && !ED_KEYS.has(k)) return null;
        if (cur == null || typeof cur !== 'object') return null;
        cur = cur[k];
      }
      const key = edStep(parts[parts.length - 1]);
      if (typeof key === 'string' && !ED_KEYS.has(key)) return null;
      if (cur == null || typeof cur !== 'object') return null;
      return { obj: cur, key };
    }

    function edGet(path) {
      const r = edResolve(path);
      return r ? r.obj[r.key] : undefined;
    }

    // 取 path 指向的陣列（不存在就補一個空陣列）
    function edArr(path) {
      const r = edResolve(path);
      if (!r) return null;
      if (!Array.isArray(r.obj[r.key])) r.obj[r.key] = [];
      return r.obj[r.key];
    }

    // ── 空白樣板 ──────────────────────────────────────────────────
    function edNewTab() {
      return { label: '', eyebrow: '', headline: '', chips: [], desc: '', summary: '' };
    }

    function edNewNode() {
      return { label: '', level: '', desc: '' };
    }

    function edNewTrack() {
      return { key: '', name: '', hint: '', nodes: [edNewNode(), edNewNode(), edNewNode(), edNewNode()] };
    }

    function edNewItem() {
      return { title: '', desc: '' };
    }

    function edNewBlock(type) {
      const base = { type, title: ED_BLOCK_LABEL[type] || '新區塊', minutes: 3 };
      if (type === 'text')   return { ...base, body: '' };
      if (type === 'tabs')   return { ...base, minutes: 4, intro: '', tabs: [edNewTab(), edNewTab(), edNewTab()] };
      if (type === 'ladder') return { ...base, minutes: 5, intro: '', tracks: [edNewTrack()] };
      if (type === 'order')  return {
        ...base, minutes: 5, intro: '',
        items: [edNewItem(), edNewItem(), edNewItem()],
        successText: '順序完全正確，這就是標準的作業流程。',
        hintText: '想一想哪一個步驟必須先完成，才輪得到下一步。'
      };
      return null;
    }

    // 把既有 material 讀成可編輯的 draft（深拷貝 + 補齊缺欄位）
    function edLoadDraft(m) {
      const src = m && typeof m === 'object' ? m : {};
      const blocks = (Array.isArray(src.blocks) ? src.blocks : [])
        .filter(b => b && ED_TYPES.includes(b.type))
        .map(b => {
          const o = {
            type: b.type,
            title: String(b.title ?? ''),
            minutes: Number(b.minutes) || 0
          };
          if (b.type === 'text') {
            o.body = String(b.body ?? '');
          } else {
            o.intro = String(b.intro ?? '');
          }
          if (b.type === 'tabs') {
            o.tabs = (Array.isArray(b.tabs) ? b.tabs : []).map(t => ({
              label:    String(t?.label ?? ''),
              eyebrow:  String(t?.eyebrow ?? ''),
              headline: String(t?.headline ?? ''),
              chips:    (Array.isArray(t?.chips) ? t.chips : []).map(c => String(c ?? '')),
              desc:     String(t?.desc ?? ''),
              summary:  String(t?.summary ?? '')
            }));
          }
          if (b.type === 'ladder') {
            o.tracks = (Array.isArray(b.tracks) ? b.tracks : []).map(t => ({
              key:   String(t?.key ?? ''),
              name:  String(t?.name ?? ''),
              hint:  String(t?.hint ?? ''),
              nodes: (Array.isArray(t?.nodes) ? t.nodes : []).map(n => ({
                label: String(n?.label ?? ''),
                level: String(n?.level ?? ''),
                desc:  String(n?.desc ?? '')
              }))
            }));
          }
          if (b.type === 'order') {
            o.items = (Array.isArray(b.items) ? b.items : []).map(i => ({
              title: String(i?.title ?? ''),
              desc:  String(i?.desc ?? '')
            }));
            o.successText = String(b.successText ?? '');
            o.hintText    = String(b.hintText ?? '');
          }
          return o;
        });

      return {
        fileName: String(src.fileName ?? ''),
        estMinutes: Number(src.estMinutes) || 0,
        blocks
      };
    }

    // ── 欄位元件 ──────────────────────────────────────────────────
    function edDomId(path) {
      return 'ed_' + String(path).replace(/[^A-Za-z0-9_]/g, '_');
    }

    function edAutoAttr(path) {
      return edFocusPath && edFocusPath === path ? ' data-ed-autofocus="1"' : '';
    }

    function edInput(path, label, value, placeholder, opts) {
      const o = opts || {};
      const id = edDomId(path);
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">${h(label)}</label>
            <input id="${a(id)}" class="input" type="${a(o.type || 'text')}"
              ${o.type === 'number' ? 'min="0" step="1" inputmode="numeric"' : ''}
              data-path="${a(path)}" value="${a(value == null ? '' : value)}"
              placeholder="${a(placeholder || '')}" oninput="edSet(this)"${edAutoAttr(path)}>
            ${o.hint ? `<div class="ed-hint">${h(o.hint)}</div>` : ''}
          </div>`;
    }

    function edArea(path, label, value, placeholder, opts) {
      const o = opts || {};
      const id = edDomId(path);
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">${h(label)}</label>
            <textarea id="${a(id)}" class="input" rows="${a(o.rows || 4)}"
              data-path="${a(path)}" placeholder="${a(placeholder || '')}"
              oninput="edSet(this)"${edAutoAttr(path)}>${h(value == null ? '' : value)}</textarea>
            ${o.hint ? `<div class="ed-hint">${h(o.hint)}</div>` : ''}
          </div>`;
    }

    // chips 以逗號分隔編輯，儲存回陣列
    function edChipsField(path, value) {
      const id = edDomId(path);
      const text = (Array.isArray(value) ? value : []).join('、');
      return `<div class="ed-field">
            <label class="ed-label" for="${a(id)}">重點標籤（用逗號或頓號分隔）</label>
            <input id="${a(id)}" class="input" type="text"
              data-path="${a(path)}" value="${a(text)}"
              placeholder="例：值班航行、避碰規則、交接紀錄" oninput="edChips(this)">
          </div>`;
    }

    // 上移／下移／刪除三顆 icon 鈕
    function edToolsHtml(listPath, idx, len, delLabel) {
      return `<span class="ed-block-tools">
              <button type="button" class="ed-icon-btn" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edUp(this)" ${idx === 0 ? 'disabled' : ''}
                title="上移" aria-label="上移">
                <i class="ph ph-arrow-up" aria-hidden="true"></i>
              </button>
              <button type="button" class="ed-icon-btn" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edDown(this)" ${idx >= len - 1 ? 'disabled' : ''}
                title="下移" aria-label="下移">
                <i class="ph ph-arrow-down" aria-hidden="true"></i>
              </button>
              <button type="button" class="ed-icon-btn danger" data-p="${a(listPath)}" data-i="${idx}"
                onclick="edDel(this)"
                title="${a(delLabel)}" aria-label="${a(delLabel)}">
                <i class="ph ph-trash" aria-hidden="true"></i>
              </button>
            </span>`;
    }

    function edAddBtn(listPath, kind, label) {
      return `<button type="button" class="btn btn-sm btn-secondary"
              data-p="${a(listPath)}" data-k="${a(kind)}" onclick="edAdd(this)">
              <i class="ph ph-plus" aria-hidden="true"></i>${h(label)}
            </button>`;
    }

    // ── 區塊編輯器 ────────────────────────────────────────────────
    function edBlockHtml(b, bi, total) {
      const p = 'blocks.' + bi;
      const label = ED_BLOCK_LABEL[b.type] || b.type;

      let body = '';
      if (b.type === 'text') {
        body = edArea(p + '.body', '內文', b.body,
          '直接換行即可，課程頁會原樣保留段落。', { rows: 6,
          hint: '純文字，不會解讀 HTML 標籤。' });

      } else if (b.type === 'tabs') {
        const tabs = Array.isArray(b.tabs) ? b.tabs : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這組分頁要比較什麼。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">分頁（${tabs.length} 頁）</span>
            <div class="ed-hint">學員按上方分頁鈕切換，一次只看一頁。建議 2～4 頁。</div>
            <div class="ed-sub">${
              tabs.length
                ? tabs.map((t, ti) => edTabHtml(t, p, ti, tabs.length)).join('')
                : '<div class="ed-empty">還沒有任何分頁。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.tabs', 'tab', '新增分頁')}</div>
          </div>`;

      } else if (b.type === 'ladder') {
        const tracks = Array.isArray(b.tracks) ? b.tracks : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這幾條職涯路線。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">路線（${tracks.length} 條）</span>
            <div class="ed-hint">每條路線是一排可點的節級；節點由左到右代表由低到高。</div>
            <div class="ed-sub">${
              tracks.length
                ? tracks.map((t, ti) => edTrackHtml(t, p, ti, tracks.length)).join('')
                : '<div class="ed-empty">還沒有任何路線。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.tracks', 'track', '新增路線')}</div>
          </div>`;

      } else if (b.type === 'order') {
        const items = Array.isArray(b.items) ? b.items : [];
        body = edArea(p + '.intro', '引言', b.intro, '一兩句話說明這個排序題在練什麼。', { rows: 3 })
          + `<div class="ed-field">
            <span class="ed-label">步驟（${items.length} 張卡）</span>
            <div class="ed-hint">
              這裡的上下順序就是正確答案 —— 請由「最先做」排到「最後做」。
              學員看到的卡片一定會被打亂，不必自己先打亂。
            </div>
            <div class="ed-sub">${
              items.length
                ? items.map((it, ii) => edItemHtml(it, p, ii, items.length)).join('')
                : '<div class="ed-empty">還沒有任何步驟。</div>'
            }</div>
            <div class="ed-add-row">${edAddBtn(p + '.items', 'item', '新增步驟')}</div>
          </div>`
          + `<div class="ed-row">
            ${edInput(p + '.successText', '答對時顯示的話', b.successText, '順序完全正確，這就是標準流程。')}
            ${edInput(p + '.hintText', '答錯時的提示', b.hintText, '再想想哪一步必須先完成。')}
          </div>`;
      }

      return `<div class="ed-block">
          <div class="ed-block-head">
            <span class="ed-block-type"><i class="ph ${a(ED_BLOCK_ICON[b.type] || 'ph-square')}" aria-hidden="true"></i> ${h(label)}</span>
            <span class="ed-block-name" data-name-for="${a(p)}">${h(b.title || '未命名區塊')}</span>
            ${edToolsHtml('blocks', bi, total, '刪除這個區塊')}
          </div>
          <div class="ed-row">
            ${edInput(p + '.title', '區塊標題', b.title, '例：三個部門在做什麼')}
            ${edInput(p + '.minutes', '分鐘', b.minutes, '3', { type: 'number' })}
          </div>
          ${body}
        </div>`;
    }

    function edTabHtml(t, blockPath, ti, len) {
      const p = blockPath + '.tabs.' + ti;
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>分頁 ${ti + 1}${t.label ? '：' + h(t.label) : ''}</span>
                ${edToolsHtml(blockPath + '.tabs', ti, len, '刪除這個分頁')}
              </div>
              <div class="ed-row">
                ${edInput(p + '.label', '分頁鈕文字', t.label, '例：甲板部')}
                ${edInput(p + '.eyebrow', '小標（鈕上方）', t.eyebrow, '例：Deck Department')}
              </div>
              ${edInput(p + '.headline', '主標題', t.headline, '例：負責航行安全與貨物裝卸')}
              ${edChipsField(p + '.chips', t.chips)}
              ${edArea(p + '.desc', '說明', t.desc, '這個部門平常在做什麼。', { rows: 3 })}
              ${edArea(p + '.summary', '結論（深色條）', t.summary, '一句話收斂重點，會用深色底白字強調。', { rows: 2 })}
            </div>`;
    }

    function edTrackHtml(t, blockPath, ti, len) {
      const p = blockPath + '.tracks.' + ti;
      const nodes = Array.isArray(t.nodes) ? t.nodes : [];
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>路線 ${ti + 1}${t.name ? '：' + h(t.name) : ''}</span>
                ${edToolsHtml(blockPath + '.tracks', ti, len, '刪除這條路線')}
              </div>
              <div class="ed-row">
                ${edInput(p + '.name', '路線名稱', t.name, '例：甲板部')}
                ${edInput(p + '.key', '代號（英數，不重複）', t.key, '例：deck')}
              </div>
              ${edInput(p + '.hint', '路線補充說明', t.hint, '例：航行值班體系')}
              <div class="ed-field">
                <span class="ed-label">節級（${nodes.length} 級，由低到高）</span>
                <div class="ed-hint">課程頁預設選到第 4 級，讓「已過」與「未到」兩種樣式同時出現；建議至少 4 級。</div>
                <div class="ed-sub">${
                  nodes.length
                    ? nodes.map((n, ni) => edNodeHtml(n, p, ni, nodes.length)).join('')
                    : '<div class="ed-empty">這條路線還沒有節級。</div>'
                }</div>
                <div class="ed-add-row">${edAddBtn(p + '.nodes', 'node', '新增節級')}</div>
              </div>
            </div>`;
    }

    function edNodeHtml(n, trackPath, ni, len) {
      const p = trackPath + '.nodes.' + ni;
      return `<div class="ed-sub-item">
                    <div class="ed-sub-head">
                      <span>第 ${ni + 1} 級${n.label ? '：' + h(n.label) : ''}</span>
                      ${edToolsHtml(trackPath + '.nodes', ni, len, '刪除這一級')}
                    </div>
                    <div class="ed-row">
                      ${edInput(p + '.label', '職務名稱', n.label, '例：三副')}
                      ${edInput(p + '.level', '級別標記', n.level, '例：Junior Officer')}
                    </div>
                    ${edArea(p + '.desc', '職務說明', n.desc, '這一級負責什麼、需要什麼資格。', { rows: 3 })}
                  </div>`;
    }

    function edItemHtml(it, blockPath, ii, len) {
      const p = blockPath + '.items.' + ii;
      return `<div class="ed-sub-item">
              <div class="ed-sub-head">
                <span>第 ${ii + 1} 步${it.title ? '：' + h(it.title) : ''}</span>
                ${edToolsHtml(blockPath + '.items', ii, len, '刪除這個步驟')}
              </div>
              ${edInput(p + '.title', '步驟標題', it.title, '例：報到與繳交證書')}
              ${edArea(p + '.desc', '步驟說明', it.desc, '這一步要做什麼。', { rows: 2 })}
            </div>`;
    }

    // ── Modal 整體 ────────────────────────────────────────────────
    function edTotalMinutes() {
      if (!edDraft) return 0;
      return (edDraft.blocks || []).reduce((s, b) => s + (Number(b.minutes) || 0), 0);
    }

    function edFootText() {
      const n = (edDraft?.blocks || []).length;
      const sum = edTotalMinutes();
      return `共 ${n} 個區塊` + (sum ? ` · 區塊分鐘合計 ${sum} 分` : '');
    }

    function edModalHtml() {
      const blocks = edDraft.blocks || [];
      const isNew = edMatIdx == null;

      return `<div class="ed-modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">
        <div class="ed-head">
          <div>
            <h3 id="edTitle">${isNew ? '新增互動教材' : '編輯互動教材'}</h3>
            <div class="ed-head-sub">學員會在課程頁依序看到下面的區塊</div>
          </div>
          <button type="button" class="ed-close" onclick="closeEditor()"
            title="關閉" aria-label="關閉編輯器">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="ed-body" id="edBody">
          <div class="ed-row">
            ${edInput('fileName', '單元標題', edDraft.fileName, '例：上船前的準備', {
              hint: '這個標題同時是進度記錄的鍵值，改名之後舊的學習進度會從頭算。'
            })}
            ${edInput('estMinutes', '預估時長（分鐘）', edDraft.estMinutes, '15', { type: 'number' })}
          </div>

          <div class="ed-field">
            <span class="ed-label">學習區塊（${blocks.length}）</span>
            <div class="ed-blocks">${
              blocks.length
                ? blocks.map((b, i) => edBlockHtml(b, i, blocks.length)).join('')
                : '<div class="ed-empty">還沒有任何區塊。<br>用下面的按鈕加入第一個區塊。</div>'
            }</div>
            <div class="ed-add-row">
              ${ED_TYPES.map(t => `<button type="button" class="btn btn-sm btn-secondary"
                data-p="blocks" data-k="${a(t)}" onclick="edAdd(this)">
                <i class="ph ${a(ED_BLOCK_ICON[t])}" aria-hidden="true"></i>${h(ED_BLOCK_LABEL[t])}
              </button>`).join('')}
            </div>
          </div>
        </div>

        <div class="ed-foot">
          <span class="ed-foot-left" id="edFoot">${h(edFootText())}</span>
          <button type="button" class="btn btn-secondary" onclick="closeEditor()">取消</button>
          <button type="button" class="btn btn-primary" id="edSave" onclick="saveEditor()">
            <i class="ph ph-check" aria-hidden="true"></i>儲存
          </button>
        </div>
      </div>`;
    }

    // 重繪：保留 .ed-body 的捲動位置，並把焦點送到剛新增的欄位
    function edRender() {
      const host = document.getElementById('edOverlay');
      if (!host || !edDraft) return;
      const prevTop = document.getElementById('edBody')?.scrollTop || 0;

      host.innerHTML = edModalHtml();

      const body = document.getElementById('edBody');
      if (body) body.scrollTop = prevTop;

      const target = host.querySelector('[data-ed-autofocus="1"]');
      edFocusPath = null;
      if (target) {
        target.focus();
        if (typeof target.scrollIntoView === 'function') {
          target.scrollIntoView({ block: 'center' });
        }
      }
      edSyncSave();
    }

    function edSyncFoot() {
      const el = document.getElementById('edFoot');
      if (el) el.textContent = edFootText();
    }

    function edSyncSave() {
      const btn = document.getElementById('edSave');
      if (btn) btn.disabled = !!edSaving;
    }

    // ── 欄位寫回（不重繪，避免打字時失焦） ─────────────────────────
    function edSet(el) {
      if (!el || !el.dataset) return;
      const path = el.dataset.path;
      const r = edResolve(path);
      if (!r) return;

      if (el.type === 'number') {
        const n = parseInt(el.value, 10);
        r.obj[r.key] = Number.isFinite(n) && n >= 0 ? n : 0;
        if (path === 'estMinutes' || /\.minutes$/.test(path)) edSyncFoot();
      } else {
        r.obj[r.key] = el.value;
      }

      // 區塊標題改了，同步更新該區塊的摺疊標頭文字
      const m = /^(blocks\.\d+)\.title$/.exec(path || '');
      if (m) {
        const nameEl = document.querySelector('[data-name-for="' + m[1] + '"]');
        if (nameEl) nameEl.textContent = el.value || '未命名區塊';
      }
    }

    function edChips(el) {
      if (!el || !el.dataset) return;
      const r = edResolve(el.dataset.path);
      if (!r) return;
      r.obj[r.key] = String(el.value || '')
        .split(/[,，、]/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    // ── 結構操作（會重繪） ────────────────────────────────────────
    function edSwap(el, delta) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      const i = Number(el.dataset.i);
      if (!list || Number.isNaN(i)) return;
      const j = i + delta;
      if (j < 0 || j >= list.length) return;
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
      edRender();
    }

    function edUp(el)   { edSwap(el, -1); }
    function edDown(el) { edSwap(el, 1); }

    function edDel(el) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      const i = Number(el.dataset.i);
      if (!list || Number.isNaN(i) || !list[i]) return;
      if (!confirm('確定刪除？刪掉之後要按儲存才會寫回課程。')) return;
      list.splice(i, 1);
      edRender();
    }

    function edAdd(el) {
      if (!el || !el.dataset) return;
      const list = edArr(el.dataset.p);
      if (!list) return;
      const kind = el.dataset.k;

      let item = null;
      let firstKey = 'title';
      if (ED_TYPES.includes(kind)) { item = edNewBlock(kind); firstKey = 'title'; }
      else if (kind === 'tab')     { item = edNewTab();   firstKey = 'label'; }
      else if (kind === 'track')   { item = edNewTrack(); firstKey = 'name'; }
      else if (kind === 'node')    { item = edNewNode();  firstKey = 'label'; }
      else if (kind === 'item')    { item = edNewItem();  firstKey = 'title'; }
      if (!item) return;

      list.push(item);
      edFocusPath = el.dataset.p + '.' + (list.length - 1) + '.' + firstKey;
      edRender();
    }

    // ── 驗證與輸出 ────────────────────────────────────────────────
    const edTrim = v => String(v == null ? '' : v).trim();

    // 回傳乾淨的 { fileName, estMinutes, blocks }，不合格回 null（並已 showToast）
    function edBuild() {
      if (!edDraft) return null;

      const fileName = edTrim(edDraft.fileName);
      if (!fileName) { edFail('請先填寫單元標題。', 'fileName'); return null; }

      const blocks = [];
      const srcBlocks = Array.isArray(edDraft.blocks) ? edDraft.blocks : [];
      if (!srcBlocks.length) { edFail('請至少加入一個學習區塊。'); return null; }

      for (let i = 0; i < srcBlocks.length; i++) {
        const b = srcBlocks[i];
        const no = i + 1;
        const title = edTrim(b.title);
        if (!title) { edFail(`第 ${no} 個區塊還沒有標題。`, 'blocks.' + i + '.title'); return null; }

        const out = { type: b.type, title, minutes: Number(b.minutes) || 0 };

        if (b.type === 'text') {
          const body = String(b.body == null ? '' : b.body).replace(/\s+$/, '');
          if (!body.trim()) { edFail(`第 ${no} 個區塊「${title}」的內文是空的。`, 'blocks.' + i + '.body'); return null; }
          out.body = body;

        } else {
          out.intro = edTrim(b.intro);

          if (b.type === 'tabs') {
            const tabs = (Array.isArray(b.tabs) ? b.tabs : [])
              .map(t => ({
                label:    edTrim(t.label),
                eyebrow:  edTrim(t.eyebrow),
                headline: edTrim(t.headline),
                chips:    (Array.isArray(t.chips) ? t.chips : []).map(edTrim).filter(Boolean),
                desc:     edTrim(t.desc),
                summary:  edTrim(t.summary)
              }))
              .filter(t => t.label || t.headline || t.desc || t.summary || t.chips.length);
            if (!tabs.length) { edFail(`第 ${no} 個區塊「${title}」至少要有一個分頁。`); return null; }
            const blank = tabs.findIndex(t => !t.label);
            if (blank >= 0) { edFail(`第 ${no} 個區塊的分頁 ${blank + 1} 還沒有分頁鈕文字。`); return null; }
            out.tabs = tabs;

          } else if (b.type === 'ladder') {
            const tracks = [];
            const usedKeys = new Set();
            const srcTracks = Array.isArray(b.tracks) ? b.tracks : [];
            for (let ti = 0; ti < srcTracks.length; ti++) {
              const t = srcTracks[ti];
              const nodes = (Array.isArray(t.nodes) ? t.nodes : [])
                .map(n => ({ label: edTrim(n.label), level: edTrim(n.level), desc: edTrim(n.desc) }))
                .filter(n => n.label || n.level || n.desc);
              const name = edTrim(t.name);
              if (!name && !nodes.length) continue;      // 整條空白 → 丟掉
              if (!name) { edFail(`第 ${no} 個區塊的路線 ${ti + 1} 還沒有名稱。`); return null; }
              if (!nodes.length) { edFail(`第 ${no} 個區塊的路線「${name}」還沒有節級。`); return null; }
              const blankNode = nodes.findIndex(n => !n.label);
              if (blankNode >= 0) { edFail(`路線「${name}」的第 ${blankNode + 1} 級還沒有職務名稱。`); return null; }

              // key 缺漏或重複時自動補，避免課程頁 activeTrack 撞號
              let key = edTrim(t.key).replace(/[^A-Za-z0-9_-]/g, '');
              if (!key || usedKeys.has(key)) key = 'track' + (ti + 1);
              while (usedKeys.has(key)) key += '_';
              usedKeys.add(key);

              tracks.push({ key, name, hint: edTrim(t.hint), nodes });
            }
            if (!tracks.length) { edFail(`第 ${no} 個區塊「${title}」至少要有一條路線。`); return null; }
            out.tracks = tracks;

          } else if (b.type === 'order') {
            const items = (Array.isArray(b.items) ? b.items : [])
              .map(it => ({ title: edTrim(it.title), desc: edTrim(it.desc) }))
              .filter(it => it.title || it.desc);
            if (items.length < 2) { edFail(`第 ${no} 個區塊「${title}」至少要有兩個步驟才排得起來。`); return null; }
            const blankItem = items.findIndex(it => !it.title);
            if (blankItem >= 0) { edFail(`第 ${no} 個區塊的第 ${blankItem + 1} 步還沒有標題。`); return null; }
            out.items = items;
            out.successText = edTrim(b.successText) || '順序完全正確。';
            out.hintText    = edTrim(b.hintText)    || '再想想哪一步必須先完成。';

          } else {
            edFail(`第 ${no} 個區塊的型別無法辨識。`);
            return null;
          }
        }

        blocks.push(out);
      }

      const est = Number(edDraft.estMinutes) || 0;
      return {
        fileName,
        estMinutes: est || edTotalMinutes(),
        blocks
      };
    }

    // 驗證失敗：提示 + 把焦點送到出問題的欄位
    function edFail(msg, path) {
      showToast(msg, 'error');
      if (!path) return;
      const el = document.getElementById(edDomId(path));
      if (el) {
        el.focus();
        if (typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'center' });
      }
    }

    function edDirty() {
      return !!edDraft && JSON.stringify(edDraft) !== edOriginal;
    }

    // ── Esc 關閉 ──────────────────────────────────────────────────
    function edBindKeys() {
      if (edKeyBound) return;
      edKeyBound = true;
      document.addEventListener('keydown', ev => {
        if (ev.key !== 'Escape' || !edDraft || edSaving) return;
        ev.preventDefault();
        closeEditor();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  對外三個函式
    // ══════════════════════════════════════════════════════════════

    // matIdx = null → 新增；否則編輯該互動教材
    function openEditor(courseId, matIdx) {
      if (!isAdmin) return;

      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { showToast('找不到這個課程模組', 'error'); return; }

      const host = document.getElementById('edOverlay');
      if (!host) { showToast('編輯器容器不存在', 'error'); return; }

      let idx = null;
      if (matIdx != null) {
        idx = Number(matIdx);
        const m = (course.materials || [])[idx];
        if (!m) { showToast('找不到這個單元', 'error'); return; }
        if (!isInteractive(m)) { showToast('這是檔案型教材，不能用互動編輯器修改', 'error'); return; }
        edDraft = edLoadDraft(m);
      } else {
        edDraft = { fileName: '', estMinutes: 0, blocks: [] };
      }

      edCourseId  = String(course.id);
      edMatIdx    = idx;
      edOriginal  = JSON.stringify(edDraft);
      edSaving    = false;
      edFocusPath = idx == null ? 'fileName' : null;

      edBindKeys();
      edRender();
      host.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    // force = true 時不問未儲存變更（儲存成功後內部呼叫）
    function closeEditor(force) {
      if (!edDraft) return;
      if (edSaving) return;
      if (force !== true && edDirty() && !confirm('有尚未儲存的變更，確定要關閉嗎？')) return;

      const host = document.getElementById('edOverlay');
      if (host) {
        host.classList.remove('open');
        host.innerHTML = '';
      }
      document.body.style.overflow = '';

      edDraft = null;
      edOriginal = '';
      edCourseId = null;
      edMatIdx = null;
      edFocusPath = null;
    }

    async function saveEditor() {
      if (!isAdmin || !edDraft || edSaving) return;

      const course = allCourses.find(c => String(c.id) === String(edCourseId));
      if (!course) { showToast('找不到這個課程模組', 'error'); closeEditor(true); return; }

      const clean = edBuild();
      if (!clean) return;

      if (!Array.isArray(course.materials)) course.materials = [];
      if (edMatIdx != null && !course.materials[edMatIdx]) {
        showToast('這個單元已被其他人移除，請重新整理後再試', 'error');
        return;
      }

      const snapshot = course.materials.slice();
      const mat = {
        kind: 'interactive',
        fileName: clean.fileName,
        estMinutes: clean.estMinutes,
        blocks: clean.blocks,
        updatedAt: new Date().toISOString(),
        updatedBy: (currentUser && currentUser.username) || ''
      };

      if (edMatIdx == null) course.materials.push(mat);
      else course.materials[edMatIdx] = mat;

      edSaving = true;
      edSyncSave();
      try {
        await persistCourses();
        edSaving = false;
        closeEditor(true);
        renderModule(course);
        showToast('已儲存互動教材', 'success');
      } catch (err) {
        course.materials = snapshot;                 // 失敗就還原，編輯器留著讓使用者再試
        edSaving = false;
        edSyncSave();
        showToast(`儲存失敗：${(err && err.message) || '未知錯誤'}`, 'error');
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  AI 助教側欄（skeleton 的 <aside class="ai-panel" id="aiPanel">）
    //  版面照原型課程頁右側欄：桌機 380px 固定在右、窄螢幕全幅抽屜
    //  類名一律用 screens.css 既有的 .ai-* / body.ai-open，不新增按鈕樣式
    //  後端 askgemini 只開放 admin / teacher，非該兩角色連面板都不渲染
    // ══════════════════════════════════════════════════════════════

    // ── 狀態（只有這一份，切換單元時保留對話，因為每則訊息都會自帶單元上下文）──
    let aiOpen = false;
    let aiMsgs = [];              // [{ role:'me'|'bot'|'err', text }]
    let aiBusy = false;
    let aiDraft = '';             // 重繪面板時把使用者沒送出的草稿帶回來
    let aiCooldownUntil = 0;      // aiChat.chat 丟 rateLimited 時進入冷卻
    let aiCdTimer = null;

    const AI_SUGGESTIONS = [
      '這個單元的重點是什麼？',
      '可以用更簡單的方式解釋一次嗎？',
      '實際在船上會怎麼用到？'
    ];

    // ── 權限 ──────────────────────────────────────────────────────
    // core.js 已有 canUseAi()；這裡做一層容錯，單獨載入本檔時直接問 Auth
    function aiAllowed() {
      if (typeof canUseAi === 'function') return !!canUseAi();
      try {
        const r = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : '';
        return r === 'admin' || r === 'teacher';
      } catch { return false; }
    }

    // ── 小工具 ────────────────────────────────────────────────────
    function aiPanelEl() { return document.getElementById('aiPanel'); }

    // AI 回覆是純文字：一律 h() 後才把換行換成 <br>，絕不直接塞原始回覆
    function aiFmt(s) { return h(s).replace(/\r\n|\r|\n/g, '<br>'); }

    function aiUnitTitle(m) {
      if (typeof lsUnitTitle === 'function') return lsUnitTitle(m);
      if (!m) return '';
      const name = m.fileName || '未命名單元';
      return (typeof isInteractive === 'function' && isInteractive(m))
        ? name : (name.replace(/\.[^.\s]{1,8}$/, '') || name);
    }

    // 目前單元的上下文，會塞在送出訊息的開頭，讓回答貼合這一課的教材
    function aiContextLine() {
      const c = (typeof activeCourse === 'function') ? activeCourse() : null;
      if (!c) return '';
      const mats = Array.isArray(c.materials) ? c.materials : [];
      const m = (typeof activeMatIdx === 'number') ? mats[activeMatIdx] : null;
      const unit = m ? aiUnitTitle(m) : '';
      const name = c.name || '未命名課程';
      return unit ? `（目前正在看：${name} / ${unit}）` : `（目前正在看：${name}）`;
    }

    function aiCooldownLeft() {
      return Math.max(0, Math.ceil((aiCooldownUntil - Date.now()) / 1000));
    }

    // 冷卻中每秒更新送出鈕與 placeholder，不整頁重繪（避免吃掉草稿與焦點）
    function aiTickCooldown() {
      if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
      const step = () => {
        const left = aiCooldownLeft();
        const btn = document.getElementById('aiSend');
        const box = document.getElementById('aiInput');
        if (left > 0) {
          if (btn) { btn.disabled = true; btn.title = `冷卻中，還要 ${left} 秒`; }
          if (box) box.placeholder = `AI 服務冷卻中，還要 ${left} 秒…`;
          return;
        }
        if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
        if (btn) { btn.title = '送出'; }
        if (box) box.placeholder = '輸入你的問題…';
        aiSyncSendState();
      };
      step();
      if (aiCooldownLeft() > 0) aiCdTimer = setInterval(step, 1000);
    }

    // 送出鈕只在「有字、沒在忙、沒冷卻」時可按
    function aiSyncSendState() {
      const btn = document.getElementById('aiSend');
      const box = document.getElementById('aiInput');
      if (!btn) return;
      const hasText = !!(box ? box.value.trim() : aiDraft.trim());
      btn.disabled = aiBusy || aiCooldownLeft() > 0 || !hasText;
    }

    function aiScrollBottom() {
      const body = document.getElementById('aiBody');
      if (body) body.scrollTop = body.scrollHeight;
    }

    // ── 輸入事件 ──────────────────────────────────────────────────
    function aiOnInput(el) {
      aiDraft = el.value;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      aiSyncSendState();
    }

    // Enter 送出、Shift+Enter 換行（輸入法組字中的 Enter 不送出）
    function aiOnKey(ev, el) {
      if (ev.key !== 'Enter' || ev.shiftKey || ev.isComposing) return;
      ev.preventDefault();
      sendAiMessage(el.value);
    }

    function aiAskSuggestion(i) {
      const q = AI_SUGGESTIONS[i];
      if (q) sendAiMessage(q);
    }

    function aiOnPanelKey(ev) {
      if (ev.key === 'Escape') { ev.stopPropagation(); closeAi(); }
    }

    // ── 開關 ──────────────────────────────────────────────────────
    function toggleAi() {
      if (!aiAllowed()) {
        showToast('AI 助教僅開放教師與管理員使用', 'error');
        return;
      }
      aiOpen ? closeAi() : openAi();
    }

    function openAi() {
      if (!aiAllowed()) {
        showToast('AI 助教僅開放教師與管理員使用', 'error');
        return;
      }
      aiOpen = true;
      renderAiPanel();
      const box = document.getElementById('aiInput');
      if (box) box.focus();
    }

    // core.js 的 goHome() / openModule() 會呼叫這支關掉面板
    function closeAi() {
      aiOpen = false;
      if (aiCdTimer) { clearInterval(aiCdTimer); aiCdTimer = null; }
      const panel = aiPanelEl();
      if (panel) {
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
      }
      document.body.classList.remove('ai-open');
      const btn = document.querySelector('.les-bar-right button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    // ── 渲染 ──────────────────────────────────────────────────────
    function renderAiPanel() {
      const panel = aiPanelEl();
      if (!panel) return;

      // 權限不足：連面板內容都不產生（不是 disabled，是不渲染）
      if (!aiAllowed()) {
        panel.innerHTML = '';
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('ai-open');
        return;
      }

      const ctx = aiContextLine();
      const left = aiCooldownLeft();

      const ctxHtml = ctx
        ? `<div style="font-size:11px; line-height:1.5; color:var(--apple-gray); padding:0 2px 2px">${h(ctx)}</div>`
        : '';

      const emptyHtml = aiMsgs.length ? '' : `
        <div class="ai-empty">可以問這個單元的內容，<br>或先從下面的問題開始。</div>
        <div class="ai-sugg">
          ${AI_SUGGESTIONS.map((q, i) => `
            <button type="button" class="ai-sugg-btn" onclick="aiAskSuggestion(${i})">${h(q)}</button>`).join('')}
        </div>`;

      const msgsHtml = aiMsgs.map(m => {
        if (m.role === 'err') {
          return `<div class="ai-msg bot" style="background:var(--ui-danger-bg); color:var(--ui-danger)">${aiFmt(m.text)}</div>`;
        }
        return `<div class="ai-msg ${m.role === 'me' ? 'me' : 'bot'}">${aiFmt(m.text)}</div>`;
      }).join('');

      const busyHtml = aiBusy ? `<div class="ai-busy">AI 助教正在思考…</div>` : '';

      panel.innerHTML = `
        <div class="ai-head">
          <span class="ai-head-title"><i class="ph-fill ph-sparkle" aria-hidden="true"></i>AI 助教</span>
          <button type="button" class="ai-close" onclick="closeAi()"
            title="關閉 AI 助教" aria-label="關閉 AI 助教">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="ai-body" id="aiBody" role="log" aria-live="polite" aria-label="AI 助教對話">
          ${ctxHtml}${emptyHtml}${msgsHtml}${busyHtml}
        </div>

        <div class="ai-foot">
          <textarea class="input" id="aiInput" rows="1"
            style="resize:none; height:40px; max-height:120px; padding:10px 12px; line-height:1.5; overflow-y:auto"
            placeholder="${left > 0 ? a('AI 服務冷卻中，還要 ' + left + ' 秒…') : '輸入你的問題…'}"
            aria-label="輸入你的問題，Enter 送出，Shift+Enter 換行"
            oninput="aiOnInput(this)" onkeydown="aiOnKey(event, this)"></textarea>
          <button type="button" class="ai-send" id="aiSend" onclick="sendAiMessage()"
            title="送出" aria-label="送出問題">
            <i class="ph ph-paper-plane-right" aria-hidden="true"></i>
          </button>
        </div>`;

      panel.onkeydown = aiOnPanelKey;
      panel.setAttribute('aria-hidden', aiOpen ? 'false' : 'true');
      panel.classList.toggle('open', aiOpen);
      document.body.classList.toggle('ai-open', aiOpen);

      const btn = document.querySelector('.les-bar-right button');
      if (btn) btn.setAttribute('aria-expanded', aiOpen ? 'true' : 'false');

      // 把草稿與自動長高還原回去
      const box = document.getElementById('aiInput');
      if (box && aiDraft) {
        box.value = aiDraft;
        box.style.height = 'auto';
        box.style.height = Math.min(box.scrollHeight, 120) + 'px';
      }
      if (box) box.disabled = aiBusy;

      aiSyncSendState();
      if (left > 0) aiTickCooldown();
      aiScrollBottom();
    }

    // ── 送出 ──────────────────────────────────────────────────────
    async function sendAiMessage(text) {
      if (!aiAllowed()) {
        showToast('AI 助教僅開放教師與管理員使用', 'error');
        return;
      }
      const box = document.getElementById('aiInput');
      const raw = (text != null ? text : (box ? box.value : aiDraft)) || '';
      const q = String(raw).trim();
      if (!q || aiBusy) return;

      if (aiCooldownLeft() > 0) {
        showToast(`AI 服務冷卻中，請等待 ${aiCooldownLeft()} 秒`, 'error');
        return;
      }
      if (typeof aiChat === 'undefined' || !aiChat || typeof aiChat.chat !== 'function') {
        showToast('AI 服務尚未就緒，請稍後再試', 'error');
        return;
      }

      aiMsgs.push({ role: 'me', text: q });
      aiDraft = '';
      aiBusy = true;
      renderAiPanel();

      // 單元上下文塞在訊息開頭，讓回答貼合這一課的教材
      const ctx = aiContextLine();
      const payload = ctx ? `${ctx}\n${q}` : q;

      try {
        const reply = await aiChat.chat(payload);
        aiMsgs.push({ role: 'bot', text: String(reply || '抱歉，我沒有收到回覆，請再試一次。') });
      } catch (err) {
        const msg = (err && err.message) ? String(err.message) : '連線發生問題';
        if (err && err.rateLimited) {
          // api.js 會進入 60 秒冷卻，這段期間送出鈕一律禁用
          aiCooldownUntil = Date.now() + 60000;
          aiMsgs.push({ role: 'err', text: `${msg}\n（提問太密集了，稍等一下再問，剛才的問題沒有送出。）` });
          showToast('AI 請求已達上限，請稍後再試', 'error');
        } else {
          aiMsgs.push({ role: 'err', text: `回答失敗：${msg}\n可以再送一次，或稍後再問。` });
        }
      } finally {
        aiBusy = false;
        renderAiPanel();
        const again = document.getElementById('aiInput');
        if (again && !again.disabled && aiCooldownLeft() === 0) again.focus();
      }
    }

  </script>
</body>
</html>
