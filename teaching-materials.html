<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材管理 | WHL MARITRAIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 共用按鈕規範：全站唯一的按鈕來源，勿在頁面內另外定義 -->
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       教材管理 — 視覺完全依照使用者提供的原型「船員教材原型.dc.html」
       此頁為獨立視覺系統（暖紙底 × 深海藍 × 襯線標題），覆寫範圍僅限本頁，
       不動 shared/ui.css 與其他頁面。
       ══════════════════════════════════════════════════════════════ */
    :root {
      --bg:        #F9F8F6;
      --surface:   #FFFFFF;
      --muted:     #F2EEE7;
      --muted-2:   #EDE9E1;
      --panel:     #F4F2EE;
      --soft:      #FBFAF8;
      --line:      #E9E5DC;
      --line-2:    #F0EDE6;
      --text:      #141412;
      --text-2:    #3F3D38;
      --dim:       #6B6860;
      --dim-2:     #8A877F;
      --faint:     #B9B5AD;
      --node-line: #D9D4CA;
      --node-ring: #C9C4B9;
      --blue:      #0B6BA8;
      --blue-deep: #0A4F7C;
      --blue-soft: #E6F0F8;
      --blue-line: #D2E3F1;
      --blue-bar:  #4F9BD6;
      --blue-pct:  #8CC4EE;
      --dark:      #141412;
      --dark-2:    #2A2925;
      --dark-3:    #3A3934;
      --ok:        #16A34A;
      --ok-bg:     #F0FAF3;
      --ok-line:   #86D4A0;
      --bad:       #DC2626;
      --bad-bg:    #FDF2F1;
      --bad-line:  #F0A8A0;
      --star:      #F5B301;
      --serif:     'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
      --sans:      'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --max:       1200px;
      --topbar-h:  60px;
      --lesbar-h:  52px;
      --ai-w:      380px;

      /* 舊變數別名：少數 inline style 仍引用，映射到原型色票 */
      --apple-text: var(--text);
      --apple-gray: var(--dim);
      --apple-gray-2: var(--dim);
      --apple-bg: var(--muted);
      --apple-white: var(--surface);
      --apple-border: var(--line);
      --apple-blue: var(--blue);
      --brand: var(--blue);
      --ui-danger: var(--bad);
      --ui-danger-bg: var(--bad-bg);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: var(--blue-deep); }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; }
    .hidden { display: none !important; }
    i.ph, i[class^="ph-"], i[class*=" ph-"] { line-height: 1; }

    /* ── 頂欄（原型：sticky 60px、半透明紙底、襯線站名） ── */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      height: var(--topbar-h);
      background: rgba(249,248,246,.86);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 16px;
      padding: 0 20px;
    }
    .topbar > * { flex: 0 0 auto; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; font-weight: 600; color: var(--dim);
      padding: 6px 10px; border-radius: 999px;
      transition: background .15s, color .15s;
    }
    .back-btn:hover { background: var(--muted); color: var(--text); }
    .topbar-sep { width: 1px; height: 18px; background: var(--line); }
    .topbar-brand {
      font-family: var(--serif); font-weight: 900; font-size: 20px;
      letter-spacing: .06em; color: var(--text); cursor: pointer;
    }
    .topbar-nav { display: flex; align-items: center; gap: 24px; margin-left: 8px; }
    .topbar-nav-link {
      font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
      transition: opacity .15s;
    }
    .topbar-nav-link:hover { opacity: .7; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .user-pill { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .role-pill {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      background: var(--muted); color: var(--dim); border: 1px solid var(--line);
    }
    .role-admin   { background: var(--blue); color: #fff; border-color: var(--blue); }
    .role-teacher { background: var(--blue-soft); color: var(--blue-deep); border-color: var(--blue-line); }
    .role-crew    { background: var(--muted); color: var(--text); }
    .role-guest   { background: var(--surface); color: var(--dim); }

    /* ── 原型按鈕語彙：黑色膠囊（主）、白底描邊（次）、純文字 ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 700; line-height: 1;
      border: 1px solid transparent; background: var(--surface); color: var(--text);
      transition: background .15s, color .15s, border-color .15s, opacity .15s;
      text-decoration: none; white-space: nowrap;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--dark); color: #fff; border-color: var(--dark); }
    .btn-primary:hover:not(:disabled) { background: var(--dark-2); border-color: var(--dark-2); }
    .btn-secondary, .btn-soft { background: var(--surface); color: var(--text); border-color: var(--line); }
    .btn-secondary:hover:not(:disabled), .btn-soft:hover:not(:disabled) { background: var(--muted); }
    .btn-plain { background: transparent; color: var(--dim); border-color: transparent; }
    .btn-plain:hover:not(:disabled) { background: var(--muted); color: var(--text); }
    .btn-danger { background: transparent; color: var(--bad); border-color: transparent; }
    .btn-danger:hover:not(:disabled) { background: var(--bad-bg); }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn-icon { width: 32px; height: 32px; padding: 0; border-radius: 50%; }
    .btn-icon i { font-size: 15px; }
    .u-pill { border-radius: 999px !important; }
    .u-block { width: 100%; display: flex; }
    .btn i { font-size: 14px; }

    .input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg);
      font-size: 13.5px; color: var(--text); outline: none;
      transition: border-color .15s, background .15s;
    }
    .input:focus { border-color: var(--blue); background: var(--surface); }
    .input::placeholder { color: var(--faint); }

    /* ══════════════════════════════════════════════════════════════
       首頁
       ══════════════════════════════════════════════════════════════ */
    .hm-wrap { max-width: var(--max); margin: 0 auto; }
    .hm-sec-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px;
    }
    .hm-sec-head h2, .mod-body h2 {
      margin: 0; font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--text);
    }

    /* 主視覺：照片佔位（原型 image-slot 的樣子：暖米底、置中淡灰圖示） */
    .hm-hero {
      position: relative; border-radius: 28px; overflow: hidden;
      height: clamp(240px, 42vw, 420px);
      background: var(--muted) !important;        /* 覆蓋 inline 漸層 */
      display: flex; align-items: center; justify-content: center;
    }
    .hm-hero-icon { font-size: 44px; color: var(--node-line); }
    .hm-welcome {
      position: relative; margin: -72px 20px 0; max-width: 600px;
      background: rgba(249,248,246,.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 22px;
      padding: 28px 32px;
      box-shadow: 0 20px 50px -30px rgba(20,20,18,.4);
    }
    .hm-welcome h1 {
      margin: 0 0 12px; font-family: var(--serif); font-weight: 900;
      font-size: clamp(24px, 3vw, 34px); line-height: 1.35; letter-spacing: .01em;
      text-wrap: pretty; color: var(--text);
    }
    .hm-welcome h1 em {
      font-style: normal; color: var(--blue);
      border-bottom: 3px solid var(--blue); white-space: nowrap;
    }
    .hm-welcome p { margin: 0; font-size: 15px; line-height: 1.8; color: var(--dim); text-wrap: pretty; }
    .hm-welcome-stats {
      display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px;
      font-size: 12.5px; color: var(--dim);
    }
    .hm-welcome-stats span { display: inline-flex; align-items: center; gap: 5px; }
    .hm-welcome-stats i { font-size: 14px; color: var(--dim-2); }

    /* 我的學習：深色續看卡 */
    .hm-continue {
      background: var(--dark); color: #fff; border-radius: 20px; padding: 16px;
      display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: center;
      cursor: pointer; transition: box-shadow .2s; outline: none;
    }
    .hm-continue:hover, .hm-continue:focus-visible { box-shadow: 0 24px 44px -26px rgba(20,20,18,.7); }
    .hm-continue-thumb {
      position: relative; flex: 0 0 auto; width: min(100%, 172px); height: 104px;
      border-radius: 12px; overflow: hidden;
      background: var(--dark-2) !important;
      display: flex; align-items: center; justify-content: center;
    }
    .hm-continue-thumb > i { font-size: 30px; color: var(--dark-3); }
    .hm-play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .hm-play i {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.25); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px;
    }
    .hm-continue-body { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .hm-eyebrow { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hm-continue-title { font-size: 18px; font-weight: 700; color: #fff; }
    .hm-prog-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .hm-prog-label { font-size: 12px; color: var(--faint); white-space: nowrap; }
    .hm-prog-track { flex: 1 1 160px; height: 6px; border-radius: 999px; background: var(--dark-3); overflow: hidden; }
    .hm-prog-fill { height: 100%; background: var(--blue-bar); border-radius: 999px; transition: width .4s; }
    .hm-prog-pct { font-size: 13px; font-weight: 700; color: var(--blue-pct); }

    /* 學習路徑 */
    .hm-path + .hm-path { margin-top: 36px; }
    .hm-path-head {
      display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center;
      padding: 12px 4px 24px;
    }
    .hm-path-cover {
      flex: 0 0 auto; width: 156px; height: 96px; border-radius: 10px; overflow: hidden;
      transform: rotate(-2deg);
      box-shadow: 0 14px 30px -16px rgba(20,20,18,.5);
      background: var(--muted-2) !important; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    .hm-path-cover i { font-size: 26px; color: var(--node-line); }
    .hm-path-text { flex: 1 1 320px; min-width: 0; }
    .hm-path-text h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--text); }
    .hm-path-text p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--dim); text-wrap: pretty; }
    .hm-path-pct {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px; background: var(--muted);
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .hm-path-pct svg { width: 14px; height: 14px; }
    .hm-tray { background: var(--muted); border-radius: 24px; padding: 16px; }
    .hm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

    /* 模組卡 */
    .hm-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px;
      display: flex; flex-direction: column; cursor: pointer; outline: none;
      transition: transform .15s, box-shadow .15s;
    }
    .hm-card:hover, .hm-card:focus-visible { transform: translateY(-2px); box-shadow: 0 16px 30px -22px rgba(20,20,18,.45); }
    .hm-card.is-locked { cursor: default; }
    .hm-card.is-locked:hover { transform: none; box-shadow: none; }
    .hm-cover {
      position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
      background: var(--muted-2) !important;
      display: flex; align-items: center; justify-content: center;
    }
    .hm-cover > i { font-size: 28px; color: var(--node-line); }
    .hm-badge {
      position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px;
      background: var(--dark); color: #fff; font-size: 11px; font-weight: 700; pointer-events: none;
    }
    .hm-lock {
      position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,.92); color: var(--dim);
      display: flex; align-items: center; justify-content: center; font-size: 13px; pointer-events: none;
    }
    .hm-cover-prog {
      position: absolute; left: 10px; right: 10px; bottom: 10px; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,.6); pointer-events: none; overflow: hidden;
    }
    .hm-cover-prog > div { height: 100%; background: var(--dark); border-radius: 999px; }
    .hm-card-body { padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .hm-card-title { font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text); }
    .hm-card-desc { font-size: 13px; line-height: 1.65; color: var(--dim); text-wrap: pretty; flex: 1; }
    .hm-card-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-top: 4px; }
    .hm-card-meta i { font-size: 13px; }
    .hm-admin-hint {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--blue-soft); border: 1px solid var(--blue-line); color: var(--blue-deep);
      font-size: 12px; font-weight: 600;
    }
    .hm-admin-hint i { font-size: 14px; }
    .hm-empty {
      text-align: center; padding: 48px 20px; color: var(--dim); font-size: 14px; line-height: 1.8;
      background: var(--muted); border-radius: 24px;
    }
    .hm-empty i { display: block; font-size: 40px; color: var(--node-line); margin-bottom: 10px; }

    /* ══════════════════════════════════════════════════════════════
       模組頁
       ══════════════════════════════════════════════════════════════ */
    .mod-hero { background: var(--muted); border-bottom: 1px solid var(--line); }
    .mod-hero-in {
      max-width: var(--max); margin: 0 auto; padding: 44px 20px 48px;
      display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center;
    }
    .mod-hero-main { flex: 1 1 360px; min-width: 0; }
    .mod-back {
      display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
      color: var(--dim); cursor: pointer; margin-bottom: 14px; outline: none;
    }
    .mod-back:hover, .mod-back:focus-visible { color: var(--text); }
    .mod-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .mod-chip {
      padding: 3px 10px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text);
    }
    .mod-chip.primary { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
    .mod-hero-main h1 {
      margin: 0 0 14px; font-family: var(--serif); font-weight: 900;
      font-size: clamp(24px, 3vw, 32px); line-height: 1.3; color: var(--text);
    }
    .mod-desc { margin: 0 0 22px; font-size: 15px; line-height: 1.85; color: var(--dim); text-wrap: pretty; }
    .mod-meta { display: flex; gap: 20px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
    .mod-meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .mod-meta-item i { font-size: 15px; }
    .mod-cover-card {
      flex: 0 1 320px; min-width: min(100%, 260px);
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
      box-shadow: 0 24px 44px -32px rgba(20,20,18,.35);
      display: flex; flex-direction: column; gap: 10px;
    }
    .mod-cover {
      position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden;
      background: var(--muted-2) !important; margin-bottom: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .cover-ph { color: var(--node-line); font-size: 28px; display: flex; }
    .cover-ph.md { font-size: 34px; }
    .mod-cover-card .btn-primary { padding: 11px; border-radius: 10px; font-size: 14px; }
    .mdl-admin { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line-2); margin-top: 4px; }
    .mdl-admin .btn { border-radius: 10px; }
    .mdl-admin-hint { font-size: 11px; color: var(--faint); line-height: 1.5; text-align: center; }

    .mod-body { max-width: var(--max); margin: 0 auto; padding: 40px 20px 80px; }
    .mod-body h2 { margin-bottom: 16px; }
    .mod-list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .mod-acc {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; background: var(--soft); border: none; border-bottom: 1px solid var(--line);
      cursor: pointer; text-align: left; color: var(--text);
    }
    .mod-acc-left { display: flex; align-items: center; gap: 10px; }
    .mod-acc-caret { color: var(--dim); display: flex; font-size: 14px; transition: transform .2s; }
    .mod-acc.open .mod-acc-caret { transform: rotate(90deg); }
    .mod-acc-title { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .mod-acc-count { font-size: 12px; color: var(--dim); white-space: nowrap; }
    .mod-list-empty { padding: 28px 18px; font-size: 13.5px; line-height: 1.8; color: var(--dim); text-align: center; }

    .mod-unit {
      display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-start;
      padding: 16px 18px; border-bottom: 1px solid var(--line-2); cursor: pointer; outline: none;
      transition: background .15s;
    }
    .mod-unit:last-child { border-bottom: none; }
    .mod-unit:hover, .mod-unit:focus-visible { background: var(--soft); }
    .mod-dot {
      flex: 0 0 24px; height: 24px; border-radius: 50%; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      border: 2px solid var(--node-line); background: var(--surface); color: var(--blue);
    }
    .mod-dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
    .mod-dot.current { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
    .mod-unit-main { flex: 1 1 240px; min-width: 0; }
    .mod-unit-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .mod-unit-title { font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
    .mod-unit-desc { font-size: 13px; line-height: 1.7; color: var(--dim); text-wrap: pretty; }
    .mod-unit-meta {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--dim); padding-top: 2px;
    }
    .mod-type {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--surface);
    }
    .mod-dur { display: inline-flex; align-items: center; gap: 4px; }
    .mod-type i, .mod-dur i { font-size: 12px; }
    .mdl-acts { display: inline-flex; gap: 2px; margin-left: 4px; }

    /* 留言討論 */
    .mod-cmt-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .mod-cmt-list { display: flex; flex-direction: column; }
    .mod-cmt-row { display: flex; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line-2); }
    .mod-cmt-ava {
      flex: 0 0 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .mod-cmt-body { flex: 1; min-width: 0; }
    .mod-cmt-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .mod-cmt-author { font-size: 13px; font-weight: 700; }
    .mod-cmt-time { font-size: 11px; color: var(--faint); }
    .mod-cmt-text { font-size: 14px; line-height: 1.75; color: var(--text-2); overflow-wrap: anywhere; }
    .mod-cmt-empty { padding: 32px 18px; text-align: center; font-size: 13px; color: var(--dim); }
    .mod-cmt-compose { display: flex; gap: 10px; align-items: flex-end; padding: 14px 18px; background: var(--soft); border-top: 1px solid var(--line-2); }
    .mod-cmt-input { flex: 1; resize: vertical; min-height: 64px; }

    /* ══════════════════════════════════════════════════════════════
       課程頁（閱讀器）
       ══════════════════════════════════════════════════════════════ */
    .les-bar {
      position: sticky; top: var(--topbar-h); z-index: 50; height: var(--lesbar-h);
      background: rgba(249,248,246,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
    }
    .les-bar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .les-brand {
      font-family: var(--serif); font-weight: 900; font-size: 16px; letter-spacing: .06em;
      cursor: pointer; flex: 0 0 auto; outline: none;
    }
    .les-sep { width: 1px; height: 18px; background: var(--line); flex: 0 0 auto; }
    .les-crumb {
      display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim);
      min-width: 0; white-space: nowrap; overflow: hidden;
    }
    .les-crumb-link { cursor: pointer; flex: 0 0 auto; outline: none; }
    .les-crumb-link:hover, .les-crumb-link:focus-visible { color: var(--text); }
    .les-crumb-cur { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .les-crumb-min { flex: 0 0 auto; }
    .les-bar-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .les-bar-right .btn { height: 34px; padding: 0 12px; }
    .les-bar-right .btn i { color: var(--blue); }
    body.ai-open .les-bar-right .btn { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-deep); }

    .les-grid { display: grid; grid-template-columns: 1fr; align-items: start; }
    .les-main {
      min-width: 0; max-width: 760px; width: 100%; margin: 0 auto;
      padding: 24px 16px 150px; display: flex; flex-direction: column; gap: 20px;
    }
    @media (min-width: 1000px) {
      body.ai-open .les-grid { grid-template-columns: 1fr var(--ai-w); }
    }

    /* 內容區塊卡 */
    .blk {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px;
      transition: box-shadow .3s;
    }
    .blk-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .blk-head h2 {
      margin: 0; font-family: var(--serif); font-weight: 700; font-size: 20px; text-wrap: pretty; color: var(--text);
    }
    .blk-min {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--line); font-size: 12px; color: var(--text);
    }
    .blk-min i { font-size: 10px; }
    .blk-intro, .blk-body > p { margin: 0 0 16px; font-size: 14px; line-height: 1.85; color: var(--dim); text-wrap: pretty; }
    .blk-body { font-size: 14px; line-height: 1.85; color: var(--text-2); }
    .blk-body:last-child p:last-child { margin-bottom: 0; }
    .blk-panel { position: relative; background: var(--panel); border-radius: 14px; padding: 44px 16px 16px; }
    .blk-reset {
      position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%;
      border: none; background: transparent; color: var(--dim-2);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .blk-reset:hover { background: var(--line); }
    .blk-card { background: var(--surface); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

    /* 分頁對照 */
    .blk-tabs { display: grid; grid-template-columns: repeat(var(--tab-n, 3), minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .blk-tabs.many { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .blk-tab {
      padding: 10px 6px; border-radius: 10px; background: var(--surface);
      border: 2px solid var(--line); color: var(--text); font-size: 14px; font-weight: 700;
      transition: border-color .15s, color .15s;
    }
    .blk-tab.active { border-color: var(--blue); color: var(--blue); }
    .blk-eyebrow { font-size: 12px; color: var(--dim); }
    .blk-headline { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--text); }
    .blk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .blk-chip {
      padding: 3px 10px; border-radius: 999px; background: var(--blue-soft);
      border: 1px solid var(--blue-line); color: var(--blue-deep); font-size: 12px; font-weight: 600;
    }
    .blk-desc { margin: 0; font-size: 14px; line-height: 1.8; color: var(--text-2); text-wrap: pretty; }
    .blk-summary {
      background: var(--dark); color: #fff; border-radius: 10px; padding: 14px 16px;
      font-size: 14px; font-weight: 600; line-height: 1.7;
    }

    /* 階梯進程 */
    .blk-tracks { display: flex; flex-direction: column; gap: 24px; margin-bottom: 18px; }
    .blk-track { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; }
    .blk-track-side { flex: 0 0 96px; display: flex; flex-direction: column; gap: 4px; }
    .blk-track-badge {
      align-self: flex-start; padding: 3px 9px; border-radius: 6px;
      background: var(--dark); color: #fff; font-size: 11px; font-weight: 700;
    }
    .blk-track-badge.alt { background: var(--blue); }
    .blk-track-hint { font-size: 11px; color: var(--dim); line-height: 1.5; }
    .blk-track-main { flex: 1 1 220px; min-width: 0; position: relative; padding-top: 6px; }
    .blk-track-line { position: absolute; top: 16px; left: 7%; right: 7%; height: 2px; background: var(--node-line); }
    .blk-nodes { display: grid; grid-template-columns: repeat(var(--node-n, 7), minmax(0, 1fr)); position: relative; }
    .blk-node {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: none; border: none; padding: 0; cursor: pointer; color: inherit;
    }
    .blk-node-dot {
      width: 22px; height: 22px; border-radius: 50%; background: var(--surface);
      border: 2px solid var(--node-ring); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .blk-node.past .blk-node-dot { background: var(--dim-2); border-color: var(--dim-2); }
    .blk-node.active .blk-node-dot { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 4px rgba(11,107,168,.18); }
    .blk-node-label { font-size: 10.5px; line-height: 1.25; text-align: center; color: var(--dim); font-weight: 500; }
    .blk-node.active .blk-node-label { color: var(--blue); font-weight: 700; }
    .blk-detail { gap: 8px; }
    .blk-detail-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
    .blk-detail-eyebrow { font-size: 12px; font-weight: 700; color: var(--blue); }
    .blk-level { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; color: var(--dim); }
    .blk-detail-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .blk-detail-next { font-size: 13px; color: var(--dim); margin-top: 4px; }

    /* 步驟排序 */
    .blk-hint-top { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .blk-hint-bot { font-size: 12px; color: var(--dim); margin-top: 8px; }
    .blk-items { display: flex; flex-direction: column; gap: 8px; }
    .blk-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      cursor: grab; transition: border-color .15s, background .15s, box-shadow .15s, opacity .15s;
    }
    .blk-item.sel { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(11,107,168,.15); }
    .blk-item.ok { background: var(--ok-bg); border-color: var(--ok-line); }
    .blk-item.bad { background: var(--bad-bg); border-color: var(--bad-line); }
    .blk-item.dragging { opacity: .5; }
    .blk-item-num {
      flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--muted); color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .blk-item.ok .blk-item-num { background: var(--ok); color: #fff; }
    .blk-item.bad .blk-item-num { background: var(--bad); color: #fff; }
    .blk-item-main { flex: 1 1 auto; min-width: 0; }
    .blk-item-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: var(--text); }
    .blk-item-desc { font-size: 12.5px; line-height: 1.6; color: var(--dim); text-wrap: pretty; }
    .blk-item-arrows { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
    .blk-arrow {
      width: 26px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface);
      color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0;
    }
    .blk-arrow:hover:not(:disabled) { background: var(--muted); }
    .blk-arrow:disabled { opacity: .35; cursor: default; }
    .blk-grip { color: var(--faint); flex: 0 0 auto; display: flex; font-size: 16px; }
    .blk-check-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .blk-result { font-size: 13px; line-height: 1.6; flex: 1 1 200px; color: var(--dim); }
    .blk-result.ok { color: var(--ok); }
    .blk-result.bad { color: var(--bad); }

    /* 底部導覽 */
    .les-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; }
    .les-nav-prev { font-size: 13px; color: var(--dim); cursor: pointer; outline: none; }
    .les-nav-prev:hover, .les-nav-prev:focus-visible { color: var(--text); }
    .les-nav-prev.off { color: var(--faint); cursor: default; }
    .les-nav-spacer { flex: 1; }

    /* 檔案型教材 */
    .ls-media { display: flex; flex-direction: column; gap: 14px; }
    .ls-media-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ls-media-title { font-family: var(--serif); font-weight: 700; font-size: 20px; margin: 0; }
    .ls-media-meta { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .ls-frame { width: 100%; height: min(78vh, 920px); border: 1px solid var(--line); border-radius: 12px; background: var(--muted-2); }
    .ls-video { width: 100%; border-radius: 12px; background: var(--dark); max-height: 78vh; }
    .ls-img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
    .ls-fallback, .ls-empty {
      padding: 40px 20px; text-align: center; background: var(--panel); border-radius: 14px;
      color: var(--dim); font-size: 14px; line-height: 1.8;
    }
    .ls-fallback i, .ls-empty i { display: block; font-size: 36px; color: var(--node-line); margin-bottom: 8px; }
    .brand-sub { display: inline; }

    /* ══════════════════════════════════════════════════════════════
       AI 助教側欄
       ══════════════════════════════════════════════════════════════ */
    .ai-panel {
      position: fixed; top: calc(var(--topbar-h) + var(--lesbar-h)); right: 0; z-index: 60;
      width: var(--ai-w); height: calc(100vh - var(--topbar-h) - var(--lesbar-h));
      background: var(--surface); border-left: 1px solid var(--line);
      display: none; flex-direction: column;
    }
    .ai-panel.open { display: flex; }
    .ai-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
    }
    .ai-head-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
    .ai-head-title i { color: var(--blue); font-size: 14px; }
    .ai-close {
      width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--dim);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .ai-close:hover { background: var(--muted); }
    .ai-body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ai-empty { margin-top: 28px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7; }
    .ai-sugg { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .ai-sugg-btn {
      text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--soft); font-size: 13px; color: var(--text); line-height: 1.5;
    }
    .ai-sugg-btn:hover { background: var(--muted); }
    .ai-msg {
      max-width: 88%; padding: 10px 12px; border-radius: 12px;
      font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .ai-msg.me { align-self: flex-end; background: var(--dark); color: #fff; }
    .ai-msg.bot { align-self: flex-start; background: var(--muted); color: var(--text); }
    .ai-busy { align-self: flex-start; font-size: 12px; color: var(--dim); }
    .ai-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .ai-foot .input { flex: 1; min-width: 0; height: 40px; border-radius: 10px; font-size: 13px; }
    .ai-send {
      width: 40px; height: 40px; border-radius: 10px; background: var(--dark); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-size: 16px;
    }
    .ai-send:hover:not(:disabled) { background: var(--dark-2); }
    .ai-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ══════════════════════════════════════════════════════════════
       互動教材編輯器（Modal）
       ══════════════════════════════════════════════════════════════ */
    .ed-overlay {
      position: fixed; inset: 0; z-index: 90; background: rgba(20,20,18,.5);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      visibility: hidden; opacity: 0; transition: opacity .2s, visibility .2s;
    }
    .ed-overlay.open { visibility: visible; opacity: 1; }
    .ed-modal {
      width: min(100%, 760px); max-height: calc(100vh - 48px);
      background: var(--surface); border-radius: 18px;
      box-shadow: 0 30px 70px -30px rgba(20,20,18,.6);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .ed-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
    .ed-head h2, .ed-head h3 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 18px; }
    .ed-head-sub { font-size: 12.5px; color: var(--dim); margin-top: 4px; }
    .ed-close {
      width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--dim);
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 auto;
    }
    .ed-close:hover { background: var(--muted); }
    .ed-body { flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .ed-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .ed-row > .ed-field { flex: 1 1 180px; min-width: 0; }
    .ed-field { display: flex; flex-direction: column; gap: 6px; }
    .ed-label { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .ed-hint { font-size: 12px; color: var(--dim); line-height: 1.6; }
    .ed-field textarea.input { resize: vertical; min-height: 84px; line-height: 1.6; }
    .ed-blocks { display: flex; flex-direction: column; gap: 12px; }
    .ed-block { background: var(--panel); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .ed-block-head { display: flex; align-items: center; gap: 10px; }
    .ed-block-type { padding: 3px 9px; border-radius: 6px; background: var(--dark); color: #fff; font-size: 11px; font-weight: 700; }
    .ed-block-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ed-block-tools { display: flex; gap: 4px; }
    .ed-icon-btn {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
      color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 13px; padding: 0;
    }
    .ed-icon-btn:hover:not(:disabled) { background: var(--muted); color: var(--text); }
    .ed-icon-btn:disabled { opacity: .35; cursor: default; }
    .ed-icon-btn.danger { color: var(--bad); }
    .ed-icon-btn.danger:hover:not(:disabled) { background: var(--bad-bg); }
    .ed-sub { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .ed-sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--dim); }
    .ed-sub-item { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .ed-sub-item:first-of-type { border-top: none; padding-top: 0; }
    .ed-empty { padding: 32px 16px; text-align: center; background: var(--panel); border-radius: 14px; color: var(--dim); font-size: 13.5px; line-height: 1.8; }
    .ed-add-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ed-add-row .btn { border-radius: 10px; }
    .ed-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--soft); }
    .ed-foot-left { font-size: 12.5px; color: var(--dim); }
    .ed-foot .btn { border-radius: 10px; }

    /* ══════════════════════════════════════════════════════════════
       Toast
       ══════════════════════════════════════════════════════════════ */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: var(--dark); color: #fff; padding: 11px 18px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 20px 40px -20px rgba(20,20,18,.6); opacity: 0; z-index: 200;
      transition: transform .25s, opacity .25s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast i { font-size: 16px; }
    .toast-success i { color: #86D4A0; }
    .toast-error i { color: #F0A8A0; }

    /* ══════════════════════════════════════════════════════════════
       手機版
       ══════════════════════════════════════════════════════════════ */
    @media (max-width: 760px) {
      .topbar { padding: 0 14px; gap: 10px; }
      .topbar-nav, .topbar-sep { display: none; }
      .user-pill span:not(.role-pill) { display: none; }
      .hm-welcome { margin: -56px 12px 0; padding: 22px 20px; }
      .hm-hero { border-radius: 20px; }
      .hm-path-cover { transform: none; width: 100%; height: 120px; }
      .hm-tray { padding: 12px; border-radius: 18px; }
      .hm-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .mod-hero-in { padding: 28px 16px 32px; }
      .mod-cover-card { flex-basis: 100%; }
      .mod-body { padding: 28px 16px 60px; }
      .mod-unit-meta { width: 100%; padding-top: 0; }
      .les-main { padding: 16px 12px 120px; gap: 14px; }
      .blk { padding: 18px 16px; border-radius: 14px; }
      .blk-panel { padding: 40px 12px 12px; }
      .blk-tabs { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
      .blk-track-side { flex-basis: 100%; flex-direction: row; align-items: center; gap: 8px; }
      .blk-item-desc { display: none; }
      .blk-grip { display: none; }
      .brand-sub { display: none; }
      .ai-panel { top: 0; width: 100%; height: 100vh; z-index: 95; }
      .ed-overlay { padding: 0; }
      .ed-modal { width: 100%; max-height: 100vh; border-radius: 0; }
      .ed-icon-btn { width: 36px; height: 36px; }
      .ls-frame { height: 70vh; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="index.html" class="back-btn"><i class="ph ph-caret-left"></i> 返回</a>
    <div class="topbar-sep"></div>
    <span class="topbar-brand" onclick="goHome()">教材管理</span>
    <nav class="topbar-nav">
      <span class="topbar-nav-link" onclick="goHome()">學習路徑</span>
      <span class="topbar-nav-link" onclick="goHome()">我的學習</span>
    </nav>
    <div class="topbar-right">
      <div class="user-pill">
        <div class="user-avatar" id="userInitial">—</div>
        <span id="userName">載入中</span>
        <span class="role-pill" id="rolePill"></span>
      </div>
    </div>
  </header>

  <!-- 首頁 -->
  <div id="homeView"></div>

  <!-- 模組頁 -->
  <div id="moduleView" class="hidden"></div>

  <!-- 課程頁（閱讀器） -->
  <div id="lessonView" class="hidden"></div>

  <!-- AI 助教側欄 -->
  <aside class="ai-panel" id="aiPanel" aria-hidden="true"></aside>

  <!-- 互動教材編輯器 -->
  <div class="ed-overlay" id="edOverlay"></div>

  <!-- 上傳用隱藏 input（全頁共用一個） -->
  <input type="file" id="fileInput" multiple
    accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.webm,.mov,.jpg,.jpeg,.png,.gif,.webp"
    style="display:none" onchange="handleFiles(this)">

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="ph ph-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/security.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ══════════════════════════════════════════════════════════════
    //  核心：全域狀態、資料載入、導覽、進度、上傳
    // ══════════════════════════════════════════════════════════════

    let currentUser = null;
    let isAdmin = false;
    let isCrew  = false;
    let allCourses = [];

    // 導覽狀態
    let view = 'home';            // 'home' | 'module' | 'lesson'
    let activeCourseId = null;    // string
    let activeMatIdx = null;      // number

    // 課程分類：與智慧派課（maritime-courses.html）的 maritimeCategoryNames 一致
    const CAT_NAME = {
      '01': '船舶操縱與航行實務訓練',
      '02': '領導統御與檢查應對管理',
      '03': '事故案例分析與應變處置訓練',
      '04': '船舶設備操作與技術知能訓練',
      '05': '國際法規與環境合規知識',
      '06': '船舶貨物裝卸作業實務',
      '07': '船員經驗交流與職能回饋',
      '08': '職級轉換與壓力調適',
      '09': '其他'
    };
    const CAT_ICON = {
      '01': 'ph-anchor', '02': 'ph-users-three', '03': 'ph-warning-circle',
      '04': 'ph-gear',   '05': 'ph-scales',      '06': 'ph-package',
      '07': 'ph-chat-circle-dots', '08': 'ph-arrow-u-up-left', '09': 'ph-dots-three'
    };
    const CAT_COLOR = {
      '01': '#0a4a7a', '02': '#0d6e8c', '03': '#1a7a5e',
      '04': '#8a6d1f', '05': '#9a3b32', '06': '#5b4a9a',
      '07': '#a1561f', '08': '#4a7a1f', '09': '#6e6e73'
    };
    const CAT_ORDER = ['01','02','03','04','05','06','07','08','09'];

    const catOf   = c => CAT_NAME[c?.category] ? c.category : '09';
    const catIcon = code => `<i class="ph ${CAT_ICON[code] || 'ph-folder'}"></i>`;
    const catGrad = () => 'var(--muted-2)';   // 封面佔位：原型的暖米色，不用分類漸層

    // ── 跳脫 ──
    function h(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function a(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function nl2br(s) { return h(s).replace(/\n/g, '<br>'); }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      if (!initAuth()) return;
      const p = new URLSearchParams(location.search);
      loadData(p.get('courseId'), p.get('unit'));
    });

    function initAuth() {
      // 角色定義統一交給 js/auth.js，避免這頁自己判斷而把 guest 標成「教師」
      currentUser = protectPage();
      if (!currentUser) return false;

      const role = Auth.getRole();
      isAdmin = role === 'admin';
      isCrew  = role === 'crew';

      const name = Auth.displayName(currentUser);
      document.getElementById('userName').textContent = name;
      document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();

      const pill = document.getElementById('rolePill');
      pill.textContent = Auth.getRoleLabel(role);
      pill.className = 'role-pill role-' + (role || 'guest');
      return true;
    }

    // AI 助教：後端 askgemini 只開放 admin / teacher
    function canUseAi() {
      const r = Auth.getRole();
      return r === 'admin' || r === 'teacher';
    }

    // ── Data ──
    function readCourses() {
      try {
        const raw = JSON.parse(localStorage.getItem('maritimeCourses') || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch { return []; }
    }

    // 先用本地快取立即上畫面，再從後端同步（與 maritime-courses.html 相同流程）
    async function loadData(preCourseId = null, preUnit = null) {
      allCourses = readCourses();
      restoreView(preCourseId, preUnit);

      if (typeof initializeDataSync === 'undefined') return;
      try {
        await initializeDataSync();
      } catch (err) {
        console.warn('⚠️ 後端同步失敗，使用本地資料:', err.message);
        if (!allCourses.length) showToast('無法連線後端，目前沒有課程資料', 'error');
        return;
      }

      allCourses = readCourses();
      restoreView(activeCourseId || preCourseId, activeMatIdx != null ? activeMatIdx : preUnit);
    }

    function restoreView(courseId, unit) {
      const course = courseId ? allCourses.find(c => String(c.id) === String(courseId)) : null;
      if (!course) { goHome(); return; }
      const idx = unit == null ? null : Number(unit);
      if (idx != null && !Number.isNaN(idx) && (course.materials || [])[idx]) openLesson(course.id, idx);
      else openModule(course.id);
    }

    // 寫入本地快取並同步回後端
    async function persistCourses() {
      // 先留快照：saveTable 失敗時要連 localStorage 一起退回，
      // 否則重新整理後 readCourses() 會把「沒存成功」的資料當成已存在。
      const snapshot = localStorage.getItem('maritimeCourses');
      localStorage.setItem('maritimeCourses', JSON.stringify(allCourses));
      if (typeof syncManager === 'undefined') return;
      try {
        const result = await syncManager.saveTable('maritimeCourses');
        if (result?.conflict) {
          showToast('課程資料已被其他人修改，請重新整理後再試', 'error');
          throw new Error('資料衝突');
        }
      } catch (err) {
        try {
          if (snapshot === null) localStorage.removeItem('maritimeCourses');
          else localStorage.setItem('maritimeCourses', snapshot);
        } catch (_) {}
        throw err;
      }
    }

    // ── 導覽 ──
    function setView(next) {
      view = next;
      ['home','module','lesson'].forEach(v => {
        document.getElementById(v + 'View').classList.toggle('hidden', v !== next);
      });
      window.scrollTo({ top: 0 });
    }

    function syncUrl() {
      const url = new URL(location.href);
      if (activeCourseId) url.searchParams.set('courseId', activeCourseId);
      else url.searchParams.delete('courseId');
      if (activeMatIdx != null) url.searchParams.set('unit', activeMatIdx);
      else url.searchParams.delete('unit');
      history.replaceState(null, '', url);
    }

    function goHome() {
      activeCourseId = null; activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('home'); syncUrl(); renderHome();
    }

    function openModule(courseId) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      activeCourseId = String(course.id); activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('module'); syncUrl(); renderModule(course);
    }

    function openLesson(courseId, idx) {
      // 切換單元時面板不關（保留對話），但要重繪，否則「目前正在看」停在上一課
      const _reAi = typeof aiOpen !== 'undefined' && aiOpen;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      const mats = course.materials || [];
      if (!mats[idx]) { openModule(courseId); return; }
      activeCourseId = String(course.id); activeMatIdx = Number(idx);
      setView('lesson'); syncUrl(); renderLesson(course, Number(idx));
      if (_reAi && typeof renderAiPanel === 'function') renderAiPanel();
    }

    function activeCourse() {
      return allCourses.find(c => String(c.id) === String(activeCourseId)) || null;
    }

    // ── 進度 ──
    function progKey(courseId, fileName) {
      return `vp_${currentUser?.username || 'u'}_${courseId}_${encodeURIComponent(fileName || '')}`;
    }

    function getProgress(courseId, fileName) {
      try { const r = localStorage.getItem(progKey(courseId, fileName)); return r ? JSON.parse(r) : null; }
      catch { return null; }
    }

    function saveProgress(courseId, fileName, data) {
      const prev = getProgress(courseId, fileName) || {};
      localStorage.setItem(progKey(courseId, fileName),
        JSON.stringify({ ...prev, ...data, lastViewed: new Date().toISOString() }));
    }

    function matDone(courseId, m) {
      const p = getProgress(courseId, m.fileName);
      return !!(p && (p.completed || p.viewed));
    }

    function courseStats(course) {
      const mats = course.materials || [];
      const done = mats.filter(m => matDone(course.id, m)).length;
      return { total: mats.length, done, pct: mats.length ? Math.round(done / mats.length * 100) : 0 };
    }

    function pathStats(courses) {
      let total = 0, done = 0;
      courses.forEach(c => { const s = courseStats(c); total += s.total; done += s.done; });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // ── 教材共用 ──
    const isInteractive = m => m?.kind === 'interactive';

    function isVideo(name) {
      return ['mp4','webm','mov','ogg'].includes((name || '').split('.').pop().toLowerCase());
    }

    function matKind(m) {
      if (isInteractive(m)) return '互動';
      const ext = (m.fileName || '').split('.').pop().toLowerCase();
      if (isVideo(m.fileName)) return '影片';
      if (ext === 'pdf') return 'PDF';
      if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '圖片';
      return '文件';
    }

    function fileStyle(name) {
      const ext = (name || '').split('.').pop().toUpperCase();
      const m = {
        PDF:  { icon:'ph-file-pdf',   bg:'#fee2e2', color:'#dc2626' },
        DOC:  { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        DOCX: { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        PPT:  { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        PPTX: { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        MP4:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        WEBM: { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        MOV:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        JPG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        JPEG: { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        PNG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
      };
      return m[ext] || { icon:'ph-paperclip', bg:'#f5f5f7', color:'#6e6e73' };
    }

    function matMinutes(m) {
      if (isInteractive(m)) return m.estMinutes || 0;
      if (!m.fileSize) return 0;
      return Math.max(1, Math.round(m.fileSize / (1024 * 1024) * 2));
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // Drive 預覽
    function drivePreview(m) { return m.fileId ? `https://drive.google.com/file/d/${m.fileId}/preview` : null; }
    function driveImage(m)   { return m.fileId ? `https://drive.google.com/thumbnail?id=${m.fileId}&sz=w1600` : null; }

    // ── 上傳 / 刪除 ──
    const UPLOAD_TYPES = [
      'application/pdf',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.ms-powerpoint',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'video/mp4', 'video/webm', 'video/ogg', 'video/quicktime',
      'image/jpeg', 'image/png', 'image/gif', 'image/webp'
    ];

    function triggerUpload(id) { document.getElementById('fileInput')?.click(); }

    function handleFiles(input) {
      if (input.files?.length && activeCourseId) processFiles(input.files, activeCourseId);
      input.value = '';
    }

    // 教材上傳到 Google Drive，課程資料寫回後端，所有裝置都看得到
    async function processFiles(files, courseId) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      if (!course.materials) course.materials = [];

      for (const file of files) {
        if (!UPLOAD_TYPES.includes(file.type)) { showToast(`不支援格式：${file.name}`, 'error'); continue; }
        if (file.size > 50 * 1024 * 1024)      { showToast(`檔案過大：${file.name}`, 'error'); continue; }

        showToast(`上傳中：${file.name}`);
        try {
          const res = await api.uploadFile(file);
          course.materials.push({
            fileName: file.name,
            fileType: file.type,
            fileId: res.id,
            fileUrl: res.url,
            fileSize: file.size,
            uploadedAt: new Date().toISOString(),
            uploadedBy: currentUser.username
          });
          await persistCourses();
          renderModule(course);
          showToast(`已上傳：${file.name}`, 'success');
        } catch (err) {
          console.error('上傳失敗:', err);
          showToast(`上傳失敗：${file.name}（${err.message || '未知錯誤'}）`, 'error');
        }
      }
    }

    async function deleteMat(courseId, idx) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course?.materials) return;
      const name = course.materials[idx]?.fileName || '此教材';
      if (!confirm(`確定移除「${name}」？`)) return;

      const removed = course.materials.splice(idx, 1);
      try {
        await persistCourses();
        renderModule(course);
        showToast('已移除', 'success');
      } catch (err) {
        course.materials.splice(idx, 0, ...removed);
        renderModule(course);
        showToast(`移除失敗：${err.message || '未知錯誤'}`, 'error');
      }
    }

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg, type = '') {
      const t  = document.getElementById('toast');
      const ic = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      ic.className = 'ph ' + (type === 'error' ? 'ph-warning-circle' : type === 'success' ? 'ph-check-circle' : 'ph-info');
      t.className = 'toast show' + (type ? ' toast-' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
    }

    // ══════════════════════════════════════════════════════════════
    //  首頁（#homeView）：歡迎區 + 我的學習 + 學習路徑 + 模組卡片
    //  版面照原型「航海學苑」首頁，配色一律用 --apple-* / --brand
    // ══════════════════════════════════════════════════════════════

    // 首頁專屬樣式：只放 hover／transition／grid 這類無法 inline 的規則，
    // 類名一律 hm- 前綴避免與 screens.css 相撞。只注入一次。
    const HOME_CSS = '';  // 視覺統一由 <style> 的原型樣式表負責;

    function ensureHomeStyle() {
      if (document.getElementById('homeStyle')) return;
      const el = document.createElement('style');
      el.id = 'homeStyle';
      el.textContent = HOME_CSS;
      document.head.appendChild(el);
    }

    // ── 進度掃描 ──────────────────────────────────────────────────
    // 掃 localStorage 的 vp_<username>_<courseId>_<encodeURIComponent(fileName)>，
    // 取 lastViewed 最新、且課程與教材現在還存在的那一筆。
    // courseId 是純數字不含底線，所以從第一個 '_' 切開即可；切出來的
    // courseId / fileName 都要能在 allCourses 裡對上，才算有效（自我驗證）。
    function lastActivity() {
      const user = (currentUser && currentUser.username) || 'u';
      const prefix = `vp_${user}_`;
      let best = null;

      let n = 0;
      try { n = localStorage.length; } catch { return null; }

      for (let i = 0; i < n; i++) {
        let key = null;
        try { key = localStorage.key(i); } catch { continue; }
        if (!key || key.indexOf(prefix) !== 0) continue;

        const rest = key.slice(prefix.length);
        const cut = rest.indexOf('_');
        if (cut <= 0) continue;

        const courseId = rest.slice(0, cut);
        const raw = rest.slice(cut + 1);
        let fileName;
        try { fileName = decodeURIComponent(raw); } catch { fileName = raw; }

        const course = allCourses.find(c => String(c.id) === courseId);
        if (!course) continue;

        const mats = course.materials || [];
        const idx = mats.findIndex(m => m && m.fileName === fileName);
        if (idx < 0) continue;

        let prog = null;
        try { prog = JSON.parse(localStorage.getItem(key) || 'null'); } catch { prog = null; }
        if (!prog || !prog.lastViewed) continue;

        const time = Date.parse(prog.lastViewed);
        if (Number.isNaN(time)) continue;

        if (!best || time > best.time) {
          best = { course, matIdx: idx, mat: mats[idx], prog, time };
        }
      }
      return best;
    }

    // ── 小工具 ────────────────────────────────────────────────────
    function hmMatTitle(m) {
      if (!m) return '';
      const name = m.fileName || '未命名教材';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 模組卡說明：優先用 keywords，否則用 method / duration 組一句
    function hmCourseDesc(course) {
      const kw = (course.keywords || []).filter(k => typeof k === 'string' && k.trim());
      if (kw.length) return kw.slice(0, 6).join('・');
      const bits = [];
      // 時長一律交給 meta 列（由教材推估），這裡再寫一次 course.duration
      // 會變成同一張卡出現兩個對不起來的分鐘數
      if (course.method) bits.push(course.method);
      if (bits.length) return bits.join('・');
      return '這個模組尚未填寫課程說明。';
    }

    function hmCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 環形完成度（底圈＝淡灰、弧線＝主色）
    function hmRing(pct) {
      const C = 56.55;                                  // 2πr，r = 9
      const d = (Math.max(0, Math.min(100, pct)) / 100 * C).toFixed(2);
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="var(--apple-gray)" stroke-opacity="0.35"></circle>
            <circle cx="12" cy="12" r="9" stroke="var(--apple-blue)" stroke-linecap="round"
              stroke-dasharray="${d} ${C}" transform="rotate(-90 12 12)"></circle>
          </svg>`;
    }

    // ── 事件（id 只透過 data-* 傳遞，不拼進 onclick 字串） ──────────
    function hmOpenModule(el) {
      const id = el && el.dataset ? el.dataset.cid : null;
      if (id) openModule(id);
    }

    function hmOpenLesson(el) {
      if (!el || !el.dataset) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) openLesson(id, idx);
    }

    function hmKey(ev, el) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // 「前往我的學習」：有進度就直接進那門課，否則捲到學習路徑
    function hmGoLearning() {
      const act = lastActivity();
      if (act) { openModule(act.course.id); return; }
      document.getElementById('hmPaths')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── 區塊：歡迎 ────────────────────────────────────────────────
    function hmWelcomeHtml(heroCat) {
      const name = currentUser ? (typeof Auth !== 'undefined' ? Auth.displayName(currentUser) : currentUser.username) : '';
      const stats = pathStats(allCourses);
      const courseCount = allCourses.length;

      return `
      <div class="hm-wrap" style="padding:20px 20px 0">
        <div class="hm-hero" style="background:${a(catGrad(heroCat))}">
          <span class="hm-hero-icon" aria-hidden="true">${catIcon(heroCat)}</span>
        </div>
        <div class="hm-welcome">
          <h1>歡迎回來，繼續累積<em>海上的實力</em></h1>
          <p>船會換、航線會換，真正跟著你一輩子的是基本功。這裡彙整公司九大類船員訓練教材，從船舶操縱、法規合規到職級轉換，一步一步把岸上的準備變成船上的即戰力。</p>
          <div class="hm-welcome-stats">
            <span><i class="ph ph-books" aria-hidden="true"></i>${courseCount} 門課程</span>
            <span><i class="ph ph-file-text" aria-hidden="true"></i>${stats.total} 份教材</span>
            <span><i class="ph ph-check-circle" aria-hidden="true"></i>已完成 ${stats.done} 份</span>
          </div>
        </div>
      </div>`;
    }

    // ── 區塊：我的學習 ────────────────────────────────────────────
    function hmLearningHtml() {
      const act = lastActivity();

      // 沒有任何紀錄時，推薦第一個有教材的課程
      let course, matIdx, eyebrow;
      if (act) {
        course = act.course;
        matIdx = act.matIdx;
        eyebrow = `繼續上次學習：${h(hmMatTitle(act.mat))}`;
      } else {
        course = allCourses.find(c => (c.materials || []).length);
        if (!course) return '';                       // 連教材都沒有 → 整塊不渲染
        matIdx = 0;
        eyebrow = `推薦從這裡開始：${h(hmMatTitle((course.materials || [])[0]))}`;
      }

      const st = courseStats(course);
      const cat = catOf(course);
      const unitNo = Math.min(matIdx + 1, st.total || 1);
      const unitText = st.pct >= 100
        ? `全部 ${st.total} 個單元已完成`
        : `單元 ${unitNo} 進行中 · 共 ${st.total} 個單元`;

      return `
      <div class="hm-wrap" style="padding:44px 20px 0">
        <div class="hm-sec-head">
          <h2>我的學習</h2>
          <button type="button" class="btn btn-sm btn-soft u-pill" onclick="hmGoLearning()">
            前往我的學習<i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </div>
        <div class="hm-continue" role="button" tabindex="0"
          data-cid="${a(String(course.id))}" data-idx="${matIdx}"
          onclick="hmOpenLesson(this)" onkeydown="hmKey(event, this)"
          aria-label="${a((act ? '繼續上次學習：' : '開始學習：') + (course.name || ''))}">
          <div class="hm-continue-thumb" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-play" aria-hidden="true"><i class="ph-fill ph-play"></i></span>
          </div>
          <div class="hm-continue-body">
            <div class="hm-eyebrow">${eyebrow}</div>
            <div class="hm-continue-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-prog-row">
              <span class="hm-prog-label">上課進度</span>
              <div class="hm-prog-track"><div class="hm-prog-fill" style="width:${st.pct}%"></div></div>
              <span class="hm-prog-pct">${st.pct}%</span>
              <span class="hm-prog-label">${unitText}</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    // ── 區塊：模組卡 ──────────────────────────────────────────────
    function hmCardHtml(course, n) {
      const cat = catOf(course);
      const st = courseStats(course);
      const empty  = st.total === 0;                   // 沒有教材
      // 一般學員：空課程鎖定不可點。管理員：一定可以點進去，否則教材全空時
      // 根本到不了模組頁，永遠看不到「上傳教材」按鈕。
      const locked = empty && !isAdmin;
      const mins = hmCourseMinutes(course);

      let metaIcon, metaText;
      if (empty && isAdmin) { metaIcon = 'ph-upload-simple'; metaText = '尚無教材 · 點此上傳'; }
      else if (locked)      { metaIcon = 'ph-lock-simple';   metaText = '尚未開放'; }
      else if (st.pct >= 100) { metaIcon = 'ph-check-circle'; metaText = `已完成 · ${st.total} 個單元`; }
      else                  { metaIcon = 'ph-clock';       metaText = mins ? `約 ${mins} 分鐘 · ${st.total} 個單元` : `${st.total} 個單元`; }

      const clickable = locked ? '' :
        ` role="button" tabindex="0" onclick="hmOpenModule(this)" onkeydown="hmKey(event, this)"`;

      return `
        <div class="hm-card${locked ? ' is-locked' : ''}" data-cid="${a(String(course.id))}"${clickable}>
          <div class="hm-cover" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-badge">模組 ${n}</span>
            ${empty ? `<span class="hm-lock" aria-hidden="true"><i class="ph ${isAdmin ? 'ph-upload-simple' : 'ph-lock-simple'}"></i></span>` : ''}
            ${(!locked && st.pct > 0) ? `<div class="hm-cover-prog"><div style="width:${st.pct}%"></div></div>` : ''}
          </div>
          <div class="hm-card-body">
            <div class="hm-card-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-card-desc">${h(hmCourseDesc(course))}</div>
            <div class="hm-card-meta">
              <i class="ph ${metaIcon}" aria-hidden="true"></i><span>${h(metaText)}</span>
            </div>
          </div>
        </div>`;
    }

    // ── 區塊：學習路徑（依分類分組，CAT_ORDER 排序） ───────────────
    function hmPathsHtml() {
      const groups = new Map();
      allCourses.forEach(c => {
        const code = catOf(c);
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(c);
      });

      const codes = CAT_ORDER.filter(code => groups.has(code));
      // 保險：萬一出現 CAT_ORDER 沒列到的分類碼，也不要整組消失
      groups.forEach((_, code) => { if (!codes.includes(code)) codes.push(code); });

      if (!codes.length) {
        return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2></div>
        <div class="hm-empty">
          <i class="ph ph-compass" aria-hidden="true"></i>
          目前還沒有任何課程資料。<br>${isAdmin
            ? '請先到「智慧派課」建立課程，課程會自動依分類排進這裡，再回來上傳教材。'
            : '課程建立後會自動依分類排進學習路徑。'}
        </div>
      </div>`;
      }

      const adminHint = isAdmin ? `
          <span class="hm-admin-hint"><i class="ph ph-shield-check" aria-hidden="true"></i>管理員：點任一模組即可上傳教材或新增互動單元</span>` : '';

      const paths = codes.map(code => {
        const list = groups.get(code);
        const st = pathStats(list);
        const cards = list.map((c, i) => hmCardHtml(c, i + 1)).join('');

        return `
        <section class="hm-path">
          <div class="hm-path-head">
            <div class="hm-path-cover" style="background:${a(catGrad(code))}">${catIcon(code)}</div>
            <div class="hm-path-text">
              <h3>${h(CAT_NAME[code] || '其他')}</h3>
              <p>共 ${list.length} 門課程 · ${st.total} 份教材${st.total ? `，已完成 ${st.done} 份` : '，尚未上傳教材'}。</p>
            </div>
            <div class="hm-path-pct">${hmRing(st.pct)}${st.pct}% 完成</div>
          </div>
          <div class="hm-tray">
            <div class="hm-grid">${cards}</div>
          </div>
        </section>`;
      }).join('');

      return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2>${adminHint}</div>
        ${paths}
      </div>`;
    }

    // ── 入口 ──────────────────────────────────────────────────────
    function renderHome() {
      const host = document.getElementById('homeView');
      if (!host) return;
      ensureHomeStyle();

      const act = lastActivity();
      const heroCat = act ? catOf(act.course) : (allCourses.length ? catOf(allCourses[0]) : '01');

      host.innerHTML = hmWelcomeHtml(heroCat) + hmLearningHtml() + hmPathsHtml();
    }

    // ══════════════════════════════════════════════════════════════
    //  模組頁（#moduleView）：課程 hero + 課程內容清單
    //  版面照原型「航海學苑」模組頁；類名用 screens.css 既有的 .mod-*，
    //  顏色一律 --apple-* / --brand，按鈕一律 shared/ui.css 的 .btn
    // ══════════════════════════════════════════════════════════════

    // 折疊狀態：預設展開（原型 acc = true）
    let mdlAcc = true;

    // screens.css 沒有的少數規則（admin 動作鈕的容器）才自己補，
    // 類名一律 mdl- 前綴，只注入一次。
    const MODULE_CSS = '';  // 視覺統一由 <style> 的原型樣式表負責;

    function ensureModuleStyle() {
      if (document.getElementById('moduleStyle')) return;
      const el = document.createElement('style');
      el.id = 'moduleStyle';
      el.textContent = MODULE_CSS;
      document.head.appendChild(el);
    }

    // ── 小工具 ────────────────────────────────────────────────────

    // 第一個未完成單元的索引；全部完成（或沒教材）回 0
    function mdlFirstUnfinished(course) {
      const mats = course.materials || [];
      const i = mats.findIndex(m => !matDone(course.id, m));
      return i < 0 ? 0 : i;
    }

    // 單元標題：互動型用 fileName 原樣，檔案型去掉副檔名
    function mdlUnitTitle(m) {
      const name = (m && m.fileName) || '未命名單元';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 單元說明
    // 互動型：取 blocks 第一個 text 區塊的 body 前 60 字；沒有就報區塊數量
    // 檔案型：型別 + 檔案大小 + 上傳日期
    function mdlUnitDesc(m) {
      if (isInteractive(m)) {
        const blocks = Array.isArray(m.blocks) ? m.blocks : [];
        const first = blocks.find(b => b && b.type === 'text' && b.body);
        if (first) {
          const flat = String(first.body).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        // 退而求其次：用 intro，再不行就報區塊數量
        const intro = blocks.find(b => b && b.intro);
        if (intro) {
          const flat = String(intro.intro).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        return blocks.length ? `互動教材，共 ${blocks.length} 個學習區塊。` : '互動教材尚未加入學習區塊。';
      }

      const bits = [`${matKind(m)} 教材`];
      const size = fmtSize(m.fileSize);
      if (size) bits.push(size);
      if (m.uploadedAt) {
        const d = new Date(m.uploadedAt);
        if (!Number.isNaN(d.getTime())) {
          bits.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} 上傳`);
        }
      }
      return bits.join(' · ');
    }

    // 型別 badge 的圖示
    function mdlKindIcon(m) {
      const kind = matKind(m);
      if (kind === '互動') return 'ph-code';
      if (kind === '影片') return 'ph-play';
      if (kind === '圖片') return 'ph-image';
      if (kind === 'PDF')  return fileStyle(m.fileName).icon;
      return 'ph-file-text';
    }

    // 時長：互動型用 estMinutes；檔案型用 fileSize 推估，推不出來就顯示副檔名
    function mdlDur(m) {
      const mins = Number(matMinutes(m)) || 0;
      if (mins) return { icon: 'ph-clock', text: `約 ${mins} 分鐘` };
      const ext = String((m && m.fileName) || '').split('.').pop().toUpperCase();
      if (ext && ext.length <= 8 && /^[A-Z0-9]+$/.test(ext)) return { icon: 'ph-paperclip', text: ext };
      return null;
    }

    // 課程總時長：教材時長加總，沒有就退回 course.duration
    function mdlCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 標籤 chips：第一顆是分類名（主色實底），其餘是 method 與 keywords 前幾個
    function mdlChipsHtml(course) {
      const cat = catOf(course);
      const rest = [];
      if (course.method && String(course.method).trim()) rest.push(String(course.method).trim());
      (Array.isArray(course.keywords) ? course.keywords : String(course.keywords || '').split(/[,，、\s]+/))
        .filter(k => typeof k === 'string' && k.trim())
        .slice(0, 4)
        .forEach(k => { if (!rest.includes(k.trim())) rest.push(k.trim()); });

      return `<div class="mod-chips">
            <span class="mod-chip primary">${h(CAT_NAME[cat] || '其他')}</span>
            ${rest.map(t => `<span class="mod-chip">${h(t)}</span>`).join('')}
          </div>`;
    }

    // ── 事件（id 與索引只透過 data-* 傳遞，不拼進 onclick 字串） ────

    function mdlUnitClick(el) {
      if (!el || !el.dataset) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) openLesson(id, idx);
    }

    function mdlUnitKey(ev, el) {
      // 焦點在內層的編輯／刪除鈕時不要攔；否則 Enter 會被改成「進入課程」
      const self = el || ev.currentTarget;
      if (ev.target !== self) return;
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // 「開始學習」→ 第一個未完成單元
    function mdlStart(el) {
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      const course = allCourses.find(c => String(c.id) === String(id));
      if (!course) return;
      if (!(course.materials || []).length) { showToast('這個模組還沒有任何單元', 'error'); return; }
      openLesson(course.id, mdlFirstUnfinished(course));
    }

    function mdlUpload(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      triggerUpload(id);
    }

    function mdlNewInteractive(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      openEditor(id, null);
    }

    function mdlEdit(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      if (id && !Number.isNaN(idx)) openEditor(id, idx);
    }

    function mdlDelete(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) deleteMat(id, idx);
    }

    // 折疊標頭：切 mdlAcc 後整頁重繪（展開時才渲染單元列）
    function toggleAcc() {
      mdlAcc = !mdlAcc;
      const course = typeof activeCourse === 'function'
        ? activeCourse()
        : allCourses.find(c => String(c.id) === String(activeCourseId));
      if (course) renderModule(course);
    }

    // ── 區塊：hero 帶 ─────────────────────────────────────────────
    function mdlHeroHtml(course) {
      const cat = catOf(course);
      const st = courseStats(course);
      const mins = mdlCourseMinutes(course);
      const cid = a(String(course.id));

      const metaItems = [];
      if (mins) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-clock" aria-hidden="true"></i>約 ${mins} 分鐘</span>`);
      metaItems.push(`<span class="mod-meta-item"><i class="ph ph-book-open" aria-hidden="true"></i>${st.total} 個單元</span>`);
      if (st.total && st.done) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-check-circle" aria-hidden="true"></i>已完成 ${st.done} / ${st.total}</span>`);

      // 課程資料沒有 description 欄位 → 用 method / keywords / 時數組一句
      const desc = mdlCourseDesc(course);

      const adminBox = isAdmin ? `
            <div class="mdl-admin">
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlUpload(this)">
                <i class="ph ph-upload-simple" aria-hidden="true"></i>上傳教材
              </button>
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlNewInteractive(this)">
                <i class="ph ph-plus-circle" aria-hidden="true"></i>新增互動單元
              </button>
              <div class="mdl-admin-hint">支援 PDF／Word／PPT／影片／圖片，單檔 50 MB 以內</div>
            </div>` : '';

      return `
      <div class="mod-hero">
        <div class="mod-hero-in">
          <div class="mod-hero-main">
            <span class="mod-back" role="button" tabindex="0"
              onclick="goHome()" onkeydown="mdlUnitKey(event, this)">
              <i class="ph ph-caret-left" aria-hidden="true"></i>返回學習路徑
            </span>
            ${mdlChipsHtml(course)}
            <h1>${h(course.name || '未命名課程')}</h1>
            <p class="mod-desc">${h(desc)}</p>
            <div class="mod-meta">${metaItems.join('')}</div>
          </div>
          <div class="mod-cover-card">
            <div class="mod-cover" style="background:${a(catGrad(cat))}">
              <span class="cover-ph md" aria-hidden="true">${catIcon(cat)}</span>
            </div>
            <button type="button" class="btn btn-primary u-block"
              data-cid="${cid}" onclick="mdlStart(this)">
              <i class="ph-fill ph-play" aria-hidden="true"></i>開始學習
            </button>
            ${adminBox}
          </div>
        </div>
      </div>`;
    }

    // 課程說明：後端沒有 description 欄位，用現有欄位組一句
    function mdlCourseDesc(course) {
      const kw = (Array.isArray(course.keywords) ? course.keywords : [])
        .filter(k => typeof k === 'string' && k.trim());
      const bits = [];
      if (course.method) bits.push(`授課方式：${String(course.method).trim()}`);
      if (kw.length) bits.push(`重點主題：${kw.slice(0, 6).join('、')}`);
      if (bits.length) return bits.join('　');
      if (course.duration) return `本模組規劃課程時數 ${course.duration} 分鐘，請依序完成下列單元。`;
      return '這個模組尚未填寫課程說明，請依序完成下列單元。';
    }

    // ── 區塊：單元列 ──────────────────────────────────────────────
    function mdlUnitHtml(course, m, idx, currentIdx) {
      const cid = a(String(course.id));
      const done = matDone(course.id, m);
      const current = !done && idx === currentIdx;

      let dotCls, dotInner;
      if (done)         { dotCls = 'done';    dotInner = '<i class="ph-bold ph-check" aria-hidden="true"></i>'; }
      else if (current) { dotCls = 'current'; dotInner = '<i class="ph-fill ph-play" aria-hidden="true"></i>'; }
      else              { dotCls = 'todo';    dotInner = ''; }

      const dur = mdlDur(m);
      const acts = isAdmin ? `
              <span class="mdl-acts">
                ${isInteractive(m) ? `<button type="button" class="btn btn-icon btn-sm btn-plain"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlEdit(event, this)"
                  title="編輯互動教材" aria-label="編輯互動教材">
                  <i class="ph ph-pencil-simple" aria-hidden="true"></i>
                </button>` : ''}
                <button type="button" class="btn btn-icon btn-sm btn-danger"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlDelete(event, this)"
                  title="移除此單元" aria-label="移除此單元">
                  <i class="ph ph-trash" aria-hidden="true"></i>
                </button>
              </span>` : '';

      const status = done ? '已完成' : current ? '進行中' : '未開始';

      return `
          <div class="mod-unit" role="button" tabindex="0"
            data-cid="${cid}" data-idx="${idx}"
            onclick="mdlUnitClick(this)" onkeydown="mdlUnitKey(event, this)"
            aria-label="${a(`單元 ${idx + 1}：${mdlUnitTitle(m)}（${status}）`)}">
            <span class="mod-dot ${dotCls}" aria-hidden="true">${dotInner}</span>
            <div class="mod-unit-main">
              <div class="mod-unit-head">
