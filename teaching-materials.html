<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材管理 | WHL MARITRAIN</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- 共用按鈕規範：全站唯一的按鈕來源，勿在頁面內另外定義 -->
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    :root {
      --apple-blue: #007aff;
      --apple-blue-hover: #0051d5;
      --apple-blue-light: #e8f0fb;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-gray-2: #6e6e73;
      --apple-bg: #f5f5f7;
      --apple-white: #ffffff;
      --apple-border: rgba(0,0,0,0.06);
      --apple-shadow-sm: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --apple-shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      --apple-shadow-lg: 0 12px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --apple-radius: 20px;      /* 卡片、Modal */
      --apple-radius-sm: 12px;   /* 卡片內層、按鈕、輸入框 */
      --brand: #0a4a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--apple-bg);
      color: var(--apple-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      height: 56px;
      background: rgba(255,255,255,0.80);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--apple-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--apple-blue);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .back-btn:hover { background: var(--apple-blue-light); }

    .topbar-sep { width: 1px; height: 18px; background: var(--apple-border); }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--apple-text);
      letter-spacing: -0.01em;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 20px;
      padding: 5px 12px 5px 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--apple-text);
    }

    .user-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .role-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .role-admin   { background: #fde8e8; color: #c0392b; }
    .role-teacher { background: var(--apple-blue-light); color: #1e40af; }
    .role-crew    { background: #dcfce7; color: #166534; }
    .role-guest   { background: #f2f2f7; color: #6e6e73; }

    /* ── Layout ── */

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(29,29,31,0.94);
      backdrop-filter: blur(16px);
      color: white;
      padding: 11px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.2,0.8,0.2,1);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success i { color: #30d158; }
    .toast.error   i { color: #ff453a; }


    /* ── Topbar 導覽（新增） ── */
    .topbar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--apple-text);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: 20px;
    }

    .topbar-nav-link {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--apple-gray-2);
      cursor: pointer;
      transition: color 0.2s;
    }

    .topbar-nav-link:hover { color: var(--apple-text); }

    /* ── 留言討論（模組頁）── */
    .mod-cmt-wrap {
      background: var(--apple-white);
      border: 1px solid var(--apple-border);
      border-radius: var(--apple-radius);
      overflow: hidden;
    }

    .mod-cmt-list { display: flex; flex-direction: column; }

    .mod-cmt-row {
      display: flex;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--apple-border);
    }

    .mod-cmt-ava {
      flex: 0 0 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .mod-cmt-body { flex: 1; min-width: 0; }

    .mod-cmt-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .mod-cmt-author { font-size: 13px; font-weight: 700; color: var(--apple-text); }
    .mod-cmt-time { font-size: 11px; color: var(--apple-gray); }

    .mod-cmt-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--apple-gray-2);
      overflow-wrap: anywhere;
    }

    .mod-cmt-empty {
      padding: 32px 18px;
      text-align: center;
      font-size: 13px;
      color: var(--apple-gray);
    }

    .mod-cmt-compose {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 14px 18px;
      background: var(--apple-bg);
    }

    .mod-cmt-input { flex: 1; resize: vertical; min-height: 64px; }

    .hidden { display: none !important; }

    body { overflow: auto; height: auto; min-height: 100vh; }

    @media (max-width: 760px) {
      .topbar-nav { display: none; }
    }

/* ==========================================================================
   screens.css — 三個畫面（首頁／模組頁／課程頁）＋互動元件＋編輯器
   版面照「航海學苑」原型；顏色一律只用 base.css 的 --apple-* 與 --brand，
   中間色用 color-mix()／既有變數透明度推導，不新增色票。
   按鈕樣式一律來自 shared/ui.css（.btn / .btn-primary / .btn-ghost …），
   本檔案不定義任何 .btn-* 規則，只提供 .u-pill / .u-block 兩個造型工具。
   ========================================================================== */

:root {
  /* 版面尺寸（非色票） */
  --shell-top: 56px;        /* base.css .topbar 高度 */
  --les-bar: 52px;          /* 課程頁麵包屑列高度 */
  --page-max: 1200px;
  --read-max: 760px;
  --ai-w: 380px;

  /* 由契約色票推導的中間階（不是新色票） */
  --s-faint:   color-mix(in srgb, var(--apple-bg) 50%, var(--apple-white));          /* 白與頁底之間的半階 */
  --s-line:    color-mix(in srgb, var(--apple-gray) 40%, var(--apple-white));        /* 比 --apple-border 明顯一階的 2px 線 */
  --s-line-soft: color-mix(in srgb, var(--apple-gray) 20%, var(--apple-white));      /* 列與列的分隔線 */
  --s-body:    color-mix(in srgb, var(--apple-text) 78%, var(--apple-white));        /* 接近正文的說明文字 */
  --s-weak:    color-mix(in srgb, var(--apple-gray) 70%, var(--apple-white));        /* 最弱一階（拖曳把手） */

  /* 深色面（--brand）上的層級 */
  --d-sunken:  color-mix(in srgb, var(--brand) 78%, #000);
  --d-text:    rgba(255,255,255,0.72);
  --d-track:   rgba(255,255,255,0.18);
  --d-bar:     color-mix(in srgb, var(--apple-blue) 70%, #fff);
  --d-pct:     color-mix(in srgb, var(--apple-blue) 42%, #fff);

  /* 對錯著色（取自 shared/ui.css，不另開色票） */
  --ok-bg:   color-mix(in srgb, var(--ui-success) 9%, var(--apple-white));
  --ok-line: color-mix(in srgb, var(--ui-success) 40%, var(--apple-white));
  --bad-bg:  color-mix(in srgb, var(--ui-danger) 9%, var(--apple-white));
  --bad-line:color-mix(in srgb, var(--ui-danger) 40%, var(--apple-white));

  /* 浮起陰影（原型的負 spread 手法） */
  --lift-sm: 0 16px 30px -22px rgba(0,0,0,0.45);
  --lift-md: 0 20px 50px -30px rgba(0,0,0,0.40);
  --lift-lg: 0 24px 44px -32px rgba(0,0,0,0.35);
}

/* 讓頂欄跟著畫面（原型頂欄是 sticky），課程頁麵包屑才有東西可以貼 */
.topbar { position: sticky; top: 0; }

/* ── 造型工具：唯一允許疊在 ui.css 按鈕上的覆寫 ───────────────────────── */
.u-pill  { border-radius: var(--ui-radius-pill) !important; }
.u-block { width: 100%; }

/* ── 分類漸層封面的佔位圖示（catGrad + catIcon 的容器） ───────────────── */
.cover-ph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.42);
  pointer-events: none;
}
.cover-ph i { font-size: 32px; line-height: 1; }
.cover-ph.lg i { font-size: 64px; }
.cover-ph.md i { font-size: 40px; }
.cover-ph.sm i { font-size: 26px; }

/* 環形完成度（JS 只給 svg 結構，顏色由這裡決定） */
.ring { flex: 0 0 auto; display: block; }
.ring-track { stroke: var(--apple-border); fill: none; }
.ring-arc   { stroke: var(--apple-blue); fill: none; stroke-linecap: round; }


/* ══════════════════════════════════════════════════════════════════════════
   1. 首頁 #homeView
   ══════════════════════════════════════════════════════════════════════════ */

.home-sec {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 44px 20px 0;
}
.home-sec.first { padding-top: 20px; }
.home-sec.last  { padding-bottom: 72px; }

.home-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.home-sec-head h2,
.home-sec > h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.home-sec > h2 { margin-bottom: 12px; }

/* ── A. 歡迎區：漸層 banner + 玻璃感疊卡 ─────────────────────────────── */
.home-hero {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  height: clamp(240px, 42vw, 420px);
  background: var(--apple-bg);
}

.home-welcome {
  position: relative;
  margin: -72px 20px 0;
  max-width: 600px;
  background: color-mix(in srgb, var(--apple-bg) 95%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  backdrop-filter: saturate(180%) blur(10px);
  border: 1px solid var(--apple-border);
  border-radius: 22px;
  padding: 28px 32px;
  box-shadow: var(--lift-md);
}
.home-welcome h1 {
  margin: 0 0 12px;
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: 0.01em;
  text-wrap: pretty;
}
.home-welcome h1 em {
  font-style: normal;
  color: var(--apple-blue);
  border-bottom: 3px solid var(--apple-blue);
}
.home-welcome p {
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
  color: var(--apple-gray-2);
  text-wrap: pretty;
}

/* ── B. 我的學習：深色「繼續上次學習」卡 ─────────────────────────────── */
.home-resume {
  background: var(--brand);
  color: #fff;
  border-radius: var(--apple-radius);
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px 24px;
  align-items: center;
  cursor: pointer;
  transition: box-shadow 0.2s ease;
}
.home-resume:hover { box-shadow: 0 24px 44px -26px rgba(0,0,0,0.70); }
.home-resume:focus-visible { outline: 2px solid var(--apple-blue); outline-offset: 3px; }

.home-resume-thumb {
  position: relative;
  flex: 0 0 auto;
  width: min(100%, 172px);
  height: 104px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--d-sunken);
}
.home-resume-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.home-resume-play span {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.home-resume-play i { font-size: 18px; line-height: 1; }

.home-resume-body {
  flex: 1 1 260px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.home-resume-eyebrow {
  font-size: 12px;
  color: var(--d-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.home-resume-title { font-size: 18px; font-weight: 700; color: #fff; }

.home-resume-prog {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.home-resume-prog .lb { font-size: 12px; color: var(--d-text); white-space: nowrap; }
.home-resume-track {
  flex: 1 1 160px;
  height: 6px;
  border-radius: var(--ui-radius-pill);
  background: var(--d-track);
  overflow: hidden;
}
.home-resume-bar {
  height: 100%;
  border-radius: var(--ui-radius-pill);
  background: var(--d-bar);
  transition: width 0.3s ease;
}
.home-resume-pct { font-size: 13px; font-weight: 700; color: var(--d-pct); }
.home-resume-units { font-size: 12px; color: var(--d-text); }

/* ── C. 學習路徑：摘要列 + 分類列 + 模組格線 ─────────────────────────── */
.home-path-sum {
  display: flex;
  flex-wrap: wrap;
  gap: 20px 28px;
  align-items: center;
  padding: 12px 4px 24px;
}
.home-path-cover {
  position: relative;
  flex: 0 0 auto;
  width: 156px;
  height: 96px;
  border-radius: 10px;
  overflow: hidden;
  transform: rotate(-2deg);
  box-shadow: 0 14px 30px -16px rgba(0,0,0,0.50);
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
}
.home-path-info { flex: 1 1 320px; min-width: 0; }
.home-path-info-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.home-path-info-head h3 { margin: 0; font-size: 20px; font-weight: 700; }
.home-path-desc {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--apple-gray-2);
  text-wrap: pretty;
}
.home-path-done {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: var(--ui-radius-pill);
  background: var(--apple-bg);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

/* 分類列（取代原型的星等評分） */
.home-cats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.home-cat {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border-radius: var(--ui-radius-pill);
  border: 1px solid var(--apple-border);
  background: var(--apple-white);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--apple-gray-2);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.home-cat i { font-size: 14px; line-height: 1; }
.home-cat .n {
  font-size: 11px;
  font-weight: 700;
  color: var(--apple-gray);
}
.home-cat:hover { background: var(--apple-bg); color: var(--apple-text); }
.home-cat.active {
  background: var(--apple-blue);
  border-color: transparent;
  color: #fff;
}
.home-cat.active .n { color: rgba(255,255,255,0.8); }

/* 灰盤托住一排白卡 */
.home-grid-wrap {
  background: var(--apple-bg);
  border-radius: 24px;
  padding: 16px;
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.home-card {
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
  border-radius: 16px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.home-card:hover { transform: translateY(-2px); box-shadow: var(--lift-sm); }
.home-card:focus-visible { outline: 2px solid var(--apple-blue); outline-offset: 2px; }
.home-card.locked { cursor: default; }
.home-card.locked:hover { transform: none; box-shadow: none; }

.home-card-cover {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: var(--apple-bg);
}
.home-card-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 3px 9px;
  border-radius: var(--ui-radius-pill);
  background: var(--brand);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  pointer-events: none;
}
.home-card-lock {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--apple-gray-2);
  pointer-events: none;
}
.home-card-lock i { font-size: 13px; line-height: 1; }

.home-card-prog {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  height: 3px;
  border-radius: var(--ui-radius-pill);
  background: rgba(255,255,255,0.60);
  pointer-events: none;
  overflow: hidden;
}
.home-card-prog > span {
  display: block;
  height: 100%;
  border-radius: var(--ui-radius-pill);
  background: #fff;
}

.home-card-body {
  padding: 14px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.home-card-title { font-size: 15px; font-weight: 700; line-height: 1.4; }
.home-card-desc {
  font-size: 13px;
  line-height: 1.65;
  color: var(--apple-gray-2);
  flex: 1;              /* 讓 meta 列永遠貼齊卡底 */
  text-wrap: pretty;
}
.home-card-meta {
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--apple-gray-2);
}
.home-card-meta i { font-size: 13px; line-height: 1; flex: 0 0 auto; }

.home-empty {
  padding: 48px 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  color: var(--apple-gray);
}
.home-empty i { display: block; font-size: 34px; margin-bottom: 10px; color: var(--apple-gray); }


/* ══════════════════════════════════════════════════════════════════════════
   2. 模組頁 #moduleView
   ══════════════════════════════════════════════════════════════════════════ */

.mod-hero {
  background: var(--apple-bg);
  border-bottom: 1px solid var(--apple-border);
}
.mod-hero-in {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 44px 20px 48px;
  display: flex;
  flex-wrap: wrap;
  gap: 32px 56px;
  align-items: center;
}
.mod-hero-main { flex: 1 1 360px; min-width: 0; }

.mod-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--apple-blue);
  cursor: pointer;
}
.mod-back:hover { opacity: 0.7; }
.mod-back i { font-size: 14px; line-height: 1; }

.mod-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 18px;
}
.mod-chip {
  padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
  font-size: 11px;
  font-weight: 600;
  color: var(--apple-gray-2);
  white-space: nowrap;
}
.mod-chip.primary {
  background: var(--apple-blue);
  border-color: transparent;
  color: #fff;
  font-weight: 700;
}

.mod-hero-main h1 {
  margin: 0 0 14px;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: 0.01em;
  text-wrap: pretty;
}
.mod-desc {
  margin: 0 0 22px;
  font-size: 15px;
  line-height: 1.85;
  color: var(--apple-gray-2);
  text-wrap: pretty;
}
.mod-meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--apple-gray-2);
}
.mod-meta-item { display: inline-flex; align-items: center; gap: 6px; }
.mod-meta-item i { font-size: 15px; line-height: 1; }

.mod-cover-card {
  flex: 0 1 320px;
  min-width: min(100%, 260px);
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--lift-lg);
}
.mod-cover {
  position: relative;
  aspect-ratio: 16 / 10;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--apple-bg);
}

/* ── 課程內容清單 ─────────────────────────────────────────────────────── */
.mod-body {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 40px 20px 80px;
}
.mod-body h2 { margin: 0 0 16px; font-size: 22px; font-weight: 700; }

.mod-list {
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
  border-radius: 16px;
  overflow: hidden;              /* 不可省：讓最後一列的分隔線被圓角裁掉 */
}

.mod-acc {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: var(--s-faint);
  border-bottom: 1px solid var(--apple-border);
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  color: inherit;
  text-align: left;
}
.mod-acc-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mod-acc-caret {
  flex: 0 0 auto;
  display: flex;
  color: var(--apple-gray-2);
  transform: rotate(0deg);
  transition: transform 0.2s ease;
}
.mod-acc-caret i { font-size: 14px; line-height: 1; }
.mod-acc.open .mod-acc-caret { transform: rotate(90deg); }
.mod-acc-title { font-size: 14px; font-weight: 700; }
.mod-acc-count { font-size: 12px; color: var(--apple-gray-2); flex: 0 0 auto; }

.mod-unit {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 14px;
  align-items: flex-start;
  padding: 16px 18px;
  border-bottom: 1px solid var(--s-line-soft);
  cursor: pointer;
  transition: background-color 0.15s ease;
}
.mod-unit:hover { background: var(--s-faint); }
.mod-unit:focus-visible { outline: 2px solid var(--apple-blue); outline-offset: -2px; }
.mod-unit.locked { cursor: default; }
.mod-unit.locked:hover { background: transparent; }

/* 狀態圓點三態 */
.mod-dot {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.mod-dot i { line-height: 1; }
.mod-dot.done {
  background: var(--ui-success);
  border: 2px solid var(--ui-success);
  color: #fff;
}
.mod-dot.done i { font-size: 12px; font-weight: 700; }
.mod-dot.current {
  background: var(--apple-blue-light);
  border: 2px solid var(--apple-blue);
  color: var(--apple-blue);
}
.mod-dot.current i { font-size: 10px; }
.mod-dot.todo {
  background: var(--apple-white);
  border: 2px solid var(--s-line);
}

.mod-unit-main { flex: 1 1 240px; min-width: 0; }
.mod-unit-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.mod-unit-title { font-size: 15px; font-weight: 600; }
.mod-unit-flag {
  padding: 1px 7px;
  border-radius: var(--ui-radius-pill);
  background: var(--apple-blue-light);
  border: 1px solid color-mix(in srgb, var(--apple-blue) 25%, var(--apple-white));
  color: var(--brand);
  font-size: 11px;
  font-weight: 600;
}
.mod-unit-desc {
  font-size: 13px;
  line-height: 1.7;
  color: var(--apple-gray-2);
  text-wrap: pretty;
}

.mod-unit-meta {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--apple-gray-2);
  padding-top: 2px;
}
.mod-type {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--apple-border);
  background: var(--apple-white);
  white-space: nowrap;
}
.mod-type i { font-size: 11px; line-height: 1; }
.mod-dur { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.mod-dur i { font-size: 12px; line-height: 1; }

/* 清單尾端的 admin 動作列 */
.mod-list-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px 18px;
  background: var(--s-faint);
}
.mod-list-empty {
  padding: 36px 18px;
  text-align: center;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--apple-gray);
}


/* ══════════════════════════════════════════════════════════════════════════
   3. 課程頁 #lessonView
   ══════════════════════════════════════════════════════════════════════════ */

.les-bar {
  position: sticky;
  top: var(--shell-top);
  z-index: 50;
  height: var(--les-bar);
  background: color-mix(in srgb, var(--apple-bg) 90%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--apple-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
}
.les-bar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.les-brand {
  flex: 0 0 auto;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.les-brand:hover { opacity: 0.7; }
.les-sep { width: 1px; height: 18px; background: var(--apple-border); flex: 0 0 auto; }

.les-crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--apple-gray-2);
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.les-crumb-link { cursor: pointer; flex: 0 0 auto; }
.les-crumb-link:hover { color: var(--apple-text); }
.les-crumb-cur {
  color: var(--apple-text);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.les-crumb-min { flex: 0 0 auto; }

.les-bar-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

/* 內容欄 */
.les-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
}
.les-main {
  min-width: 0;
  max-width: var(--read-max);
  width: 100%;
  margin: 0 auto;
  padding: 24px 16px 80px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 底部「上一課 / 下一課」列 */
.les-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: 8px;
}
.les-nav-prev {
  font-size: 13px;
  color: var(--apple-gray);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.les-nav-prev:hover { color: var(--apple-text); }
.les-nav-prev.off { cursor: default; opacity: 0.55; }
.les-nav-prev.off:hover { color: var(--apple-gray); }
.les-nav-spacer { flex: 1 1 auto; }


/* ══════════════════════════════════════════════════════════════════════════
   4. AI 助教側欄（skeleton 的 .ai-panel#aiPanel，body 直屬）
   ══════════════════════════════════════════════════════════════════════════ */

.ai-panel {
  position: fixed;
  top: var(--shell-top);
  right: 0;
  width: var(--ai-w);
  height: calc(100vh - var(--shell-top));
  z-index: 60;
  background: var(--apple-white);
  border-left: 1px solid var(--apple-border);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1), visibility 0.25s;
}
.ai-panel.open { transform: translateX(0); visibility: visible; }

/* 面板開啟且寬螢幕時，內容欄讓出 380px（面板是 fixed，不佔格線） */
body.ai-open .les-grid { padding-right: var(--ai-w); }

.ai-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--apple-border);
  flex: 0 0 auto;
}
.ai-head-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
}
.ai-head-title i { font-size: 15px; line-height: 1; color: var(--apple-blue); }

.ai-close {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--apple-gray-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex: 0 0 auto;
  transition: background-color 0.15s ease;
}
.ai-close:hover { background: var(--apple-bg); color: var(--apple-text); }
.ai-close i { font-size: 15px; line-height: 1; }

.ai-body {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ai-empty {
  margin-top: 28px;
  text-align: center;
  color: var(--apple-gray-2);
  font-size: 13px;
  line-height: 1.7;
}
.ai-sugg {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.ai-sugg-btn {
  text-align: left;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--apple-border);
  background: var(--s-faint);
  font-family: inherit;
  font-size: 13px;
  color: var(--apple-text);
  line-height: 1.5;
  cursor: pointer;
  transition: background-color 0.15s ease;
}
.ai-sugg-btn:hover { background: var(--apple-bg); }

.ai-msg {
  max-width: 88%;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 13.5px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.ai-msg.me  { align-self: flex-end;   background: var(--apple-blue); color: #fff; }
.ai-msg.bot { align-self: flex-start; background: var(--apple-bg);   color: var(--apple-text); }
.ai-busy { align-self: flex-start; font-size: 12px; color: var(--apple-gray-2); }

.ai-foot {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--apple-border);
  flex: 0 0 auto;
}
/* 輸入框用 shared/ui.css 的 .input，只壓高度與字級 */
.ai-foot .input {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  font-size: 13px;
  background: var(--apple-bg);
}
.ai-foot .input:focus { background: var(--apple-white); }
.ai-send {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: none;
  background: var(--apple-blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  cursor: pointer;
  transition: background-color 0.2s ease;
}
.ai-send:hover { background: var(--apple-blue-hover); }
.ai-send:disabled { background: var(--ui-disabled); cursor: not-allowed; }
.ai-send i { font-size: 17px; line-height: 1; }


/* ══════════════════════════════════════════════════════════════════════════
   5. 區塊卡與三個互動元件（blk-）
   ══════════════════════════════════════════════════════════════════════════ */

.blk {
  background: var(--apple-white);
  border: 1px solid var(--apple-border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: none;
  transition: box-shadow 0.3s ease;
}
.blk.is-target { box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple-blue) 25%, transparent); }

.blk-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.blk-head h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.4;
  text-wrap: pretty;
}
.blk-min {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--ui-radius-pill);
  border: 1px solid var(--apple-border);
  font-size: 12px;
  color: var(--apple-text);
  white-space: nowrap;
}
.blk-min i { font-size: 11px; line-height: 1; }

.blk-intro {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.85;
  color: var(--apple-gray-2);
  text-wrap: pretty;
}

/* type:'text' — 沒有灰面板 */
.blk-body {
  margin: 0;
  font-size: 14px;
  line-height: 1.85;
  color: var(--s-body);
  white-space: pre-wrap;
  text-wrap: pretty;
}

/* 互動面板：白卡裡再退回頁底色 */
.blk-panel {
  position: relative;
  background: var(--apple-bg);
  border-radius: 14px;
  padding: 44px 16px 16px;        /* 上方 44px 是給重設鈕的淨空區，不要改小 */
}
.blk-reset {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--apple-gray);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.blk-reset:hover {
  background: color-mix(in srgb, var(--apple-gray) 22%, var(--apple-white));
  color: var(--apple-text);
}
.blk-reset i { font-size: 15px; line-height: 1; }

/* 面板內的白卡（結果卡／詳情卡）— 無邊線無陰影，層級只靠明度差 */
.blk-card {
  background: var(--apple-white);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── 5.1 tabs：部門分頁 ──────────────────────────────────────────────── */
.blk-tabs {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
  grid-template-columns: repeat(var(--tab-n, 3), minmax(0, 1fr));
}
.blk-tabs.many { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }

.blk-tab {
  padding: 10px 6px;
  border-radius: 10px;
  background: var(--apple-white);
  border: 2px solid var(--s-line);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--apple-text);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
}
.blk-tab:hover { border-color: color-mix(in srgb, var(--apple-blue) 45%, var(--s-line)); }
.blk-tab[aria-selected="true"],
.blk-tab.active {
  border-color: var(--apple-blue);
  color: var(--apple-blue);
  background: var(--apple-white);
}
.blk-tab:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(0,122,255,0.15); }

.blk-eyebrow { font-size: 12px; color: var(--apple-gray-2); }
.blk-headline { font-size: 16px; font-weight: 700; line-height: 1.5; }
.blk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.blk-chip {
  padding: 3px 10px;
  border-radius: var(--ui-radius-pill);
  background: var(--apple-blue-light);
  border: 1px solid color-mix(in srgb, var(--apple-blue) 22%, var(--apple-white));
  color: var(--brand);
  font-size: 12px;
  font-weight: 600;
}
.blk-desc {
  margin: 0;
  font-size: 14px;
  line-height: 1.8;
  color: var(--s-body);
  text-wrap: pretty;
}
.blk-summary {
  border-radius: 10px;
  padding: 14px 16px;
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.7;
}

/* ── 5.2 ladder：職級階梯 ───────────────────────────────────────────── */
.blk-tracks {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-bottom: 18px;
}
.blk-track {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: flex-start;
}
.blk-track-side {
  flex: 0 0 96px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.blk-track-badge {
  align-self: flex-start;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--brand);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.blk-track-badge.alt { background: var(--apple-blue); }
.blk-track-hint {
  font-size: 11px;
  line-height: 1.5;
  color: var(--apple-gray-2);
}

.blk-track-main {
  flex: 1 1 220px;
  min-width: 0;
  position: relative;
  padding-top: 6px;
}
.blk-track-line {
  position: absolute;
  top: 16px;
  left: 7%;
  right: 7%;
  height: 2px;
  background: var(--s-line);
}
.blk-nodes {
  display: grid;
  grid-template-columns: repeat(var(--node-n, 7), minmax(0, 1fr));
  position: relative;
}

.blk-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}
.blk-node-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: var(--apple-white);
  border: 2px solid var(--s-line);
  transition: box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.blk-node-dot i { font-size: 11px; line-height: 1; font-weight: 700; }
.blk-node-label {
  font-size: 10.5px;
  line-height: 1.25;
  text-align: center;
  color: var(--apple-gray-2);
  font-weight: 500;
}

.blk-node.active .blk-node-dot {
  background: var(--apple-blue);
  border-color: var(--apple-blue);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--apple-blue) 18%, transparent);
}
.blk-node.active .blk-node-label { color: var(--apple-blue); font-weight: 700; }

.blk-node.past .blk-node-dot {
  background: var(--apple-gray);
  border-color: var(--apple-gray);
}
.blk-node.past .blk-node-label { color: var(--apple-gray-2); font-weight: 500; }

.blk-node:hover .blk-node-dot {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--apple-blue) 8%, transparent);
}
.blk-node.active:hover .blk-node-dot {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--apple-blue) 18%, transparent);
}
.blk-node:hover .blk-node-label { color: var(--apple-text); }
.blk-node.active:hover .blk-node-label { color: var(--apple-blue); }
.blk-node:focus-visible { outline: none; }
.blk-node:focus-visible .blk-node-dot { box-shadow: 0 0 0 4px rgba(0,122,255,0.30); }

/* 詳情卡 */
.blk-detail { gap: 8px; }
.blk-detail-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.blk-detail-eyebrow { font-size: 12px; font-weight: 700; color: var(--apple-blue); }
.blk-level {
  padding: 2px 8px;
  border-radius: var(--ui-radius-pill);
  border: 1px solid var(--apple-border);
  font-size: 11px;
  color: var(--apple-gray-2);
  white-space: nowrap;
}
.blk-detail-title { font-size: 17px; font-weight: 700; }
.blk-detail-next { font-size: 13px; color: var(--apple-gray-2); margin-top: 4px; }

/* ── 5.3 order：上船步驟拖曳排序 ────────────────────────────────────── */

<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="index.html" class="back-btn"><i class="ph ph-caret-left"></i> 返回</a>

    <span class="topbar-brand" onclick="goHome()">教材管理</span>
    <nav class="topbar-nav">
      <span class="topbar-nav-link" onclick="goHome()">學習路徑</span>
      <span class="topbar-nav-link" onclick="goHome()">我的學習</span>
    </nav>
    <div class="topbar-right">
      <div class="user-pill">
        <div class="user-avatar" id="userInitial">—</div>
        <span id="userName">載入中</span>
        <span class="role-pill" id="rolePill"></span>
      </div>
    </div>
  </header>

  <!-- 首頁 -->
  <div id="homeView"></div>

  <!-- 模組頁 -->
  <div id="moduleView" class="hidden"></div>

  <!-- 課程頁（閱讀器） -->
  <div id="lessonView" class="hidden"></div>

  <!-- AI 助教側欄 -->
  <aside class="ai-panel" id="aiPanel" aria-hidden="true"></aside>

  <!-- 互動教材編輯器 -->
  <div class="ed-overlay" id="edOverlay"></div>

  <!-- 上傳用隱藏 input（全頁共用一個） -->
  <input type="file" id="fileInput" multiple
    accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.webm,.mov,.jpg,.jpeg,.png,.gif,.webp"
    style="display:none" onchange="handleFiles(this)">

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="ph ph-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/security.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ══════════════════════════════════════════════════════════════
    //  核心：全域狀態、資料載入、導覽、進度、上傳
    // ══════════════════════════════════════════════════════════════

    let currentUser = null;
    let isAdmin = false;
    let isCrew  = false;
    let allCourses = [];

    // 導覽狀態
    let view = 'home';            // 'home' | 'module' | 'lesson'
    let activeCourseId = null;    // string
    let activeMatIdx = null;      // number

    // 課程分類：與智慧派課（maritime-courses.html）的 maritimeCategoryNames 一致
    const CAT_NAME = {
      '01': '船舶操縱與航行實務訓練',
      '02': '領導統御與檢查應對管理',
      '03': '事故案例分析與應變處置訓練',
      '04': '船舶設備操作與技術知能訓練',
      '05': '國際法規與環境合規知識',
      '06': '船舶貨物裝卸作業實務',
      '07': '船員經驗交流與職能回饋',
      '08': '職級轉換與壓力調適',
      '09': '其他'
    };
    const CAT_ICON = {
      '01': 'ph-anchor', '02': 'ph-users-three', '03': 'ph-warning-circle',
      '04': 'ph-gear',   '05': 'ph-scales',      '06': 'ph-package',
      '07': 'ph-chat-circle-dots', '08': 'ph-arrow-u-up-left', '09': 'ph-dots-three'
    };
    const CAT_COLOR = {
      '01': '#0a4a7a', '02': '#0d6e8c', '03': '#1a7a5e',
      '04': '#8a6d1f', '05': '#9a3b32', '06': '#5b4a9a',
      '07': '#a1561f', '08': '#4a7a1f', '09': '#6e6e73'
    };
    const CAT_ORDER = ['01','02','03','04','05','06','07','08','09'];

    const catOf   = c => CAT_NAME[c?.category] ? c.category : '09';
    const catIcon = code => `<i class="ph ${CAT_ICON[code] || 'ph-folder'}"></i>`;
    const catGrad = code => {
      const col = CAT_COLOR[code] || '#6e6e73';
      return `linear-gradient(135deg, ${col} 0%, ${col}b3 100%)`;
    };

    // ── 跳脫 ──
    function h(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function a(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function nl2br(s) { return h(s).replace(/\n/g, '<br>'); }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      if (!initAuth()) return;
      const p = new URLSearchParams(location.search);
      loadData(p.get('courseId'), p.get('unit'));
    });

    function initAuth() {
      // 角色定義統一交給 js/auth.js，避免這頁自己判斷而把 guest 標成「教師」
      currentUser = protectPage();
      if (!currentUser) return false;

      const role = Auth.getRole();
      isAdmin = role === 'admin';
      isCrew  = role === 'crew';

      const name = Auth.displayName(currentUser);
      document.getElementById('userName').textContent = name;
      document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();

      const pill = document.getElementById('rolePill');
      pill.textContent = Auth.getRoleLabel(role);
      pill.className = 'role-pill role-' + (role || 'guest');
      return true;
    }

    // AI 助教：後端 askgemini 只開放 admin / teacher
    function canUseAi() {
      const r = Auth.getRole();
      return r === 'admin' || r === 'teacher';
    }

    // ── Data ──
    function readCourses() {
      try {
        const raw = JSON.parse(localStorage.getItem('maritimeCourses') || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch { return []; }
    }

    // 先用本地快取立即上畫面，再從後端同步（與 maritime-courses.html 相同流程）
    async function loadData(preCourseId = null, preUnit = null) {
      allCourses = readCourses();
      restoreView(preCourseId, preUnit);

      if (typeof initializeDataSync === 'undefined') return;
      try {
        await initializeDataSync();
      } catch (err) {
        console.warn('⚠️ 後端同步失敗，使用本地資料:', err.message);
        if (!allCourses.length) showToast('無法連線後端，目前沒有課程資料', 'error');
        return;
      }

      allCourses = readCourses();
      restoreView(activeCourseId || preCourseId, activeMatIdx != null ? activeMatIdx : preUnit);
    }

    function restoreView(courseId, unit) {
      const course = courseId ? allCourses.find(c => String(c.id) === String(courseId)) : null;
      if (!course) { goHome(); return; }
      const idx = unit == null ? null : Number(unit);
      if (idx != null && !Number.isNaN(idx) && (course.materials || [])[idx]) openLesson(course.id, idx);
      else openModule(course.id);
    }

    // 寫入本地快取並同步回後端
    async function persistCourses() {
      localStorage.setItem('maritimeCourses', JSON.stringify(allCourses));
      if (typeof syncManager === 'undefined') return;
      const result = await syncManager.saveTable('maritimeCourses');
      if (result?.conflict) {
        showToast('課程資料已被其他人修改，請重新整理後再試', 'error');
        throw new Error('資料衝突');
      }
    }

    // ── 導覽 ──
    function setView(next) {
      view = next;
      ['home','module','lesson'].forEach(v => {
        document.getElementById(v + 'View').classList.toggle('hidden', v !== next);
      });
      window.scrollTo({ top: 0 });
    }

    function syncUrl() {
      const url = new URL(location.href);
      if (activeCourseId) url.searchParams.set('courseId', activeCourseId);
      else url.searchParams.delete('courseId');
      if (activeMatIdx != null) url.searchParams.set('unit', activeMatIdx);
      else url.searchParams.delete('unit');
      history.replaceState(null, '', url);
    }

    function goHome() {
      activeCourseId = null; activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('home'); syncUrl(); renderHome();
    }

    function openModule(courseId) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      activeCourseId = String(course.id); activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('module'); syncUrl(); renderModule(course);
    }

    function openLesson(courseId, idx) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      const mats = course.materials || [];
      if (!mats[idx]) { openModule(courseId); return; }
      activeCourseId = String(course.id); activeMatIdx = Number(idx);
      setView('lesson'); syncUrl(); renderLesson(course, Number(idx));
    }

    function activeCourse() {
      return allCourses.find(c => String(c.id) === String(activeCourseId)) || null;
    }

    // ── 進度 ──
    function progKey(courseId, fileName) {
      return `vp_${currentUser?.username || 'u'}_${courseId}_${encodeURIComponent(fileName || '')}`;
    }

    function getProgress(courseId, fileName) {
      try { const r = localStorage.getItem(progKey(courseId, fileName)); return r ? JSON.parse(r) : null; }
      catch { return null; }
    }

    function saveProgress(courseId, fileName, data) {
      const prev = getProgress(courseId, fileName) || {};
      localStorage.setItem(progKey(courseId, fileName),
        JSON.stringify({ ...prev, ...data, lastViewed: new Date().toISOString() }));
    }

    function matDone(courseId, m) {
      const p = getProgress(courseId, m.fileName);
      return !!(p && (p.completed || p.viewed));
    }

    function courseStats(course) {
      const mats = course.materials || [];
      const done = mats.filter(m => matDone(course.id, m)).length;
      return { total: mats.length, done, pct: mats.length ? Math.round(done / mats.length * 100) : 0 };
    }

    function pathStats(courses) {
      let total = 0, done = 0;
      courses.forEach(c => { const s = courseStats(c); total += s.total; done += s.done; });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // ── 教材共用 ──
    const isInteractive = m => m?.kind === 'interactive';

    function isVideo(name) {
      return ['mp4','webm','mov','ogg'].includes((name || '').split('.').pop().toLowerCase());
    }

    function matKind(m) {
      if (isInteractive(m)) return '互動';
      const ext = (m.fileName || '').split('.').pop().toLowerCase();
      if (isVideo(m.fileName)) return '影片';
      if (ext === 'pdf') return 'PDF';
      if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '圖片';
      return '文件';
    }

    function fileStyle(name) {
      const ext = (name || '').split('.').pop().toUpperCase();
      const m = {
        PDF:  { icon:'ph-file-pdf',   bg:'#fee2e2', color:'#dc2626' },
        DOC:  { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        DOCX: { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        PPT:  { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        PPTX: { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        MP4:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        WEBM: { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        MOV:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        JPG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        JPEG: { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        PNG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
      };
      return m[ext] || { icon:'ph-paperclip', bg:'#f5f5f7', color:'#6e6e73' };
    }

    function matMinutes(m) {
      if (isInteractive(m)) return m.estMinutes || 0;
      if (!m.fileSize) return 0;
      return Math.max(1, Math.round(m.fileSize / (1024 * 1024) * 2));
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // Drive 預覽
    function drivePreview(m) { return m.fileId ? `https://drive.google.com/file/d/${m.fileId}/preview` : null; }
    function driveImage(m)   { return m.fileId ? `https://drive.google.com/thumbnail?id=${m.fileId}&sz=w1600` : null; }

    // ── 上傳 / 刪除 ──
    const UPLOAD_TYPES = [
      'application/pdf',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.ms-powerpoint',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'video/mp4', 'video/webm', 'video/ogg', 'video/quicktime',
      'image/jpeg', 'image/png', 'image/gif', 'image/webp'
    ];

    function triggerUpload(id) { document.getElementById('fileInput')?.click(); }

    function handleFiles(input) {
      if (input.files?.length && activeCourseId) processFiles(input.files, activeCourseId);
      input.value = '';

    // 教材上傳到 Google Drive，課程資料寫回後端，所有裝置都看得到
    async function processFiles(files, courseId) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      if (!course.materials) course.materials = [];

      for (const file of files) {
        if (!UPLOAD_TYPES.includes(file.type)) { showToast(`不支援格式：${file.name}`, 'error'); continue; }
        if (file.size > 50 * 1024 * 1024)      { showToast(`檔案過大：${file.name}`, 'error'); continue; }

        showToast(`上傳中：${file.name}`);
        try {
          const res = await api.uploadFile(file);
          course.materials.push({
            fileName: file.name,
            fileType: file.type,
            fileId: res.id,
            fileUrl: res.url,
            fileSize: file.size,
            uploadedAt: new Date().toISOString(),
            uploadedBy: currentUser.username
          });
          await persistCourses();
          renderModule(course);
          showToast(`已上傳：${file.name}`, 'success');
        } catch (err) {
          console.error('上傳失敗:', err);
          showToast(`上傳失敗：${file.name}（${err.message || '未知錯誤'}）`, 'error');
        }
      }
    }

    async function deleteMat(courseId, idx) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course?.materials) return;
      const name = course.materials[idx]?.fileName || '此教材';
      if (!confirm(`確定移除「${name}」？`)) return;

      const removed = course.materials.splice(idx, 1);
      try {
        await persistCourses();
        renderModule(course);
        showToast('已移除', 'success');
      } catch (err) {
        course.materials.splice(idx, 0, ...removed);
        renderModule(course);
        showToast(`移除失敗：${err.message || '未知錯誤'}`, 'error');
      }
    }

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg, type = '') {
      const t  = document.getElementById('toast');
      const ic = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      ic.className = 'ph ' + (type === 'error' ? 'ph-warning-circle' : type === 'success' ? 'ph-check-circle' : 'ph-info');
      t.className = 'toast show' + (type ? ' toast-' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
    }

    function ensureHomeStyle() {
      if (document.getElementById('homeStyle')) return;

    // ── 進度掃描 ──────────────────────────────────────────────────
    // 掃 localStorage 的 vp_<username>_<courseId>_<encodeURIComponent(fileName)>，
    // 取 lastViewed 最新、且課程與教材現在還存在的那一筆。
    // courseId 是純數字不含底線，所以從第一個 '_' 切開即可；切出來的
    // courseId / fileName 都要能在 allCourses 裡對上，才算有效（自我驗證）。
    function lastActivity() {
      const user = (currentUser && currentUser.username) || 'u';
      const prefix = `vp_${user}_`;
      let best = null;

      let n = 0;
      try { n = localStorage.length; } catch { return null; }

      for (let i = 0; i < n; i++) {
        let key = null;
        try { key = localStorage.key(i); } catch { continue; }
        if (!key || key.indexOf(prefix) !== 0) continue;

        const rest = key.slice(prefix.length);
        const cut = rest.indexOf('_');
        if (cut <= 0) continue;

        const courseId = rest.slice(0, cut);
        const raw = rest.slice(cut + 1);
        let fileName;
        try { fileName = decodeURIComponent(raw); } catch { fileName = raw; }

        const course = allCourses.find(c => String(c.id) === courseId);
        if (!course) continue;

        const mats = course.materials || [];
        const idx = mats.findIndex(m => m && m.fileName === fileName);
        if (idx < 0) continue;

        let prog = null;
        try { prog = JSON.parse(localStorage.getItem(key) || 'null'); } catch { prog = null; }
        if (!prog || !prog.lastViewed) continue;

        const time = Date.parse(prog.lastViewed);
        if (Number.isNaN(time)) continue;

        if (!best || time > best.time) {
          best = { course, matIdx: idx, mat: mats[idx], prog, time };
        }
      }
      return best;
    }

    // ── 小工具 ────────────────────────────────────────────────────
    function hmMatTitle(m) {
      if (!m) return '';
      const name = m.fileName || '未命名教材';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 模組卡說明：優先用 keywords，否則用 method / duration 組一句
    function hmCourseDesc(course) {
      const kw = (course.keywords || []).filter(k => typeof k === 'string' && k.trim());
      if (kw.length) return kw.slice(0, 6).join('・');
      const bits = [];
      if (course.method) bits.push(course.method);
      if (course.duration) bits.push(`課程時數 ${course.duration} 分鐘`);
      if (bits.length) return bits.join('・');
      return '這個模組尚未填寫課程說明。';
    }

    function hmCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 環形完成度（底圈＝淡灰、弧線＝主色）
    function hmRing(pct) {
      const C = 56.55;                                  // 2πr，r = 9
      const d = (Math.max(0, Math.min(100, pct)) / 100 * C).toFixed(2);
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" aria-hidden="true">

              stroke-dasharray="${d} ${C}" transform="rotate(-90 12 12)"></circle>
          </svg>`;
    }

      ev.preventDefault();

    // ── 區塊：我的學習 ────────────────────────────────────────────
    function hmLearningHtml() {
      const act = lastActivity();

      // 沒有任何紀錄時，推薦第一個有教材的課程
      let course, matIdx, eyebrow;
      if (act) {
        course = act.course;
        matIdx = act.matIdx;
        eyebrow = `繼續上次學習：${h(hmMatTitle(act.mat))}`;
      } else {
        course = allCourses.find(c => (c.materials || []).length);
        if (!course) return '';                       // 連教材都沒有 → 整塊不渲染
        matIdx = 0;
        eyebrow = `推薦從這裡開始：${h(hmMatTitle((course.materials || [])[0]))}`;
      }

      const st = courseStats(course);
      const cat = catOf(course);
      const unitNo = Math.min(matIdx + 1, st.total || 1);
      const unitText = st.pct >= 100
        ? `全部 ${st.total} 個單元已完成`
        : `單元 ${unitNo} 進行中 · 共 ${st.total} 個單元`;

      return `
      <div class="hm-wrap" style="padding:44px 20px 0">
        <div class="hm-sec-head">
          <h2>我的學習</h2>
          <button type="button" class="btn btn-sm btn-secondary hm-pill" onclick="hmGoLearning()">
            前往我的學習<i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </div>
        <div class="hm-continue" role="button" tabindex="0"
          data-cid="${a(String(course.id))}" data-idx="${matIdx}"
          onclick="hmOpenLesson(this)" onkeydown="hmKey(event, this)"
          aria-label="${a((act ? '繼續上次學習：' : '開始學習：') + (course.name || ''))}">
          <div class="hm-continue-thumb" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-play" aria-hidden="true"><i class="ph-fill ph-play"></i></span>
          </div>
          <div class="hm-continue-body">
            <div class="hm-eyebrow">${eyebrow}</div>
            <div class="hm-continue-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-prog-row">
              <span class="hm-prog-label">上課進度</span>
              <div class="hm-prog-track"><div class="hm-prog-fill" style="width:${st.pct}%"></div></div>
              <span class="hm-prog-pct">${st.pct}%</span>
              <span class="hm-prog-label">${unitText}</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    // ── 區塊：模組卡 ──────────────────────────────────────────────
    function hmCardHtml(course, n) {
      const cat = catOf(course);
      const st = courseStats(course);
      const locked = st.total === 0;                   // 沒有教材 → 鎖定、不可點
      const mins = hmCourseMinutes(course);

      let metaIcon, metaText;
      if (locked)           { metaIcon = 'ph-lock-simple'; metaText = '尚未開放'; }
      else if (st.pct >= 100) { metaIcon = 'ph-check-circle'; metaText = `已完成 · ${st.total} 個單元`; }
      else                  { metaIcon = 'ph-clock';       metaText = mins ? `約 ${mins} 分鐘 · ${st.total} 個單元` : `${st.total} 個單元`; }

      const clickable = locked ? '' :
        ` role="button" tabindex="0" onclick="hmOpenModule(this)" onkeydown="hmKey(event, this)"`;

      return `
        <div class="hm-card${locked ? ' is-locked' : ''}" data-cid="${a(String(course.id))}"${clickable}>
          <div class="hm-cover" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-badge">模組 ${n}</span>
            ${locked ? `<span class="hm-lock" aria-hidden="true"><i class="ph ph-lock-simple"></i></span>` : ''}
            ${(!locked && st.pct > 0) ? `<div class="hm-cover-prog"><div style="width:${st.pct}%"></div></div>` : ''}
          </div>
          <div class="hm-card-body">
            <div class="hm-card-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-card-desc">${h(hmCourseDesc(course))}</div>
            <div class="hm-card-meta">
              <i class="ph ${metaIcon}" aria-hidden="true"></i><span>${h(metaText)}</span>
            </div>
          </div>
        </div>`;
    }

    // ── 區塊：學習路徑（依分類分組，CAT_ORDER 排序） ───────────────
    function hmPathsHtml() {
      const groups = new Map();
      allCourses.forEach(c => {
        const code = catOf(c);
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(c);
      });

      const codes = CAT_ORDER.filter(code => groups.has(code));
      // 保險：萬一出現 CAT_ORDER 沒列到的分類碼，也不要整組消失
      groups.forEach((_, code) => { if (!codes.includes(code)) codes.push(code); });

      if (!codes.length) {
        return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2></div>
        <div class="hm-empty">
          <i class="ph ph-compass" aria-hidden="true"></i>
          目前還沒有任何課程資料。<br>課程建立後會自動依分類排進學習路徑。
        </div>
      </div>`;
      }

      const paths = codes.map(code => {
        const list = groups.get(code);
        const st = pathStats(list);
        const cards = list.map((c, i) => hmCardHtml(c, i + 1)).join('');

        return `
        <section class="hm-path">
          <div class="hm-path-head">
            <div class="hm-path-cover" style="background:${a(catGrad(code))}">${catIcon(code)}</div>
            <div class="hm-path-text">
              <h3>${h(CAT_NAME[code] || '其他')}</h3>
              <p>共 ${list.length} 門課程 · ${st.total} 份教材${st.total ? `，已完成 ${st.done} 份` : '，尚未上傳教材'}。</p>
            </div>
            <div class="hm-path-pct">${hmRing(st.pct)}${st.pct}% 完成</div>
          </div>
          <div class="hm-tray">
            <div class="hm-grid">${cards}</div>
          </div>
        </section>`;
      }).join('');

      return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2></div>
        ${paths}
      </div>`;
    }

    // ── 入口 ──────────────────────────────────────────────────────
    function renderHome() {
      const host = document.getElementById('homeView');
      if (!host) return;
      ensureHomeStyle();

      const act = lastActivity();
      const heroCat = act ? catOf(act.course) : (allCourses.length ? catOf(allCourses[0]) : '01');

      host.innerHTML = hmWelcomeHtml(heroCat) + hmLearningHtml() + hmPathsHtml();
    }

    // ══════════════════════════════════════════════════════════════
    //  模組頁（#moduleView）：課程 hero + 課程內容清單
    //  版面照原型「航海學苑」模組頁；類名用 screens.css 既有的 .mod-*，
    //  顏色一律 --apple-* / --brand，按鈕一律 shared/ui.css 的 .btn
    // ══════════════════════════════════════════════════════════════

    // 折疊狀態：預設展開（原型 acc = true）
    let mdlAcc = true;

    // screens.css 沒有的少數規則（admin 動作鈕的容器）才自己補，
    // 類名一律 mdl- 前綴，只注入一次。
    const MODULE_CSS = `
    /* screens.css 的 .mod-acc 是給 <button> 用的，但沒重設瀏覽器預設外框 */
    .mod-acc { border: none; border-bottom: 1px solid var(--apple-border); }
    .mdl-acts { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
    .mdl-admin { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .mdl-admin-hint {
      font-size: 11.5px; line-height: 1.6; color: var(--apple-gray);
      text-align: center; margin-top: 2px;
    }
    `;

    function ensureModuleStyle() {
      if (document.getElementById('moduleStyle')) return;
      const el = document.createElement('style');
      el.id = 'moduleStyle';
      el.textContent = MODULE_CSS;
      document.head.appendChild(el);
    }

    // ── 小工具 ────────────────────────────────────────────────────

    // 第一個未完成單元的索引；全部完成（或沒教材）回 0
    function mdlFirstUnfinished(course) {
      const mats = course.materials || [];
      const i = mats.findIndex(m => !matDone(course.id, m));
      return i < 0 ? 0 : i;
    }

    // 單元標題：互動型用 fileName 原樣，檔案型去掉副檔名
    function mdlUnitTitle(m) {
      const name = (m && m.fileName) || '未命名單元';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 單元說明
    // 互動型：取 blocks 第一個 text 區塊的 body 前 60 字；沒有就報區塊數量
    // 檔案型：型別 + 檔案大小 + 上傳日期
    function mdlUnitDesc(m) {
      if (isInteractive(m)) {
        const blocks = Array.isArray(m.blocks) ? m.blocks : [];
        const first = blocks.find(b => b && b.type === 'text' && b.body);
        if (first) {
          const flat = String(first.body).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        // 退而求其次：用 intro，再不行就報區塊數量
        const intro = blocks.find(b => b && b.intro);
        if (intro) {
          const flat = String(intro.intro).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        return blocks.length ? `互動教材，共 ${blocks.length} 個學習區塊。` : '互動教材尚未加入學習區塊。';
      }

      const bits = [`${matKind(m)} 教材`];
      const size = fmtSize(m.fileSize);
      if (size) bits.push(size);
      if (m.uploadedAt) {
        const d = new Date(m.uploadedAt);
        if (!Number.isNaN(d.getTime())) {
          bits.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} 上傳`);
        }
      }
      return bits.join(' · ');
    }

    // 型別 badge 的圖示
    function mdlKindIcon(m) {
      const kind = matKind(m);
      if (kind === '互動') return 'ph-code';
      if (kind === '影片') return 'ph-play';
      if (kind === '圖片') return 'ph-image';
      if (kind === 'PDF')  return fileStyle(m.fileName).icon;
      return 'ph-file-text';
    }

    // 時長：互動型用 estMinutes；檔案型用 fileSize 推估，推不出來就顯示副檔名
    function mdlDur(m) {
      const mins = matMinutes(m);
      if (mins) return { icon: 'ph-clock', text: `約 ${mins} 分鐘` };
      const ext = String((m && m.fileName) || '').split('.').pop().toUpperCase();
      if (ext && ext.length <= 8 && /^[A-Z0-9]+$/.test(ext)) return { icon: 'ph-paperclip', text: ext };
      return null;
    }

    // 課程總時長：教材時長加總，沒有就退回 course.duration
    function mdlCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 標籤 chips：第一顆是分類名（主色實底），其餘是 method 與 keywords 前幾個
    function mdlChipsHtml(course) {
      const cat = catOf(course);
      const rest = [];
      if (course.method && String(course.method).trim()) rest.push(String(course.method).trim());
      (Array.isArray(course.keywords) ? course.keywords : String(course.keywords || '').split(/[,，、\s]+/))
        .filter(k => typeof k === 'string' && k.trim())
        .slice(0, 4)
        .forEach(k => { if (!rest.includes(k.trim())) rest.push(k.trim()); });

      return `<div class="mod-chips">
            <span class="mod-chip primary">${h(CAT_NAME[cat] || '其他')}</span>
            ${rest.map(t => `<span class="mod-chip">${h(t)}</span>`).join('')}
          </div>`;
    }

    // ── 事件（id 與索引只透過 data-* 傳遞，不拼進 onclick 字串） ────

    function mdlUnitClick(el) {
      if (!el || !el.dataset) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) openLesson(id, idx);
    }

    function mdlUnitKey(ev, el) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // 「開始學習」→ 第一個未完成單元
    function mdlStart(el) {
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      const course = allCourses.find(c => String(c.id) === String(id));
      if (!course) return;
      if (!(course.materials || []).length) { showToast('這個模組還沒有任何單元', 'error'); return; }
      openLesson(course.id, mdlFirstUnfinished(course));
    }

    function mdlUpload(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      triggerUpload(id);
    }

    function mdlNewInteractive(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      openEditor(id, null);
    }

    function mdlEdit(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      if (id && !Number.isNaN(idx)) openEditor(id, idx);
    }

    function mdlDelete(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) deleteMat(id, idx);
    }

    // 折疊標頭：切 mdlAcc 後整頁重繪（展開時才渲染單元列）
    function toggleAcc() {
      mdlAcc = !mdlAcc;
      const course = typeof activeCourse === 'function'
        ? activeCourse()
        : allCourses.find(c => String(c.id) === String(activeCourseId));
      if (course) renderModule(course);
    }

    // ── 區塊：hero 帶 ─────────────────────────────────────────────
    function mdlHeroHtml(course) {
      const cat = catOf(course);
      const st = courseStats(course);
      const mins = mdlCourseMinutes(course);
      const cid = a(String(course.id));

      const metaItems = [];
      if (mins) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-clock" aria-hidden="true"></i>約 ${mins} 分鐘</span>`);
      metaItems.push(`<span class="mod-meta-item"><i class="ph ph-book-open" aria-hidden="true"></i>${st.total} 個單元</span>`);
      if (st.total && st.done) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-check-circle" aria-hidden="true"></i>已完成 ${st.done} / ${st.total}</span>`);

      // 課程資料沒有 description 欄位 → 用 method / keywords / 時數組一句
      const desc = mdlCourseDesc(course);

      const adminBox = isAdmin ? `
            <div class="mdl-admin">
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlUpload(this)">
                <i class="ph ph-upload-simple" aria-hidden="true"></i>上傳教材
              </button>
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlNewInteractive(this)">
                <i class="ph ph-plus-circle" aria-hidden="true"></i>新增互動單元
              </button>
              <div class="mdl-admin-hint">支援 PDF／Word／PPT／影片／圖片，單檔 50 MB 以內</div>
            </div>` : '';

      return `
      <div class="mod-hero">
        <div class="mod-hero-in">
          <div class="mod-hero-main">
            <span class="mod-back" role="button" tabindex="0"
              onclick="goHome()" onkeydown="mdlUnitKey(event, this)">
              <i class="ph ph-caret-left" aria-hidden="true"></i>返回學習路徑
            </span>
            ${mdlChipsHtml(course)}
            <h1>${h(course.name || '未命名課程')}</h1>
            <p class="mod-desc">${h(desc)}</p>
            <div class="mod-meta">${metaItems.join('')}</div>
          </div>
          <div class="mod-cover-card">
            <div class="mod-cover" style="background:${a(catGrad(cat))}">
              <span class="cover-ph md" aria-hidden="true">${catIcon(cat)}</span>
            </div>
            <button type="button" class="btn btn-primary u-block"
              data-cid="${cid}" onclick="mdlStart(this)">
              <i class="ph-fill ph-play" aria-hidden="true"></i>開始學習
            </button>
            ${adminBox}
          </div>
        </div>
      </div>`;
    }

    // 課程說明：後端沒有 description 欄位，用現有欄位組一句
    function mdlCourseDesc(course) {
      const kw = (Array.isArray(course.keywords) ? course.keywords : [])
        .filter(k => typeof k === 'string' && k.trim());
      const bits = [];
      if (course.method) bits.push(`授課方式：${String(course.method).trim()}`);
      if (kw.length) bits.push(`重點主題：${kw.slice(0, 6).join('、')}`);
      if (bits.length) return bits.join('　');
      if (course.duration) return `本模組規劃課程時數 ${course.duration} 分鐘，請依序完成下列單元。`;
      return '這個模組尚未填寫課程說明，請依序完成下列單元。';
    }

    // ── 區塊：單元列 ──────────────────────────────────────────────
    function mdlUnitHtml(course, m, idx, currentIdx) {
      const cid = a(String(course.id));
      const done = matDone(course.id, m);
      const current = !done && idx === currentIdx;

      let dotCls, dotInner;
      if (done)         { dotCls = 'done';    dotInner = '<i class="ph-bold ph-check" aria-hidden="true"></i>'; }
      else if (current) { dotCls = 'current'; dotInner = '<i class="ph-fill ph-play" aria-hidden="true"></i>'; }
      else              { dotCls = 'todo';    dotInner = ''; }

      const dur = mdlDur(m);
      const acts = isAdmin ? `
              <span class="mdl-acts">
                ${isInteractive(m) ? `<button type="button" class="btn btn-icon btn-sm btn-plain"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlEdit(event, this)"
                  title="編輯互動教材" aria-label="編輯互動教材">
                  <i class="ph ph-pencil-simple" aria-hidden="true"></i>
                </button>` : ''}
                <button type="button" class="btn btn-icon btn-sm btn-danger"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlDelete(event, this)"
                  title="移除此單元" aria-label="移除此單元">
                  <i class="ph ph-trash" aria-hidden="true"></i>
                </button>
              </span>` : '';

      const status = done ? '已完成' : current ? '進行中' : '未開始';

      return `
          <div class="mod-unit" role="button" tabindex="0"
            data-cid="${cid}" data-idx="${idx}"
            onclick="mdlUnitClick(this)" onkeydown="mdlUnitKey(event, this)"
            aria-label="${a(`單元 ${idx + 1}：${mdlUnitTitle(m)}（${status}）`)}">
            <span class="mod-dot ${dotCls}" aria-hidden="true">${dotInner}</span>
            <div class="mod-unit-main">
              <div class="mod-unit-head">
                <span class="mod-unit-title">${h(mdlUnitTitle(m))}</span>
              </div>
              <div class="mod-unit-desc">${h(mdlUnitDesc(m))}</div>
            </div>
            <div class="mod-unit-meta">
              <span class="mod-type"><i class="ph ${a(mdlKindIcon(m))}" aria-hidden="true"></i>${h(matKind(m))}</span>
              ${dur ? `<span class="mod-dur"><i class="ph ${a(dur.icon)}" aria-hidden="true"></i>${h(dur.text)}</span>` : ''}
              ${acts}
            </div>
          </div>`;
    }

    // ── 區塊：課程內容清單 ────────────────────────────────────────
    function mdlBodyHtml(course) {
      const mats = course.materials || [];
      const currentIdx = mdlFirstUnfinished(course);

      let inner;
      if (!mats.length) {
        inner = `
          <div class="mod-list-empty">
            這個模組還沒有任何單元。<br>
            ${isAdmin ? '可用右上的「上傳教材」或「新增互動單元」開始建立課程內容。' : '教材準備好之後就會出現在這裡。'}
          </div>`;
      } else if (!mdlAcc) {
        inner = '';
      } else {
        inner = mats.map((m, i) => mdlUnitHtml(course, m, i, currentIdx)).join('');
      }

      return `
      <div class="mod-body">
        <h2>課程內容</h2>
        <div class="mod-list">
          <button type="button" class="mod-acc${mdlAcc ? ' open' : ''}"
            onclick="toggleAcc()" aria-expanded="${mdlAcc ? 'true' : 'false'}">
            <span class="mod-acc-left">
              <span class="mod-acc-caret" aria-hidden="true"><i class="ph ph-caret-right"></i></span>
              <span class="mod-acc-title">${h(course.name || '課程單元')}</span>
            </span>
            <span class="mod-acc-count">${mats.length} 個單元</span>
          </button>
          ${inner}
        </div>
        ${mdlCommentsHtml(course)}
      </div>`;
    }

    // ── 留言討論（課程層級；沿用舊版的 localStorage 'comments' 格式）──
    function mdlComments(courseId) {
      try {
        const all = JSON.parse(localStorage.getItem('comments') || '[]');
        return (Array.isArray(all) ? all : [])
          .filter(c => String(c.courseId) === String(courseId))
          .sort((x, y) => (x.timestamp || 0) - (y.timestamp || 0));
      } catch { return []; }
    }

    function mdlCommentsHtml(course) {
      const list = mdlComments(course.id);
      const rows = list.length
        ? list.map(c => {
            const init = (c.author || '?').charAt(0).toUpperCase();
            const time = c.timestamp
              ? new Date(c.timestamp).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
              : '';
            return `
              <div class="mod-cmt-row">
                <div class="mod-cmt-ava">${h(init)}</div>
                <div class="mod-cmt-body">
                  <div class="mod-cmt-meta">
                    <span class="mod-cmt-author">${h(c.author || '匿名')}</span>
                    <span class="mod-cmt-time">${h(time)}</span>
                  </div>
                  <div class="mod-cmt-text">${nl2br(c.content || '')}</div>
                </div>
              </div>`;
          }).join('')
        : `<div class="mod-cmt-empty">還沒有人留言，成為第一個發問的人。</div>`;

      return `
        <h2 style="margin-top:36px">留言討論</h2>
        <div class="mod-cmt-wrap">
          <div class="mod-cmt-list">${rows}</div>
          <div class="mod-cmt-compose">
            <textarea class="input mod-cmt-input" id="mdlCommentInput" rows="3"
              placeholder="對這個模組有疑問或心得？寫在這裡…"></textarea>
            <button type="button" class="btn btn-sm btn-primary"
              data-cid="${a(course.id)}" onclick="mdlPostComment(this)">送出</button>
          </div>
        </div>`;
    }

    function mdlPostComment(el) {
      const courseId = el?.dataset?.cid;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      const input = document.getElementById('mdlCommentInput');
      const content = (input?.value || '').trim();
      if (!content) { showToast('請輸入留言內容', 'error'); return; }

      let all;
      try { all = JSON.parse(localStorage.getItem('comments') || '[]'); } catch { all = []; }
      if (!Array.isArray(all)) all = [];
      all.push({
        id: Date.now(),
        courseId: course.id,
        author: Auth.displayName(currentUser) || currentUser.username,
        content,
        timestamp: Date.now()
      });
      localStorage.setItem('comments', JSON.stringify(all));
      renderModule(course);
      showToast('留言已送出', 'success');
    }

    // ── 入口 ──────────────────────────────────────────────────────
    function renderModule(course) {
      const host = document.getElementById('moduleView');
      if (!host) return;
      if (!course) { goHome(); return; }
      ensureModuleStyle();
      host.innerHTML = mdlHeroHtml(course) + mdlBodyHtml(course);
    }

    // ══════════════════════════════════════════════════════════════
    //  課程頁（#lessonView）：麵包屑列 + 內容欄（max 760px）+ 互動元件 + 下一課
    //  版面照原型「航海學苑」課程頁；類名沿用 screens.css 的 .les-* / .blk-*
    //  配色只用 --apple-* / --brand / --ui-*，不新增色票、不新增按鈕樣式
    // ══════════════════════════════════════════════════════════════

    // 檔案型教材的播放／預覽框 screens.css 沒有對應類名（那邊只負責 .les-* 與 .blk-*），
    // 這裡補一份最小樣式，類名一律 ls- 前綴避免相撞。只注入一次。
    const LESSON_CSS = `
    .ls-media {
      background: var(--apple-white); border: 1px solid var(--apple-border);
      border-radius: 16px; padding: 12px;
    }
    .ls-media-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 4px 6px 10px; min-width: 0;
    }
    .ls-media-title {
      font-size: 15px; font-weight: 700; line-height: 1.4; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ls-media-meta {
      margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--apple-gray-2); flex: 0 0 auto;
    }
    .ls-media-meta i { font-size: 12px; line-height: 1; }
    .ls-frame {
      display: block; width: 100%; height: min(74vh, 640px);
      border: 0; border-radius: 12px; background: var(--apple-bg);
    }
    .ls-video { display: block; width: 100%; border-radius: 12px; background: #000; }
    .ls-img   { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--apple-bg); }
    .ls-fallback {
      border-radius: 12px; background: var(--apple-bg);
      padding: 32px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .ls-fallback i { font-size: 34px; line-height: 1; color: var(--apple-gray); }
    .ls-fallback p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--apple-gray-2); }
    .ls-empty {
      background: var(--apple-white); border: 1px solid var(--apple-border);
      border-radius: 16px; padding: 44px 24px; text-align: center;
    }
    .ls-empty i { display: block; font-size: 34px; margin-bottom: 10px; color: var(--apple-gray); }
    .ls-empty p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--apple-gray-2); }

    @media (max-width: 760px) {
      .ls-frame { height: min(62vh, 440px); }
      .ls-media { padding: 10px; border-radius: 14px; }
    }
    `;

    function ensureLessonStyle() {
      if (document.getElementById('lessonStyle')) return;
      const el = document.createElement('style');
      el.id = 'lessonStyle';
      el.textContent = LESSON_CSS;
      document.head.appendChild(el);
    }

    // ── 互動狀態 ──────────────────────────────────────────────────
    // 模組層級，key 是「blocks 的索引」。切單元（courseId#idx 變了）就整包丟掉重建；
    // 同一單元的重新渲染（例如後端同步完）會保留使用者已經按到哪裡。
    let lessonState = {};
    let lessonStateKey = null;
    let lessonVideoSaveAt = 0;     // 影片進度節流用的時間戳

    // ── 小工具 ────────────────────────────────────────────────────
    function lsCurMat() {
      const c = activeCourse();
      if (!c) return null;
      return (c.materials || [])[activeMatIdx] || null;
    }

    function lsUnitTitle(m) {
      if (!m) return '未命名單元';
      const name = m.fileName || '未命名單元';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    function lsBlocks(m) {
      return (m && Array.isArray(m.blocks)) ? m.blocks.filter(b => b && typeof b === 'object') : [];
    }

    function lsGoModule() {
      if (activeCourseId) openModule(activeCourseId);
      else goHome();
    }

    // 上／下一課：只靠全域 activeCourseId / activeMatIdx，不把 id 拼進 onclick
    function lsGo(delta) {
      const c = activeCourse();
      if (!c) { goHome(); return; }
      const next = Number(activeMatIdx) + Number(delta);
      if (!(c.materials || [])[next]) return;
      openLesson(c.id, next);
    }

    // 最後一課：標記完成後回模組頁
