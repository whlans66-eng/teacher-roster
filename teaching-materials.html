<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材管理 | WHL MARITRAIN</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <!-- 共用按鈕規範：全站唯一的按鈕來源，勿在頁面內另外定義 -->
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    /* ══════════════════════════════════════════════════════════════
       教材管理 — 版面結構依使用者提供的原型；顏色／字體／圖示／圓角
       嚴格依 shared/ui.css 與 shared/styleguide.html 的全站規範：
         色票只用 --ui-*、禁止漸層、系統字體、Phosphor regular、
         圓角只有 12 / 20 / 999 / 50% 四級、按鈕一律用 ui.css 的 .btn。
       本檔不定義任何 .btn 規則。
       ══════════════════════════════════════════════════════════════ */
    :root {
      --bg:        var(--ui-surface-hover);   /* #f5f5f7 頁底 */
      --fill:      var(--ui-fill);            /* #f2f2f7 灰盤、佔位 */
      --fill-2:    var(--ui-fill-hover);      /* #e5e5ea 佔位圖示、軌道 */
      --surface:   var(--ui-surface);
      --line:      var(--ui-border);
      --line-soft: rgba(0, 0, 0, 0.06);
      --text:      var(--ui-text);
      --dim:       var(--ui-text-secondary);
      --faint:     #86868b;
      --blue:      var(--ui-primary);
      --blue-h:    var(--ui-primary-hover);
      --blue-l:    var(--ui-primary-light);
      --blue-l2:   var(--ui-primary-light-hover);
      --ok:        var(--ui-success);
      --bad:       var(--ui-danger);
      --bad-bg:    var(--ui-danger-bg);
      --dark:      var(--ui-text);            /* 深色卡用文字色，不另開色票 */
      --r-btn:     var(--ui-radius-btn);      /* 12 */
      --r-card:    var(--ui-radius-card);     /* 20 */
      --r-pill:    var(--ui-radius-pill);     /* 999 */
      --r-round:   var(--ui-radius-round);    /* 50% */
      --max:       1200px;
      --topbar-h:  60px;
      --lesbar-h:  52px;
      --ai-w:      380px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      line-height: 1.5;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: var(--blue-h); }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; }
    .hidden { display: none !important; }
    i.ph { line-height: 1; }
    h1, h2, h3 { letter-spacing: -0.01em; }

    /* 原型按鈕使用了「膠囊」造型；規範圓角只有四級，膠囊屬 999 級，
       因此僅提供 .u-pill / .u-block 兩個造型工具，不碰 .btn 本身 */
    .u-pill { border-radius: var(--r-pill) !important; }
    .u-block { width: 100%; display: flex; }

    /* ── 頂欄（原型結構：sticky 60px；視覺依規範） ── */
    .topbar {
      /* 接在共用導覽列（Auth.mountNav）下面，沒有導覽列時 --app-nav-h 為 0 */
      position: sticky; top: var(--app-nav-h, 0px); z-index: 40;
      height: var(--topbar-h);
      background: rgba(255,255,255,.82);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line-soft);
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
    }
    .topbar > * { flex: 0 0 auto; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 500; color: var(--blue);
      padding: 8px 14px; border-radius: var(--r-btn);
      transition: background .2s;
    }
    .back-btn:hover { background: var(--blue-l); }
    .topbar-sep { width: 1px; height: 18px; background: var(--line-soft); }
    .topbar-brand { font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; }
    .topbar-nav { display: flex; align-items: center; gap: 18px; margin-left: 12px; }
    .topbar-nav-link { font-size: 13.5px; font-weight: 600; color: var(--dim); cursor: pointer; transition: color .2s; }
    .topbar-nav-link:hover { color: var(--text); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600;
      background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-pill);
      padding: 4px 12px 4px 4px; box-shadow: var(--shadow-sm);
    }
    .user-avatar {
      width: 28px; height: 28px; border-radius: var(--r-round);
      background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
    }
    .role-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill); }
    .role-admin   { background: var(--blue); color: #fff; }
    .role-teacher { background: var(--blue-l); color: var(--blue-h); }
    .role-crew    { background: var(--fill); color: var(--text); }
    .role-guest   { background: var(--fill); color: var(--dim); }

    .input {
      width: 100%; padding: 10px 12px; border-radius: var(--r-btn);
      border: 1px solid var(--line); background: var(--surface);
      font-size: 14px; color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.15); }
    .input::placeholder { color: var(--faint); }

    /* ══════════════════════════════════════════════════════════════
       首頁
       ══════════════════════════════════════════════════════════════ */
    .hm-wrap { max-width: var(--max); margin: 0 auto; }
    .hm-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .hm-sec-head h2, .mod-body h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text); }

    /* 主視覺照片槽：中性灰佔位 + 置中 Phosphor 圖示（無漸層、無照片時的狀態） */
    .hm-hero {
      position: relative; border-radius: var(--r-card); overflow: hidden;
      height: clamp(200px, 32vw, 320px);
      background: var(--fill) !important;
      display: flex; align-items: center; justify-content: center;
    }
    .hm-hero-icon { font-size: 44px; color: var(--fill-2); }
    .hm-welcome {
      position: relative; margin: -64px 20px 0; max-width: 600px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line-soft); border-radius: var(--r-card);
      padding: 28px 32px; box-shadow: var(--shadow-lg);
    }
    .hm-welcome h1 {
      margin: 0 0 12px; font-size: clamp(24px, 3vw, 32px); font-weight: 700;
      line-height: 1.3; letter-spacing: -0.02em; text-wrap: pretty; color: var(--text);
    }
    .hm-welcome h1 em { font-style: normal; color: var(--blue); white-space: nowrap; }
    .hm-welcome p { margin: 0; font-size: 15px; line-height: 1.8; color: var(--dim); text-wrap: pretty; }
    .hm-welcome-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 12.5px; color: var(--dim); }
    .hm-welcome-stats span { display: inline-flex; align-items: center; gap: 5px; }
    .hm-welcome-stats i { font-size: 14px; }

    .hm-admin-hint {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: var(--r-pill); background: var(--blue-l); color: var(--blue-h);
      font-size: 12px; font-weight: 600;
    }
    .hm-admin-hint i { font-size: 14px; }

    /* 我的學習：深色續看卡（參考站的黑色卡；深色用文字色 #1d1d1f） */
    .hm-continue {
      background: var(--dark); color: #fff; border-radius: var(--r-card); padding: 16px;
      display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: center;
      cursor: pointer; transition: box-shadow .2s; outline: none;
    }
    .hm-continue:hover, .hm-continue:focus-visible { box-shadow: var(--shadow-lg); }
    .hm-continue-thumb {
      position: relative; flex: 0 0 auto; width: min(100%, 172px); height: 104px;
      border-radius: var(--r-btn); overflow: hidden;
      background: rgba(255,255,255,.08) !important;
      display: flex; align-items: center; justify-content: center;
    }
    .hm-continue-thumb > i { font-size: 30px; color: rgba(255,255,255,.18); }
    .hm-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .hm-play i {
      width: 44px; height: 44px; border-radius: var(--r-round);
      background: rgba(255,255,255,.22); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
    }
    .hm-continue-body { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .hm-eyebrow { font-size: 12px; color: rgba(255,255,255,.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hm-continue-title { font-size: 18px; font-weight: 700; color: #fff; }
    .hm-prog-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .hm-prog-label { font-size: 12px; color: rgba(255,255,255,.6); white-space: nowrap; }
    .hm-prog-track { flex: 1 1 160px; height: 6px; border-radius: var(--r-pill); background: rgba(255,255,255,.16); overflow: hidden; }
    .hm-prog-fill { height: 100%; background: var(--blue); border-radius: var(--r-pill); transition: width .4s; }
    .hm-prog-pct { font-size: 13px; font-weight: 700; color: #fff; }

    /* 學習路徑 */
    .hm-path + .hm-path { margin-top: 36px; }
    .hm-path-head { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center; padding: 12px 4px 24px; }
    .hm-path-cover {
      flex: 0 0 auto; width: 156px; height: 96px; border-radius: var(--r-btn); overflow: hidden;
      transform: rotate(-2deg); box-shadow: var(--shadow-md);
      background: var(--fill) !important; border: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .hm-path-cover i { font-size: 26px; color: var(--fill-2); }
    .hm-path-text { flex: 1 1 320px; min-width: 0; }
    .hm-path-text h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--text); }
    .hm-path-text p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--dim); text-wrap: pretty; }
    .hm-path-pct {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
      border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line-soft);
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .hm-path-pct svg { width: 14px; height: 14px; }
    .hm-tray { background: var(--fill); border-radius: var(--r-card); padding: 16px; }
    .hm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

    .hm-card {
      background: var(--surface); border-radius: var(--r-card); padding: 10px;
      display: flex; flex-direction: column; cursor: pointer; outline: none;
      box-shadow: var(--shadow-sm); transition: box-shadow .15s;
    }
    .hm-card:hover, .hm-card:focus-visible { box-shadow: var(--shadow-md); }
    .hm-card.is-locked { cursor: default; }
    .hm-card.is-locked:hover { box-shadow: var(--shadow-sm); }
    .hm-cover {
      position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-btn); overflow: hidden;
      background: var(--fill) !important;
      display: flex; align-items: center; justify-content: center;
    }
    .hm-cover > i { font-size: 28px; color: var(--fill-2); }
    .hm-badge {
      position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: var(--r-pill);
      background: var(--dark); color: #fff; font-size: 11px; font-weight: 700; pointer-events: none;
    }
    .hm-lock {
      position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: var(--r-round);
      background: rgba(255,255,255,.92); color: var(--dim); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center; font-size: 13px; pointer-events: none;
    }
    .hm-cover-prog {
      position: absolute; left: 10px; right: 10px; bottom: 10px; height: 3px; border-radius: var(--r-pill);
      background: rgba(255,255,255,.7); pointer-events: none; overflow: hidden;
    }
    .hm-cover-prog > div { height: 100%; background: var(--blue); border-radius: var(--r-pill); }
    .hm-card-body { padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .hm-card-title { font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text); }
    .hm-card-desc { font-size: 13px; line-height: 1.65; color: var(--dim); text-wrap: pretty; flex: 1; }
    .hm-card-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-top: 4px; }
    .hm-card-meta i { font-size: 13px; }
    .hm-empty {
      text-align: center; padding: 48px 20px; color: var(--dim); font-size: 14px; line-height: 1.8;
      background: var(--fill); border-radius: var(--r-card);
    }
    .hm-empty i { display: block; font-size: 40px; color: var(--fill-2); margin-bottom: 10px; }

    /* ══════════════════════════════════════════════════════════════
       模組頁
       ══════════════════════════════════════════════════════════════ */
    .mod-hero { background: var(--surface); border-bottom: 1px solid var(--line-soft); }
    .mod-hero-in {
      max-width: var(--max); margin: 0 auto; padding: 44px 20px 48px;
      display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center;
    }
    .mod-hero-main { flex: 1 1 360px; min-width: 0; }
    .mod-back {
      display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
      color: var(--blue); cursor: pointer; margin-bottom: 14px; outline: none;
    }
    .mod-back:hover, .mod-back:focus-visible { color: var(--blue-h); }
    .mod-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .mod-chip {
      padding: 3px 10px; border-radius: var(--r-pill); background: var(--fill);
      font-size: 11px; font-weight: 600; color: var(--dim);
    }
    .mod-chip.primary { background: var(--blue-l); color: var(--blue-h); font-weight: 700; }
    .mod-hero-main h1 { margin: 0 0 14px; font-size: clamp(24px, 3vw, 30px); font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; color: var(--text); }
    .mod-desc { margin: 0 0 22px; font-size: 15px; line-height: 1.85; color: var(--dim); text-wrap: pretty; }
    .mod-meta { display: flex; gap: 20px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
    .mod-meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .mod-meta-item i { font-size: 15px; }
    .mod-cover-card {
      flex: 0 1 320px; min-width: min(100%, 260px);
      background: var(--surface); border-radius: var(--r-card); padding: 14px;
      box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 10px;
    }
    .mod-cover {
      position: relative; aspect-ratio: 16 / 10; border-radius: var(--r-btn); overflow: hidden;
      background: var(--fill) !important; margin-bottom: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .cover-ph { color: var(--fill-2); font-size: 28px; display: flex; }
    .cover-ph.md { font-size: 34px; }
    .mdl-admin { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft); margin-top: 4px; }
    .mdl-admin-hint { font-size: 11px; color: var(--faint); line-height: 1.5; text-align: center; }

    .mod-body { max-width: var(--max); margin: 0 auto; padding: 40px 20px 80px; }
    .mod-body h2 { margin-bottom: 16px; }
    .mod-list { background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-sm); }
    .mod-acc {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; background: var(--bg); border: none; border-bottom: 1px solid var(--line-soft);
      cursor: pointer; text-align: left; color: var(--text);
    }
    .mod-acc-left { display: flex; align-items: center; gap: 10px; }
    .mod-acc-caret { color: var(--dim); display: flex; font-size: 14px; transition: transform .2s; }
    .mod-acc.open .mod-acc-caret { transform: rotate(90deg); }
    .mod-acc-title { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .mod-acc-count { font-size: 12px; color: var(--dim); white-space: nowrap; }
    .mod-list-empty { padding: 28px 18px; font-size: 13.5px; line-height: 1.8; color: var(--dim); text-align: center; }

    .mod-unit {
      display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-start;
      padding: 16px 18px; border-bottom: 1px solid var(--line-soft); cursor: pointer; outline: none;
      transition: background .15s;
    }
    .mod-unit:last-child { border-bottom: none; }
    .mod-unit:hover, .mod-unit:focus-visible { background: var(--bg); }
    .mod-dot {
      flex: 0 0 24px; height: 24px; border-radius: var(--r-round); margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
      border: 2px solid var(--fill-2); background: var(--surface); color: var(--blue);
    }
    .mod-dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
    .mod-dot.current { background: var(--blue-l); border-color: var(--blue); color: var(--blue); }
    .mod-unit-main { flex: 1 1 240px; min-width: 0; }
    .mod-unit-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .mod-unit-title { font-size: 15px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
    .mod-unit-desc { font-size: 13px; line-height: 1.7; color: var(--dim); text-wrap: pretty; }
    .mod-unit-meta { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); padding-top: 2px; }
    .mod-type { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--r-pill); background: var(--fill); }
    .mod-dur { display: inline-flex; align-items: center; gap: 4px; }
    .mod-type i, .mod-dur i { font-size: 12px; }
    .mdl-acts { display: inline-flex; gap: 2px; margin-left: 4px; }

    .mod-cmt-wrap { background: var(--surface); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-sm); }
    .mod-cmt-list { display: flex; flex-direction: column; }
    .mod-cmt-row { display: flex; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
    .mod-cmt-ava {
      flex: 0 0 32px; height: 32px; border-radius: var(--r-round); background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .mod-cmt-body { flex: 1; min-width: 0; }
    .mod-cmt-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .mod-cmt-author { font-size: 13px; font-weight: 700; }
    .mod-cmt-time { font-size: 11px; color: var(--faint); }
    .mod-cmt-text { font-size: 14px; line-height: 1.75; color: var(--dim); overflow-wrap: anywhere; }
    .mod-cmt-empty { padding: 32px 18px; text-align: center; font-size: 13px; color: var(--dim); }
    .mod-cmt-compose { display: flex; gap: 10px; align-items: flex-end; padding: 14px 18px; background: var(--bg); }
    .mod-cmt-input { flex: 1; resize: vertical; min-height: 64px; }

    /* ══════════════════════════════════════════════════════════════
       課程頁（閱讀器）
       ══════════════════════════════════════════════════════════════ */
    .les-bar {
      position: sticky; top: calc(var(--app-nav-h, 0px) + var(--topbar-h)); z-index: 50; height: var(--lesbar-h);
      background: rgba(255,255,255,.82); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line-soft);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px;
    }
    .les-bar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .les-brand { font-size: 15px; font-weight: 700; cursor: pointer; flex: 0 0 auto; outline: none; }
    .les-sep { width: 1px; height: 18px; background: var(--line-soft); flex: 0 0 auto; }
    .les-crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); min-width: 0; white-space: nowrap; overflow: hidden; }
    .les-crumb-link { cursor: pointer; flex: 0 0 auto; outline: none; }
    .les-crumb-link:hover, .les-crumb-link:focus-visible { color: var(--text); }
    .les-crumb-cur { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .les-crumb-min { flex: 0 0 auto; }
    .les-bar-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

    .les-grid { display: grid; grid-template-columns: 1fr; align-items: start; }
    .les-main { min-width: 0; max-width: 760px; width: 100%; margin: 0 auto; padding: 24px 16px 150px; display: flex; flex-direction: column; gap: 20px; }
    @media (min-width: 1000px) { body.ai-open .les-grid { grid-template-columns: 1fr var(--ai-w); } }

    .blk { background: var(--surface); border-radius: var(--r-card); padding: 24px; box-shadow: var(--shadow-sm); }
    .blk-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .blk-head h2 { margin: 0; font-size: 20px; font-weight: 700; text-wrap: pretty; color: var(--text); }
    .blk-min { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--fill); font-size: 12px; color: var(--dim); }
    .blk-min i { font-size: 11px; }
    .blk-intro, .blk-body > p { margin: 0 0 16px; font-size: 14px; line-height: 1.85; color: var(--dim); text-wrap: pretty; }
    .blk-body { font-size: 14px; line-height: 1.85; color: var(--text); }
    .blk-body:last-child p:last-child { margin-bottom: 0; }
    .blk-panel { position: relative; background: var(--bg); border-radius: var(--r-btn); padding: 44px 16px 16px; }
    .blk-reset {
      position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: var(--r-round);
      border: none; background: transparent; color: var(--dim);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .blk-reset:hover { background: var(--fill-2); }
    .blk-card { background: var(--surface); border-radius: var(--r-btn); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); }

    .blk-tabs { display: grid; grid-template-columns: repeat(var(--tab-n, 3), minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .blk-tabs.many { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .blk-tab {
      padding: 10px 6px; border-radius: var(--r-btn); background: var(--surface);
      border: 2px solid transparent; color: var(--text); font-size: 14px; font-weight: 600;
      box-shadow: var(--shadow-sm); transition: border-color .15s, color .15s;
    }
    .blk-tab.active { border-color: var(--blue); color: var(--blue); }
    .blk-eyebrow { font-size: 12px; color: var(--dim); }
    .blk-headline { font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--text); }
    .blk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .blk-chip { padding: 3px 10px; border-radius: var(--r-pill); background: var(--blue-l); color: var(--blue-h); font-size: 12px; font-weight: 600; }
    .blk-desc { margin: 0; font-size: 14px; line-height: 1.8; color: var(--text); text-wrap: pretty; }
    .blk-summary { background: var(--dark); color: #fff; border-radius: var(--r-btn); padding: 14px 16px; font-size: 14px; font-weight: 600; line-height: 1.7; }

    .blk-tracks { display: flex; flex-direction: column; gap: 24px; margin-bottom: 18px; }
    .blk-track { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; }
    .blk-track-side { flex: 0 0 96px; display: flex; flex-direction: column; gap: 4px; }
    .blk-track-badge { align-self: flex-start; padding: 3px 9px; border-radius: var(--r-pill); background: var(--dark); color: #fff; font-size: 11px; font-weight: 700; }
    .blk-track-badge.alt { background: var(--blue); }
    .blk-track-hint { font-size: 11px; color: var(--dim); line-height: 1.5; }
    .blk-track-main { flex: 1 1 220px; min-width: 0; position: relative; padding-top: 6px; }
    .blk-track-line { position: absolute; top: 16px; left: 7%; right: 7%; height: 2px; background: var(--fill-2); }
    .blk-nodes { display: grid; grid-template-columns: repeat(var(--node-n, 7), minmax(0, 1fr)); position: relative; }
    .blk-node { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; color: inherit; }
    .blk-node-dot {
      width: 22px; height: 22px; border-radius: var(--r-round); background: var(--surface);
      border: 2px solid var(--fill-2); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .blk-node.past .blk-node-dot { background: var(--faint); border-color: var(--faint); }
    .blk-node.active .blk-node-dot { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.15); }
    .blk-node-label { font-size: 10.5px; line-height: 1.25; text-align: center; color: var(--dim); font-weight: 500; }
    .blk-node.active .blk-node-label { color: var(--blue); font-weight: 700; }
    .blk-detail { gap: 8px; }
    .blk-detail-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
    .blk-detail-eyebrow { font-size: 12px; font-weight: 700; color: var(--blue); }
    .blk-level { padding: 2px 8px; border-radius: var(--r-pill); background: var(--fill); font-size: 11px; color: var(--dim); }
    .blk-detail-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .blk-detail-next { font-size: 13px; color: var(--dim); margin-top: 4px; }

    .blk-hint-top { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .blk-hint-bot { font-size: 12px; color: var(--dim); margin-top: 8px; }
    .blk-items { display: flex; flex-direction: column; gap: 8px; }
    .blk-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px;
      background: var(--surface); border: 1px solid transparent; border-radius: var(--r-btn);
      box-shadow: var(--shadow-sm); cursor: grab;
      transition: border-color .15s, background .15s, box-shadow .15s, opacity .15s;
    }
    .blk-item.sel { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.15); }
    .blk-item.ok { background: rgba(52,199,89,.10); border-color: rgba(52,199,89,.45); }
    .blk-item.bad { background: var(--bad-bg); border-color: rgba(255,59,48,.45); }
    .blk-item.dragging { opacity: .5; }
    .blk-item-num {
      flex: 0 0 26px; height: 26px; border-radius: var(--r-round); background: var(--fill); color: var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .blk-item.ok .blk-item-num { background: var(--ok); color: #fff; }
    .blk-item.bad .blk-item-num { background: var(--bad); color: #fff; }
    .blk-item-main { flex: 1 1 auto; min-width: 0; }
    .blk-item-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: var(--text); }
    .blk-item-desc { font-size: 12.5px; line-height: 1.6; color: var(--dim); text-wrap: pretty; }
    .blk-item-arrows { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
    .blk-arrow {
      width: 26px; height: 24px; border-radius: 12px; border: none; background: var(--fill);
      color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0;
    }
    .blk-arrow:hover:not(:disabled) { background: var(--fill-2); }
    .blk-arrow:disabled { opacity: .35; cursor: default; }
    .blk-grip { color: var(--faint); flex: 0 0 auto; display: flex; font-size: 16px; }
    .blk-check-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .blk-result { font-size: 13px; line-height: 1.6; flex: 1 1 200px; color: var(--dim); }
    .blk-result.ok { color: var(--ok); }
    .blk-result.bad { color: var(--bad); }

    .les-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; }
    .les-nav-prev { font-size: 13px; color: var(--blue); cursor: pointer; outline: none; }
    .les-nav-prev:hover, .les-nav-prev:focus-visible { color: var(--blue-h); }
    .les-nav-prev.off { color: var(--faint); cursor: default; }
    .les-nav-spacer { flex: 1; }

    .ls-media { display: flex; flex-direction: column; gap: 14px; }
    .ls-media-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ls-media-title { font-weight: 700; font-size: 20px; margin: 0; }
    .ls-media-meta { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .ls-frame { width: 100%; height: min(78vh, 920px); border: none; border-radius: var(--r-btn); background: var(--fill); }
    .ls-video { width: 100%; border-radius: var(--r-btn); background: var(--dark); max-height: 78vh; }
    .ls-img { width: 100%; height: auto; border-radius: var(--r-btn); }
    .ls-fallback, .ls-empty { padding: 40px 20px; text-align: center; background: var(--fill); border-radius: var(--r-btn); color: var(--dim); font-size: 14px; line-height: 1.8; }
    .ls-fallback i, .ls-empty i { display: block; font-size: 36px; color: var(--fill-2); margin-bottom: 8px; }
    .brand-sub { display: inline; }

    /* ══════════════════════════════════════════════════════════════
       AI 助教側欄
       ══════════════════════════════════════════════════════════════ */
    .ai-panel {
      position: fixed; top: calc(var(--app-nav-h, 0px) + var(--topbar-h) + var(--lesbar-h)); right: 0; z-index: 60;
      width: var(--ai-w); height: calc(100vh - var(--app-nav-h, 0px) - var(--topbar-h) - var(--lesbar-h));
      background: var(--surface); border-left: 1px solid var(--line-soft); box-shadow: var(--shadow-lg);
      display: none; flex-direction: column;
    }
    .ai-panel.open { display: flex; }
    .ai-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
    .ai-head-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
    .ai-head-title i { color: var(--blue); font-size: 14px; }
    .ai-close { width: 28px; height: 28px; border-radius: var(--r-round); border: none; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .ai-close:hover { background: var(--fill); }
    .ai-body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ai-empty { margin-top: 28px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7; }
    .ai-sugg { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .ai-sugg-btn { text-align: left; padding: 10px 12px; border-radius: var(--r-btn); border: none; background: var(--fill); font-size: 13px; color: var(--text); line-height: 1.5; }
    .ai-sugg-btn:hover { background: var(--fill-2); }
    .ai-msg { max-width: 88%; padding: 10px 12px; border-radius: var(--r-btn); font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .ai-msg.me { align-self: flex-end; background: var(--blue); color: #fff; }
    .ai-msg.bot { align-self: flex-start; background: var(--fill); color: var(--text); }
    .ai-busy { align-self: flex-start; font-size: 12px; color: var(--dim); }
    .ai-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
    .ai-foot .input { flex: 1; min-width: 0; height: 40px; font-size: 13px; }
    .ai-send { width: 40px; height: 40px; border-radius: var(--r-btn); background: var(--blue); color: #fff; border: none; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; font-size: 16px; }
    .ai-send:hover:not(:disabled) { background: var(--blue-h); }
    .ai-send:disabled { background: var(--ui-disabled); cursor: not-allowed; }

    /* ══════════════════════════════════════════════════════════════
       互動教材編輯器（Modal）
       ══════════════════════════════════════════════════════════════ */
    .ed-overlay {
      position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      visibility: hidden; opacity: 0; transition: opacity .2s, visibility .2s;
    }
    .ed-overlay.open { visibility: visible; opacity: 1; }
    .ed-modal { width: min(100%, 760px); max-height: calc(100vh - 48px); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
    .ed-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line-soft); }
    .ed-head h2, .ed-head h3 { margin: 0; font-size: 18px; font-weight: 700; }
    .ed-head-sub { font-size: 12.5px; color: var(--dim); margin-top: 4px; }
    .ed-close { width: 30px; height: 30px; border-radius: var(--r-round); border: none; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: 0 0 auto; }
    .ed-close:hover { background: var(--fill); }
    .ed-body { flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .ed-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .ed-row > .ed-field { flex: 1 1 180px; min-width: 0; }
    .ed-field { display: flex; flex-direction: column; gap: 6px; }
    .ed-label { font-size: 12.5px; font-weight: 600; color: var(--text); }
    .ed-hint { font-size: 12px; color: var(--dim); line-height: 1.6; }
    .ed-field textarea.input { resize: vertical; min-height: 84px; line-height: 1.6; }
    .ed-blocks { display: flex; flex-direction: column; gap: 12px; }
    .ed-block { background: var(--bg); border-radius: var(--r-btn); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .ed-block-head { display: flex; align-items: center; gap: 10px; }
    .ed-block-type { padding: 3px 9px; border-radius: var(--r-pill); background: var(--blue-l); color: var(--blue-h); font-size: 11px; font-weight: 700; }
    .ed-block-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ed-block-tools { display: flex; gap: 4px; }
    .ed-icon-btn { width: 28px; height: 28px; border-radius: var(--r-btn); border: none; background: var(--surface); color: var(--dim); display: flex; align-items: center; justify-content: center; font-size: 13px; padding: 0; box-shadow: var(--shadow-sm); }
    .ed-icon-btn:hover:not(:disabled) { background: var(--fill); color: var(--text); }
    .ed-icon-btn:disabled { opacity: .35; cursor: default; }
    .ed-icon-btn.danger { color: var(--bad); }
    .ed-icon-btn.danger:hover:not(:disabled) { background: var(--bad-bg); }
    .ed-sub { background: var(--surface); border-radius: var(--r-btn); padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); }
    .ed-sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--dim); }
    .ed-sub-item { border-top: 1px solid var(--line-soft); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .ed-sub-item:first-of-type { border-top: none; padding-top: 0; }
    .ed-empty { padding: 32px 16px; text-align: center; background: var(--bg); border-radius: var(--r-btn); color: var(--dim); font-size: 13.5px; line-height: 1.8; }
    .ed-add-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ed-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--line-soft); background: var(--bg); }
    .ed-foot-left { font-size: 12.5px; color: var(--dim); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: rgba(29,29,31,.94); backdrop-filter: blur(16px); color: #fff;
      padding: 11px 18px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-lg);
      opacity: 0; z-index: 200; transition: transform .25s, opacity .25s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast i { font-size: 16px; }
    .toast-success i { color: var(--ok); }
    .toast-error i { color: var(--bad); }

    /* ── 手機版 ── */
    @media (max-width: 760px) {
      .topbar { padding: 0 14px; gap: 8px; }
      .topbar-nav, .topbar-sep { display: none; }
      .user-pill span:not(.role-pill) { display: none; }
      .hm-welcome { margin: -48px 12px 0; padding: 22px 20px; }
      .hm-path-cover { transform: none; width: 100%; height: 120px; }
      .hm-tray { padding: 12px; }
      .hm-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .mod-hero-in { padding: 28px 16px 32px; }
      .mod-cover-card { flex-basis: 100%; }
      .mod-body { padding: 28px 16px 60px; }
      .mod-unit-meta { width: 100%; padding-top: 0; }
      .les-main { padding: 16px 12px 120px; gap: 14px; }
      .blk { padding: 18px 16px; }
      .blk-panel { padding: 40px 12px 12px; }
      .blk-tabs { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
      .blk-track-side { flex-basis: 100%; flex-direction: row; align-items: center; gap: 8px; }
      .blk-item-desc, .blk-grip, .brand-sub { display: none; }
      .ai-panel { top: 0; width: 100%; height: 100vh; z-index: 95; }
      .ed-overlay { padding: 0; }
      .ed-modal { width: 100%; max-height: 100vh; border-radius: 0; }
      .ed-icon-btn { width: 36px; height: 36px; }
      .ls-frame { height: 70vh; }
    }

    /* 環形完成度：純 CSS conic-gradient（規範禁止手寫 inline SVG） */
    .hm-ring {
      width: 14px; height: 14px; border-radius: var(--r-round); flex: 0 0 auto;
      background: conic-gradient(var(--blue) calc(var(--pct, 0) * 1%), var(--fill-2) 0);
      -webkit-mask: radial-gradient(circle at center, transparent 55%, #000 57%);
              mask: radial-gradient(circle at center, transparent 55%, #000 57%);
    }

    /* ══════════════════════════════════════════════════════════════
       課表、問卷、船員設定（tm-*）：沿用本頁的 hm- 版面與 ed- 對話框
       ══════════════════════════════════════════════════════════════ */
    .topbar-nav-link.is-on { color: var(--text); }
    .topbar-nav-link.is-on::after { content: ''; display: block; height: 2px; margin-top: 4px; border-radius: var(--r-pill); background: var(--blue); }
    .tm-nav-badge {
      display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
      margin-left: 5px; border-radius: var(--r-pill); background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px;
    }
    .tm-sub { margin: -6px 0 16px; font-size: 13.5px; line-height: 1.7; color: var(--dim); }
    .tm-banner {
      display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r-card);
      font-size: 14px; line-height: 1.7; border: 1px solid transparent;
    }
    .tm-banner > i { font-size: 20px; flex: 0 0 auto; align-self: flex-start; margin-top: 2px; }
    .tm-banner-amber { background: #fff8e6; border-color: #fde3a7; color: #7a4b00; }
    .tm-banner-blue  { background: var(--blue-l); border-color: var(--blue-l2); color: var(--blue-h); }
    .tm-notice-add {
      width: 100%; display: flex; align-items: center; gap: 8px; justify-content: center; padding: 12px;
      border: 1.5px dashed var(--line); border-radius: var(--r-card); background: transparent; color: var(--dim);
      font-size: 13.5px; font-weight: 600;
    }
    .tm-notice-add:hover { border-color: var(--blue); color: var(--blue); }
    .tm-extras { display: grid; gap: 16px; }
    .tm-strip { background: var(--surface); border-radius: var(--r-card); padding: 16px 18px; box-shadow: var(--shadow-sm); }
    .tm-strip-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tm-strip-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .tm-strip .tm-row { box-shadow: none; padding: 10px 4px; border-radius: 0; border-bottom: 1px solid var(--line-soft); }
    .tm-strip .tm-row:last-child { border-bottom: 0; }
    .tm-strip-action { display: flex; align-items: center; gap: 14px; cursor: pointer; outline: none; transition: box-shadow .15s; }
    .tm-strip-action:hover, .tm-strip-action:focus-visible { box-shadow: var(--shadow-md); }
    .tm-strip-action > i:first-child { font-size: 26px; color: var(--blue); }
    .tm-crewtag {
      display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; padding: 2px 8px; border-radius: var(--r-pill);
      background: var(--blue-l); color: var(--blue-h); font-size: 11px; font-weight: 700;
    }
    .tm-crewtag.off { background: var(--fill); color: var(--dim); }

    .tm-section + .tm-section { margin-top: 40px; }
    .tm-day { margin-bottom: 22px; }
    .tm-day-label { font-size: 13px; font-weight: 700; color: var(--dim); margin: 0 0 8px 4px; }
    .tm-day-label.is-today { color: var(--blue); }
    .tm-list { display: flex; flex-direction: column; gap: 8px; }
    .tm-row {
      display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: var(--surface);
      border-radius: var(--r-btn); box-shadow: var(--shadow-sm); cursor: pointer; outline: none; transition: box-shadow .15s;
    }
    .tm-row:hover, .tm-row:focus-visible { box-shadow: var(--shadow-md); }
    .tm-row.is-static { cursor: default; }
    .tm-row.is-static:hover { box-shadow: var(--shadow-sm); }
    .tm-row.is-cancelled .tm-row-title { text-decoration: line-through; color: var(--dim); }
    .tm-row.is-off .tm-row-title { color: var(--dim); }
    .tm-row > .ph-caret-right { color: var(--faint); }
    .tm-row-time { flex: 0 0 104px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tm-row-icon { font-size: 22px; color: var(--blue); flex: 0 0 auto; }
    .tm-row-main { flex: 1; min-width: 0; }
    .tm-row-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .tm-row-sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.6; }
    .tm-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--fill); color: var(--dim); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .tm-pill.ok { background: #ecfdf5; color: #047857; }
    .tm-status { flex: 0 0 auto; padding: 3px 10px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 700; }
    .tm-status.draft  { background: var(--fill); color: var(--dim); }
    .tm-status.active { background: #ecfdf5; color: #047857; }
    .tm-status.closed { background: var(--bad-bg); color: var(--bad); }
    .tm-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 640px) {
      .tm-row { flex-wrap: wrap; }
      .tm-row-time { flex-basis: 100%; }
      .tm-actions { flex-basis: 100%; justify-content: flex-start; }
    }

    .tm-choices { display: flex; flex-direction: column; gap: 6px; }
    .tm-choice { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-btn); background: var(--bg); font-size: 14px; cursor: pointer; }
    .tm-rating { display: flex; gap: 8px; flex-wrap: wrap; }
    .tm-rate { width: 42px; height: 42px; border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 700; color: var(--text); }
    .tm-rate.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .tm-bar { display: grid; grid-template-columns: minmax(70px, 160px) 1fr 76px; gap: 10px; align-items: center; font-size: 13px; }
    .tm-bar .track { height: 8px; border-radius: var(--r-pill); background: var(--fill-2); overflow: hidden; }
    .tm-bar .track > span { display: block; height: 100%; background: var(--blue); border-radius: var(--r-pill); }
    .tm-bar .n { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
    .tm-big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
    .tm-big span { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: 0; }
    .tm-ans { padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; line-height: 1.6; }
    .tm-ans:last-child { border-bottom: 0; }

    .tm-panel { background: var(--surface); border-radius: var(--r-card); padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
    .tm-panel h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .tm-panel .tm-sub { margin: 0 0 12px; }
    .tm-panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .tm-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 12px; }
    @media (max-width: 640px) { .tm-modes { grid-template-columns: 1fr; } }
    .tm-mode { text-align: left; padding: 14px 16px; border-radius: var(--r-btn); border: 1.5px solid var(--line); background: var(--surface); }
    .tm-mode.on { border-color: var(--blue); background: var(--blue-l); }
    .tm-mode .t { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--text); }
    .tm-mode .d { margin-top: 4px; font-size: 12.5px; line-height: 1.6; color: var(--dim); }
    .tm-switch {
      position: relative; flex: 0 0 auto; width: 46px; height: 28px; padding: 0; border: 0; border-radius: var(--r-pill);
      background: var(--ui-disabled); transition: background .2s;
    }
    .tm-switch::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: var(--r-round);
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s;
    }
    .tm-switch[aria-checked="true"] { background: var(--ok); }
    .tm-switch[aria-checked="true"]::after { transform: translateX(18px); }
    .tm-cmt-del { margin-left: auto; border: 0; background: transparent; color: var(--faint); padding: 2px 6px; border-radius: var(--r-btn); font-size: 13px; }
    .tm-cmt-del:hover { color: var(--bad); background: var(--bad-bg); }

  </style>
</head>
<body>

  <!-- Topbar
       「返回首頁」與使用者資訊已由共用導覽列（Auth.mountNav）提供，
       這裡只留頁面標題，避免同一畫面出現兩次帳號資訊。 -->
  <header class="topbar">
    <span class="topbar-brand" id="tmBrand" onclick="goHome()">教材管理</span>
    <!-- 子選單依功能權限產生（帳號管理 → 權限設定 → 教材頁功能） -->
    <nav class="topbar-nav" id="tmNav"></nav>
    <div class="topbar-right">
      <span class="role-pill" id="rolePill"></span>
    </div>
  </header>

  <!-- 首頁 -->
  <div id="homeView"></div>

  <!-- 模組頁 -->
  <div id="moduleView" class="hidden"></div>

  <!-- 課程頁（閱讀器） -->
  <div id="lessonView" class="hidden"></div>

  <!-- 我的課表、問卷、船員設定：各自要有對應的功能權限才會出現在子選單 -->
  <div id="scheduleView" class="hidden"></div>
  <div id="surveysView" class="hidden"></div>
  <div id="crewsetView" class="hidden"></div>

  <!-- 問卷填寫／編輯／結果共用的對話框（互動教材編輯器用的是 #edOverlay） -->
  <div class="ed-overlay" id="tmOverlay"></div>

  <!-- AI 助教側欄 -->
  <aside class="ai-panel" id="aiPanel" aria-hidden="true"></aside>

  <!-- 互動教材編輯器 -->
  <div class="ed-overlay" id="edOverlay"></div>

  <!-- 上傳用隱藏 input（全頁共用一個） -->
  <input type="file" id="fileInput" multiple
    accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.webm,.mov,.jpg,.jpeg,.png,.gif,.webp"
    style="display:none" onchange="handleFiles(this)">

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="ph ph-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/security.js"></script>
  <script src="js/api.js"></script>
  <!-- 系統名稱、時數目標、分享訊息、AI 提問等在「帳號管理 → 系統設定」改 -->
  <script src="js/site.js"></script>
  <script src="js/ui-feedback.js"></script>
  <!-- 船員職級的顯示名稱跟「選單管理」同一份 -->
  <script src="js/options.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ══════════════════════════════════════════════════════════════
    //  核心：全域狀態、資料載入、導覽、進度、上傳
    // ══════════════════════════════════════════════════════════════

    let currentUser = null;
    let isAdmin = false;
    let isCrew  = false;
    let allCourses = [];

    // 導覽狀態
    let view = 'home';            // 'home' | 'module' | 'lesson'
    let activeCourseId = null;    // string
    let activeMatIdx = null;      // number

    // 課程分類：跟「帳號管理 → 選單管理 → 課程分類」同一份。
    // 以前這裡另外寫死一份名稱、圖示、順序，管理者改了分類這頁不會跟著變，
    // 新增的分類還會被硬塞進「其他」。
    const catName  = code => code ? Options.name('courseCategory', code) : '未分類';
    const catOrder = () => Options.all('courseCategory').map(o => o.value);
    const catOf = c => {
      const v = String(c?.category ?? '').trim();
      if (v) return v;                                   // 不認得的代碼自成一組，管理者一看就知道要補分類
      return Options.has('courseCategory', '09') ? '09' : '';
    };
    const catIcon = code => `<i class="ph ${Options.icon('courseCategory', code, 'ph-folder')}"></i>`;
    const catGrad = () => 'var(--muted-2)';   // 封面佔位：原型的暖米色，不用分類漸層

    // ── 跳脫 ──
    function h(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function a(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function nl2br(s) { return h(s).replace(/\n/g, '<br>'); }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      if (!initAuth()) return;
      Auth.mountNav();          // 全站共用主導覽（依角色過濾）
      const p = new URLSearchParams(location.search);
      pendingTab = p.get('tab');
      renderTopNav();
      loadData(p.get('courseId'), p.get('unit'));
      // 管理者在帳號管理改了功能權限：已開著的頁面最晚一分鐘內就換成新的功能
      // 系統設定（歡迎詞、AI 建議問題）或選單（課程分類）在別處改了：就地重畫
      document.addEventListener('site:changed', () => rerenderCurrent());
      Options.ready().then(() => rerenderCurrent());
      document.addEventListener('auth:features', () => {
        isAdmin = Auth.can('materials_edit') && !previewRank;
        rerenderCurrent();
      });
    });

    function initAuth() {
      // 角色定義統一交給 js/auth.js，避免這頁自己判斷而把 guest 標成「教師」
      currentUser = protectPage();
      if (!currentUser) return false;

      const role = Auth.getRole();
      // 這頁大家共用，能不能上傳／編輯教材看功能權限，不寫死角色
      isAdmin = Auth.can('materials_edit');
      isCrew  = role === 'crew';

      // 姓名與頭像由共用導覽列的帳號選單顯示，這裡只標角色
      const pill = document.getElementById('rolePill');
      pill.textContent = Auth.getRoleLabel(role);
      pill.className = 'role-pill role-' + (role || 'guest');
      return true;
    }

    // AI 助教開給誰由功能權限決定（後端 askgemini 也照同一張表檢查）
    function canUseAi() {
      return Auth.can('ai');
    }

    // ── Data ──
    function readCourses() {
      try {
        const raw = JSON.parse(localStorage.getItem('maritimeCourses') || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch { return []; }
    }

    // 先用本地快取立即上畫面，再從後端同步（與 maritime-courses.html 相同流程）
    async function loadData(preCourseId = null, preUnit = null) {
      // 船員看得到哪些課由「船員設定」決定，後端已經篩好；
      // 不能走員工的同步流程把整份課程表拉下來
      if (isCrew) return loadCrewData(preCourseId, preUnit);
      allCourses = readCourses();
      restoreView(preCourseId, preUnit);

      if (typeof initializeDataSync === 'undefined') return;
      try {
        await initializeDataSync();
      } catch (err) {
        console.warn('⚠️ 後端同步失敗，使用本地資料:', err.message);
        if (!allCourses.length) showToast('無法連線後端，目前沒有課程資料', 'error');
        return;
      }

      allCourses = readCourses();
      restoreView(activeCourseId || preCourseId, activeMatIdx != null ? activeMatIdx : preUnit);
      loadLearning();
    }

    function crewCacheKey() {
      return 'crewPortalCache:' + String(currentUser?.username || '').toLowerCase();
    }

    function applyCrewData(d) {
      allCourses = Array.isArray(d?.courses) ? d.courses : [];
      applyLearningData(d);
    }

    async function loadCrewData(preCourseId, preUnit) {
      try {
        const cached = JSON.parse(localStorage.getItem(crewCacheKey()) || 'null');
        if (cached) applyCrewData(cached);
      } catch { /* 快取壞了就等後端 */ }
      restoreView(preCourseId, preUnit);
      try {
        const d = await api.learningData();
        applyCrewData(d);
        try { localStorage.setItem(crewCacheKey(), JSON.stringify(d)); } catch (_) {}
      } catch (err) {
        if (!allCourses.length) showToast('讀取課程失敗：' + (err.message || '請稍後再試'), 'error');
        return;
      }
      restoreView(activeCourseId || preCourseId, activeMatIdx != null ? activeMatIdx : preUnit);
    }

    // ── 課表、留言、問卷、公告（learning_data，管理者與船員共用同一支）──
    // 以前這頁的留言只存在各自的瀏覽器：老師在這裡回的話船員看不到，船員留的言老師也看不到。
    let tmComments = [];
    let ld = { assignments: [], comments: [], surveys: [], templates: [], myResponses: [],
               notice: '', viewer: null, crewSettings: null };
    let previewRank = '';        // 有「船員設定」功能的人以船員身分預覽時，模擬的職級
    let pendingTab = null;       // 網址帶 ?tab= 進來時要開的分頁
    const EXTRA_VIEWS = ['schedule', 'surveys', 'crewset'];

    const arr = v => Array.isArray(v) ? v : [];

    function applyLearningData(d) {
      ld = {
        assignments: arr(d?.assignments), comments: arr(d?.comments), surveys: arr(d?.surveys),
        templates: arr(d?.templates), myResponses: arr(d?.myResponses),
        notice: String(d?.notice || ''), viewer: d?.viewer || null, crewSettings: d?.crewSettings || null
      };
      tmComments = ld.comments;
    }

    async function loadLearning() {
      try {
        const d = await api.learningData(previewRank || undefined);
        applyLearningData(d);
        // 預覽時課程也換成船員看到的那一份
        if (previewRank) allCourses = arr(d.courses);
      } catch (err) {
        console.warn('讀取課表／留言／問卷失敗:', err);
        return;
      }
      rerenderCurrent();
    }

    function rerenderCurrent() {
      renderTopNav();
      if (view === 'home') renderHome();
      else if (view === 'module') { const c = activeCourse(); if (c) renderModule(c); }
      else if (EXTRA_VIEWS.includes(view)) renderExtraView(view);
    }

    function restoreView(courseId, unit) {
      if (!courseId && pendingTab && tabAllowed(pendingTab)) { openTab(pendingTab); return; }
      const course = courseId ? allCourses.find(c => String(c.id) === String(courseId)) : null;
      if (!course) { goHome(); return; }
      const idx = unit == null ? null : Number(unit);
      if (idx != null && !Number.isNaN(idx) && (course.materials || [])[idx]) openLesson(course.id, idx);
      else openModule(course.id);
    }

    // 寫入本地快取並同步回後端
    async function persistCourses() {
      // 預覽時 allCourses 是船員看到的那一份（少了被藏起來的課），存回去會把那些課刪掉
      if (previewRank) throw new Error('以船員身分預覽中不能修改教材，請先結束預覽');
      // 先留快照：saveTable 失敗時要連 localStorage 一起退回，
      // 否則重新整理後 readCourses() 會把「沒存成功」的資料當成已存在。
      const snapshot = localStorage.getItem('maritimeCourses');
      localStorage.setItem('maritimeCourses', JSON.stringify(allCourses));
      if (typeof syncManager === 'undefined') return;
      try {
        const result = await syncManager.saveTable('maritimeCourses');
        if (result?.conflict) {
          showToast('課程資料已被其他人修改，請重新整理後再試', 'error');
          throw new Error('資料衝突');
        }
      } catch (err) {
        try {
          if (snapshot === null) localStorage.removeItem('maritimeCourses');
          else localStorage.setItem('maritimeCourses', snapshot);
        } catch (_) {}
        throw err;
      }
    }

    // ── 導覽 ──
    function setView(next) {
      view = next;
      ['home','module','lesson'].concat(EXTRA_VIEWS).forEach(v => {
        document.getElementById(v + 'View').classList.toggle('hidden', v !== next);
      });
      renderTopNav();
      window.scrollTo({ top: 0 });
    }

    function syncUrl() {
      const url = new URL(location.href);
      if (activeCourseId) url.searchParams.set('courseId', activeCourseId);
      else url.searchParams.delete('courseId');
      if (activeMatIdx != null) url.searchParams.set('unit', activeMatIdx);
      else url.searchParams.delete('unit');
      if (EXTRA_VIEWS.includes(view)) url.searchParams.set('tab', view);
      else url.searchParams.delete('tab');
      history.replaceState(null, '', url);
    }

    function goHome() {
      pendingTab = null;
      activeCourseId = null; activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('home'); syncUrl(); renderHome();
    }

    function openModule(courseId) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      activeCourseId = String(course.id); activeMatIdx = null;
      if (typeof closeAi === "function") closeAi();
      setView('module'); syncUrl(); renderModule(course);
    }

    function openLesson(courseId, idx) {
      // 切換單元時面板不關（保留對話），但要重繪，否則「目前正在看」停在上一課
      const _reAi = typeof aiOpen !== 'undefined' && aiOpen;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) { goHome(); return; }
      const mats = course.materials || [];
      if (!mats[idx]) { openModule(courseId); return; }
      activeCourseId = String(course.id); activeMatIdx = Number(idx);
      setView('lesson'); syncUrl(); renderLesson(course, Number(idx));
      if (_reAi && typeof renderAiPanel === 'function') renderAiPanel();
    }

    function activeCourse() {
      return allCourses.find(c => String(c.id) === String(activeCourseId)) || null;
    }

    // ── 進度 ──
    function progKey(courseId, fileName) {
      return `vp_${currentUser?.username || 'u'}_${courseId}_${encodeURIComponent(fileName || '')}`;
    }

    function getProgress(courseId, fileName) {
      try { const r = localStorage.getItem(progKey(courseId, fileName)); return r ? JSON.parse(r) : null; }
      catch { return null; }
    }

    function saveProgress(courseId, fileName, data) {
      const prev = getProgress(courseId, fileName) || {};
      localStorage.setItem(progKey(courseId, fileName),
        JSON.stringify({ ...prev, ...data, lastViewed: new Date().toISOString() }));
    }

    function matDone(courseId, m) {
      const p = getProgress(courseId, m.fileName);
      return !!(p && (p.completed || p.viewed));
    }

    function courseStats(course) {
      const mats = course.materials || [];
      const done = mats.filter(m => matDone(course.id, m)).length;
      return { total: mats.length, done, pct: mats.length ? Math.round(done / mats.length * 100) : 0 };
    }

    function pathStats(courses) {
      let total = 0, done = 0;
      courses.forEach(c => { const s = courseStats(c); total += s.total; done += s.done; });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // ── 教材共用 ──
    const isInteractive = m => m?.kind === 'interactive';

    function isVideo(name) {
      return ['mp4','webm','mov','ogg'].includes((name || '').split('.').pop().toLowerCase());
    }

    function matKind(m) {
      if (isInteractive(m)) return '互動';
      const ext = (m.fileName || '').split('.').pop().toLowerCase();
      if (isVideo(m.fileName)) return '影片';
      if (ext === 'pdf') return 'PDF';
      if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '圖片';
      return '文件';
    }

    function fileStyle(name) {
      const ext = (name || '').split('.').pop().toUpperCase();
      const m = {
        PDF:  { icon:'ph-file-pdf',   bg:'#fee2e2', color:'#dc2626' },
        DOC:  { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        DOCX: { icon:'ph-file-doc',   bg:'#dbeafe', color:'#1d4ed8' },
        PPT:  { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        PPTX: { icon:'ph-file-ppt',   bg:'#ffedd5', color:'#c2410c' },
        MP4:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        WEBM: { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        MOV:  { icon:'ph-file-video', bg:'#ede9fe', color:'#7c3aed' },
        JPG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        JPEG: { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
        PNG:  { icon:'ph-file-image', bg:'#dcfce7', color:'#15803d' },
      };
      return m[ext] || { icon:'ph-paperclip', bg:'#f5f5f7', color:'#6e6e73' };
    }

    function matMinutes(m) {
      if (isInteractive(m)) return m.estMinutes || 0;
      if (!m.fileSize) return 0;
      return Math.max(1, Math.round(m.fileSize / (1024 * 1024) * 2));
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // Drive 預覽
    function drivePreview(m) { return m.fileId ? `https://drive.google.com/file/d/${m.fileId}/preview` : null; }
    function driveImage(m)   { return m.fileId ? `https://drive.google.com/thumbnail?id=${m.fileId}&sz=w1600` : null; }

    // ── 上傳 / 刪除 ──
    const UPLOAD_TYPES = [
      'application/pdf',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.ms-powerpoint',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'video/mp4', 'video/webm', 'video/ogg', 'video/quicktime',
      'image/jpeg', 'image/png', 'image/gif', 'image/webp'
    ];

    function triggerUpload(id) { document.getElementById('fileInput')?.click(); }

    function handleFiles(input) {
      if (input.files?.length && activeCourseId) processFiles(input.files, activeCourseId);
      input.value = '';
    }

    // 教材上傳到 Google Drive，課程資料寫回後端，所有裝置都看得到
    async function processFiles(files, courseId) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      if (!course.materials) course.materials = [];

      // 上傳整段都蓋遮罩：以前只有一個 2.8 秒就消失的 toast，
      // 但整條流程（上傳 Drive + 寫回課程）要四秒以上，中間畫面看起來像沒反應。
      const list = Array.from(files);
      await withBusy(`upload:${courseId}`, '上傳教材中…', '正在上傳並同步，請稍候', async () => {
        let n = 0;
        for (const file of list) {
          n++;
          if (!UPLOAD_TYPES.includes(file.type)) { showToast(`不支援格式：${file.name}`, 'error'); continue; }
          // 實際上限是 24 MB（Apps Script 一次收得下的大小，後端與 js/api.js 也是這個數字）；
          // 以前這裡寫 50 MB，24～50 MB 的檔案會先過關、上傳時才失敗
          if (file.size > 24 * 1024 * 1024)      { showToast(`檔案過大（上限 24 MB）：${file.name}`, 'error'); continue; }

          if (window.UIFeedback && UIFeedback.showBusy) {
            UIFeedback.showBusy(`上傳教材中…（${n}/${list.length}）`, file.name);
          }
          try {
            const res = await api.uploadFile(file);
            course.materials.push({
              fileName: file.name,
              fileType: file.type,
              fileId: res.id,
              fileUrl: res.url,
              fileSize: file.size,
              uploadedAt: new Date().toISOString(),
              uploadedBy: currentUser.username
            });
            await persistCourses();
            renderModule(course);
            showToast(`已上傳：${file.name}`, 'success');
          } catch (err) {
            console.error('上傳失敗:', err);
            showToast(`上傳失敗：${file.name}（${err.message || '未知錯誤'}）`, 'error');
          }
        }
      });
    }

    async function deleteMat(courseId, idx) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course?.materials) return;
      const name = course.materials[idx]?.fileName || '此教材';
      if (!confirm(`確定移除「${name}」？`)) return;

      const removed = course.materials.splice(idx, 1);
      await withBusy(`del:${courseId}:${idx}`, '移除教材中…', '正在同步到雲端，請稍候', async () => {
        try {
          await persistCourses();
          renderModule(course);
          showToast('已移除', 'success');
        } catch (err) {
          course.materials.splice(idx, 0, ...removed);
          renderModule(course);
          showToast(`移除失敗：${err.message || '未知錯誤'}`, 'error');
        }
      });
    }

    // ── 處理中遮罩 ──
    //
    // 這頁以前完全沒有等待提示：按下移除之後兩秒內畫面毫無變化，
    // 而且連點兩下會跳兩次 confirm、送出兩筆，第二筆把下一份教材也刪掉。
    // 遮罩擋住重複點擊，inFlight 再擋一次（confirm 會先卡住事件迴圈）。
    const inFlight = new Set();

    async function withBusy(key, text, sub, task) {
      if (inFlight.has(key)) return;
      inFlight.add(key);
      const done = (window.UIFeedback && UIFeedback.showBusy)
        ? UIFeedback.showBusy(text, sub)
        : function () {};
      try {
        return await task();
      } finally {
        done();
        inFlight.delete(key);
      }
    }

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg, type = '') {
      const t  = document.getElementById('toast');
      const ic = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      ic.className = 'ph ' + (type === 'error' ? 'ph-warning-circle' : type === 'success' ? 'ph-check-circle' : 'ph-info');
      t.className = 'toast show' + (type ? ' toast-' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
    }

    // ══════════════════════════════════════════════════════════════
    //  首頁（#homeView）：歡迎區 + 我的學習 + 學習路徑 + 模組卡片
    //  版面照原型「航海學苑」首頁，配色一律用 --apple-* / --brand
    // ══════════════════════════════════════════════════════════════

    // 首頁專屬樣式：只放 hover／transition／grid 這類無法 inline 的規則，
    // 類名一律 hm- 前綴避免與 screens.css 相撞。只注入一次。
    const HOME_CSS = '';  // 視覺統一由 <style> 的原型樣式表負責;

    function ensureHomeStyle() {
      if (document.getElementById('homeStyle')) return;
      const el = document.createElement('style');
      el.id = 'homeStyle';
      el.textContent = HOME_CSS;
      document.head.appendChild(el);
    }

    // ── 進度掃描 ──────────────────────────────────────────────────
    // 掃 localStorage 的 vp_<username>_<courseId>_<encodeURIComponent(fileName)>，
    // 取 lastViewed 最新、且課程與教材現在還存在的那一筆。
    // courseId 是純數字不含底線，所以從第一個 '_' 切開即可；切出來的
    // courseId / fileName 都要能在 allCourses 裡對上，才算有效（自我驗證）。
    function lastActivity() {
      const user = (currentUser && currentUser.username) || 'u';
      const prefix = `vp_${user}_`;
      let best = null;

      let n = 0;
      try { n = localStorage.length; } catch { return null; }

      for (let i = 0; i < n; i++) {
        let key = null;
        try { key = localStorage.key(i); } catch { continue; }
        if (!key || key.indexOf(prefix) !== 0) continue;

        const rest = key.slice(prefix.length);
        const cut = rest.indexOf('_');
        if (cut <= 0) continue;

        const courseId = rest.slice(0, cut);
        const raw = rest.slice(cut + 1);
        let fileName;
        try { fileName = decodeURIComponent(raw); } catch { fileName = raw; }

        const course = allCourses.find(c => String(c.id) === courseId);
        if (!course) continue;

        const mats = course.materials || [];
        const idx = mats.findIndex(m => m && m.fileName === fileName);
        if (idx < 0) continue;

        let prog = null;
        try { prog = JSON.parse(localStorage.getItem(key) || 'null'); } catch { prog = null; }
        if (!prog || !prog.lastViewed) continue;

        const time = Date.parse(prog.lastViewed);
        if (Number.isNaN(time)) continue;

        if (!best || time > best.time) {
          best = { course, matIdx: idx, mat: mats[idx], prog, time };
        }
      }
      return best;
    }

    // ── 小工具 ────────────────────────────────────────────────────
    function hmMatTitle(m) {
      if (!m) return '';
      const name = m.fileName || '未命名教材';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 模組卡說明：優先用 keywords，否則用 method / duration 組一句
    function hmCourseDesc(course) {
      const kw = (course.keywords || []).filter(k => typeof k === 'string' && k.trim());
      if (kw.length) return kw.slice(0, 6).join('・');
      const bits = [];
      // 時長一律交給 meta 列（由教材推估），這裡再寫一次 course.duration
      // 會變成同一張卡出現兩個對不起來的分鐘數
      if (course.method) bits.push(course.method);
      if (bits.length) return bits.join('・');
      return '這個模組尚未填寫課程說明。';
    }

    function hmCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 環形完成度（底圈＝淡灰、弧線＝主色）
    function hmRing(pct) {
      const v = Math.max(0, Math.min(100, Number(pct) || 0));
      return `<span class="hm-ring" style="--pct:${v}" aria-hidden="true"></span>`;
    }

    // ── 事件（id 只透過 data-* 傳遞，不拼進 onclick 字串） ──────────
    function hmOpenModule(el) {
      const id = el && el.dataset ? el.dataset.cid : null;
      if (id) openModule(id);
    }

    function hmOpenLesson(el) {
      if (!el || !el.dataset) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) openLesson(id, idx);
    }

    function hmKey(ev, el) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // 「前往我的學習」：有進度就直接進那門課，否則捲到學習路徑
    function hmGoLearning() {
      const act = lastActivity();
      if (act) { openModule(act.course.id); return; }
      document.getElementById('hmPaths')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── 區塊：歡迎 ────────────────────────────────────────────────
    function hmWelcomeHtml(heroCat) {
      const name = currentUser ? (typeof Auth !== 'undefined' ? Auth.displayName(currentUser) : currentUser.username) : '';
      const stats = pathStats(allCourses);
      const courseCount = allCourses.length;

      return `
      <div class="hm-wrap" style="padding:20px 20px 0">
        <div class="hm-hero" style="background:${a(catGrad(heroCat))}">
          <span class="hm-hero-icon" aria-hidden="true">${catIcon(heroCat)}</span>
        </div>
        <div class="hm-welcome">
          <h1>${h(Site.get('welcomeTitle'))}${Site.get('welcomeHighlight') ? `<em>${h(Site.get('welcomeHighlight'))}</em>` : ''}</h1>
          ${Site.get('welcomeBody') ? `<p>${h(Site.get('welcomeBody'))}</p>` : ''}
          <div class="hm-welcome-stats">
            <span><i class="ph ph-books" aria-hidden="true"></i>${courseCount} 門課程</span>
            <span><i class="ph ph-file-text" aria-hidden="true"></i>${stats.total} 份教材</span>
            <span><i class="ph ph-check-circle" aria-hidden="true"></i>已完成 ${stats.done} 份</span>
          </div>
        </div>
      </div>`;

    // ── 區塊：我的學習 ────────────────────────────────────────────
    function hmLearningHtml() {
      const act = lastActivity();

      // 沒有任何紀錄時，推薦第一個有教材的課程
      let course, matIdx, eyebrow;
      if (act) {
        course = act.course;
        matIdx = act.matIdx;
        eyebrow = `繼續上次學習：${h(hmMatTitle(act.mat))}`;
      } else {
        course = allCourses.find(c => (c.materials || []).length);
        if (!course) return '';                       // 連教材都沒有 → 整塊不渲染
        matIdx = 0;
        eyebrow = `推薦從這裡開始：${h(hmMatTitle((course.materials || [])[0]))}`;
      }

      const st = courseStats(course);
      const cat = catOf(course);
      const unitNo = Math.min(matIdx + 1, st.total || 1);
      const unitText = st.pct >= 100
        ? `全部 ${st.total} 個單元已完成`
        : `單元 ${unitNo} 進行中 · 共 ${st.total} 個單元`;

      return `
      <div class="hm-wrap" style="padding:44px 20px 0">
        <div class="hm-sec-head">
          <h2>我的學習</h2>
          <button type="button" class="btn btn-sm btn-soft u-pill" onclick="hmGoLearning()">
            前往我的學習<i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </div>
        <div class="hm-continue" role="button" tabindex="0"
          data-cid="${a(String(course.id))}" data-idx="${matIdx}"
          onclick="hmOpenLesson(this)" onkeydown="hmKey(event, this)"
          aria-label="${a((act ? '繼續上次學習：' : '開始學習：') + (course.name || ''))}">
          <div class="hm-continue-thumb" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-play" aria-hidden="true"><i class="ph ph-play"></i></span>
          </div>
          <div class="hm-continue-body">
            <div class="hm-eyebrow">${eyebrow}</div>
            <div class="hm-continue-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-prog-row">
              <span class="hm-prog-label">上課進度</span>
              <div class="hm-prog-track"><div class="hm-prog-fill" style="width:${st.pct}%"></div></div>
              <span class="hm-prog-pct">${st.pct}%</span>
              <span class="hm-prog-label">${unitText}</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    // ── 區塊：模組卡 ──────────────────────────────────────────────
    function hmCardHtml(course, n) {
      const cat = catOf(course);
      const st = courseStats(course);
      const empty  = st.total === 0;                   // 沒有教材
      // 一般學員：空課程鎖定不可點。管理員：一定可以點進去，否則教材全空時
      // 根本到不了模組頁，永遠看不到「上傳教材」按鈕。
      const locked = empty && !isAdmin;
      const mins = hmCourseMinutes(course);

      let metaIcon, metaText;
      if (empty && isAdmin) { metaIcon = 'ph-upload-simple'; metaText = '尚無教材 · 點此上傳'; }
      else if (locked)      { metaIcon = 'ph-lock-simple';   metaText = '尚未開放'; }
      else if (st.pct >= 100) { metaIcon = 'ph-check-circle'; metaText = `已完成 · ${st.total} 個單元`; }
      else                  { metaIcon = 'ph-clock';       metaText = mins ? `約 ${mins} 分鐘 · ${st.total} 個單元` : `${st.total} 個單元`; }

      const clickable = locked ? '' :
        ` role="button" tabindex="0" onclick="hmOpenModule(this)" onkeydown="hmKey(event, this)"`;

      return `
        <div class="hm-card${locked ? ' is-locked' : ''}" data-cid="${a(String(course.id))}"${clickable}>
          <div class="hm-cover" style="background:${a(catGrad(cat))}">
            ${catIcon(cat)}
            <span class="hm-badge">模組 ${n}</span>
            ${empty ? `<span class="hm-lock" aria-hidden="true"><i class="ph ${isAdmin ? 'ph-upload-simple' : 'ph-lock-simple'}"></i></span>` : ''}
            ${(!locked && st.pct > 0) ? `<div class="hm-cover-prog"><div style="width:${st.pct}%"></div></div>` : ''}
          </div>
          <div class="hm-card-body">
            <div class="hm-card-title">${h(course.name || '未命名課程')}</div>
            <div class="hm-card-desc">${h(hmCourseDesc(course))}</div>
            <div class="hm-card-meta">
              <i class="ph ${metaIcon}" aria-hidden="true"></i><span>${h(metaText)}</span>
            </div>
            ${tmCrewTagHtml(course)}
          </div>
        </div>`;
    }

    // ── 區塊：學習路徑（依分類分組，依選單管理的順序） ───────────────
    function hmPathsHtml() {
      const groups = new Map();
      allCourses.forEach(c => {
        const code = catOf(c);
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(c);
      });

      const codes = catOrder().filter(code => groups.has(code));
      // 選單管理裡沒有的分類碼（例如被刪掉的）也不要整組消失，排在最後
      groups.forEach((_, code) => { if (!codes.includes(code)) codes.push(code); });

      if (!codes.length) {
        return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2></div>
        <div class="hm-empty">
          <i class="ph ph-compass" aria-hidden="true"></i>
          目前還沒有任何課程資料。<br>${isAdmin
            ? '請先到「智慧派課」建立課程，課程會自動依分類排進這裡，再回來上傳教材。'
            : '課程建立後會自動依分類排進學習路徑。'}
        </div>
      </div>`;
      }

      const adminHint = isAdmin ? `
          <span class="hm-admin-hint"><i class="ph ph-shield-check" aria-hidden="true"></i>管理員：點任一模組即可上傳教材或新增互動單元</span>` : '';

      const paths = codes.map(code => {
        const list = groups.get(code);
        const st = pathStats(list);
        const cards = list.map((c, i) => hmCardHtml(c, i + 1)).join('');

        return `
        <section class="hm-path">
          <div class="hm-path-head">
            <div class="hm-path-cover" style="background:${a(catGrad(code))}">${catIcon(code)}</div>
            <div class="hm-path-text">
              <h3>${h(catName(code))}</h3>
              <p>共 ${list.length} 門課程 · ${st.total} 份教材${st.total ? `，已完成 ${st.done} 份` : '，尚未上傳教材'}。</p>
            </div>
            <div class="hm-path-pct">${hmRing(st.pct)}${st.pct}% 完成</div>
          </div>
          <div class="hm-tray">
            <div class="hm-grid">${cards}</div>
          </div>
        </section>`;
      }).join('');

      return `
      <div class="hm-wrap" id="hmPaths" style="padding:44px 20px 72px">
        <div class="hm-sec-head"><h2>學習路徑</h2>${adminHint}</div>
        ${paths}
      </div>`;
    }

    // ── 入口 ──────────────────────────────────────────────────────
    function renderHome() {

      host.innerHTML = tmPreviewBarHtml() + tmNoticeHtml() + hmWelcomeHtml(heroCat)
                     + tmHomeExtrasHtml() + hmLearningHtml() + hmPathsHtml();
