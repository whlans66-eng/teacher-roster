    // ══════════════════════════════════════════════════════════════
    //  課表、問卷、船員設定（同一頁，功能依角色不同）
    //
    //  這頁是管理者、教師、船員共用的同一頁。差別只在功能，而每個功能開給誰
    //  在「帳號管理 → 權限設定 → 教材頁功能」設定，後端也照同一張表檢查：
    //    schedule          我的課表
    //    comments          留言討論（模組頁）
    //    comments_moderate 刪除留言
    //    surveys_fill      填寫問卷
    //    surveys_manage    問卷管理（建立、開關、看結果）
    //    crew_settings     船員設定（公告、船員看得到哪些課、以船員身分預覽）
    //    ai                AI 助教
    //    materials_edit    上傳與編輯教材
    // ══════════════════════════════════════════════════════════════

    const SURVEY_STATUS = { draft: '草稿', active: '開放中', closed: '已關閉' };
    const QTYPES = [
      { v: 'radio',    t: '單選' },
      { v: 'checkbox', t: '複選' },
      { v: 'rating',   t: '評分' },
      { v: 'text',     t: '文字回答' }
    ];

    let md = null;               // 管理類資料（問卷含作答、船員設定），用到才載
    let mdLoading = null;
    let schedShowPast = false;

    function tabAllowed(v) {
      if (v === 'schedule') return Auth.can('schedule');
      if (v === 'surveys')  return Auth.can('surveys_fill') || Auth.can('surveys_manage');
      if (v === 'crewset')  return Auth.can('crew_settings');
      return v === 'home';
    }

    function openTab(v) {
      if (v === 'home' || !tabAllowed(v)) { goHome(); return; }
      activeCourseId = null; activeMatIdx = null;
      if (typeof closeAi === 'function') closeAi();
      setView(v); syncUrl(); renderExtraView(v);
    }

    function renderExtraView(v) {
      if (!tabAllowed(v)) { goHome(); return; }
      if (v === 'schedule') renderSchedule();
      if (v === 'surveys')  renderSurveys();
      if (v === 'crewset')  renderCrewset();
    }

    function openSurveyCount() {
      if (!Auth.can('surveys_fill')) return 0;
      const done = new Set(ld.myResponses.map(r => String(r.surveyId)));
      return ld.surveys.filter(s => s.status === 'active' && !done.has(String(s.id))).length;
    }

    // ── 子選單 ──
    function renderTopNav() {

      const items = [
        { v: 'home',     t: '學習路徑' },

        { v: 'surveys',  t: '問卷', badge: n },
        { v: 'crewset',  t: '船員設定' }
      ].filter(it => tabAllowed(it.v));
      nav.innerHTML = items.map(it => {
        const on = it.v === 'home' ? learnViews.includes(view) : view === it.v;
        return `<span class="topbar-nav-link${on ? ' is-on' : ''}" role="link" tabindex="0"
                  onclick="openTab('${it.v}')" onkeydown="if(event.key==='Enter')openTab('${it.v}')">${h(it.t)}${
                  it.badge ? `<span class="tm-nav-badge">${it.badge}</span>` : ''}</span>`;
      }).join('');
      const brand = document.getElementById('tmBrand');
      if (brand) brand.textContent = Auth.can('materials_edit') ? '教材管理' : '教材學習';
    }

    // ── 首頁加掛：預覽列、公告、接下來的課、待填問卷 ──
    function tmPreviewBarHtml() {
      if (!previewRank) return '';
      const who = previewRank === '__all__' ? '所有船員（不分職級）'
        : previewRank === '__none__' ? '尚未設定職級的船員'
        : Options.fullLabel('crewRank', previewRank) + ' 的船員';
      return `
      <div class="hm-wrap" style="padding:20px 20px 0">
        <div class="tm-banner tm-banner-blue">
          <i class="ph ph-eye" aria-hidden="true"></i>
          <div style="flex:1">正在以<strong>${h(who)}</strong>的身分預覽：課程、課表、留言都是他們實際看到的。預覽中不能修改教材。</div>
          <button type="button" class="btn btn-secondary btn-sm u-pill" onclick="tmStopPreview()">結束預覽</button>
        </div>
      </div>`;
    }

    function tmNoticeHtml() {
      const canEdit = Auth.can('crew_settings') && !previewRank;
      if (!ld.notice && !canEdit) return '';
      if (!ld.notice) {
        return `
      <div class="hm-wrap" style="padding:20px 20px 0">
        <button type="button" class="tm-notice-add" onclick="openTab('crewset')">
          <i class="ph ph-megaphone-simple" aria-hidden="true"></i>新增一則公告（所有人登入後都會先看到）</button>
      </div>`;
      }
      return `
      <div class="hm-wrap" style="padding:20px 20px 0">
        <div class="tm-banner tm-banner-amber">
          <i class="ph ph-megaphone-simple" aria-hidden="true"></i>
          <div style="flex:1;white-space:pre-line">${h(ld.notice)}</div>
          ${canEdit ? `<button type="button" class="btn btn-plain btn-sm" onclick="openTab('crewset')">編輯</button>` : ''}
        </div>
      </div>`;
    }

    function tmHomeExtrasHtml() {
      const parts = [];
      if (Auth.can('schedule')) {
        const next = tmUpcoming().slice(0, 3);
        if (next.length) {
          parts.push(`
          <div class="tm-strip">
            <div class="tm-strip-head"><h3>接下來的課</h3>
              <button type="button" class="btn btn-plain btn-sm" onclick="openTab('schedule')">看完整課表</button></div>
            ${next.map(tmSchedRowHtml).join('')}
          </div>`);
        }
      }
      const n = openSurveyCount();
      if (n) {
        parts.push(`
          <div class="tm-strip tm-strip-action" role="button" tabindex="0" onclick="openTab('surveys')"
               onkeydown="if(event.key==='Enter')openTab('surveys')">
            <i class="ph ph-clipboard-text" aria-hidden="true"></i>
            <div style="flex:1"><strong>有 ${n} 份問卷等你填寫</strong><div class="tm-sub" style="margin:2px 0 0">花幾分鐘告訴我們課上得怎麼樣</div></div>
            <i class="ph ph-caret-right" aria-hidden="true"></i>
          </div>`);
      }
      return parts.length ? `<div class="hm-wrap tm-extras" style="padding:36px 20px 0">${parts.join('')}</div>` : '';
    }

    /** 首頁課程卡上給「船員設定」的人看的標示：這門課船員看不看得到 */
    function tmCrewTagHtml(course) {
      const st = ld.crewSettings;
      if (!st || previewRank || !Auth.can('crew_settings')) return '';
      if (st.hiddenCourseIds.includes(String(course.id))) {
        return `<span class="tm-crewtag off"><i class="ph ph-eye-slash"></i>船員看不到</span>`;
      }
      const ranks = arr(course.targetRanks);
      if (st.courseMode === 'rank' && ranks.length) {
        return `<span class="tm-crewtag"><i class="ph ph-users"></i>限 ${ranks.length} 個職級</span>`;
      }
      return '';
    }

    // ══ 我的課表 ══
    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function tmSortedSessions() {
      return ld.assignments.filter(a => a.date)
        .slice().sort((x, y) => String(x.date).localeCompare(String(y.date)) || String(x.time || '').localeCompare(String(y.time || '')));
    }

    function tmUpcoming() {
      const today = todayKey();
      return tmSortedSessions().filter(a => String(a.date) >= today && !tmCancelled(a));
    }

    function tmCancelled(a) { return /cancel|取消/i.test(String(a.status || '')); }

    function tmDateLabel(date) {
      const d = new Date(date + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return String(date);
      const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
      return `${d.getMonth() + 1} 月 ${d.getDate()} 日（${wd}）`;
    }

    function tmSchedRowHtml(s) {
      const course = allCourses.find(c => String(c.id) === String(s.courseId));
      const name = (course && course.name) || s.name || '課程';
      const sub = [String(s.date) === todayKey() ? '今天' : tmDateLabel(s.date),
                   s.teacherName ? '講師 ' + s.teacherName : '', course && course.method ? course.method : '']
        .filter(Boolean).join(' · ');
      const open = course ? ` role="button" tabindex="0" onclick="openModule('${a(String(course.id))}')"
                              onkeydown="if(event.key==='Enter')openModule('${a(String(course.id))}')"` : '';
      return `
        <div class="tm-row${tmCancelled(s) ? ' is-cancelled' : ''}${course ? '' : ' is-static'}"${open}>
          <div class="tm-row-time">${h(s.time || '時間未定')}</div>
          <div class="tm-row-main">
            <div class="tm-row-title">${h(name)}</div>
            <div class="tm-row-sub">${h(sub)}</div>
          </div>
          ${tmCancelled(s) ? '<span class="tm-pill">已取消</span>' : (course ? '<i class="ph ph-caret-right" aria-hidden="true"></i>' : '')}
        </div>`;
    }

    function tmToggleSchedPast() { schedShowPast = !schedShowPast; renderSchedule(); }

    function renderSchedule() {
      const host = document.getElementById('scheduleView');
      const today = todayKey();
      const rows = tmSortedSessions().filter(a => schedShowPast || String(a.date) >= today);
      const byDate = new Map();
      rows.forEach(a => { if (!byDate.has(a.date)) byDate.set(a.date, []); byDate.get(a.date).push(a); });
      const intro = isCrew || previewRank
        ? '開放給你的課程接下來的上課時間；點一下進入課程看教材。'
        : '所有課程接下來的上課時間；點一下進入課程。';
      host.innerHTML = `
      ${tmPreviewBarHtml()}
      <div class="hm-wrap" style="padding:32px 20px 72px">
        <div class="hm-sec-head"><h2>我的課表</h2>
          <button type="button" class="btn btn-secondary btn-sm u-pill" onclick="tmToggleSchedPast()">
            ${schedShowPast ? '只看接下來的課' : '顯示已結束的課'}</button></div>
        <p class="tm-sub">${h(intro)}</p>
        ${byDate.size ? [...byDate.entries()].map(([date, list]) => `
          <div class="tm-day">
            <div class="tm-day-label${date === today ? ' is-today' : ''}">${h(tmDateLabel(date))}${date === today ? ' · 今天' : ''}</div>
            <div class="tm-list">${list.map(tmSchedRowHtml).join('')}</div>
          </div>`).join('')
          : `<div class="hm-empty"><i class="ph ph-calendar-blank" aria-hidden="true"></i>${
              schedShowPast ? '目前沒有任何排定的課。' : '接下來沒有排定的課。'}</div>`}
      </div>`;
    }

    // ══ 問卷 ══
    async function loadManage(force) {
      if (!Auth.can('surveys_manage') && !Auth.can('crew_settings')) return null;
      if (md && !force) return md;
      if (mdLoading) return mdLoading;
      mdLoading = Promise.all([api.learningManageData(), Options.ready()])
        .then(([d]) => { md = d; return md; })
        .catch(err => { showToast('讀取管理資料失敗：' + (err.message || '請稍後再試'), 'error'); return null; })
        .finally(() => { mdLoading = null; });
      return mdLoading;
    }

    function courseName(id) {
      if (id === '' || id == null) return '全體船員';
      const c = allCourses.find(x => String(x.id) === String(id)) || arr(md?.courses).find(x => String(x.id) === String(id));
      return c ? c.name : '課程（已刪除）';
    }

    function renderSurveys() {
      const host = document.getElementById('surveysView');
      const parts = [tmPreviewBarHtml(), `<div class="hm-wrap" style="padding:32px 20px 72px">`];
      if (Auth.can('surveys_fill')) parts.push(tmFillListHtml());
      if (Auth.can('surveys_manage') && !previewRank) {
        parts.push(tmManageListHtml());
        if (!md) loadManage().then(d => { if (d && view === 'surveys') renderSurveys(); });
      }
      parts.push('</div>');
      host.innerHTML = parts.join('');
    }

    function tmFillListHtml() {
      const done = new Map(ld.myResponses.map(r => [String(r.surveyId), r]));
      const list = ld.surveys.slice().sort((x, y) => (x.status === 'active' ? 0 : 1) - (y.status === 'active' ? 0 : 1));
      const rows = list.map(s => {
        const isDone = done.has(String(s.id));
        const open = s.status === 'active';
        const tpl = ld.templates.find(t => String(t.id) === String(s.templateId));
        let action;
        if (isDone) action = `<span class="tm-pill ok"><i class="ph ph-check"></i> 已填寫</span>`;
        else if (!open) action = `<span class="tm-pill">已關閉</span>`;
        else action = `<button type="button" class="btn btn-primary btn-sm u-pill" onclick="tmOpenFill('${a(String(s.id))}')">填寫問卷</button>`;
        return `
          <div class="tm-row is-static">
            <i class="ph ph-clipboard-text tm-row-icon" aria-hidden="true"></i>
            <div class="tm-row-main">
              <div class="tm-row-title">${h(s.title || tpl?.title || '問卷')}</div>
              <div class="tm-row-sub">${h(courseName(s.courseId))}${tpl?.questions?.length ? ' · ' + tpl.questions.length + ' 題' : ''}</div>
            </div>
            ${action}
          </div>`;
      }).join('');
      return `
        <section class="tm-section">
          <div class="hm-sec-head"><h2>待填問卷</h2></div>
          ${rows ? `<div class="tm-list">${rows}</div>`
                 : `<div class="hm-empty"><i class="ph ph-clipboard-text" aria-hidden="true"></i>目前沒有要填的問卷。</div>`}
        </section>`;
    }

    function tmManageListHtml() {
      const head = `
          <div class="hm-sec-head"><h2>問卷管理</h2>
            <button type="button" class="btn btn-primary btn-sm u-pill" onclick="tmEditSurvey(null)"><i class="ph ph-plus"></i> 新增問卷</button></div>
          <p class="tm-sub">開放中的問卷會出現在有「填寫問卷」功能的人的問卷頁；綁了課程的問卷，只有看得到那門課的船員會收到。</p>`;
      if (!md) return `<section class="tm-section">${head}<div class="hm-empty">讀取中…</div></section>`;
      const list = arr(md.surveys);
      if (!list.length) {
        return `<section class="tm-section">${head}
          <div class="hm-empty"><i class="ph ph-clipboard-text" aria-hidden="true"></i>還沒有問卷。按「新增問卷」建立第一份，例如課後滿意度調查。</div></section>`;
      }
      const total = md.crewCount || 0;
      return `<section class="tm-section">${head}
        <div class="tm-list">${list.map(s => `
          <div class="tm-row is-static">
            <span class="tm-status ${a(s.status)}">${h(SURVEY_STATUS[s.status] || s.status)}</span>
            <div class="tm-row-main">
              <div class="tm-row-title">${h(s.title)}</div>
              <div class="tm-row-sub">${h(courseName(s.courseId))} · ${s.questions.length} 題 · 已回覆 ${s.responseCount}${total ? ' / ' + total + ' 位船員' : ' 份'}</div>
            </div>
            <div class="tm-actions">
              <button type="button" class="btn btn-plain btn-sm" onclick="tmShowResults('${a(String(s.id))}')" ${s.responseCount ? '' : 'disabled'}>結果</button>
              <button type="button" class="btn btn-plain btn-sm" onclick="tmEditSurvey('${a(String(s.id))}')">編輯</button>
              <button type="button" class="btn btn-plain btn-sm" onclick="tmCopySurvey('${a(String(s.id))}')">複製</button>
              <button type="button" class="btn btn-plain btn-sm" style="color:var(--bad)" onclick="tmDeleteSurvey('${a(String(s.id))}')"
                      ${s.responseCount ? 'disabled title="已有回覆，不能刪除；不想再收回覆請改成已關閉"' : ''}>刪除</button>
            </div>
          </div>`).join('')}</div>
      </section>`;
    }

    // ── 對話框 ──
    function tmModal(html) {
      const ov = document.getElementById('tmOverlay');
      ov.innerHTML = `<div class="ed-modal" role="dialog" aria-modal="true">${html}</div>`;
      ov.classList.add('open');
      ov.onclick = e => { if (e.target === ov) tmCloseModal(); };
    }
    function tmCloseModal() {
      const ov = document.getElementById('tmOverlay');
      ov.classList.remove('open');
      ov.innerHTML = '';
      tmFill = null; svDraft = null;
    }

    // ── 填寫 ──
    let tmFill = null;      // { survey, template, answers }
    let tmSubmitting = false;

    function tmOpenFill(id) {
      const s = ld.surveys.find(x => String(x.id) === String(id));
      if (!s) return;
      const t = ld.templates.find(x => String(x.id) === String(s.templateId));
      const qs = arr(t?.questions);
      tmFill = { survey: s, questions: qs, answers: {} };
      tmModal(`
        <div class="ed-head"><div><h2>${h(s.title || t?.title || '問卷')}</h2>
          <div class="ed-head-sub">${h(courseName(s.courseId))}${t?.description ? ' · ' + h(t.description) : ''}</div></div>
          <button type="button" class="ed-close" onclick="tmCloseModal()" aria-label="關閉"><i class="ph ph-x"></i></button></div>
        <div class="ed-body">${qs.length ? qs.map(tmQuestionHtml).join('') : '<div class="ed-empty">這份問卷還沒有題目。</div>'}</div>
        <div class="ed-foot"><span class="ed-foot-left">標 * 的題目必填；送出後就不能再改。</span>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-secondary" onclick="tmCloseModal()">取消</button>
            <button type="button" class="btn btn-primary" id="tmFillSubmit" onclick="tmSubmitFill()" ${qs.length ? '' : 'disabled'}>送出</button>
          </div></div>`);
    }

    function tmQuestionHtml(q, i) {
      const label = `<div class="ed-label">${i + 1}. ${h(q.text || q.question || '')}${q.required ? ' <span style="color:var(--bad)">*</span>' : ''}</div>`;
      const type = String(q.type || 'text');
      if (type === 'radio' || type === 'checkbox') {
        return `<div class="ed-field">${label}<div class="tm-choices">${arr(q.options).map((o, k) => `
          <label class="tm-choice"><input type="${type}" name="tmq${i}" value="${a(o)}" onchange="tmAnswer(${i}, this)"> ${h(o)}</label>`).join('')}</div></div>`;
      }
      if (type === 'rating') {
        const max = q.max || 5;
        return `<div class="ed-field">${label}<div class="tm-rating">${Array.from({ length: max }, (_, k) => `
          <button type="button" class="tm-rate" data-q="${i}" data-v="${k + 1}" onclick="tmRate(this)">${k + 1}</button>`).join('')}</div></div>`;
      }
      return `<div class="ed-field">${label}<textarea class="input" rows="3" oninput="tmFill.answers[${i}] = this.value" placeholder="請輸入你的回答"></textarea></div>`;
    }

    function tmAnswer(i, el) {
      if (!tmFill) return;
      if (el.type === 'checkbox') {
        tmFill.answers[i] = [...document.querySelectorAll(`#tmOverlay input[name="tmq${i}"]:checked`)].map(x => x.value);
      } else {
        tmFill.answers[i] = el.value;
      }
    }

    function tmRate(btn) {
      const i = Number(btn.dataset.q);
      btn.parentElement.querySelectorAll('.tm-rate').forEach(b => b.classList.toggle('on', b === btn));
      tmFill.answers[i] = btn.dataset.v;
    }

    async function tmSubmitFill() {
      if (!tmFill || tmSubmitting) return;
      for (let i = 0; i < tmFill.questions.length; i++) {
        const v = tmFill.answers[i];
        if (tmFill.questions[i].required && (v === undefined || v === '' || (Array.isArray(v) && !v.length))) {
          showToast(`第 ${i + 1} 題是必填`, 'error'); return;
        }
      }
      const btn = document.getElementById('tmFillSubmit');
      tmSubmitting = true; btn.disabled = true; btn.textContent = '送出中…';
      try {
        const saved = await api.submitSurvey(tmFill.survey.id, { ...tmFill.answers });
        ld.myResponses = ld.myResponses.concat([saved]);
        tmCloseModal();
        showToast('問卷已送出，謝謝你的回覆', 'success');
        renderTopNav(); renderSurveys();
      } catch (err) {
        // 失敗就留在表單，作答還在
        showToast('送出失敗：' + (err.message || '請稍後再試'), 'error');
        btn.disabled = false; btn.textContent = '送出';
      } finally {
        tmSubmitting = false;
      }
    }

    // ── 建立／編輯 ──
    let svDraft = null;
    let svSaving = false;

    function tmEditSurvey(id) {
      const src = id ? arr(md?.surveys).find(s => String(s.id) === String(id)) : null;
      svDraft = src
        ? JSON.parse(JSON.stringify({ id: src.id, title: src.title, description: src.description, courseId: String(src.courseId ?? ''),
                                      status: src.status, questions: src.questions, responseCount: src.responseCount }))
        : { id: '', title: '', description: '', courseId: '', status: 'draft', responseCount: 0,
            questions: [{ type: 'rating', text: '整體來說，這門課對你有幫助嗎？', max: 5, required: true },
                        { type: 'text', text: '還有什麼想告訴我們的？', required: false }] };
      tmRenderEditor();
    }

    function tmCopySurvey(id) {
      tmEditSurvey(id);
      if (!svDraft) return;
      svDraft.id = ''; svDraft.responseCount = 0; svDraft.status = 'draft';
      svDraft.title = svDraft.title + '（複本）';
      tmRenderEditor();
    }

    function tmRenderEditor() {
      const d = svDraft;
      const locked = d.responseCount > 0;
      const courses = allCourses.slice().sort((x, y) => String(x.name).localeCompare(String(y.name), 'zh-Hant'));
      tmModal(`
        <div class="ed-head"><div><h2>${d.id ? '編輯問卷' : '新增問卷'}</h2>
          <div class="ed-head-sub">${locked ? `已有 ${d.responseCount} 份回覆：題目鎖定，標題、課程與狀態仍可修改` : '存成「開放中」，有填寫問卷功能的人就會看到'}</div></div>
          <button type="button" class="ed-close" onclick="tmCloseModal()" aria-label="關閉"><i class="ph ph-x"></i></button></div>
        <div class="ed-body">
          <div class="ed-row">
            <div class="ed-field" style="flex:2 1 260px"><label class="ed-label">問卷標題</label>
              <input class="input" value="${a(d.title)}" oninput="svDraft.title = this.value" placeholder="例如：進出港操船課後問卷"></div>
            <div class="ed-field"><label class="ed-label">狀態</label>
              <select class="input" onchange="svDraft.status = this.value">${Object.keys(SURVEY_STATUS).map(k =>
                `<option value="${k}" ${d.status === k ? 'selected' : ''}>${SURVEY_STATUS[k]}</option>`).join('')}</select></div>
          </div>
          <div class="ed-field"><label class="ed-label">發給誰</label>
            <select class="input" onchange="svDraft.courseId = this.value">
              <option value="" ${d.courseId === '' ? 'selected' : ''}>全體船員（不綁課程）</option>
              ${courses.map(c => `<option value="${a(String(c.id))}" ${String(c.id) === d.courseId ? 'selected' : ''}>上過「${h(c.name)}」的船員</option>`).join('')}
            </select>
            <div class="ed-hint">綁了課程的問卷，只有看得到那門課的船員會收到。</div></div>
          <div class="ed-field"><label class="ed-label">說明（選填）</label>
            <textarea class="input" rows="2" oninput="svDraft.description = this.value" placeholder="填寫前想先告訴對方的話">${h(d.description || '')}</textarea></div>
          ${locked ? `<div class="tm-banner tm-banner-amber" style="margin:0"><i class="ph ph-lock-simple"></i>
             <div style="flex:1">答案是用題號存的，有人作答後再改題目，舊答案就會對到錯的題。要調整題目請複製成新問卷。</div>
             <button type="button" class="btn btn-secondary btn-sm" onclick="tmCopySurvey('${a(String(d.id))}')">複製成新問卷</button></div>` : ''}
          <div class="ed-blocks">${d.questions.map((q, i) => tmQEditHtml(q, i, locked)).join('')}</div>
          ${locked ? '' : `<div class="ed-add-row">${QTYPES.map(t =>
            `<button type="button" class="btn btn-secondary btn-sm" onclick="tmAddQ('${t.v}')"><i class="ph ph-plus"></i> ${t.t}</button>`).join('')}</div>`}
        </div>
        <div class="ed-foot"><span class="ed-foot-left">${d.questions.length} 題</span>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-secondary" onclick="tmCloseModal()">取消</button>
            <button type="button" class="btn btn-primary" id="svSaveBtn" onclick="tmSaveSurvey()">儲存</button>
          </div></div>`);
    }

    function tmQEditHtml(q, i, locked) {
      const dis = locked ? 'disabled' : '';
      const n = svDraft.questions.length;
      const typeName = (QTYPES.find(t => t.v === q.type) || QTYPES[3]).t;
      let extra = '';
      if (q.type === 'radio' || q.type === 'checkbox') {
        extra = `<div class="ed-field"><label class="ed-label">選項（一行一個）</label>
          <textarea class="input" rows="3" ${dis} oninput="tmQOptions(${i}, this.value)">${h(q._optText ?? arr(q.options).join('\n'))}</textarea></div>`;
      } else if (q.type === 'rating') {
        extra = `<div class="ed-field" style="max-width:220px"><label class="ed-label">分數範圍</label>
          <select class="input" ${dis} onchange="svDraft.questions[${i}].max = Number(this.value)">${[3, 4, 5, 6, 7, 8, 9, 10].map(m =>
            `<option value="${m}" ${(q.max || 5) === m ? 'selected' : ''}>1 到 ${m} 分</option>`).join('')}</select></div>`;
      }
      return `
        <div class="ed-block">
          <div class="ed-block-head">
            <span class="ed-block-type">${h(typeName)}</span>
            <span class="ed-block-name">第 ${i + 1} 題</span>
            ${locked ? '' : `<div class="ed-block-tools">
              <button type="button" class="ed-icon-btn" onclick="tmMoveQ(${i}, -1)" ${i === 0 ? 'disabled' : ''} aria-label="上移"><i class="ph ph-arrow-up"></i></button>
              <button type="button" class="ed-icon-btn" onclick="tmMoveQ(${i}, 1)" ${i === n - 1 ? 'disabled' : ''} aria-label="下移"><i class="ph ph-arrow-down"></i></button>
              <button type="button" class="ed-icon-btn danger" onclick="tmRemoveQ(${i})" aria-label="刪除這題"><i class="ph ph-trash"></i></button></div>`}
          </div>
          <div class="ed-field"><input class="input" ${dis} value="${a(q.text || '')}" placeholder="題目" oninput="svDraft.questions[${i}].text = this.value"></div>
          ${extra}
          <label class="tm-choice" style="padding:0"><input type="checkbox" ${dis} ${q.required ? 'checked' : ''}
            onchange="svDraft.questions[${i}].required = this.checked"> 必填</label>
        </div>`;
    }

    function tmQOptions(i, text) {
      const q = svDraft.questions[i];
      q._optText = text;
      q.options = text.split('\n').map(x => x.trim()).filter(Boolean);
    }
    function tmAddQ(type) {
      const q = { type, text: '', required: false };
      if (type === 'radio' || type === 'checkbox') { q.options = ['選項一', '選項二']; }
      if (type === 'rating') q.max = 5;
      svDraft.questions.push(q);
      tmRenderEditor();
    }
    function tmMoveQ(i, dir) {
      const qs = svDraft.questions, j = i + dir;
      if (j < 0 || j >= qs.length) return;
      [qs[i], qs[j]] = [qs[j], qs[i]];
      tmRenderEditor();
    }
    function tmRemoveQ(i) {
      svDraft.questions.splice(i, 1);
      tmRenderEditor();
    }

    async function tmSaveSurvey() {
      if (!svDraft || svSaving) return;
      const d = svDraft;
      if (!String(d.title).trim()) { showToast('請輸入問卷標題', 'error'); return; }
      if (!d.questions.length) { showToast('問卷至少要有一題', 'error'); return; }
      const bad = d.questions.findIndex(q => !String(q.text || '').trim()
        || ((q.type === 'radio' || q.type === 'checkbox') && arr(q.options).length < 2));
      if (bad >= 0) { showToast(`第 ${bad + 1} 題沒有題目，或選項少於兩個`, 'error'); return; }
      const btn = document.getElementById('svSaveBtn');
      svSaving = true; btn.disabled = true; btn.textContent = '儲存中…';
      try {
        await api.saveCrewSurvey({
          id: d.id || undefined, title: d.title, description: d.description, courseId: d.courseId, status: d.status,
          questions: d.questions.map(q => {
            const o = { type: q.type, text: q.text, required: !!q.required };
            if (q.type === 'radio' || q.type === 'checkbox') o.options = arr(q.options);
            if (q.type === 'rating') o.max = q.max || 5;
            return o;
          })
        });
        tmCloseModal();
        showToast('問卷已儲存', 'success');
        await Promise.all([loadManage(true), loadLearning()]);
        if (view === 'surveys') renderSurveys();
      } catch (err) {
        showToast('儲存失敗：' + (err.message || '請稍後再試'), 'error');
        btn.disabled = false; btn.textContent = '儲存';
      } finally {
        svSaving = false;
      }
    }

    async function tmDeleteSurvey(id) {
      const s = arr(md?.surveys).find(x => String(x.id) === String(id));
      if (!s || !confirm(`刪除問卷「${s.title}」？刪除後無法復原。`)) return;
      try {
        await api.deleteCrewSurvey(id);
        showToast('問卷已刪除', 'success');
        await Promise.all([loadManage(true), loadLearning()]);
        if (view === 'surveys') renderSurveys();
      } catch (err) {
        showToast('刪除失敗：' + (err.message || '請稍後再試'), 'error');
      }
    }

    // ── 結果 ──
    function tmResponsesOf(id) {
      return arr(md?.responses).filter(r => String(r.surveyId) === String(id));
    }

    function tmShowResults(id) {
      const s = arr(md?.surveys).find(x => String(x.id) === String(id));
      if (!s) return;
      const rs = tmResponsesOf(id);
      const ans = (r, i) => { const v = r.answers && typeof r.answers === 'object' ? r.answers[i] : undefined; return v; };
      const bar = (label, n, total) => {
        const pct = total ? Math.round(n / total * 100) : 0;
        return `<div class="tm-bar"><span class="t">${h(label)}</span><span class="track"><span style="width:${pct}%"></span></span><span class="n">${n} · ${pct}%</span></div>`;
      };
      const blocks = s.questions.map((q, i) => {
        let body = '';
        if (q.type === 'radio' || q.type === 'checkbox') {
          const counts = arr(q.options).map(o => rs.filter(r => {
            const v = ans(r, i); return Array.isArray(v) ? v.includes(o) : v === o;
          }).length);
          body = arr(q.options).map((o, k) => bar(o, counts[k], rs.length)).join('');
        } else if (q.type === 'rating') {
          const vals = rs.map(r => Number(ans(r, i))).filter(v => v > 0);
          const avg = vals.length ? (vals.reduce((x, y) => x + y, 0) / vals.length).toFixed(1) : '—';
          const max = q.max || 5;
          body = `<div class="tm-big">${avg}<span> / ${max} 分（${vals.length} 人作答）</span></div>` +
            Array.from({ length: max }, (_, k) => max - k).map(v => bar(v + ' 分', vals.filter(x => x === v).length, vals.length)).join('');
        } else {
          const texts = rs.map(r => ({ r, v: String(ans(r, i) || '').trim() })).filter(x => x.v);
          body = texts.length ? texts.map(x => `<div class="tm-ans"><div>${h(x.v)}</div>
              <div class="tm-row-sub">${h(x.r.displayName || x.r.username || '')} · ${h(new Date(x.r.submittedAt).toLocaleString('zh-TW', { hour12: false }))}</div></div>`).join('')
            : '<div class="tm-row-sub">沒有人寫這一題。</div>';
        }
        return `<div class="ed-block"><div class="ed-label">${i + 1}. ${h(q.text)}</div>${body}</div>`;
      }).join('');
      tmModal(`
        <div class="ed-head"><div><h2>${h(s.title)} · 結果</h2>
          <div class="ed-head-sub">${h(courseName(s.courseId))} · 共 ${rs.length} 份回覆${md.crewCount ? '（船員共 ' + md.crewCount + ' 位）' : ''}</div></div>
          <button type="button" class="ed-close" onclick="tmCloseModal()" aria-label="關閉"><i class="ph ph-x"></i></button></div>
        <div class="ed-body">${blocks}</div>
        <div class="ed-foot"><span class="ed-foot-left">CSV 可以用 Excel 開</span>
          <button type="button" class="btn btn-secondary" onclick="tmExportCsv('${a(String(s.id))}')"><i class="ph ph-download-simple"></i> 下載 CSV</button></div>`);
    }

    function tmExportCsv(id) {
      const s = arr(md?.surveys).find(x => String(x.id) === String(id));
      if (!s) return;
      // 開頭是 = + - @ 的儲存格，Excel 會當公式執行；前面加 ' 讓它變回文字
      const cell = v => {
        let t = Array.isArray(v) ? v.join('、') : String(v ?? '');
        if (/^[=+\-@]/.test(t)) t = "'" + t;
        return '"' + t.replace(/"/g, '""') + '"';
      };
      const head = ['填寫人', '帳號', '填寫時間'].concat(s.questions.map((q, i) => `${i + 1}. ${q.text}`));
      const lines = [head.map(cell).join(',')].concat(tmResponsesOf(id).map(r =>
        [r.displayName, r.username, r.submittedAt].concat(s.questions.map((_, i) => (r.answers || {})[i])).map(cell).join(',')));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${s.title}-回覆.csv`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

            他們只看得到沒有設定適用職級的課。到「帳號管理」編輯帳號就能設定職級。</div></div>` : ''}
          <div class="tm-list" style="margin-top:12px">${courses.map(c => {

            const ranks = arr(c.targetRanks);

    // ══════════════════════════════════════════════════════════════
    //  模組頁（#moduleView）：課程 hero + 課程內容清單
    //  版面照原型「航海學苑」模組頁；類名用 screens.css 既有的 .mod-*，
    //  顏色一律 --apple-* / --brand，按鈕一律 shared/ui.css 的 .btn
    // ══════════════════════════════════════════════════════════════

    // 折疊狀態：預設展開（原型 acc = true）
    let mdlAcc = true;

    // screens.css 沒有的少數規則（admin 動作鈕的容器）才自己補，
    // 類名一律 mdl- 前綴，只注入一次。
    const MODULE_CSS = '';  // 視覺統一由 <style> 的原型樣式表負責;

    function ensureModuleStyle() {
      if (document.getElementById('moduleStyle')) return;
      const el = document.createElement('style');
      el.id = 'moduleStyle';
      el.textContent = MODULE_CSS;
      document.head.appendChild(el);
    }

    // ── 小工具 ────────────────────────────────────────────────────

    // 第一個未完成單元的索引；全部完成（或沒教材）回 0
    function mdlFirstUnfinished(course) {
      const mats = course.materials || [];
      const i = mats.findIndex(m => !matDone(course.id, m));
      return i < 0 ? 0 : i;
    }

    // 單元標題：互動型用 fileName 原樣，檔案型去掉副檔名
    function mdlUnitTitle(m) {
      const name = (m && m.fileName) || '未命名單元';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    // 單元說明
    // 互動型：取 blocks 第一個 text 區塊的 body 前 60 字；沒有就報區塊數量
    // 檔案型：型別 + 檔案大小 + 上傳日期
    function mdlUnitDesc(m) {
      if (isInteractive(m)) {
        const blocks = Array.isArray(m.blocks) ? m.blocks : [];
        const first = blocks.find(b => b && b.type === 'text' && b.body);
        if (first) {
          const flat = String(first.body).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        // 退而求其次：用 intro，再不行就報區塊數量
        const intro = blocks.find(b => b && b.intro);
        if (intro) {
          const flat = String(intro.intro).replace(/\s+/g, ' ').trim();
          return flat.length > 60 ? flat.slice(0, 60) + '…' : flat;
        }
        return blocks.length ? `互動教材，共 ${blocks.length} 個學習區塊。` : '互動教材尚未加入學習區塊。';
      }

      const bits = [`${matKind(m)} 教材`];
      const size = fmtSize(m.fileSize);
      if (size) bits.push(size);
      if (m.uploadedAt) {
        const d = new Date(m.uploadedAt);
        if (!Number.isNaN(d.getTime())) {
          bits.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} 上傳`);
        }
      }
      return bits.join(' · ');
    }

    // 型別 badge 的圖示
    function mdlKindIcon(m) {
      const kind = matKind(m);
      if (kind === '互動') return 'ph-code';
      if (kind === '影片') return 'ph-play';
      if (kind === '圖片') return 'ph-image';
      if (kind === 'PDF')  return fileStyle(m.fileName).icon;
      return 'ph-file-text';
    }

    // 時長：互動型用 estMinutes；檔案型用 fileSize 推估，推不出來就顯示副檔名
    function mdlDur(m) {
      const mins = Number(matMinutes(m)) || 0;
      if (mins) return { icon: 'ph-clock', text: `約 ${mins} 分鐘` };
      const ext = String((m && m.fileName) || '').split('.').pop().toUpperCase();
      if (ext && ext.length <= 8 && /^[A-Z0-9]+$/.test(ext)) return { icon: 'ph-paperclip', text: ext };
      return null;
    }

    // 課程總時長：教材時長加總，沒有就退回 course.duration
    function mdlCourseMinutes(course) {
      const mats = course.materials || [];
      const sum = mats.reduce((s, m) => s + (matMinutes(m) || 0), 0);
      return sum || Number(course.duration) || 0;
    }

    // 標籤 chips：第一顆是分類名（主色實底），其餘是 method 與 keywords 前幾個
    function mdlChipsHtml(course) {
      const cat = catOf(course);
      const rest = [];
      if (course.method && String(course.method).trim()) rest.push(String(course.method).trim());
      (Array.isArray(course.keywords) ? course.keywords : String(course.keywords || '').split(/[,，、\s]+/))
        .filter(k => typeof k === 'string' && k.trim())
        .slice(0, 4)
        .forEach(k => { if (!rest.includes(k.trim())) rest.push(k.trim()); });

      return `<div class="mod-chips">
            <span class="mod-chip primary">${h(catName(cat))}</span>
            ${rest.map(t => `<span class="mod-chip">${h(t)}</span>`).join('')}
          </div>`;
    }

    // ── 事件（id 與索引只透過 data-* 傳遞，不拼進 onclick 字串） ────

    function mdlUnitClick(el) {
      if (!el || !el.dataset) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) openLesson(id, idx);
    }

    function mdlUnitKey(ev, el) {
      // 焦點在內層的編輯／刪除鈕時不要攔；否則 Enter 會被改成「進入課程」
      const self = el || ev.currentTarget;
      if (ev.target !== self) return;
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // 「開始學習」→ 第一個未完成單元
    function mdlStart(el) {
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      const course = allCourses.find(c => String(c.id) === String(id));
      if (!course) return;
      if (!(course.materials || []).length) { showToast('這個模組還沒有任何單元', 'error'); return; }
      openLesson(course.id, mdlFirstUnfinished(course));
    }

    function mdlUpload(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      triggerUpload(id);
    }

    function mdlNewInteractive(el) {
      if (!isAdmin) return;
      const id = el && el.dataset ? el.dataset.cid : activeCourseId;
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      openEditor(id, null);
    }

    function mdlEdit(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (typeof openEditor !== 'function') { showToast('互動教材編輯器尚未載入', 'error'); return; }
      if (id && !Number.isNaN(idx)) openEditor(id, idx);
    }

    function mdlDelete(ev, el) {
      ev.stopPropagation();
      if (!isAdmin) return;
      const id = el.dataset.cid;
      const idx = Number(el.dataset.idx);
      if (id && !Number.isNaN(idx)) deleteMat(id, idx);
    }

    // 折疊標頭：切 mdlAcc 後整頁重繪（展開時才渲染單元列）
    function toggleAcc() {
      mdlAcc = !mdlAcc;
      const course = typeof activeCourse === 'function'
        ? activeCourse()
        : allCourses.find(c => String(c.id) === String(activeCourseId));
      if (course) renderModule(course);
    }

    // ── 區塊：hero 帶 ─────────────────────────────────────────────
    function mdlHeroHtml(course) {
      const cat = catOf(course);
      const st = courseStats(course);
      const mins = mdlCourseMinutes(course);
      const cid = a(String(course.id));

      const metaItems = [];
      if (mins) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-clock" aria-hidden="true"></i>約 ${mins} 分鐘</span>`);
      metaItems.push(`<span class="mod-meta-item"><i class="ph ph-book-open" aria-hidden="true"></i>${st.total} 個單元</span>`);
      if (st.total && st.done) metaItems.push(`<span class="mod-meta-item"><i class="ph ph-check-circle" aria-hidden="true"></i>已完成 ${st.done} / ${st.total}</span>`);

      // 課程資料沒有 description 欄位 → 用 method / keywords / 時數組一句
      const desc = mdlCourseDesc(course);

      const adminBox = isAdmin ? `
            <div class="mdl-admin">
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlUpload(this)">
                <i class="ph ph-upload-simple" aria-hidden="true"></i>上傳教材
              </button>
              <button type="button" class="btn btn-sm btn-secondary u-block"
                data-cid="${cid}" onclick="mdlNewInteractive(this)">
                <i class="ph ph-plus-circle" aria-hidden="true"></i>新增互動單元
              </button>
              <div class="mdl-admin-hint">支援 PDF／Word／PPT／影片／圖片，單檔 24 MB 以內</div>
            </div>` : '';

      return `
      <div class="mod-hero">
        <div class="mod-hero-in">
          <div class="mod-hero-main">
            <span class="mod-back" role="button" tabindex="0"
              onclick="goHome()" onkeydown="mdlUnitKey(event, this)">
              <i class="ph ph-caret-left" aria-hidden="true"></i>返回學習路徑
            </span>
            ${mdlChipsHtml(course)}
            <h1>${h(course.name || '未命名課程')}</h1>
            <p class="mod-desc">${h(desc)}</p>
            <div class="mod-meta">${metaItems.join('')}</div>
          </div>
          <div class="mod-cover-card">
            <div class="mod-cover" style="background:${a(catGrad(cat))}">
              <span class="cover-ph md" aria-hidden="true">${catIcon(cat)}</span>
            </div>
            <button type="button" class="btn btn-primary u-block"
              data-cid="${cid}" onclick="mdlStart(this)">
              <i class="ph ph-play" aria-hidden="true"></i>開始學習
            </button>
            ${adminBox}
          </div>
        </div>
      </div>`;
    }

    // 課程說明：後端沒有 description 欄位，用現有欄位組一句
    function mdlCourseDesc(course) {
      const kw = (Array.isArray(course.keywords) ? course.keywords : [])
        .filter(k => typeof k === 'string' && k.trim());
      const bits = [];
      if (course.method) bits.push(`授課方式：${String(course.method).trim()}`);
      if (kw.length) bits.push(`重點主題：${kw.slice(0, 6).join('、')}`);
      if (bits.length) return bits.join('　');
      if (course.duration) return `本模組規劃課程時數 ${course.duration} 分鐘，請依序完成下列單元。`;
      return '這個模組尚未填寫課程說明，請依序完成下列單元。';
    }

    // ── 區塊：單元列 ──────────────────────────────────────────────
    function mdlUnitHtml(course, m, idx, currentIdx) {
      const cid = a(String(course.id));
      const done = matDone(course.id, m);
      const current = !done && idx === currentIdx;

      let dotCls, dotInner;
      if (done)         { dotCls = 'done';    dotInner = '<i class="ph ph-check" aria-hidden="true"></i>'; }
      else if (current) { dotCls = 'current'; dotInner = '<i class="ph ph-play" aria-hidden="true"></i>'; }
      else              { dotCls = 'todo';    dotInner = ''; }

      const dur = mdlDur(m);
      const acts = isAdmin ? `
              <span class="mdl-acts">
                ${isInteractive(m) ? `<button type="button" class="btn btn-icon btn-sm btn-plain"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlEdit(event, this)"
                  title="編輯互動教材" aria-label="編輯互動教材">
                  <i class="ph ph-pencil-simple" aria-hidden="true"></i>
                </button>` : ''}
                <button type="button" class="btn btn-icon btn-sm btn-danger"
                  data-cid="${cid}" data-idx="${idx}" onclick="mdlDelete(event, this)"
                  title="移除此單元" aria-label="移除此單元">
                  <i class="ph ph-trash" aria-hidden="true"></i>
                </button>
              </span>` : '';

      const status = done ? '已完成' : current ? '進行中' : '未開始';

      return `
          <div class="mod-unit" role="button" tabindex="0"
            data-cid="${cid}" data-idx="${idx}"
            onclick="mdlUnitClick(this)" onkeydown="mdlUnitKey(event, this)"
            aria-label="${a(`單元 ${idx + 1}：${mdlUnitTitle(m)}（${status}）`)}">
            <span class="mod-dot ${dotCls}" aria-hidden="true">${dotInner}</span>
            <div class="mod-unit-main">
              <div class="mod-unit-head">
                <span class="mod-unit-title">${h(mdlUnitTitle(m))}</span>
              </div>
              <div class="mod-unit-desc">${h(mdlUnitDesc(m))}</div>
            </div>
            <div class="mod-unit-meta">
              <span class="mod-type"><i class="ph ${a(mdlKindIcon(m))}" aria-hidden="true"></i>${h(matKind(m))}</span>
              ${dur ? `<span class="mod-dur"><i class="ph ${a(dur.icon)}" aria-hidden="true"></i>${h(dur.text)}</span>` : ''}
              ${acts}
            </div>
          </div>`;
    }

    // ── 區塊：課程內容清單 ────────────────────────────────────────
    function mdlBodyHtml(course) {
      const mats = course.materials || [];
      const currentIdx = mdlFirstUnfinished(course);

      let inner;
      if (!mats.length) {
        inner = `
          <div class="mod-list-empty">
            這個模組還沒有任何單元。<br>
            ${isAdmin ? '可用右上的「上傳教材」或「新增互動單元」開始建立課程內容。' : '教材準備好之後就會出現在這裡。'}
          </div>`;
      } else if (!mdlAcc) {
        inner = '';
      } else {
        inner = mats.map((m, i) => mdlUnitHtml(course, m, i, currentIdx)).join('');
      }

      return `
      <div class="mod-body">
        <h2>課程內容</h2>
        <div class="mod-list">
          <button type="button" class="mod-acc${mdlAcc ? ' open' : ''}"
            onclick="toggleAcc()" aria-expanded="${mdlAcc ? 'true' : 'false'}">
            <span class="mod-acc-left">
              <span class="mod-acc-caret" aria-hidden="true"><i class="ph ph-caret-right"></i></span>
              <span class="mod-acc-title">${h(course.name || '課程單元')}</span>
            </span>
            <span class="mod-acc-count">${mats.length} 個單元</span>
          </button>
          ${inner}
        </div>
        ${mdlCommentsHtml(course)}
      </div>`;
    }

    // ── 留言討論（課程層級，後端 comments 表）──
    function mdlComments(courseId) {
      return tmComments
        .filter(c => String(c.courseId) === String(courseId))
        .sort((x, y) => new Date(x.createdAt || x.timestamp || 0) - new Date(y.createdAt || y.timestamp || 0));
    }

    function mdlCommentsHtml(course) {
      if (!Auth.can('comments')) return '';
      const canDelete = Auth.can('comments_moderate') && !previewRank;
      const list = mdlComments(course.id);
      const rows = list.length
        ? list.map(c => {
            const init = (c.author || '?').charAt(0).toUpperCase();
            const ts = c.createdAt || c.timestamp;
            const time = ts
              ? new Date(ts).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
              : '';
            return `
              <div class="mod-cmt-row">
                <div class="mod-cmt-ava">${h(init)}</div>
                <div class="mod-cmt-body">
                  <div class="mod-cmt-meta">
                    <span class="mod-cmt-author">${h(c.author || '匿名')}</span>
                    <span class="mod-cmt-time">${h(time)}</span>
                    ${canDelete ? `<button type="button" class="tm-cmt-del" data-id="${a(String(c.id))}"
                       onclick="tmDeleteComment(this)" aria-label="刪除這則留言"><i class="ph ph-trash"></i></button>` : ''}
                  </div>
                  <div class="mod-cmt-text">${nl2br(c.content || '')}</div>
                </div>
              </div>`;
          }).join('')
        : `<div class="mod-cmt-empty">還沒有人留言，成為第一個發問的人。</div>`;

      return `
        <h2 style="margin-top:36px">留言討論</h2>
        <div class="mod-cmt-wrap">
          <div class="mod-cmt-list">${rows}</div>
          <div class="mod-cmt-compose">
            <textarea class="input mod-cmt-input" id="mdlCommentInput" rows="3"
              placeholder="對這個模組有疑問或心得？寫在這裡…"></textarea>
            <button type="button" class="btn btn-sm btn-primary"
              data-cid="${a(course.id)}" onclick="mdlPostComment(this)">送出</button>
          </div>
        </div>`;
    }

    let postingComment = false;

    async function mdlPostComment(el) {
      if (postingComment) return;
      const courseId = el?.dataset?.cid;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      const input = document.getElementById('mdlCommentInput');
      const content = (input?.value || '').trim();
      if (!content) { showToast('請輸入留言內容', 'error'); return; }

      postingComment = true;
      el.disabled = true;
      try {
        // 作者由後端以登入身分認定
        const saved = await api.addComment(course.id, content);
        tmComments = tmComments.concat([saved]);
        ld.comments = tmComments;
        renderModule(course);
        showToast('留言已送出', 'success');
      } catch (err) {
        // 失敗就留著打好的字
        showToast('留言失敗：' + (err.message || '請稍後再試'), 'error');
        el.disabled = false;
      } finally {
        postingComment = false;
      }
    }

    // ── 入口 ──────────────────────────────────────────────────────
    function renderModule(course) {
      const host = document.getElementById('moduleView');
      if (!host) return;
      if (!course) { goHome(); return; }
      ensureModuleStyle();
      host.innerHTML = mdlHeroHtml(course) + mdlBodyHtml(course);
    }

    // ══════════════════════════════════════════════════════════════
    //  課程頁（#lessonView）：麵包屑列 + 內容欄（max 760px）+ 互動元件 + 下一課
    //  版面照原型「航海學苑」課程頁；類名沿用 screens.css 的 .les-* / .blk-*
    //  配色只用 --apple-* / --brand / --ui-*，不新增色票、不新增按鈕樣式
    // ══════════════════════════════════════════════════════════════

    // 檔案型教材的播放／預覽框 screens.css 沒有對應類名（那邊只負責 .les-* 與 .blk-*），
    // 這裡補一份最小樣式，類名一律 ls- 前綴避免相撞。只注入一次。
    const LESSON_CSS = '';  // 視覺統一由 <style> 的原型樣式表負責;

    function ensureLessonStyle() {
      if (document.getElementById('lessonStyle')) return;
      const el = document.createElement('style');
      el.id = 'lessonStyle';
      el.textContent = LESSON_CSS;
      document.head.appendChild(el);
    }

    // ── 互動狀態 ──────────────────────────────────────────────────
    // 模組層級，key 是「blocks 的索引」。切單元（courseId#idx 變了）就整包丟掉重建；
    // 同一單元的重新渲染（例如後端同步完）會保留使用者已經按到哪裡。
    let lessonState = {};
    let lessonStateKey = null;
    let lessonVideoSaveAt = 0;     // 影片進度節流用的時間戳

    // ── 小工具 ────────────────────────────────────────────────────
    function lsCurMat() {
      const c = activeCourse();
      if (!c) return null;
      return (c.materials || [])[activeMatIdx] || null;
    }

    function lsUnitTitle(m) {
      if (!m) return '未命名單元';
      const name = m.fileName || '未命名單元';
      if (isInteractive(m)) return name;
      return name.replace(/\.[^.\s]{1,8}$/, '') || name;
    }

    function lsBlocks(m) {
      return (m && Array.isArray(m.blocks)) ? m.blocks.filter(b => b && typeof b === 'object') : [];
    }

    function lsGoModule() {
      if (activeCourseId) openModule(activeCourseId);
      else goHome();
    }

    // 上／下一課：只靠全域 activeCourseId / activeMatIdx，不把 id 拼進 onclick
    function lsGo(delta) {
      const c = activeCourse();
      if (!c) { goHome(); return; }
      const next = Number(activeMatIdx) + Number(delta);
      if (!(c.materials || [])[next]) return;
      openLesson(c.id, next);
    }

    // 最後一課：標記完成後回模組頁
    function lsFinish() {
      const c = activeCourse();
      const m = lsCurMat();
      if (c && m) saveProgress(c.id, m.fileName, { completed: true });
      showToast('已完成本模組', 'success');
      if (c) openModule(c.id); else goHome();
    }

    function lsToggleAi() {
      if (typeof toggleAi === 'function') toggleAi();
    }

    function lsKey(ev, el) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      (el || ev.currentTarget).click();
    }

    // ── 麵包屑列 ──────────────────────────────────────────────────
    function lsBarHtml(course, m) {
      const mins = Number(matMinutes(m)) || 0;
      const ai = (typeof canUseAi === 'function' && canUseAi())
        ? `<button type="button" class="btn btn-sm btn-secondary u-pill" onclick="lsToggleAi()"
              title="AI 助教" aria-label="開啟 AI 助教">
              <i class="ph ph-sparkle" aria-hidden="true"></i><span class="brand-sub">AI 助教</span>
            </button>`
        : '';

      return `
      <div class="les-bar">
        <div class="les-bar-left">
          <span class="les-brand" role="link" tabindex="0"
            onclick="goHome()" onkeydown="lsKey(event, this)">${Auth.can('materials_edit') ? '教材管理' : '教材學習'}</span>
          <span class="les-sep" aria-hidden="true"></span>
          <nav class="les-crumb" aria-label="麵包屑">
            <span class="les-crumb-link" role="link" tabindex="0"
              onclick="lsGoModule()" onkeydown="lsKey(event, this)">${h(course.name || '未命名課程')}</span>
            <span aria-hidden="true">/</span>
            <span class="les-crumb-cur" title="${a(lsUnitTitle(m))}">${h(lsUnitTitle(m))}</span>
            ${mins ? `<span class="les-crumb-min">· ${mins} 分鐘</span>` : ''}
          </nav>
        </div>
        <div class="les-bar-right">${ai}</div>
      </div>`;
    }

    // ── 底部導覽 ──────────────────────────────────────────────────
    function lsNavHtml(course, idx) {
      const mats = course.materials || [];
      const hasPrev = idx > 0;
      const hasNext = !!mats[idx + 1];

      const prev = hasPrev
        ? `<span class="les-nav-prev" role="link" tabindex="0"
              onclick="lsGo(-1)" onkeydown="lsKey(event, this)">‹ 上一課</span>`
        : `<span class="les-nav-prev off" aria-disabled="true">‹ 上一課</span>`;

      const next = hasNext
        ? `<button type="button" class="btn btn-sm btn-primary u-pill" onclick="lsGo(1)">
              下一課<i class="ph ph-caret-right" aria-hidden="true"></i>
            </button>`
        : `<button type="button" class="btn btn-sm btn-primary u-pill" onclick="lsFinish()">
              <i class="ph ph-check" aria-hidden="true"></i>完成本模組
            </button>`;

      return `<div class="les-nav">${prev}<span class="les-nav-spacer"></span>${next}</div>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  檔案型教材
    // ══════════════════════════════════════════════════════════════

    function lsMediaHeadHtml(m) {
      const size = fmtSize(m.fileSize);
      const url = m.fileUrl || '';
      const open = url
        ? `<a class="btn btn-sm btn-plain" href="${a(url)}" target="_blank" rel="noopener noreferrer">
              <i class="ph ph-arrow-square-out" aria-hidden="true"></i>另開
            </a>`
        : '';
      return `
        <div class="ls-media-head">
          <span class="ls-media-title">${h(lsUnitTitle(m))}</span>
          <span class="ls-media-meta">
            <span><i class="ph ${a(fileStyle(m.fileName).icon)}" aria-hidden="true"></i>${h(matKind(m))}</span>
            ${size ? `<span>${h(size)}</span>` : ''}
            ${open}
          </span>
        </div>`;
    }

    function lsFallbackHtml(m, msg) {
      const url = m.fileUrl || '';
      return `
        <div class="ls-fallback">
          <i class="ph ph-cloud-slash" aria-hidden="true"></i>
          <p>${h(msg)}</p>
          ${url ? `<a class="btn btn-sm btn-secondary u-pill" href="${a(url)}"
                target="_blank" rel="noopener noreferrer">
                <i class="ph ph-download-simple" aria-hidden="true"></i>下載原始檔案
              </a>` : ''}
        </div>`;
    }

    function lsFileHtml(course, m) {
      const ext = (m.fileName || '').split('.').pop().toLowerCase();
      const preview = drivePreview(m);
      let inner;

      if (isVideo(m.fileName)) {
        // 本機／dataUrl 影片才能用 <video>（可追蹤 timeupdate 進度）；
        // Drive 上的影片只能靠 iframe 預覽，沒有可讀的播放事件。
        const src = m.dataUrl || '';
        if (src) {
          inner = `<video class="ls-video" controls preload="metadata" playsinline
              src="${a(src)}" ontimeupdate="lsVideoTime(this)" onended="lsVideoEnd(this)"></video>`;
        } else if (preview) {
          inner = `<iframe class="ls-frame" src="${a(preview)}" title="${a(lsUnitTitle(m))}"
              allow="autoplay" allowfullscreen loading="lazy"></iframe>`;
        } else {
          inner = lsFallbackHtml(m, '這個影片沒有可預覽的來源。');
        }
      } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
        const src = m.dataUrl || driveImage(m) || m.fileUrl || '';
        inner = src
          ? `<img class="ls-img" src="${a(src)}" alt="${a(lsUnitTitle(m))}" loading="lazy">`
          : lsFallbackHtml(m, '這張圖片沒有可預覽的來源。');
      } else if (preview) {
        // PDF 與 Office 文件都走 Drive 的 /preview
        inner = `<iframe class="ls-frame" src="${a(preview)}" title="${a(lsUnitTitle(m))}"
            allowfullscreen loading="lazy"></iframe>`;
      } else if (m.fileUrl && ext === 'pdf') {
        inner = `<iframe class="ls-frame" src="${a(m.fileUrl)}" title="${a(lsUnitTitle(m))}"
            allowfullscreen loading="lazy"></iframe>`;
      } else {
        inner = lsFallbackHtml(m, '這個教材沒有可直接預覽的格式，請下載後開啟。');
      }

      return `<div class="ls-media">${lsMediaHeadHtml(m)}${inner}</div>`;
    }

    // 影片進度：每 5 秒寫一次，看完 92% 以上就算完成
    function lsVideoTime(el) {
      const c = activeCourse();
      const m = lsCurMat();
      if (!c || !m || !el || !el.duration) return;

      const now = Date.now();
      if (now - lessonVideoSaveAt < 5000) return;
      lessonVideoSaveAt = now;

      const pct = Math.round(el.currentTime / el.duration * 100);
      const data = { viewed: true, pos: Math.floor(el.currentTime), pct };
      // 看到幾 % 算完成：帳號管理 → 系統設定
      if (pct >= (Number(Site.get('videoCompletePct')) || 92)) data.completed = true;
      saveProgress(c.id, m.fileName, data);
    }

    function lsVideoEnd() {
      const c = activeCourse();
      const m = lsCurMat();
      if (!c || !m) return;
      saveProgress(c.id, m.fileName, { viewed: true, completed: true, pct: 100 });
      showToast('已看完這個單元', 'success');
    }

    // ══════════════════════════════════════════════════════════════
    //  互動型教材：區塊卡外殼
    // ══════════════════════════════════════════════════════════════

    // tracks 會過濾掉沒有節點的路線。渲染出的 data-t 索引與點擊時解析的索引
    // 必須來自同一份陣列，否則兩套索引錯開 → 點第 N 條會跑到別條線。
    // 注意：編輯器（ed*）要的是未過濾的原始陣列，不可共用這支。
    function lsTracks(b) {
      return (b && Array.isArray(b.tracks) ? b.tracks : [])
        .filter(t => t && Array.isArray(t.nodes) && t.nodes.length);
    }

    function lsInitState(b) {
      if (!b) return {};
      if (b.type === 'tabs') return { activeTab: 0 };
      if (b.type === 'ladder') {
      const tracks = lsTracks(b);
        const nodes = (tracks[0] && Array.isArray(tracks[0].nodes)) ? tracks[0].nodes : [];
        // 原型刻意預選第 4 個節點，讓「已過」與「未到」兩種樣式一開場就同時出現
        return { trackIdx: 0, nodeIdx: Math.max(0, Math.min(3, nodes.length - 1)) };
      }
      if (b.type === 'order') {
        const items = Array.isArray(b.items) ? b.items : [];
        return { order: lsShuffle(items.length), sel: null, checked: null, dragFrom: null };
      }
      return {};
    }

    // 打亂，但保證開場一定不是正解（長度 < 2 時無解可打亂，直接回傳）
    function lsShuffle(n) {
      const base = [];
      for (let i = 0; i < n; i++) base.push(i);
      if (n < 2) return base;

      let out;
      let guard = 0;
      do {
        out = base.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = out[i]; out[i] = out[j]; out[j] = t;
        }
        guard++;
      } while (guard < 50 && out.every((v, i) => v === i));
      return out;
    }

    function lsState(bi, b) {
      if (!lessonState[bi]) lessonState[bi] = lsInitState(b);
      return lessonState[bi];
    }

    function lsResetBlock(bi) {
      const m = lsCurMat();
      const b = lsBlocks(m)[bi];
      if (!b) return;
      lessonState[bi] = lsInitState(b);
      if (b.type === 'tabs')   lsTabsApply(bi, b);
      if (b.type === 'ladder') lsLadderApply(bi, b);
      if (b.type === 'order')  lsOrderApply(bi, b);
    }

    function lsHeadHtml(b) {
      const mins = Number(b.minutes) || 0;
      return `
        <div class="blk-head">
          <h2>${h(b.title || '未命名段落')}</h2>
          ${mins ? `<span class="blk-min"><i class="ph ph-play" aria-hidden="true"></i>${mins} 分鐘</span>` : ''}
        </div>`;
    }

    function lsResetBtnHtml(bi, label) {
      return `<button type="button" class="blk-reset" onclick="lsResetBlock(${Number(bi)})"
          title="${a(label)}" aria-label="${a(label)}">
          <i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>
        </button>`;
    }

    function lsBlockHtml(b, bi) {
      lsState(bi, b);
      let body;
      if (b.type === 'text')        body = lsTextHtml(b);
      else if (b.type === 'tabs')   body = lsTabsHtml(b, bi);
      else if (b.type === 'ladder') body = lsLadderHtml(b, bi);
      else if (b.type === 'order')  body = lsOrderHtml(b, bi);
      else return '';
      return `<section class="blk" id="lsBlock${Number(bi)}">${lsHeadHtml(b)}${body}</section>`;
    }

    // ── type:'text' ───────────────────────────────────────────────
    // .blk-body 是 white-space:pre-wrap，所以 body 只要跳脫、換行會自己保留
    function lsTextHtml(b) {
      return `<p class="blk-body">${h(b.body || '')}</p>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  1. type:'tabs' — 部門分頁
    // ══════════════════════════════════════════════════════════════

    function lsTabPaneInner(b, ti) {
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      const t = tabs[ti] || {};
      const chips = (Array.isArray(t.chips) ? t.chips : []).filter(s => typeof s === 'string' && s.trim());
      return `
            ${t.eyebrow ? `<span class="blk-eyebrow">${h(t.eyebrow)}</span>` : ''}
            ${t.headline ? `<div class="blk-headline">${h(t.headline)}</div>` : ''}
            ${chips.length ? `<div class="blk-chips">${chips.map(s => `<span class="blk-chip">${h(s)}</span>`).join('')}</div>` : ''}
            ${t.desc ? `<p class="blk-desc">${h(t.desc)}</p>` : ''}
            ${t.summary ? `<div class="blk-summary">${h(t.summary)}</div>` : ''}`;
    }

    function lsTabsHtml(b, bi) {
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      if (!tabs.length) return lsIntroHtml(b);
      const st = lsState(bi, b);
      const n = tabs.length;

      const btns = tabs.map((t, i) => `
            <button type="button" class="blk-tab${i === st.activeTab ? ' active' : ''}"
              id="lsTab${Number(bi)}-${i}" role="tab" data-i="${i}"
              aria-selected="${i === st.activeTab ? 'true' : 'false'}"
              aria-controls="lsTabPane${Number(bi)}" tabindex="${i === st.activeTab ? 0 : -1}"
              onclick="lsTabPick(${Number(bi)}, ${i})"
              onkeydown="lsTabKey(event, ${Number(bi)}, ${i})">${h(t && t.label || '分頁 ' + (i + 1))}</button>`).join('');

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重設')}
          <div class="blk-tabs${n > 4 ? ' many' : ''}" id="lsTabs${Number(bi)}"
            style="--tab-n:${n}" role="tablist" aria-label="${a(b.title || '分頁')}">${btns}
          </div>
          <div class="blk-card" id="lsTabPane${Number(bi)}" role="tabpanel"
            aria-labelledby="lsTab${Number(bi)}-${st.activeTab}">${lsTabPaneInner(b, st.activeTab)}
          </div>
        </div>`;
    }

    function lsIntroHtml(b) {
      return b.intro ? `<p class="blk-intro">${h(b.intro)}</p>` : '';
    }

    function lsTabsApply(bi, b) {
      const st = lessonState[bi] || {};
      const root = document.getElementById('lsTabs' + bi);
      if (root) {
        root.querySelectorAll('.blk-tab').forEach(el => {
          const on = Number(el.dataset.i) === st.activeTab;
          el.classList.toggle('active', on);
          el.setAttribute('aria-selected', on ? 'true' : 'false');
          el.tabIndex = on ? 0 : -1;
        });
      }
      const pane = document.getElementById('lsTabPane' + bi);
      if (pane) {
        pane.innerHTML = lsTabPaneInner(b, st.activeTab);
        pane.setAttribute('aria-labelledby', 'lsTab' + bi + '-' + st.activeTab);
      }
    }

    function lsTabPick(bi, ti) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tabs = Array.isArray(b.tabs) ? b.tabs : [];
      if (!tabs[ti]) return;
      lsState(bi, b).activeTab = Number(ti);
      lsTabsApply(bi, b);
    }

    function lsTabKey(ev, bi, ti) {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const n = (Array.isArray(b.tabs) ? b.tabs : []).length;
      if (n < 2) return;
      ev.preventDefault();
      const next = (Number(ti) + (ev.key === 'ArrowRight' ? 1 : -1) + n) % n;
      lsTabPick(bi, next);
      document.getElementById('lsTab' + bi + '-' + next)?.focus();
    }

    // ══════════════════════════════════════════════════════════════
    //  2. type:'ladder' — 職級階梯
    // ══════════════════════════════════════════════════════════════

    function lsLadderDetailInner(b, st) {
      const tracks = lsTracks(b);
      const track = tracks[st.trackIdx] || {};
      const nodes = Array.isArray(track.nodes) ? track.nodes : [];
      const node = nodes[st.nodeIdx] || {};
      const next = nodes[st.nodeIdx + 1];
      return `
            <div class="blk-detail-top">
              <span class="blk-detail-eyebrow">${h(track.name || '路線')} · 第 ${Number(st.nodeIdx) + 1} 級</span>
              ${node.level ? `<span class="blk-level">${h(node.level)}</span>` : ''}
            </div>
            <div class="blk-detail-title">${h(node.label || '未命名職級')}</div>
            ${node.desc ? `<p class="blk-desc">${h(node.desc)}</p>` : ''}
            <div class="blk-detail-next">${next ? '下一級 → ' + h(next.label || '') : '這是這條路線的最高職務。'}</div>`;
    }

    function lsLadderHtml(b, bi) {
      const tracks = lsTracks(b);
      if (!tracks.length) return lsIntroHtml(b);
      const st = lsState(bi, b);
      if (!tracks[st.trackIdx]) { st.trackIdx = 0; st.nodeIdx = 0; }

      const rows = tracks.map((t, ti) => {
        const nodes = t.nodes;
        const dots = nodes.map((nd, ni) => {
          const active = ti === st.trackIdx && ni === st.nodeIdx;
          const past   = ti === st.trackIdx && ni < st.nodeIdx;
          const cls = 'blk-node' + (active ? ' active' : past ? ' past' : '');
          return `
                <button type="button" class="${cls}" data-t="${ti}" data-n="${ni}"
                  ${active ? 'aria-current="true"' : ''}
                  aria-label="${a((t.name || '') + ' 第 ' + (ni + 1) + ' 級 ' + (nd && nd.label || ''))}"
                  onclick="lsLadderPick(${Number(bi)}, ${ti}, ${ni})"
                  onkeydown="lsNodeKey(event, ${Number(bi)}, ${ti}, ${ni})">
                  <span class="blk-node-dot">${active ? '<i class="ph ph-check" aria-hidden="true"></i>' : ''}</span>
                  <span class="blk-node-label">${h(nd && nd.label || '')}</span>
                </button>`;
        }).join('');

        return `
            <div class="blk-track">
              <div class="blk-track-side">
                <span class="blk-track-badge${ti % 2 ? ' alt' : ''}">${h(t.name || '路線 ' + (ti + 1))}</span>
                ${t.hint ? `<span class="blk-track-hint">${h(t.hint)}</span>` : ''}
              </div>
              <div class="blk-track-main">
                <span class="blk-track-line" aria-hidden="true"></span>
                <div class="blk-nodes" style="--node-n:${nodes.length}">${dots}</div>
              </div>
            </div>`;
      }).join('');

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重設')}
          <div class="blk-tracks" id="lsLadder${Number(bi)}">${rows}</div>
          <div class="blk-card blk-detail" id="lsDetail${Number(bi)}">${lsLadderDetailInner(b, st)}</div>
        </div>`;
    }

    function lsLadderApply(bi, b) {
      const st = lessonState[bi] || {};
      const root = document.getElementById('lsLadder' + bi);
      if (root) {
        root.querySelectorAll('.blk-node').forEach(el => {
          const ti = Number(el.dataset.t);
          const ni = Number(el.dataset.n);
          const active = ti === st.trackIdx && ni === st.nodeIdx;
          const past   = ti === st.trackIdx && ni < st.nodeIdx;
          el.className = 'blk-node' + (active ? ' active' : past ? ' past' : '');
          if (active) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
          const dot = el.querySelector('.blk-node-dot');
          if (dot) dot.innerHTML = active ? '<i class="ph ph-check" aria-hidden="true"></i>' : '';
        });
      }
      const d = document.getElementById('lsDetail' + bi);
      if (d) d.innerHTML = lsLadderDetailInner(b, st);
    }

    // 點了另一條 track，原本那條的「已過」灰點會全部退回未到態 —— 著色只跟著作用中的線
    function lsLadderPick(bi, ti, ni) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tracks = lsTracks(b);
      const nodes = tracks[ti] && Array.isArray(tracks[ti].nodes) ? tracks[ti].nodes : null;
      if (!nodes || !nodes[ni]) return;
      const st = lsState(bi, b);
      st.trackIdx = Number(ti);
      st.nodeIdx = Number(ni);
      lsLadderApply(bi, b);
    }

    function lsNodeKey(ev, bi, ti, ni) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        lsLadderPick(bi, ti, ni);
        return;
      }
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const tracks = lsTracks(b);
      const nodes = tracks[ti] && Array.isArray(tracks[ti].nodes) ? tracks[ti].nodes : [];
      if (nodes.length < 2) return;
      ev.preventDefault();
      const next = (Number(ni) + (ev.key === 'ArrowRight' ? 1 : -1) + nodes.length) % nodes.length;
      lsLadderPick(bi, ti, next);
      document.querySelector(`#lsLadder${Number(bi)} .blk-node[data-t="${Number(ti)}"][data-n="${next}"]`)?.focus();
    }

    // ══════════════════════════════════════════════════════════════
    //  3. type:'order' — 上船步驟拖曳排序
    // ══════════════════════════════════════════════════════════════

    function lsOrderItemsInner(b, bi) {
      const items = Array.isArray(b.items) ? b.items : [];
      const st = lsState(bi, b);
      const order = st.order || [];

      return order.map((orig, pos) => {
        const it = items[orig] || {};
        let cls = 'blk-item';
        if (st.checked != null) cls += (orig === pos ? ' ok' : ' bad');
        else if (st.sel === pos) cls += ' sel';
        if (st.dragFrom === pos) cls += ' dragging';

        return `
            <div class="${cls}" draggable="true" data-pos="${pos}"
              ondragstart="lsDragStart(event, ${Number(bi)}, ${pos})"
              ondragover="lsDragOver(event)"
              ondrop="lsDrop(event, ${Number(bi)}, ${pos})"
              ondragend="lsDragEnd(event, ${Number(bi)})"
              onclick="lsOrderSelect(${Number(bi)}, ${pos})">
              <span class="blk-item-num">${pos + 1}</span>
              <div class="blk-item-main">
                <div class="blk-item-title">${h(it.title || '未命名步驟')}</div>
                ${it.desc ? `<div class="blk-item-desc">${h(it.desc)}</div>` : ''}
              </div>
              <div class="blk-item-arrows">
                <button type="button" class="blk-arrow" aria-label="往上移一格"
                  ${pos === 0 ? 'disabled' : ''}
                  onclick="lsOrderMove(event, ${Number(bi)}, ${pos}, -1)">
                  <i class="ph ph-caret-up" aria-hidden="true"></i>
                </button>
                <button type="button" class="blk-arrow" aria-label="往下移一格"
                  ${pos >= order.length - 1 ? 'disabled' : ''}
                  onclick="lsOrderMove(event, ${Number(bi)}, ${pos}, 1)">
                  <i class="ph ph-caret-down" aria-hidden="true"></i>
                </button>
              </div>
              <span class="blk-grip" aria-hidden="true"><i class="ph ph-dots-six-vertical"></i></span>
            </div>`;
      }).join('');
    }

    function lsOrderHtml(b, bi) {
      const items = Array.isArray(b.items) ? b.items : [];
      if (!items.length) return lsIntroHtml(b);

      return `
        ${lsIntroHtml(b)}
        <div class="blk-panel">
          ${lsResetBtnHtml(bi, '重新打亂')}
          <div class="blk-hint-top">↑ 最先做</div>
          <div class="blk-items" id="lsItems${Number(bi)}">${lsOrderItemsInner(b, bi)}</div>
          <div class="blk-hint-bot">↓ 最後做</div>
          <div class="blk-check-row">
            <button type="button" class="btn btn-sm btn-primary u-pill"
              onclick="lsOrderCheck(${Number(bi)})">檢查答案</button>
            <span class="blk-result" id="lsRes${Number(bi)}" role="status" aria-live="polite"></span>
          </div>
        </div>`;
    }

    // 只重畫卡片清單；結果列（aria-live）要一直留在 DOM 上才播報得出來
    function lsOrderApply(bi, b) {
      const box = document.getElementById('lsItems' + bi);
      if (box) box.innerHTML = lsOrderItemsInner(b, bi);
      lsOrderResultApply(bi, b);
    }

    function lsOrderResultApply(bi, b) {
      const el = document.getElementById('lsRes' + bi);
      if (!el) return;
      const st = lessonState[bi] || {};
      if (st.checked == null) { el.className = 'blk-result'; el.textContent = ''; return; }
      if (st.checked === 0) {
        el.className = 'blk-result ok';
        el.textContent = b.successText || '完全正確，這就是標準的上船流程。';
        return;
      }
      el.className = 'blk-result bad';
      el.textContent = `還有 ${st.checked} 張卡片的位置不對。` + (b.hintText ? ' ' + b.hintText : '');
    }

    // 拖曳與上下箭頭共用：任何一次移動都把 checked 清回 null，對錯著色立刻消失
    function lsOrderMoveTo(bi, from, to) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      const o = (st.order || []).slice();
      if (from < 0 || from >= o.length || to < 0 || to >= o.length || from === to) {
        st.dragFrom = null;
        lsOrderApply(bi, b);
        return;
      }
      const moved = o.splice(from, 1)[0];
      o.splice(to, 0, moved);
      st.order = o;
      st.checked = null;
      st.sel = to;
      st.dragFrom = null;
      lsOrderApply(bi, b);
    }

    function lsOrderSelect(bi, pos) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      st.sel = Number(pos);
      lsOrderApply(bi, b);
    }

    // 箭頭鈕：觸控裝置沒有 HTML5 drag，這是唯一可靠的輸入方式
    function lsOrderMove(ev, bi, pos, dir) {
      ev.stopPropagation();
      ev.preventDefault();
      lsOrderMoveTo(bi, Number(pos), Number(pos) + Number(dir));
    }

    function lsDragStart(ev, bi, pos) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      lsState(bi, b).dragFrom = Number(pos);
      try {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', String(pos));
      } catch (e) { /* 部分瀏覽器會丟錯，忽略 */ }
      const el = document.getElementById('lsItems' + bi);
      const row = el && el.querySelector(`.blk-item[data-pos="${Number(pos)}"]`);
      if (row) row.classList.add('dragging');
    }

    function lsDragOver(ev) {
      ev.preventDefault();
      try { ev.dataTransfer.dropEffect = 'move'; } catch (e) { /* noop */ }
    }

    function lsDrop(ev, bi, pos) {
      ev.preventDefault();
      ev.stopPropagation();
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);

      let from = st.dragFrom;
      if (from == null) {
        try {
          const raw = ev.dataTransfer.getData('text/plain');
          if (raw !== '' && raw != null) from = Number(raw);
        } catch (e) { from = null; }
      }
      if (from == null || Number.isNaN(from) || from === Number(pos)) {
        st.dragFrom = null;
        lsOrderApply(bi, b);
        return;
      }
      lsOrderMoveTo(bi, Number(from), Number(pos));
    }

    function lsDragEnd(ev, bi) {
      const st = lessonState[bi];
      if (!st) return;
      st.dragFrom = null;
      const b = lsBlocks(lsCurMat())[bi];
      if (b) lsOrderApply(bi, b);
    }

    function lsOrderCheck(bi) {
      const b = lsBlocks(lsCurMat())[bi];
      if (!b) return;
      const st = lsState(bi, b);
      const order = st.order || [];
      st.checked = order.filter((v, i) => v !== i).length;
      st.sel = null;
      lsOrderApply(bi, b);

      if (st.checked !== 0) return;
      // 全對就是標記這個單元完成的自然時機
      const c = activeCourse();
      const m = lsCurMat();
      if (c && m) saveProgress(c.id, m.fileName, { completed: true });
      showToast('答對了，單元已標記完成', 'success');
    }

    // ══════════════════════════════════════════════════════════════
    //  入口
    // ══════════════════════════════════════════════════════════════

    function renderLesson(course, idx) {
      ensureLessonStyle();
      const host = document.getElementById('lessonView');
      if (!host) return;
      if (!course) { goHome(); return; }

      const i = Number(idx);
      const m = (course.materials || [])[i];
      if (!m) { openModule(course.id); return; }

      // 切單元就整包丟掉互動狀態；同一單元重畫（後端同步完）則保留
      const key = String(course.id) + '#' + i;
      if (lessonStateKey !== key) { lessonState = {}; lessonStateKey = key; lessonVideoSaveAt = 0; }

      // 進到單元就算看過
      saveProgress(course.id, m.fileName, { viewed: true });

      let body;
      if (isInteractive(m)) {
        const blocks = lsBlocks(m);
        body = blocks.length
          ? blocks.map((b, bi) => lsBlockHtml(b, bi)).join('')
          : `<div class="ls-empty"><i class="ph ph-cards" aria-hidden="true"></i>
              <p>這份互動教材還沒有任何段落。</p></div>`;
      } else {
        body = lsFileHtml(course, m);
      }

      host.innerHTML = `
      ${lsBarHtml(course, m)}
      <div class="les-grid">
        <div class="les-main">
          ${body}
          ${lsNavHtml(course, i)}
        </div>
      </div>`;
    }

    // ══════════════════════════════════════════════════════════════
    //  互動教材編輯器（#edOverlay）— 僅 isAdmin
    //  宣告：openEditor(courseId, matIdx) / closeEditor() / saveEditor()
    //  版面用 screens.css 既有的 .ed-* 類名；按鈕一律 shared/ui.css 的 .btn
    //  產出：{ kind:'interactive', fileName, estMinutes, blocks, updatedAt, updatedBy }
    // ══════════════════════════════════════════════════════════════

    // ── 模組層級狀態（不放 window，不與其他 writer 的變數衝突） ──
    let edCourseId  = null;   // string | null
    let edMatIdx    = null;   // number | null（null = 新增）
    let edDraft     = null;   // { fileName, estMinutes, blocks:[] }
    let edOriginal  = '';     // 開啟時的 JSON 快照，用來判斷是否有未儲存變更
    let edSaving    = false;
    let edFocusPath = null;   // 重繪後要自動聚焦的欄位 path
    let edKeyBound  = false;

    const ED_TYPES = ['text', 'tabs', 'ladder', 'order'];

    const ED_BLOCK_LABEL = {
      text:   '文字段落',
      tabs:   '分頁對照',
      ladder: '階梯進程',
      order:  '步驟排序'
    };

    const ED_BLOCK_ICON = {
      text:   'ph-text-align-left',
      tabs:   'ph-squares-four',
      ladder: 'ph-steps',
      order:  'ph-list-numbers'
    };

    // path 只允許走這些鍵（path 字串由本檔產生，仍做白名單，避免被 data-* 竄改後亂走）
    const ED_KEYS = new Set([
      'fileName', 'estMinutes', 'blocks',
      'type', 'title', 'minutes', 'body', 'intro',
      'tabs', 'tracks', 'items', 'nodes',
      'label', 'eyebrow', 'headline', 'chips', 'desc', 'summary',
      'key', 'name', 'hint', 'level',
      'successText', 'hintText'
    ]);

    // ── path 解析 ─────────────────────────────────────────────────
    function edStep(raw) {
      return /^\d+$/.test(raw) ? Number(raw) : raw;
    }

    // 回傳 { obj, key }，無效 path 回 null
    function edResolve(path) {
      if (!edDraft) return null;
      const parts = String(path || '').split('.');
      if (!parts.length || parts[0] === '') return null;
      let cur = edDraft;
      for (let i = 0; i < parts.length - 1; i++) {
        const k = edStep(parts[i]);
        if (typeof k === 'string' && !ED_KEYS.has(k)) return null;
        if (cur == null || typeof cur !== 'object') return null;
        cur = cur[k];
      }
      const key = edStep(parts[parts.length - 1]);
      if (typeof key === 'string' && !ED_KEYS.has(key)) return null;
      if (cur == null || typeof cur !== 'object') return null;
      return { obj: cur, key };
    }

    function edGet(path) {
      const r = edResolve(path);
      return r ? r.obj[r.key] : undefined;
    }

    // 取 path 指向的陣列（不存在就補一個空陣列）
    function edArr(path) {
      const r = edResolve(path);
      if (!r) return null;
      if (!Array.isArray(r.obj[r.key])) r.obj[r.key] = [];
      return r.obj[r.key];
    }

    // ── 空白樣板 ──────────────────────────────────────────────────
    function edNewTab() {
      return { label: '', eyebrow: '', headline: '', chips: [], desc: '', summary: '' };
    }

    function edNewNode() {
      return { label: '', level: '', desc: '' };
    }

    function edNewTrack() {
      return { key: '', name: '', hint: '', nodes: [edNewNode(), edNewNode(), edNewNode(), edNewNode()] };
    }

    function edNewItem() {
      return { title: '', desc: '' };
    }

    function edNewBlock(type) {
