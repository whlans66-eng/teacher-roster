<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材管理 | WHL MARITRAIN</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <!-- 共用按鈕規範：全站唯一的按鈕來源，勿在頁面內另外定義 -->
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    :root {
      --apple-blue: #007aff;
      --apple-blue-hover: #0051d5;
      --apple-blue-light: #e8f0fb;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-gray-2: #6e6e73;
      --apple-bg: #f5f5f7;
      --apple-white: #ffffff;
      --apple-border: rgba(0,0,0,0.06);
      --apple-shadow-sm: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --apple-shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      --apple-shadow-lg: 0 12px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --apple-radius: 20px;      /* 卡片、Modal */
      --apple-radius-sm: 12px;   /* 卡片內層、按鈕、輸入框 */
      --brand: #0a4a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--apple-bg);
      color: var(--apple-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      height: 56px;
      background: rgba(255,255,255,0.80);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--apple-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--apple-blue);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .back-btn:hover { background: var(--apple-blue-light); }

    .topbar-sep { width: 1px; height: 18px; background: var(--apple-border); }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--apple-text);
      letter-spacing: -0.01em;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 20px;
      padding: 5px 12px 5px 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--apple-text);
    }

    .user-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .role-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .role-admin   { background: #fde8e8; color: #c0392b; }
    .role-teacher { background: var(--apple-blue-light); color: #1e40af; }
    .role-crew    { background: #dcfce7; color: #166534; }
    .role-guest   { background: #f2f2f7; color: #6e6e73; }

    /* ── Layout ── */
    .app-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .app-body::-webkit-scrollbar { width: 8px; }
    .app-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }

    .learn-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 64px;
      animation: fadeUp 0.35s ease;
    }

    /* ── Section ── */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sec-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--apple-text);
    }

    .sec-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--apple-text);
      background: var(--apple-white);
      border: 1px solid var(--apple-border);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .sec-link:hover { background: var(--apple-bg); transform: translateX(2px); }

    .sec + .sec { margin-top: 36px; }

    /* ── 我的學習 Hero ── */
    .hero-card {
      display: flex;
      align-items: center;
      gap: 22px;
      background: #1c1c1e;
      border-radius: var(--apple-radius);
      padding: 20px;
      box-shadow: var(--apple-shadow-md);
    }

    .hero-thumb {
      position: relative;
      width: 188px;
      height: 106px;
      flex-shrink: 0;
      border-radius: var(--apple-radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .hero-thumb i.cat-ico {
      font-size: 42px;
      color: rgba(255,255,255,0.92);
    }

    .hero-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.26);
      transition: background 0.2s;
    }

    .hero-thumb:hover .hero-play { background: rgba(0,0,0,0.42); }

    .hero-play span {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .hero-info { flex: 1; min-width: 0; }

    .hero-kicker {
      font-size: 12px;
      color: rgba(255,255,255,0.56);
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-prog {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-prog-label {
      font-size: 12px;
      color: rgba(255,255,255,0.56);
      flex-shrink: 0;
    }

    .hero-track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.16);
      overflow: hidden;
    }

    .hero-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #7c5cff, #c084fc);
      transition: width 0.4s ease;
    }

    .hero-pct {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .hero-units {
      font-size: 12px;
      color: rgba(255,255,255,0.56);
      flex-shrink: 0;
    }

    /* ── 學習路徑 ── */
    .path-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--apple-white);
      border-radius: var(--apple-radius);
      padding: 18px;
      box-shadow: var(--apple-shadow-sm);
      margin-bottom: 14px;
    }

    .path-cover {
      width: 150px;
      height: 92px;
      flex-shrink: 0;
      border-radius: var(--apple-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.92);
      font-size: 34px;
    }

    .path-info { flex: 1; min-width: 0; }

    .path-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .path-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--apple-gray);
      background: var(--apple-bg);
      border-radius: 6px;
      padding: 2px 7px;
    }

    .path-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--apple-gray-2);
    }

    .path-ring {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--apple-bg);
      border-radius: 999px;
      padding: 8px 16px 8px 10px;
    }

    .ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }

    .path-ring-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--apple-text);
      white-space: nowrap;
    }

    /* ── 模組卡片 ── */
    .mod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }

    .mod-card {
      background: var(--apple-white);
      border-radius: var(--apple-radius-sm);
      overflow: hidden;
      box-shadow: var(--apple-shadow-sm);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .mod-card:hover { transform: translateY(-3px); box-shadow: var(--apple-shadow-md); }

    .mod-card.locked { cursor: default; }
    .mod-card.locked:hover { transform: none; box-shadow: var(--apple-shadow-sm); }
    .mod-card.locked .mod-cover { filter: grayscale(0.55); opacity: 0.6; }

    .mod-cover {
      position: relative;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.92);
      font-size: 34px;
    }

    .mod-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(6px);
      border-radius: 6px;
      padding: 3px 8px;
    }

    .mod-lock {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
    }

    .mod-bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 4px;
      background: rgba(0,0,0,0.22);
    }

    .mod-bar > span {
      display: block;
      height: 100%;
      background: #7c5cff;
    }

    .mod-body { padding: 12px 14px 14px; }

    .mod-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--apple-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 7px;
      min-height: 40px;
    }

    .mod-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--apple-gray);
    }

    .mod-meta i { font-size: 13px; }

    /* ── Course detail view ── */
    .detail-bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 24px 0;
    }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--apple-blue);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .detail-back:hover { background: var(--apple-blue-light); }

    .detail-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding-bottom: 56px;
    }

    .hidden { display: none !important; }

    /* ── Course Header ── */
    .course-header {
      background: var(--apple-white);
      border-bottom: 1px solid var(--apple-border);
      padding: 20px 28px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-shrink: 0;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .course-hero-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      box-shadow: var(--apple-shadow-sm);
    }

    .course-hero-info { flex: 1; }

    .course-hero-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--apple-text);
      line-height: 1.2;
    }

    .course-hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .tag-blue   { background: var(--apple-blue-light); color: var(--apple-blue); }
    .tag-green  { background: #dcfce7; color: #15803d; }
    .tag-gray   { background: var(--apple-bg); color: var(--apple-gray); }
    .tag-purple { background: #ede9fe; color: #6d28d9; }

    .course-hero-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }

    .btn-apple {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-apple-primary {
      background: var(--apple-blue);
      color: white;
      box-shadow: 0 2px 8px rgba(0,122,255,0.25);
    }

    .btn-apple-primary:hover {
      background: var(--apple-blue-hover);
    }

    .btn-apple-secondary {
      background: var(--apple-bg);
      color: var(--apple-text);
      border: 1px solid var(--apple-border);
    }

    .btn-apple-secondary:hover { background: #e5e5ea; }

    /* ── Segmented Control ── */
    .segment-wrap {
      background: var(--apple-white);
      border-bottom: 1px solid var(--apple-border);
      padding: 12px 28px;
      flex-shrink: 0;
    }

    .segmented-control {
      display: inline-flex;
      background: var(--apple-bg);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .seg-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: var(--apple-gray-2);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .seg-btn.active {
      background: var(--apple-white);
      color: var(--apple-text);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12), 0 0 1px rgba(0,0,0,0.06);
    }

    /* ── Content ── */
    .content-panel { display: none; padding: 24px 28px 40px; animation: fadeUp 0.3s ease; }
    .content-panel.active { display: block; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed rgba(0,113,227,0.25);
      border-radius: var(--apple-radius);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      background: rgba(0,113,227,0.02);
      transition: all 0.25s ease;
      margin-bottom: 20px;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--apple-blue);
      background: var(--apple-blue-light);
    }

    .upload-zone-icon {
      font-size: 40px;
      color: var(--apple-blue);
      opacity: 0.5;
      margin-bottom: 10px;
    }

    .upload-zone p {
      font-size: 14px;
      color: var(--apple-gray);
      line-height: 1.6;
    }

    .upload-zone strong { color: var(--apple-blue); font-weight: 600; }

    /* ── Material cards ── */
    .mat-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mat-card {
      background: var(--apple-white);
      border: 1px solid var(--apple-border);
      border-radius: var(--apple-radius-sm);
      box-shadow: var(--apple-shadow-sm);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      transition: all 0.25s ease;
    }

    .mat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--apple-shadow-md);
      border-color: rgba(0,113,227,0.12);
    }

    .mat-card-icon {
      width: 44px; height: 44px;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .mat-card-info { flex: 1; min-width: 0; }

    .mat-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--apple-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .mat-card-sub {
      font-size: 12px;
      color: var(--apple-gray);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--apple-bg);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--apple-blue), #34aadc);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .progress-pct {
      font-size: 11px;
      font-weight: 600;
      color: var(--apple-blue);
      white-space: nowrap;
    }

    /* 併入 .tag 同一套尺寸，只留顏色差異 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .badge-new      { background: var(--apple-bg); color: var(--apple-gray); }
    .badge-progress { background: #fff7ed; color: #c2410c; }
    .badge-done     { background: #dcfce7; color: #15803d; }

    .mat-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-view {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--apple-blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-view:hover {
      background: var(--apple-blue-hover);
    }

    .btn-trash {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,59,48,0.06);
      border: 1px solid rgba(255,59,48,0.15);
      color: #ff3b30;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }

    .btn-trash:hover { background: rgba(255,59,48,0.12); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--apple-gray);
    }

    .empty-state i { font-size: 52px; opacity: 0.2; display: block; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--apple-gray-2); }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* ── Comments ── */
    .comments-list { display: flex; flex-direction: column; gap: 0; }

    .comment-row {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--apple-border);
      animation: fadeUp 0.3s ease;
    }

    .comment-row:last-child { border-bottom: none; }

    .comment-ava {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--brand);
      color: white;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--apple-shadow-sm);
    }

    .comment-body { flex: 1; }

    .comment-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }

    .comment-author { font-size: 13px; font-weight: 700; color: var(--apple-text); }

    .comment-time { font-size: 11px; color: var(--apple-gray); }

    .comment-text {
      font-size: 14px;
      line-height: 1.65;
      color: var(--apple-text);
    }

    .comment-compose {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--apple-border);
    }

    .compose-input {
      flex: 1;
      border: 1px solid var(--apple-border);
      border-radius: var(--apple-radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 72px;
      color: var(--apple-text);
      background: var(--apple-white);
      transition: all 0.2s;
    }

    .compose-input:focus {
      outline: none;
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 4px rgba(0,122,255,0.15);
    }

    .compose-submit {
      align-self: flex-end;
      padding: 10px 22px;
      background: var(--apple-blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,122,255,0.25);
      white-space: nowrap;
    }

    .compose-submit:hover {
      background: var(--apple-blue-hover);
    }

    /* ── Viewer ── */
    .viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 800;
      flex-direction: column;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .viewer-overlay.open { display: flex; }

    .viewer-bar {
      height: 56px;
      background: rgba(20,20,20,0.85);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      flex-shrink: 0;
    }

    .viewer-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
    }

    .viewer-close:hover { background: rgba(255,255,255,0.2); }

    .viewer-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #viewerVideo {
      max-width: 100%;
      max-height: 100%;
      border-radius: 2px;
    }

    #viewerIframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #viewerImage {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(29,29,31,0.94);
      backdrop-filter: blur(16px);
      color: white;
      padding: 11px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.2,0.8,0.2,1);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success i { color: #30d158; }
    .toast.error   i { color: #ff453a; }

    @media (max-width: 760px) {
      .learn-wrap { padding: 20px 16px 48px; }
      .detail-bar, .detail-inner { padding-left: 16px; padding-right: 16px; }
      .hero-card { flex-direction: column; align-items: stretch; gap: 14px; }
      .hero-thumb { width: 100%; height: 150px; }
      .path-card { flex-wrap: wrap; }
      .path-cover { width: 100%; height: 110px; }
      .path-ring { margin-left: auto; }
      .mod-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .course-header { flex-wrap: wrap; padding: 16px; }
      .content-panel { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="index.html" class="back-btn">
      <i class="ph ph-caret-left"></i> 返回
    </a>
    <div class="topbar-sep"></div>
    <span class="topbar-title">教材管理</span>
    <div class="topbar-right">
      <div class="user-pill">
        <div class="user-avatar" id="userInitial">—</div>
        <span id="userName">載入中</span>
        <span class="role-pill" id="rolePill"></span>
      </div>
    </div>
  </header>

  <!-- App body -->
  <div class="app-body">

    <!-- 學習總覽 -->
    <div id="learnView">
      <div class="learn-wrap">

        <section class="sec">
          <div class="sec-head">
            <div class="sec-title">我的學習</div>
            <button class="sec-link" onclick="goMyLearning()">前往我的學習 <i class="ph ph-caret-right"></i></button>
          </div>
          <div id="heroSlot"></div>
        </section>

        <section class="sec" id="pathSection">
          <div class="sec-head">
            <div class="sec-title">學習路徑</div>
          </div>
          <div id="pathSlot">
            <div class="empty-state" style="padding:36px 0">
              <i class="ph ph-circle-notch"></i>
              <h3>載入中…</h3>
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- 課程（模組）詳細 -->
    <div id="courseView" class="hidden">
      <div class="detail-bar">
        <button class="detail-back" onclick="closeCourse()">
          <i class="ph ph-caret-left"></i> 返回學習路徑
        </button>
      </div>
      <div class="detail-inner" id="courseArea"></div>
    </div>

  </div>

  <!-- Viewer -->
  <div class="viewer-overlay" id="viewerOverlay">
    <div class="viewer-bar">
      <span class="viewer-title" id="viewerTitle">—</span>
      <button class="viewer-close" onclick="closeViewer()"><i class="ph ph-x"></i></button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="ph ph-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/security.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ── Globals ──
    let currentUser = null;
    let isAdmin = false;
    let isCrew  = false;
    let allCourses = [];
    let activeCourseId = null;
    let activeTab = 'materials';
    let progressTimer = null;
    let viewerMeta = null;

    // 課程分類：與智慧派課（maritime-courses.html）的 maritimeCategoryNames 一致
    const CAT_NAME = {
      '01': '船舶操縱與航行實務訓練',
      '02': '領導統御與檢查應對管理',
      '03': '事故案例分析與應變處置訓練',
      '04': '船舶設備操作與技術知能訓練',
      '05': '國際法規與環境合規知識',
      '06': '船舶貨物裝卸作業實務',
      '07': '船員經驗交流與職能回饋',
      '08': '職級轉換與壓力調適',
      '09': '其他'
    };
    const CAT_ICON = {
      '01': 'ph-anchor', '02': 'ph-users-three', '03': 'ph-warning-circle',
      '04': 'ph-gear',   '05': 'ph-scales',      '06': 'ph-package',
      '07': 'ph-chat-circle-dots', '08': 'ph-arrow-u-up-left', '09': 'ph-dots-three'
    };
    const CAT_COLOR = {
      '01': '#4f46e5', '02': '#06b6d4', '03': '#10b981',
      '04': '#f59e0b', '05': '#ef4444', '06': '#8b5cf6',
      '07': '#f97316', '08': '#84cc16', '09': '#ec4899'
    };
    const CAT_ORDER = ['01','02','03','04','05','06','07','08','09'];

    const catOf   = c => CAT_NAME[c?.category] ? c.category : '09';
    const catIcon = code => `<i class="ph ${CAT_ICON[code] || 'ph-folder'}"></i>`;
    const catGrad = code => {
      const col = CAT_COLOR[code] || '#6e6e73';
      return `linear-gradient(135deg, ${col} 0%, ${col}99 100%)`;
    };

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      if (!initAuth()) return;
      const p = new URLSearchParams(location.search);
      loadData(p.get('courseId'));
    });

    function initAuth() {
      // 角色定義統一交給 js/auth.js，避免這頁自己判斷而把 guest 標成「教師」
      currentUser = protectPage();
      if (!currentUser) return false;

      const role = Auth.getRole();
      isAdmin = role === 'admin';
      isCrew  = role === 'crew';

      const name = Auth.displayName(currentUser);
      document.getElementById('userName').textContent = name;
      document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();

      const pill = document.getElementById('rolePill');
      pill.textContent = Auth.getRoleLabel(role);
      pill.className = 'role-pill role-' + (role || 'guest');
      return true;
    }

    // ── Data ──
    function readCourses() {
      try {
        const raw = JSON.parse(localStorage.getItem('maritimeCourses') || '[]');
        return Array.isArray(raw) ? raw : [];
      } catch { return []; }
    }

    // 先用本地快取立即上畫面，再從後端同步（與 maritime-courses.html 相同流程）
    async function loadData(preselectId = null) {
      allCourses = readCourses();
      renderLearn();
      if (preselectId) openCourse(preselectId);

      if (typeof initializeDataSync === 'undefined') return;
      try {
        await initializeDataSync();
      } catch (err) {
        console.warn('⚠️ 後端同步失敗，使用本地資料:', err.message);
        if (!allCourses.length) showToast('無法連線後端，目前沒有課程資料', 'error');
        return;
      }

      allCourses = readCourses();
      renderLearn();
      const keep = activeCourseId || preselectId;
      if (keep && allCourses.some(c => String(c.id) === String(keep))) openCourse(keep);
      else if (activeCourseId) closeCourse();
    }

    // ── 進度計算 ──
    function matDone(courseId, m) {
      const prog = getProgress(courseId, m.fileName);
      return !!(prog && (prog.completed || prog.viewed));
    }

    function courseStats(course) {
      const mats = course.materials || [];
      const done = mats.filter(m => matDone(course.id, m)).length;
      return { total: mats.length, done, pct: mats.length ? Math.round(done / mats.length * 100) : 0 };
    }

    function pathStats(courses) {
      let total = 0, done = 0;
      courses.forEach(c => { const s = courseStats(c); total += s.total; done += s.done; });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    // 最近一次觀看的教材（掃描本機進度紀錄）
    function lastActivity() {
      const prefix = `vp_${currentUser.username || 'u'}_`;
      let best = null;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || key.indexOf(prefix) !== 0) continue;
        let val;
        try { val = JSON.parse(localStorage.getItem(key)); } catch { continue; }
        if (!val || !val.lastViewed) continue;
        if (best && val.lastViewed <= best.lastViewed) continue;
        const rest = key.slice(prefix.length);
        const sep = rest.indexOf('_');
        if (sep < 0) continue;
        best = {
          courseId: rest.slice(0, sep),
          fileName: decodeURIComponent(rest.slice(sep + 1)),
          lastViewed: val.lastViewed
        };
      }
      return best;
    }

    // ── 學習總覽 ──
    function renderLearn() {
      renderHero();
      renderPaths();
    }

    function renderHero() {
      const slot = document.getElementById('heroSlot');

      // 優先顯示「繼續上次學習」，否則推薦第一門有教材的課程
      const act = lastActivity();
      let course = act ? allCourses.find(c => String(c.id) === String(act.courseId)) : null;
      let kicker = course ? `繼續上次學習：${h(act.fileName)}` : '';

      if (!course) {
        course = allCourses.find(c => (c.materials || []).length);
        kicker = course ? '開始學習：尚未觀看任何教材' : '';
      }

      if (!course) {
        slot.innerHTML = `
          <div class="hero-card">
            <div class="hero-thumb" style="background:${catGrad('09')};cursor:default">
              <i class="ph ph-books cat-ico"></i>
            </div>
            <div class="hero-info">
              <div class="hero-kicker">目前沒有可學習的教材</div>
              <div class="hero-name">${allCourses.length ? '課程尚未上傳教材' : '尚無課程資料'}</div>
              <div class="hero-prog">
                <span class="hero-prog-label">${isAdmin ? '請先到智慧派課建立課程，再回到此頁上傳教材' : '請等待管理員上傳教材'}</span>
              </div>
            </div>
          </div>`;
        return;
      }

      const code = catOf(course);
      const st = courseStats(course);
      slot.innerHTML = `
        <div class="hero-card">
          <div class="hero-thumb" style="background:${catGrad(code)}" onclick="openCourse('${a(course.id)}')">
            <i class="ph ${CAT_ICON[code]} cat-ico"></i>
            <div class="hero-play"><span><i class="ph-fill ph-play"></i></span></div>
          </div>
          <div class="hero-info">
            <div class="hero-kicker">${kicker}</div>
            <div class="hero-name">${h(course.name || '未命名課程')}</div>
            <div class="hero-prog">
              <span class="hero-prog-label">上課進度</span>
              <div class="hero-track"><div class="hero-fill" style="width:${st.pct}%"></div></div>
              <span class="hero-pct">${st.pct}%</span>
              <span class="hero-units">已完成 ${st.done}/${st.total} 個單元</span>
            </div>
          </div>
        </div>`;
    }

    function renderPaths() {
      const slot = document.getElementById('pathSlot');

      // 依智慧派課的課程分類分組：一個分類＝一條學習路徑，分類底下每門課＝一個模組
      const groups = new Map();
      allCourses.forEach(c => {
        const code = catOf(c);
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(c);
      });

      const codes = CAT_ORDER.filter(code => groups.has(code));
      if (!codes.length) {
        slot.innerHTML = `
          <div class="empty-state" style="padding:48px 0">
            <i class="ph ph-path"></i>
            <h3>尚無學習路徑</h3>
            <p>${isAdmin ? '請先到「智慧派課」建立課程，課程會依分類自動歸入學習路徑' : '管理員尚未建立課程'}</p>
          </div>`;
        return;
      }

      slot.innerHTML = codes.map(code => {
        const courses = groups.get(code);
        const st = pathStats(courses);
        const col = CAT_COLOR[code];
        const matCount = courses.reduce((n, c) => n + (c.materials || []).length, 0);

        const ring = `conic-gradient(${col} ${st.pct * 3.6}deg, rgba(0,0,0,0.08) 0deg)`;

        const mods = courses.map((c, i) => {
          const cs = courseStats(c);
          const locked = cs.total === 0;
          return `
            <div class="mod-card ${locked ? 'locked' : ''}" ${locked ? '' : `onclick="openCourse('${a(c.id)}')"`}>
              <div class="mod-cover" style="background:${catGrad(code)}">
                <span class="mod-badge">模組 ${i + 1}</span>
                ${locked ? '<span class="mod-lock" title="尚未上傳教材"><i class="ph ph-lock-simple"></i></span>' : ''}
                ${catIcon(code)}
                ${cs.pct > 0 ? `<div class="mod-bar"><span style="width:${cs.pct}%"></span></div>` : ''}
              </div>
              <div class="mod-body">
                <div class="mod-name">${h(c.name || '未命名課程')}</div>
                <div class="mod-meta">
                  <span><i class="ph ph-folder"></i> ${cs.total} 份教材</span>
                  ${cs.total ? `<span><i class="ph ph-check-circle"></i> ${cs.done}/${cs.total}</span>` : '<span>尚未開放</span>'}
                </div>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="path-card">
            <div class="path-cover" style="background:${catGrad(code)}">${catIcon(code)}</div>
            <div class="path-info">
              <div class="path-title">
                <span class="path-code">${code}</span>${h(CAT_NAME[code])}
              </div>
              <div class="path-desc">
                共 ${courses.length} 門課程 · ${matCount} 份教材${st.total ? ` · 已完成 ${st.done} 份` : ' · 尚未上傳教材'}
              </div>
            </div>
            <div class="path-ring">
              <span class="ring" style="background:${ring}"><span class="ring-inner" style="background:var(--apple-bg);transform:scale(0.58)"></span></span>
              <span class="path-ring-text">${st.pct}% 完成</span>
            </div>
          </div>
          <div class="mod-grid">${mods}</div>`;
      }).join('');
    }

    function goMyLearning() {
      closeCourse();
      document.getElementById('heroSlot')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── 課程（模組）詳細 ──
    function openCourse(id) {
      const course = allCourses.find(c => String(c.id) === String(id));
      if (!course) return;
      activeCourseId = String(id);
      activeTab = 'materials';
      document.getElementById('learnView').classList.add('hidden');
      document.getElementById('courseView').classList.remove('hidden');
      renderMain(course);
      document.querySelector('.app-body').scrollTop = 0;
      const url = new URL(location.href);
      url.searchParams.set('courseId', id);
      history.replaceState(null, '', url);
    }

    function closeCourse() {
      activeCourseId = null;
      document.getElementById('courseView').classList.add('hidden');
      document.getElementById('learnView').classList.remove('hidden');
      renderLearn();
      const url = new URL(location.href);
      url.searchParams.delete('courseId');
      history.replaceState(null, '', url);
    }

    // ── Main ──
    function renderMain(course) {
      const code = catOf(course);
      const mats = course.materials || [];
      const st = courseStats(course);

      const uploadBtn = isAdmin ? `
        <button class="btn-apple btn-apple-primary" onclick="triggerUpload('${a(course.id)}')">
          <i class="ph ph-upload-simple"></i> 上傳教材
        </button>
        <input type="file" id="fi_${a(course.id)}" multiple
          accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.webm,.mov,.jpg,.jpeg,.png,.gif,.webp"
          style="display:none" onchange="handleFiles(this,'${a(course.id)}')">` : '';

      const commentTab = (isCrew || isAdmin) ? `
        <button class="seg-btn" data-tab="comments" onclick="switchTab('comments',this)">
          <i class="ph ph-chat-circle-dots"></i> 留言討論
        </button>` : '';

      document.getElementById('courseArea').innerHTML = `
        <div class="course-header">
          <div class="course-hero-icon" style="background:${catGrad(code)};color:#fff">${catIcon(code)}</div>
          <div class="course-hero-info">
            <div class="course-hero-name">${h(course.name || '未命名課程')}</div>
            <div class="course-hero-tags">
              <span class="tag tag-blue"><i class="ph ph-path"></i>${h(CAT_NAME[code])}</span>
              ${course.method   ? `<span class="tag tag-green">${h(course.method)}</span>` : ''}
              ${course.duration ? `<span class="tag tag-gray"><i class="ph ph-clock"></i>${h(course.duration)} 分</span>` : ''}
              <span class="tag tag-gray"><i class="ph ph-folder"></i>${mats.length} 個教材</span>
              ${st.total ? `<span class="tag tag-purple"><i class="ph ph-check-circle"></i>已完成 ${st.done}/${st.total}</span>` : ''}
            </div>
          </div>
          <div class="course-hero-actions">${uploadBtn}</div>
        </div>

        <div class="segment-wrap">
          <div class="segmented-control">
            <button class="seg-btn active" data-tab="materials" onclick="switchTab('materials',this)">
              <i class="ph ph-folder-open"></i> 教材附件
            </button>
            ${commentTab}
          </div>
        </div>

        <div class="content-panel active" id="panel-materials">${renderMatsPanel(course)}</div>
        <div class="content-panel" id="panel-comments">${(isCrew || isAdmin) ? renderCommentsPanel(course.id) : ''}</div>
      `;
    }

    function switchTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('#courseArea .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('#courseArea .content-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab)?.classList.add('active');
    }

    // ── Materials panel ──
    function renderMatsPanel(course) {
      const mats = course.materials || [];
      const zone = isAdmin ? `
        <div class="upload-zone" onclick="triggerUpload('${a(course.id)}')">
          <div class="upload-zone-icon"><i class="ph ph-cloud-arrow-up"></i></div>
          <p>點擊或將檔案<strong>拖曳</strong>到此上傳</p>
          <p style="font-size:12px;margin-top:4px;opacity:.7">支援 PDF、Word、PPT、MP4、圖片（上限 50 MB），上傳後同步至雲端</p>
        </div>` : '';

      if (!mats.length) return `${zone}
        <div class="empty-state">
          <i class="ph ph-folder-open"></i>
          <h3>${isAdmin ? '尚未上傳教材' : '此課程尚無教材'}</h3>
          <p>${isAdmin ? '點擊上方區域或拖曳檔案即可上傳' : '管理員尚未上傳教材'}</p>
        </div>`;

      return `${zone}<div class="mat-grid">${mats.map((m,i) => matCard(m,i,course.id)).join('')}</div>`;
    }

    function matCard(m, idx, courseId) {
      const { icon, bg, color } = fileStyle(m.fileName || '');
      const prog = getProgress(courseId, m.fileName);
      const isVid = isVideo(m.fileName);
      const hasUrl = !!(m.fileUrl || m.dataUrl || m.fileId);

      let badgeHtml = `<span class="status-badge badge-new">未觀看</span>`;
      let progressHtml = '';

      if (prog) {
        if (prog.completed) {
          badgeHtml = `<span class="status-badge badge-done"><i class="ph ph-check"></i> 已完成</span>`;
        } else if (isVid && prog.percent > 0) {
          badgeHtml = `<span class="status-badge badge-progress">看到 ${prog.percent}%</span>`;
          progressHtml = `
            <div class="progress-row">
              <div class="progress-track"><div class="progress-fill" style="width:${prog.percent}%"></div></div>
              <span class="progress-pct">${prog.percent}%</span>
            </div>`;
        } else if (!isVid && prog.viewed) {
          badgeHtml = `<span class="status-badge badge-done"><i class="ph ph-check"></i> 已開啟</span>`;
        }
      }

      const viewBtn = hasUrl
        ? `<button class="btn-view" onclick="openMaterialAt('${a(courseId)}',${idx})">
            <i class="ph ph-${isVid ? 'play' : 'arrow-square-out'}"></i> 開啟
           </button>`
        : `<span style="font-size:12px;color:var(--apple-gray)">無連結</span>`;

      const trashBtn = isAdmin
        ? `<button class="btn-trash" onclick="deleteMat('${a(courseId)}',${idx})" title="移除"><i class="ph ph-trash"></i></button>`
        : '';

      return `
        <div class="mat-card">
          <div class="mat-card-icon" style="background:${bg};color:${color}">${icon}</div>
          <div class="mat-card-info">
            <div class="mat-card-name">${h(m.fileName || m.name || '未命名')}</div>
            <div class="mat-card-sub">${badgeHtml}</div>
            ${progressHtml}
          </div>
          <div class="mat-card-actions">
            ${viewBtn}
            ${trashBtn}
          </div>
        </div>`;
    }

    // ── Comments panel ──
    function renderCommentsPanel(courseId) {
      const comments = JSON.parse(localStorage.getItem('comments') || '[]')
        .filter(c => String(c.courseId) === String(courseId))
        .sort((a,b) => (a.timestamp||0) - (b.timestamp||0));

      const listHtml = comments.length
        ? comments.map(c => {
            const init = (c.author||'?').charAt(0).toUpperCase();
            const time = c.timestamp
              ? new Date(c.timestamp).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
              : '';
            return `
              <div class="comment-row">
                <div class="comment-ava">${init}</div>
                <div class="comment-body">
                  <div class="comment-meta">
                    <span class="comment-author">${h(c.author||'匿名')}</span>
                    <span class="comment-time">${time}</span>
                  </div>
                  <div class="comment-text">${h(c.content||'').replace(/\n/g,'<br>')}</div>
                </div>
              </div>`;
          }).join('')
        : `<div class="empty-state" style="padding:36px 0">
             <i class="ph ph-chat-circle-dots"></i>
             <h3>尚無留言</h3>
             <p>成為第一個留言的人</p>
           </div>`;

      return `
        <div class="comments-list" id="commentList">${listHtml}</div>
        <div class="comment-compose">
          <textarea class="compose-input" id="commentInput" placeholder="輸入留言…" rows="3"></textarea>
          <button class="compose-submit" onclick="postComment(${courseId})">送出</button>
        </div>`;
    }

    function postComment(courseId) {
      const input = document.getElementById('commentInput');
      const content = (input?.value || '').trim();
      if (!content) { showToast('請輸入留言內容', 'error'); return; }
      const comments = JSON.parse(localStorage.getItem('comments') || '[]');
      comments.push({
        id: Date.now(), courseId,
        author: currentUser.displayName || currentUser.username,
        content, timestamp: Date.now()
      });
      localStorage.setItem('comments', JSON.stringify(comments));
      document.getElementById('panel-comments').innerHTML = renderCommentsPanel(courseId);
      showToast('留言已送出', 'success');
    }

    // ── Progress ──
    function progKey(courseId, fileName) {
      return `vp_${currentUser.username||'u'}_${courseId}_${encodeURIComponent(fileName||'')}`;
    }

    function getProgress(courseId, fileName) {
      try { const r = localStorage.getItem(progKey(courseId, fileName)); return r ? JSON.parse(r) : null; }
      catch { return null; }
    }

    function saveProgress(courseId, fileName, data) {
      localStorage.setItem(progKey(courseId, fileName), JSON.stringify({ ...data, lastViewed: new Date().toISOString() }));
    }

    // ── Viewer ──
    // 雲端（Google Drive）教材的預覽網址
    function drivePreview(m) { return m.fileId ? `https://drive.google.com/file/d/${m.fileId}/preview` : null; }
    function driveImage(m)   { return m.fileId ? `https://drive.google.com/thumbnail?id=${m.fileId}&sz=w1600` : null; }

    function openMaterialAt(courseId, idx) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      const m = course?.materials?.[idx];
      if (m) openMaterial(m, courseId);
    }

    function openMaterial(m, courseId) {
      const fileName = m.fileName || m.name || '';
      const fileUrl  = m.dataUrl || m.fileUrl || '';
      if (!fileUrl && !m.fileId) return;
      viewerMeta = { fileName, courseId };
      document.getElementById('viewerTitle').textContent = fileName;
      const body = document.getElementById('viewerBody');
      body.innerHTML = '';
      const ext = (fileName||'').split('.').pop().toLowerCase();

      if (isVideo(fileName) && !m.dataUrl && m.fileId) {
        const fr = document.createElement('iframe');
        fr.id = 'viewerIframe'; fr.src = drivePreview(m); fr.allow = 'autoplay';
        body.appendChild(fr);
        saveProgress(courseId, fileName, { viewed: true });
      } else if (isVideo(fileName)) {
        const prog = getProgress(courseId, fileName);
        const start = prog && !prog.completed ? (prog.seconds || 0) : 0;
        const vid = document.createElement('video');
        vid.id = 'viewerVideo'; vid.controls = true; vid.autoplay = true; vid.src = fileUrl;
        if (start > 5) vid.currentTime = start;
        vid.addEventListener('timeupdate', () => {
          if (!vid.duration) return;
          clearTimeout(progressTimer);
          progressTimer = setTimeout(() => {
            const pct = Math.round(vid.currentTime / vid.duration * 100);
            saveProgress(courseId, fileName, { seconds: vid.currentTime, duration: vid.duration, percent: pct, completed: pct >= 90 });
          }, 3000);
        });
        vid.addEventListener('ended', () => {
          saveProgress(courseId, fileName, { seconds: 0, percent: 100, completed: true });
          refreshMats(courseId);
        });
        body.appendChild(vid);
      } else if (ext === 'pdf') {
        const fr = document.createElement('iframe');
        fr.id = 'viewerIframe'; fr.src = drivePreview(m) || fileUrl;
        body.appendChild(fr);
        saveProgress(courseId, fileName, { viewed: true });
      } else if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
        const img = document.createElement('img');
        img.id = 'viewerImage'; img.src = m.dataUrl || driveImage(m) || fileUrl; img.alt = fileName;
        body.appendChild(img);
        saveProgress(courseId, fileName, { viewed: true });
      } else if (m.fileId) {
        const fr = document.createElement('iframe');
        fr.id = 'viewerIframe'; fr.src = drivePreview(m);
        body.appendChild(fr);
        saveProgress(courseId, fileName, { viewed: true });
      } else {
        window.open(fileUrl, '_blank');
        saveProgress(courseId, fileName, { viewed: true });
        refreshMats(courseId);
        return;
      }

      document.getElementById('viewerOverlay').classList.add('open');
      refreshMats(courseId);
    }

    function closeViewer() {
      const vid = document.getElementById('viewerVideo');
      if (vid) { vid.pause(); vid.src = ''; }
      document.getElementById('viewerOverlay').classList.remove('open');
      document.getElementById('viewerBody').innerHTML = '';
      if (viewerMeta) { refreshMats(viewerMeta.courseId); viewerMeta = null; }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });

    function refreshMats(courseId) {
      const course = allCourses.find(c => String(c.id) === String(courseId));
      const panel = document.getElementById('panel-materials');
      if (course && panel) panel.innerHTML = renderMatsPanel(course);
    }

    // ── Upload ──
    function triggerUpload(id) { document.getElementById('fi_' + id)?.click(); }
    function handleFiles(input, id) { if (input.files?.length) processFiles(input.files, id); input.value = ''; }

    const UPLOAD_TYPES = [
      'application/pdf',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.ms-powerpoint',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'video/mp4', 'video/webm', 'video/ogg', 'video/quicktime',
      'image/jpeg', 'image/png', 'image/gif', 'image/webp'
    ];

    // 教材上傳到 Google Drive，課程資料寫回後端，所有裝置都看得到
    async function processFiles(files, courseId) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course) return;
      if (!course.materials) course.materials = [];

      for (const file of files) {
        if (!UPLOAD_TYPES.includes(file.type)) { showToast(`不支援格式：${file.name}`, 'error'); continue; }
        if (file.size > 50 * 1024 * 1024)      { showToast(`檔案過大：${file.name}`, 'error'); continue; }

        showToast(`上傳中：${file.name}`);
        try {
          const res = await api.uploadFile(file);
          course.materials.push({
            fileName: file.name,
            fileType: file.type,
            fileId: res.id,
            fileUrl: res.url,
            fileSize: file.size,
            uploadedAt: new Date().toISOString(),
            uploadedBy: currentUser.username
          });
          await persistCourses();
          renderMain(course);
          showToast(`已上傳：${file.name}`, 'success');
        } catch (err) {
          console.error('上傳失敗:', err);
          showToast(`上傳失敗：${file.name}（${err.message || '未知錯誤'}）`, 'error');
        }
      }
    }

    async function deleteMat(courseId, idx) {
      if (!isAdmin) return;
      const course = allCourses.find(c => String(c.id) === String(courseId));
      if (!course?.materials) return;
      const name = course.materials[idx]?.fileName || '此教材';
      if (!confirm(`確定移除「${name}」？`)) return;

      const removed = course.materials.splice(idx, 1);
      try {
        await persistCourses();
        renderMain(course);
        showToast('已移除', 'success');
      } catch (err) {
        course.materials.splice(idx, 0, ...removed);
        renderMain(course);
        showToast(`移除失敗：${err.message || '未知錯誤'}`, 'error');
      }
    }

    // 寫入本地快取並同步回後端
    async function persistCourses() {
      localStorage.setItem('maritimeCourses', JSON.stringify(allCourses));
      if (typeof syncManager === 'undefined') return;
      const result = await syncManager.saveTable('maritimeCourses');
      if (result?.conflict) {
        showToast('課程資料已被其他人修改，請重新整理後再試', 'error');
        throw new Error('資料衝突');
      }
    }

    // ── Helpers ──
    function isVideo(name) {
      return ['mp4','webm','mov','ogg'].includes((name||'').split('.').pop().toLowerCase());
    }

    function fileStyle(name) {
      const ext = (name||'').split('.').pop().toUpperCase();
      const m = {
        PDF: { icon:'<i class="ph ph-file-pdf"></i>', bg:'#fee2e2', color:'#dc2626' },
        DOC: { icon:'<i class="ph ph-file-doc"></i>', bg:'#dbeafe', color:'#1d4ed8' }, DOCX: { icon:'<i class="ph ph-file-doc"></i>', bg:'#dbeafe', color:'#1d4ed8' },
        PPT: { icon:'<i class="ph ph-file-ppt"></i>', bg:'#ffedd5', color:'#c2410c' }, PPTX: { icon:'<i class="ph ph-file-ppt"></i>', bg:'#ffedd5', color:'#c2410c' },
        MP4: { icon:'<i class="ph ph-file-video"></i>', bg:'#ede9fe', color:'#7c3aed' }, WEBM: { icon:'<i class="ph ph-file-video"></i>', bg:'#ede9fe', color:'#7c3aed' }, MOV: { icon:'<i class="ph ph-file-video"></i>', bg:'#ede9fe', color:'#7c3aed' },
        JPG: { icon:'<i class="ph ph-file-image"></i>', bg:'#dcfce7', color:'#15803d' }, PNG: { icon:'<i class="ph ph-file-image"></i>', bg:'#dcfce7', color:'#15803d' },
        ZIP: { icon:'<i class="ph ph-file-zip"></i>', bg:'#fef9c3', color:'#92400e' },
      };
      return m[ext] || { icon:'<i class="ph ph-paperclip"></i>', bg:'#f5f5f7', color:'#6e6e73' };
    }

    function showToast(msg, type='') {
      const t = document.getElementById('toast');
      const ic = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      ic.className = type === 'error' ? 'ph ph-warning-circle' : 'ph ph-check-circle';
      t.className = 'toast show' + (type ? ' '+type : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.className = 'toast', 3000);
    }

    function h(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function a(s)  { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
</body>
</html>
